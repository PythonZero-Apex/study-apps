成を仮定して導かれる。", "フロイントリッヒの式は、実験式として広く用いられる。", "BETの式は、多分子層吸着を取り扱うことができる。", "平衡吸着量は、温度が高くなるほど増大する関係にある。", "吸着等温線は、一定温度における平衡吸着量と濃度の関係を表す。"], "answer": [3], "explanation": "物理吸着は発熱過程であるため、温度を高くすると平衡吸着量は減少する。この性質を利用して、加熱により吸着質を追い出す加熱脱着(再生)が行われる。「温度が高いほど吸着量が増える」は事実と逆である。"}, {"id": 165, "domain": "大気有害物質特論", "sub": "ガス吸着", "type": "single", "q": "吸着装置の破過に関する記述として、誤っているものはどれか。", "options": ["破過曲線は、吸着塔出口の濃度と通気時間の関係を表したものである。", "破過点は、出口濃度があらかじめ定めた許容値に達した時点をいう。", "吸着帯の長さが短いほど、破過曲線の立ち上がりは急になる。", "破過点に達した吸着剤は、加熱や水蒸気により再生できる場合がある。", "通気速度を大きくすると、破過に達するまでの時間は長くなる。"], "answer": [4], "explanation": "通気速度を大きくすると、単位時間当たりに供給される吸着質の量が増え、また吸着帯も長くなるため、破過に達するまでの時間は短くなる。処理量を増やせば早く破過する、という関係である。"}, {"id": 166, "domain": "大気有害物質特論", "sub": "ガス吸着", "type": "single", "q": "物理吸着と化学吸着に関する記述として、正しいものはどれか。", "options": ["物理吸着の吸着熱は、一般に化学吸着の吸着熱より小さい。", "物理吸着では、吸着質と吸着剤の間に化学結合が形成される。", "化学吸着は可逆性が高く、減圧により容易に脱着できる。", "物理吸着では、温度が高いほど吸着量が増加する。", "化学吸着では、吸着量が単分子層を超えて増加を続ける。"], "answer": [0], "explanation": "物理吸着はファンデルワールス力によるもので、吸着熱は凝縮熱と同程度で小さい。化学吸着は化学結合を伴うため吸着熱が大きく、脱着しにくい。物理吸着は温度が高いほど吸着量が減少し、化学吸着は表面での結合であるため単分子層で飽和する。「物理吸着で化学結合が形成される」「化学吸着が減圧のみで容易に脱着できる」はいずれも両者の性質を入れ替えたものである。"}, {"id": 167, "domain": "大気有害物質特論", "sub": "ガス吸着", "type": "single", "q": "吸着剤及び脱着操作に関する記述として、誤っているものはどれか。", "options": ["水蒸気を用いた脱着では、凝縮させることで吸着質を回収できる。", "活性炭は親水性が高く、湿度の高い排ガスほど有機溶剤の吸着量が増える。", "活性炭は、有機溶剤蒸気の回収に広く用いられる。", "シリカゲルや活性アルミナは、水分の吸着に用いられる。", "ゼオライトは、細孔径がそろっており分子ふるい効果を示す。"], "answer": [1], "explanation": "活性炭は疎水性(親油性)であり有機物をよく吸着するが、湿度が高いと水分が細孔を占有するため有機溶剤の吸着量はむしろ低下する。このため実務では前段で除湿を行うことがある。「親水性が高い」という記述自体が誤りである。"}, {"id": 168, "domain": "大気有害物質特論", "sub": "その他の処理技術", "type": "single", "q": "ふっ素化合物を含む排ガスの処理に関する記述として、誤っているものはどれか。", "options": ["四ふっ化けい素の水吸収では、生成する二酸化けい素によるスケール付着に留意する。", "吸収液が酸性のまま循環すると、ふっ素の再放散が起こるおそれがある。", "ふっ化カルシウムは水に極めてよく溶けるため、沈殿分離には適さない。", "ふっ化水素は水に溶けやすく、水吸収による除去が有効である。", "水酸化カルシウムを用いると、難溶性のふっ化カルシウムとして固定できる。"], "answer": [2], "explanation": "ふっ化カルシウム(CaF2)は水に難溶であり、この難溶性を利用して沈殿として分離・固定するのがふっ素処理の基本である。天然にも蛍石として安定に存在することからも、水に溶けにくいことがわかる。"}, {"id": 169, "domain": "大気有害物質特論", "sub": "その他の処理技術", "type": "single", "q": "塩化水素を含む排ガスの処理に関する記述として、誤っているものはどれか。", "options": ["アルカリ吸収では、水酸化ナトリウムや水酸化カルシウムが用いられる。", "廃棄物焼却炉では、消石灰を炉内や煙道に吹き込む乾式法も用いられる。", "吸収塔の材質には、塩酸に対する耐食性を考慮する必要がある。", "吸収液のpHが低下しても、塩化水素の吸収効率はほとんど変化しない。", "水に極めてよく溶けるため、水洗塔による吸収が有効である。"], "answer": [3], "explanation": "吸収液のpHが低下する(酸性が強まる)と塩化水素の吸収能力は低下するため、アルカリを補給してpHを管理する必要がある。実運転では吸収液のpH制御が処理性能を左右する重要な管理項目となる。"}, {"id": 170, "domain": "大気有害物質特論", "sub": "その他の処理技術", "type": "single", "q": "特定物質の漏えい時の中和処理に関する記述として、誤っているものはどれか。", "options": ["中和剤の散布に当たっては、発熱や飛散に注意する必要がある。", "塩化水素の漏えいには、消石灰や炭酸ナトリウムによる中和が用いられる。", "硫酸の漏えいには、炭酸ナトリウムや消石灰による中和が用いられる。", "ふっ化水素の漏えいには、消石灰による中和が有効である。", "アンモニアの漏えいには、炭酸ナトリウムによる中和が有効である。"], "answer": [4], "explanation": "アンモニアはアルカリ性のガスであるため、アルカリ性である炭酸ナトリウムでは中和できない。多量の水による希釈や、酸による中和が用いられる。酸性物質にはアルカリを、アルカリ性物質には酸を、という対応関係を取り違えさせるのは頻出の出題パターンである。"}, {"id": 171, "domain": "大気有害物質特論", "sub": "ガス吸収", "type": "single", "q": "次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「ガス吸収装置のうち(ア)は、スロート部でガス流速を高めて液を微細化するため圧力損失が大きい。一方(イ)は、液を噴霧するだけの構造であり圧力損失が小さい。また、水への溶解度が(ウ)ガスの吸収では、ガス側境膜抵抗が支配的となる。」", "options": ["(ア)ベンチュリスクラバー (イ)スプレー塔 (ウ)大きい", "(ア)ベンチュリスクラバー (イ)スプレー塔 (ウ)小さい", "(ア)スプレー塔 (イ)ベンチュリスクラバー (ウ)大きい", "(ア)充塡塔 (イ)ぬれ壁塔 (ウ)大きい", "(ア)サイクロンスクラバー (イ)段塔 (ウ)小さい"], "answer": [0], "explanation": "スロート部で液を微細化するのはベンチュリスクラバーであり、圧力損失が大きい。スプレー塔は液を噴霧する簡素な構造で圧力損失が小さい。また溶解度の大きいガス(塩化水素、アンモニア、ふっ化水素など)はガス側境膜抵抗が支配的、溶解度の小さいガス(二酸化炭素、酸素など)は液側境膜抵抗が支配的となる。"}, {"id": 172, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "排ガス中のふっ素化合物の分析に関する記述として、誤っているものはどれか。", "options": ["イオン電極法やイオンクロマトグラフ法も適用できる。", "水蒸気蒸留を行うと、ふっ素化合物は留出せず残留物側に濃縮される。", "試料ガスを吸収液に通じて、ふっ素化合物を捕集する。", "共存物質の影響を除くため、水蒸気蒸留による分離操作が行われる。", "ランタン-アリザリンコンプレキソン吸光光度法が用いられる。"], "answer": [1], "explanation": "水蒸気蒸留は、ふっ素をヘキサフルオロけい酸などの形で留出させ、共存物質から分離するための操作である。ふっ素は留出液側に移行するのであって、残留物側に残るのではない。分離操作の目的と物質の挙動を取り違えさせる出題は頻出である。"}, {"id": 173, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "排ガス中の塩素の分析に関する記述として、誤っているものはどれか。", "options": ["共存する塩化水素は、測定値の妨害要因となることがある。", "試料採取に用いる器具は、塩素に対する耐食性を考慮する。", "塩素は安定であり、採取後に長期間保存しても濃度は変化しない。", "吸収液に捕集した後、吸光光度法により定量する方法がある。", "イオンクロマトグラフ法を適用して定量することができる。"], "answer": [2], "explanation": "塩素は反応性の高いガスであり、採取後の試料は容器壁への吸着や共存成分との反応により濃度が変化しやすい。このため速やかに分析するか、規定された方法で安定化させる必要がある。「化学的に安定で長期保存できる」は誤りである。"}, {"id": 174, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "排ガス中の塩化水素の分析に関する記述として、正しいものはどれか。", "options": ["共存する塩素は、塩化物イオンを生じないため妨害とならない。", "試料採取管は、加熱を行わずに使用しなければならない。", "定量に用いる方法は、原子吸光法に限られている。", "捕集した塩化物イオンを、イオンクロマトグラフ法で定量できる。", "塩化水素は水に溶けにくいため、吸収液による捕集はできない。"], "answer": [3], "explanation": "塩化水素は吸収液に捕集して塩化物イオンとし、イオンクロマトグラフ法や滴定法、吸光光度法で定量する。塩化水素は水に極めてよく溶けるため吸収捕集が可能であり、「水に溶けにくい」は誤り。共存する塩素は塩化物イオンを生じて妨害となりうる。試料採取管は結露を防ぐため加熱することがあり、原子吸光法は金属分析の手法であって塩化水素の定量には用いない。"}, {"id": 175, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "排ガス中のカドミウム及び鉛の分析に関する記述として、誤っているものはどれか。", "options": ["試料はろ紙などで捕集し、酸により分解して測定溶液とする。", "フレーム原子吸光法を適用することができる。", "ICP発光分光分析法やICP質量分析法を適用することができる。", "電気加熱原子吸光法は、フレーム原子吸光法より低濃度域の測定に適する。", "カドミウムと鉛は排ガス中で気体として存在するため、ろ過捕集は不要である。"], "answer": [4], "explanation": "製錬炉などの排ガス中では、いったん揮発したカドミウムや鉛は冷却されて微細な粒子(ヒューム)となっているため、ろ紙などによるろ過捕集が必要である。気体のまま存在し続けるわけではない。"}, {"id": 176, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "ICP質量分析法に関する記述として、誤っているものはどれか。", "options": ["測定は質量数に基づくため、共存塩類の濃度は結果に影響しない。", "誘導結合プラズマで試料をイオン化し、質量数ごとに分離して検出する。", "多元素を同時に測定でき、感度が高い。", "内標準物質を添加して、測定値の変動を補正することがある。", "共存成分に由来する多原子イオンが、測定を妨害することがある。"], "answer": [0], "explanation": "共存する塩類が高濃度に存在すると、プラズマの状態変化や試料導入系への析出により信号強度が変動する(マトリックス効果)ため、測定結果に影響を及ぼす。この影響を補正する目的で内標準物質が用いられる。"}, {"id": 177, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "原子吸光法に関する記述として、誤っているものはどれか。", "options": ["電気加熱方式では、乾燥・灰化・原子化の各段階を経る。", "多元素を同時に定量できる点が、この方法の最大の利点である。", "目的元素の中空陰極ランプを光源として用いる。", "原子化された目的元素による光の吸収量から濃度を求める。", "検量線法や標準添加法により定量する。"], "answer": [1], "explanation": "原子吸光法は目的元素ごとの中空陰極ランプを用いるため、原則として一元素ずつの測定となる。多元素同時定量を得意とするのはICP発光分光分析法やICP質量分析法である。この両者の特徴を入れ替える出題は頻出である。"}, {"id": 178, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "排ガス中の有害物質の試料採取に関する記述として、誤っているものはどれか。", "options": ["採取管には、目的物質と反応しにくい材質を選定する。", "水分の凝縮が問題となる場合は、採取管の加熱を行う。", "吸引速度が排ガス流速より大きいと、粗大粒子の割合が過大となる。", "採取位置は、ガス流の偏りが少ない直管部から選定する。", "粒子状物質を採取する場合は、等速吸引を行う必要がある。"], "answer": [2], "explanation": "吸引速度が排ガス流速より大きい場合、慣性の小さい微細粒子は過剰に吸い込まれる一方、慣性の大きい粗大粒子は流れに追随できないため、粗大粒子の割合はむしろ過小に評価される。過大に評価されるのは吸引速度が流速より小さい場合である。等速吸引が求められるのはこのためである。"}, {"id": 179, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「濃度既知の標準液を段階的に測定して作成する(ア)により、試料の濃度を求める。共存成分の影響が大きい場合には、試料に目的成分を段階的に添加して測定する(イ)が有効である。また、装置側の変動を補正する目的で、目的元素とは別の元素をあらかじめ加えておく(ウ)が用いられる。」", "options": ["(ア)検量線法 (イ)内標準法 (ウ)標準添加法", "(ア)内標準法 (イ)標準添加法 (ウ)検量線法", "(ア)標準添加法 (イ)内標準法 (ウ)検量線法", "(ア)検量線法 (イ)標準添加法 (ウ)内標準法", "(ア)標準添加法 (イ)検量線法 (ウ)内標準法"], "answer": [3], "explanation": "検量線法は濃度既知の標準液から検量線を作成する基本的な定量法。標準添加法は試料そのものに目的成分を添加していく方法で、マトリックスの影響を受けにくい。内標準法は目的元素とは別の元素を一定量加え、その信号との比をとることで装置変動を補正する方法である。三者の役割を入れ替える出題は頻出である。"}, {"id": 180, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "イオンクロマトグラフ法に関する記述として、誤っているものはどれか。", "options": ["分離カラムにより、陰イオンを種類ごとに分離する。", "検出には電気伝導度検出器が広く用いられる。", "サプレッサーを用いると、溶離液由来のバックグラウンドを低減できる。", "ふっ化物イオンや塩化物イオンの定量に適用できる。", "対象はイオンに限られないため、中性の有機溶剤蒸気も直接定量できる。"], "answer": [4], "explanation": "イオンクロマトグラフ法はイオン交換に基づく分離法であり、測定対象はイオン性成分に限られる。中性の有機溶剤蒸気を直接定量することはできず、その場合はガスクロマトグラフ法などが用いられる。"}, {"id": 181, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "環境基本法第1条に規定する目的に関する記述中、ア〜ウの（　）の中に挿入すべき語句の組合せとして、正しいものはどれか。\n「この法律は、（ ア ）について、基本理念を定め、並びに国、地方公共団体、事業者及び国民の（ イ ）を明らかにするとともに、（ ア ）に関する施策の基本となる事項を定めることにより、（ ア ）に関する施策を（ ウ ）かつ計画的に推進すること等を目的とする。」", "options": ["ア：公害の防止　イ：義務　ウ：優先的", "ア：環境の保全　イ：責務　ウ：総合的", "ア：自然の保護　イ：義務　ウ：段階的", "ア：環境の保全　イ：役割　ウ：優先的", "ア：公害の防止　イ：責務　ウ：総合的"], "answer": [1], "explanation": "環境基本法第1条は「環境の保全」について基本理念を定め、国・地方公共団体・事業者・国民の「責務」を明らかにし、施策を「総合的」かつ計画的に推進することを目的としています。"}, {"id": 182, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "環境基本法第2条に規定する公害の定義に関する記述中、ア〜エの（　）に該当しないものを含む選択肢はどれか。「公害」とは、環境の保全上の支障のうち、事業活動その他の人の活動に伴って生ずる相当範囲にわたる（ ア ）、（ イ ）、土壌の汚染、（ ウ ）、振動、地盤の沈下及び悪臭によって、人の健康又は生活環境に係る被害が生ずることをいう。", "options": ["ア：大気の汚染　イ：水質の汚濁　ウ：騒音", "ア：大気の汚染　イ：水質の汚濁　ウ：放射能汚染", "ア：土壌流出　イ：水質の汚濁　ウ：騒音", "ア：大気の汚染　イ：光害　ウ：騒音", "ア：水質の汚濁　イ：大気の汚染　ウ：交通渋滞"], "answer": [0], "explanation": "典型7公害は「大気の汚染・水質の汚濁・土壌の汚染・騒音・振動・地盤の沈下・悪臭」です。放射能汚染は典型7公害には含まれません（原子力関連は別法体系）。"}, {"id": 183, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "環境基本法第16条に規定する環境基準に関する記述中の（　）に入る語句として、正しいものはどれか。「政府は、大気の汚染、水質の汚濁、土壌の汚染及び騒音に係る環境上の条件について、それぞれ、人の健康を保護し、及び生活環境を保全する上で（　）ことが望ましい基準を定めるものとする。」", "options": ["達成しうる限り低い", "維持されることが", "速やかに改善する", "最低限確保すべき", "段階的に規制する"], "answer": [1], "explanation": "環境基準は「維持されることが望ましい基準」であり、行政上の政策目標であって、大気汚染防止法などの「排出基準」（罰則を伴う規制基準）とは性格が異なります。"}, {"id": 184, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "特定工場における公害防止組織の整備に関する法律の目的に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。「この法律は、特定工場における（ ア ）の設置その他の公害防止に関する組織について定めることにより、当該特定工場の（ イ ）を確保し、もつて（ ウ ）に資することを目的とする。」", "options": ["ア：公害防止管理者　イ：公害防止体制　ウ：公害の防止", "ア：環境管理責任者　イ：品質管理体制　ウ：ISO認証", "ア：公害防止統括者　イ：安全衛生体制　ウ：労働災害防止", "ア：公害防止管理者　イ：生産性向上　ウ：企業競争力強化", "ア：保安責任者　イ：公害防止体制　ウ：事故防止"], "answer": [0], "explanation": "特定工場法は「公害防止管理者」等の設置により工場の「公害防止体制」を確保し「公害の防止」に資することを目的としています。"}, {"id": 185, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "特定工場における公害防止組織の整備に関する法律に定める公害防止統括者・公害防止管理者・公害防止主任管理者の関係に関する記述中の（　）に入る語句として、誤っているものはどれか。公害防止統括者は工場の公害防止管理業務を（ ア ）し、公害防止管理者はばい煙発生施設等の（ イ ）に係る技術的事項を管理し、公害防止主任管理者は騒音・振動を除く（ ウ ）を統括管理する。", "options": ["ア：統括管理", "イ：構造・使用方法", "ウ：ばい煙及び汚水等に関する事項", "ア：直接操作", "イ：日常点検"], "answer": [3], "explanation": "公害防止統括者は「統括管理」する立場であり、日常の設備操作を直接行う立場ではありません。「直接操作」という語句はこの法律の職務規定にはあたりません。"}, {"id": 186, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "大気汚染防止法の目的に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。「この法律は、工場及び事業場における事業活動に伴い、並びに（ ア ）に伴うばい煙、（ イ ）及び有害大気汚染物質の排出等を規制し、（中略）もつて国民の健康を保護するとともに（ ウ ）を保全することを目的とする。」", "options": ["ア：建築物の解体等　イ：粉じん　ウ：生活環境", "ア：交通機関の運行　イ：騒音　ウ：自然環境", "ア：建築物の解体等　イ：騒音　ウ：生活環境", "ア：産業廃棄物の処理　イ：粉じん　ウ：生活環境", "ア：建築物の解体等　イ：粉じん　ウ：自然環境"], "answer": [0], "explanation": "大気汚染防止法は「ばい煙」「粉じん（一般粉じん・特定粉じん＝石綿）」「有害大気汚染物質」の排出を規制し、健康保護と「生活環境」の保全を目的としています。"}, {"id": 187, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "悪臭防止法の規制方式に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。悪臭の規制方法には、特定悪臭物質の濃度で規制する（ ア ）と、人の嗅覚を用いて求める（ イ ）で規制する方法があり、市町村長が地域の実情に応じて（ ウ ）ことができる。", "options": ["ア：物質濃度規制　イ：臭気指数　ウ：いずれかを選択する", "ア：臭気指数規制　イ：物質濃度　ウ：両方を義務付ける", "ア：物質濃度規制　イ：臭気強度　ウ：国が一律に定める", "ア：臭気指数規制　イ：騒音レベル　ウ：いずれかを選択する", "ア：物質濃度規制　イ：臭気指数　ウ：都道府県のみが定める"], "answer": [0], "explanation": "悪臭防止法は特定悪臭物質22物質の「物質濃度規制」と、複合臭にも対応できる「臭気指数」規制のいずれかを市町村長が選択して規制地域・規制基準を定める仕組みです。"}, {"id": 188, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "騒音規制法における規制の枠組みに関する記述中の（　）に入る語句として、誤っているものはどれか。騒音規制法は、（ ア ）騒音、（ イ ）騒音及び（ ウ ）騒音について規制地域を指定し、規制基準を定めている。", "options": ["ア：工場・事業場", "イ：建設作業", "ウ：自動車", "ア：航空機", "イ：建設作業"], "answer": [3], "explanation": "騒音規制法の対象は「工場・事業場騒音」「建設作業騒音」「自動車騒音（許容限度）」の3つです。航空機騒音・新幹線騒音は環境基本法に基づく別の環境基準体系で扱われ、騒音規制法の直接の規制対象ではありません。"}, {"id": 189, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "水質汚濁防止法の目的に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。「この法律は、工場及び事業場から公共用水域に排出される水の排出及び（ ア ）を規制するとともに、生活排水対策の実施を推進すること等によつて、公共用水域及び（ イ ）の水質の汚濁の防止を図り（後略）」", "options": ["ア：地下への浸透　イ：地下水", "ア：地下への浸透　イ：土壌", "ア：海域への流出　イ：地下水", "ア：大気への排出　イ：地下水", "ア：地下への浸透　イ：湖沼"], "answer": [0], "explanation": "水質汚濁防止法は、公共用水域への「排出」と地下への「浸透」の両方を規制対象とし、公共用水域及び「地下水」の水質汚濁防止を図る法律です。"}, {"id": 190, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "循環型社会形成推進基本法における処理の優先順位に関する記述中、ア〜エに入る語句の順序として、正しいものはどれか。同法は、①発生抑制（リデュース）、②（ ア ）、③（ イ ）、④熱回収、⑤（ ウ ）の優先順位で循環資源の処理を行うことを基本原則としている。", "options": ["ア：再使用　イ：再生利用　ウ：適正処分", "ア：再生利用　イ：再使用　ウ：適正処分", "ア：再使用　イ：適正処分　ウ：再生利用", "ア：焼却　イ：再使用　ウ：埋立", "ア：再生利用　イ：適正処分　ウ：再使用"], "answer": [0], "explanation": "優先順位は「発生抑制（リデュース）→再使用（リユース）→再生利用（リサイクル）→熱回収→適正処分」の順です。マテリアルリサイクルより再使用が優先される点がポイントです。"}, {"id": 191, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "廃棄物の処理及び清掃に関する法律における廃棄物の区分に関する記述中の（　）に入る語句として、正しい組合せはどれか。同法における廃棄物は、事業活動に伴って生じた廃棄物のうち法令で定める20種類を（ ア ）とし、それ以外を（ イ ）とする。産業廃棄物のうち爆発性・毒性等を有するものは（ ウ ）に区分される。", "options": ["ア：産業廃棄物　イ：一般廃棄物　ウ：特別管理産業廃棄物", "ア：一般廃棄物　イ：産業廃棄物　ウ：特別管理産業廃棄物", "ア：産業廃棄物　イ：特別管理廃棄物　ウ：一般廃棄物", "ア：産業廃棄物　イ：一般廃棄物　ウ：指定廃棄物", "ア：事業系廃棄物　イ：家庭系廃棄物　ウ：特別管理産業廃棄物"], "answer": [0], "explanation": "事業活動に伴い生じ、法令で列挙された20種類が「産業廃棄物」、それ以外（家庭ごみ等）が「一般廃棄物」です。産業廃棄物のうち有害性の高いものは「特別管理産業廃棄物」に区分されます。"}, {"id": 192, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "環境影響評価法（環境アセスメント法）の手続きに関する記述中、ア〜ウの実施順序として、正しいものはどれか。同法の手続きは、（ ア ）配慮書の作成、（ イ ）方法書の作成・住民意見聴取、（ ウ ）準備書・評価書の作成という流れで進められる。", "options": ["計画段階環境配慮書→環境影響評価方法書→環境影響評価準備書・評価書", "環境影響評価方法書→計画段階環境配慮書→環境影響評価準備書・評価書", "環境影響評価準備書→計画段階環境配慮書→環境影響評価方法書", "環境影響評価方法書→環境影響評価準備書・評価書→計画段階環境配慮書", "計画段階環境配慮書→環境影響評価準備書・評価書→環境影響評価方法書"], "answer": [0], "explanation": "環境アセスメントの手続きは「計画段階配慮書→方法書（住民意見聴取）→準備書→評価書」の順で進みます。事業の初期段階から複数回、地域住民や自治体の意見を反映させる仕組みです。"}, {"id": 193, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "特定化学物質の環境への排出量の把握等及び管理の改善の促進に関する法律（化管法）に定めるPRTR制度に関する記述中の（　）に入る語句として、正しいものはどれか。PRTR制度とは、事業者が化学物質の環境への（ ア ）量及び廃棄物に含まれての（ イ ）量を自ら把握し、国に届け出て、国が集計・公表する制度である。", "options": ["ア：排出　イ：移動", "ア：排出　イ：貯蔵", "ア：使用　イ：移動", "ア：排出　イ：輸出", "ア：製造　イ：移動"], "answer": [0], "explanation": "PRTR（Pollutant Release and Transfer Register）は「排出量」と事業所外への「移動量」を把握・届出・公表する制度です。頭文字のRelease（排出）とTransfer（移動）がそのまま対応します。"}, {"id": 194, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "地球温暖化対策の推進に関する法律に関する記述中の（　）に入る語句として、正しいものはどれか。我が国は同法に基づき、2050年までに温室効果ガスの排出を実質（ ア ）にする、いわゆる（ イ ）を目指すことを基本理念として法定化している。", "options": ["ア：ゼロ　イ：カーボンニュートラル", "ア：半減　イ：2050年目標", "ア：ゼロ　イ：ネットポジティブ", "ア：マイナス　イ：カーボンネガティブ", "ア：ゼロ　イ：グリーン成長戦略"], "answer": [0], "explanation": "改正地球温暖化対策推進法（2021年改正）で、2050年カーボンニュートラル（温室効果ガス排出実質ゼロ）が基本理念として法律に明記されました。"}, {"id": 195, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "ダイオキシン類対策特別措置法に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。同法は、ダイオキシン類による環境の汚染の防止及びその除去等をするため、（ ア ）を定めるとともに、必要な規制、汚染土壌に係る措置等を定め、（ イ ）の保護を図ることを目的とする。", "options": ["ア：耐容一日摂取量（TDI）　イ：国民の健康", "ア：許容濃度　イ：生態系", "ア：耐容一日摂取量（TDI）　イ：労働者", "ア：排出基準　イ：国民の健康", "ア：耐容一日摂取量（TDI）　イ：地域住民のみ"], "answer": [0], "explanation": "ダイオキシン類対策特別措置法は、耐容一日摂取量（TDI）を定め、規制や汚染土壌対策等を通じて「国民の健康」の保護を図ることを目的としています。"}, {"id": 196, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "石綿による健康被害の救済に関する法律及び大気汚染防止法における石綿規制の強化に関する記述中の（　）に入る語句として、正しいものはどれか。令和8年1月1日からは、建築物だけでなく一定の（ ア ）の解体等工事についても、新設された資格である（ イ ）による事前調査が義務化された。", "options": ["ア：工作物　イ：工作物石綿事前調査者", "ア：船舶　イ：船舶石綿調査者", "ア：工作物　イ：建築物石綿含有建材調査者", "ア：設備　イ：石綿作業主任者", "ア：工作物　イ：特定粉じん排出者"], "answer": [0], "explanation": "令和8年1月1日から、煙突・貯蔵タンク等の「工作物」の解体等にも、新設資格「工作物石綿事前調査者」による事前調査が義務化されました（建築物の調査は令和5年10月1日から既に義務化済み）。"}, {"id": 197, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "水銀に関する水俣条約及び大気汚染防止法の水銀規制に関する記述中の（　）に入る語句として、正しいものはどれか。水銀規制の見直しは条約発効後、定期的に点検されており、令和6年9月には中央環境審議会の（ ア ）が取りまとめられ、これを受けて令和7年2月に（ イ ）が公布された。", "options": ["ア：第三次答申　イ：大気汚染防止法施行規則等の一部を改正する省令", "ア：第一次答申　イ：大気汚染防止法の改正法", "ア：第三次答申　イ：水俣条約改正議定書", "ア：中間答申　イ：大気汚染防止法施行令の改正", "ア：第三次答申　イ：水銀汚染防止法の新規制定"], "answer": [0], "explanation": "令和6年9月の中央環境審議会「第三次答申」を受け、令和7年2月17日に大気汚染防止法施行規則等の一部を改正する省令が公布されました。「第三次」という表現から、過去に複数回の点検が行われていることが分かります。"}, {"id": 198, "domain": "公害総論", "sub": "語群選択", "type": "single", "q": "令和8年版環境白書のテーマに関する記述中の（　）に入る語句として、正しいものはどれか。令和8年版環境白書は「（ ア ）で日本列島を強く豊かに」をテーマとし、2026年4月に決定された（ イ ）に基づく再生資源サプライチェーンの強靱化等を新たな柱として取り上げている。", "options": ["ア：循環経済（サーキュラーエコノミー）　イ：循環経済行動計画", "ア：グリーントランスフォーメーション（GX）　イ：GX推進法", "ア：カーボンニュートラル　イ：脱炭素成長型経済構造移行推進戦略", "ア：循環経済（サーキュラーエコノミー）　イ：資源循環基本計画", "ア：ネイチャーポジティブ　イ：生物多様性国家戦略"], "answer": [0], "explanation": "令和8年版環境白書のテーマは「循環経済（サーキュラーエコノミー）で日本列島を強く豊かに」で、2026年4月決定の「循環経済行動計画」に基づく施策が新規の柱として紹介されています。前年（令和7年版）はGX・ESG投資が主題でした。"}, {"id": 199, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "典型7公害に関する次のa〜eの記述のうち、正しいものの組合せはどれか。\na　典型7公害は、大気の汚染、水質の汚濁、土壌の汚染、騒音、振動、地盤の沈下及び悪臭である。\nb　放射性物質による大気の汚染の防止のための措置は、大気汚染防止法によって全て規定される。\nc　典型7公害の中で、近年苦情受付件数が最も多いのは騒音である。\nd　地盤の沈下は、主に地下水の過剰なくみ上げによって生じる。\ne　悪臭は典型7公害には含まれない。", "options": ["a,b", "a,d", "b,c", "c,e", "d,e"], "answer": [1], "explanation": "a・dが正しい記述です。bは誤り（放射性物質は原子力基本法など別体系で規制）。cは近年の傾向として騒音の苦情件数は多いものの「最も多い」と断定するのは年度により変動があり注意が必要です。eは誤り（悪臭は典型7公害に含まれる）。"}, {"id": 200, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "公害防止管理者制度に関する次のa〜eの記述のうち、誤っているものの組合せはどれか。\na　特定工場の設置者は、公害防止管理者を選任する義務がある。\nb　公害防止管理者は、選任後遅滞なく都道府県知事に届け出なければならない。\nc　公害防止管理者は、必ず常勤の役員でなければならない。\nd　大気関係公害防止管理者の資格区分は、排出ガス量やばい煙発生施設の種類により1種〜4種に分かれる。\ne　公害防止管理者が旅行、疾病等の事故によってその職務を行うことができない場合は、代理者を選任しなければならない。", "options": ["a,c", "b,c", "c,のみ", "b,e", "a,e"], "answer": [1], "explanation": "bとcが誤りです。届出先は「都道府県知事等」で正しい表現ですが、細かい選択肢としては誤りを含む場合があります。cは明確に誤り（公害防止管理者は常勤の役員である必要はなく、資格を有する従業員でよい）。a・d・eは正しい記述です。"}, {"id": 201, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "環境基準と排出基準（規制基準）に関する次の記述のうち、誤っているものはどれか。", "options": ["環境基準は、行政上の政策目標として維持されることが望ましい基準である。", "排出基準は、大気汚染防止法等に基づき、個別の発生源に対して遵守を義務付ける基準である。", "環境基準に違反した事業者には、直接罰則が科される。", "環境基準は、大気・水質・土壌・騒音について定められているが、悪臭については定められていない。", "都道府県は、地域の実情に応じて排出基準を国の基準より厳しく定める上乗せ基準を設けることができる。"], "answer": [2], "explanation": "誤っているのは(3)です。環境基準は行政の政策目標であり、環境基準の超過そのものに対して事業者に直接罰則が科されるわけではありません（罰則は排出基準違反に対して科されます）。"}, {"id": 202, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "国際的な環境条約に関する次のa〜eの組合せのうち、条約名と主な対象の組合せとして誤っているものはどれか。\na　ラムサール条約　―　湿地の保全\nb　バーゼル条約　―　有害廃棄物の越境移動の規制\nc　ワシントン条約　―　絶滅のおそれのある野生動植物の取引規制\nd　水俣条約　―　オゾン層破壊物質の規制\ne　ロンドン条約　―　海洋投棄による汚染の防止", "options": ["a", "b", "c", "d", "e"], "answer": [3], "explanation": "誤っているのはdです。水俣条約は「水銀」の規制に関する条約で、オゾン層破壊物質の規制はモントリオール議定書の対象です。a・b・c・eの組合せは正しいです。"}, {"id": 203, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "循環型社会形成推進基本法及び関連するリサイクル法制に関する次の記述のうち、正しいものはどれか。", "options": ["容器包装リサイクル法、家電リサイクル法、自動車リサイクル法は、いずれも循環型社会形成推進基本法の制定と同時に個別に制定された。", "循環型社会形成推進基本法における「循環資源」とは、廃棄物等のうち有用なものをいう。", "3R（リデュース・リユース・リサイクル）のうち、法律上最も優先順位が高いのはリサイクルである。", "一般廃棄物の処理責任は国にあり、市町村は関与しない。", "循環型社会形成推進基本法は、廃棄物処理法の下位法令として位置づけられる。"], "answer": [1], "explanation": "正しいのは(2)です。循環資源とは廃棄物等のうち有用なもの（リサイクル可能なもの）を指します。(1)は誤り（各リサイクル法は個別のタイミングで制定）、(3)は誤り（優先順位はリデュースが最上位）、(4)は誤り（一般廃棄物の処理責任は市町村）、(5)は誤り（循環型社会形成推進基本法は基本法であり、廃棄物処理法等の上位に位置づけられる）。"}, {"id": 204, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "地球温暖化及び気候変動対策に関する次のa〜eの記述のうち、正しいものの組合せはどれか。\na　パリ協定は、全ての締約国に温室効果ガス削減目標の策定・提出・更新を義務付けている。\nb　京都議定書は、先進国のみに数値目標を課す枠組みであった。\nc　我が国のNDC（国が決定する貢献）は、2013年度比で2030年度に温室効果ガス46%削減を目指すとしている。\nd　温室効果ガスにはCO2、メタン、一酸化炭素などが含まれる。\ne　COP（締約国会議）は、気候変動枠組条約に基づき毎年開催されている。", "options": ["a,b,c,e", "a,b,d,e", "a,c,d,e", "b,c,d,e", "a,b,c,d"], "answer": [0], "explanation": "a・b・c・eが正しい記述です。dは誤り（一酸化炭素は温室効果ガスに含まれない。温室効果ガスはCO2・メタン・一酸化二窒素・フロン類等）。"}, {"id": 205, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "PRTR制度（化学物質排出移動量届出制度）に関する次の記述のうち、誤っているものはどれか。", "options": ["対象となる化学物質は、政令で定める第一種指定化学物質である。", "届出義務があるのは、一定量以上の対象化学物質を取り扱う特定の業種の事業者である。", "家庭やコンビニエンスストア等、業種要件を満たさない事業者からの排出量は、国が推計して集計に含めている。", "届出されたデータは、事業者ごとに一切公表されず、業種別の合計値のみが公表される。", "PRTRデータは、事業者の自主的な化学物質管理の改善を促す目的でも活用される。"], "answer": [3], "explanation": "誤っているのは(4)です。PRTR制度では、個別事業者ごとのデータも開示請求により公表される仕組みがあり、「一切公表されない」というのは誤りです。"}, {"id": 206, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "大気関係公害防止管理者の資格区分に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　大気関係公害防止管理者は、排出ガス量やダイオキシン類の発生施設の有無等により1種から4種に区分される。\nb　大気関係第1種公害防止管理者は、全ての区分のばい煙発生施設等を管理できる。\nc　大気関係第4種公害防止管理者は、粉じん発生施設のみを管理できる。\nd　資格区分にかかわらず、選任される公害防止管理者の職務内容は同一である。", "options": ["a,b", "a,c", "b,c", "b,d", "c,d"], "answer": [0], "explanation": "a・bが正しい記述です。cは誤り（第4種は特定の要件を満たす施設に限定されるが「粉じん発生施設のみ」という限定は不正確）。dも誤り（資格区分により管理できる施設の範囲が異なるため、実質的な業務範囲は異なる）。"}, {"id": 207, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "廃棄物の処理及び清掃に関する法律における産業廃棄物の処理責任に関する次の記述のうち、正しいものはどれか。", "options": ["産業廃棄物の処理責任は、排出事業者ではなく処理業者が負う。", "排出事業者は、産業廃棄物の処理を委託する場合、産業廃棄物管理票（マニフェスト）により処理状況を確認する義務を負う。", "産業廃棄物の処理は、市町村が全て責任を持って行う。", "特別管理産業廃棄物の管理責任者の選任は任意である。", "産業廃棄物の処理委託契約は、口頭による合意で足りる。"], "answer": [1], "explanation": "正しいのは(2)です。排出事業者責任の原則に基づき、マニフェスト制度により処理の流れを確認する義務があります。(1)(3)は排出事業者責任の原則に反し誤り、(4)は誤り（特別管理産業廃棄物管理責任者の選任は義務）、(5)は誤り（委託契約は書面による必要がある）。"}, {"id": 208, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "有害大気汚染物質に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　有害大気汚染物質のうち、環境基準が定められている物質にはベンゼン、トリクロロエチレン、テトラクロロエチレン、ジクロロメタンがある。\nb　有害大気汚染物質のうち、指針値が定められている物質にはアクリロニトリル等がある。\nc　有害大気汚染物質は、全て大気汚染防止法上の「特定物質」として排出が全面的に禁止されている。\nd　優先取組物質は、有害性の程度や環境実態等から優先的に対策に取り組むべき物質として選定されている。", "options": ["a,b,d", "a,c,d", "b,c,d", "a,b,c", "a,c"], "answer": [0], "explanation": "a・b・dが正しい記述です。cは誤り（有害大気汚染物質は排出抑制の対象であり、全面禁止ではない。また「特定物質」は事故時の緊急対応に関する別の区分）。"}, {"id": 209, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "四大公害（四大公害病）に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　四大公害病とは、水俣病、新潟水俣病、イタイイタイ病、四日市ぜんそくをいう。\nb　水俣病と新潟水俣病は、いずれも有機水銀（メチル水銀）による健康被害である。\nc　イタイイタイ病の原因物質はカドミウムであり、富山県神通川流域で発生した。\nd　四大公害はいずれも1990年代以降に発生が確認された、比較的新しい公害である。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（四大公害はいずれも1950〜60年代の高度経済成長期に発生が確認されたものであり、1990年代以降ではありません）。"}, {"id": 210, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "土壌汚染対策法に関する次の記述のうち、正しいものはどれか。", "options": ["土壌汚染対策法は、農用地の土壌汚染のみを対象としている。", "一定規模以上の土地の形質変更を行う場合、土壌汚染状況の調査が必要となる場合がある。", "土壌汚染対策法における特定有害物質には、重金属類のみが指定されている。", "土壌汚染が判明した場合、土地の所有者等に浄化の義務はなく、行政が全額負担して対策を行う。", "要措置区域に指定された土地は、指定後いかなる利用も一切禁止される。"], "answer": [1], "explanation": "正しいのは(2)です。一定規模以上の土地の形質変更の届出の際に、土壌汚染状況調査が必要となる仕組みがあります。(1)は誤り（市街地の土壌汚染等も対象）、(3)は誤り（重金属類だけでなく揮発性有機化合物等も対象）、(4)(5)も誤りです。"}, {"id": 211, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "環境影響評価法（環境アセスメント法）の対象事業に関する次の記述のうち、誤っているものはどれか。", "options": ["対象事業は、規模が大きく環境影響の程度が著しいものとなるおそれがある事業として法令で定められている。", "対象事業は「第一種事業」と「第二種事業」に区分され、第二種事業は個別に環境影響の程度を判定するスクリーニングの対象となる。", "環境アセスメントの実施主体は、事業の許認可を行う行政庁である。", "住民は、方法書や準備書の縦覧期間中に意見書を提出することができる。", "環境アセスメントの手続きには、事後調査（事後モニタリング）の実施が含まれる場合がある。"], "answer": [2], "explanation": "誤っているのは(3)です。環境アセスメントの実施主体は、道路・ダム・発電所などの事業を行う「事業者」であり、許認可行政庁ではありません。行政庁は審査・意見提出の立場です。"}, {"id": 212, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "地盤沈下に関する次の記述のうち、正しいものはどれか。", "options": ["地盤沈下は、主に地表面での振動によって生じる現象である。", "地盤沈下の主な原因は、地下水の過剰な採取（くみ上げ）による地層の収縮である。", "地盤沈下は、一度発生しても地下水位を回復させれば地盤も元の高さに完全に復元する。", "地盤沈下は、工業用水法や建築物用地下水の採取の規制に関する法律の規制対象ではない。", "地盤沈下は、典型7公害には含まれない。"], "answer": [1], "explanation": "正しいのは(2)です。過剰な地下水採取により粘土層等が収縮し地盤沈下が起こります。(3)は誤り（沈下した地盤は基本的に不可逆的で元には戻りにくい）、(4)は誤り（工業用水法等で地下水採取規制が行われている）、(5)は誤り（地盤沈下は典型7公害の一つ）。"}, {"id": 213, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "環境基本計画に関する次の記述のうち、誤っているものはどれか。", "options": ["環境基本計画は、環境基本法に基づき政府が定める環境保全に関する総合的な計画である。", "環境基本計画は、これまで複数回改定されており、社会情勢の変化を踏まえて見直されている。", "環境基本計画は、都道府県及び市町村が独自に、国の関与なく策定するものである。", "環境基本計画には、環境の状況に関する評価や、施策の展開の基本方向が示される。", "環境基本計画の策定にあたっては、中央環境審議会の意見を聴くこととされている。"], "answer": [2], "explanation": "誤っているのは(3)です。環境基本計画は「政府（国）」が環境基本法に基づき策定するものです。地方公共団体が独自に策定する環境計画とは別のものです。"}, {"id": 214, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "成層圏オゾン層の破壊に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　オゾン層は、太陽からの有害な紫外線を吸収し、地上の生物を保護する役割を持つ。\nb　オゾン層破壊の主な原因物質は、CFC（クロロフルオロカーボン）等のフロン類である。\nc　南極上空では、季節的にオゾン層が著しく薄くなる「オゾンホール」が観測されている。\nd　モントリオール議定書は、地球温暖化対策のための温室効果ガス削減を目的とした条約である。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（モントリオール議定書は「オゾン層破壊物質」の規制を目的とした条約であり、温室効果ガス削減が目的の京都議定書・パリ協定とは異なります）。"}, {"id": 215, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "特定工場における公害防止組織の整備に関する法律に基づく公害防止管理者等の選任に関する次の記述のうち、正しいものはどれか。", "options": ["公害防止管理者は、選任の際に必ず国家試験に合格していなければならず、資格認定講習修了者は認められない。", "公害防止統括者は、原則としてその工場に置かれる事業所の代表者又はこれに準ずる者から選任される。", "公害防止管理者を選任しなかった場合でも、罰則の対象とはならない。", "公害防止主任管理者は、常時使用する従業員数にかかわらず全ての特定工場で選任が義務付けられる。", "外部の公害防止管理者資格者を、業務委託契約のみで自社の公害防止管理者として選任することができる。"], "answer": [1], "explanation": "正しいのは(2)です。公害防止統括者は工場の事業の実施を統括管理する者（代表者やこれに準ずる者）から選任されます。(1)は誤り（資格認定講習修了でも資格取得可能）、(3)は誤り（選任義務違反は罰則対象）、(4)は誤り（一定規模以上の場合等の要件がある）、(5)は誤り（公害防止管理者は当該工場の従業員から選任する必要がある）。"}, {"id": 216, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "揮発性有機化合物（VOC）対策に関する次の記述のうち、誤っているものはどれか。", "options": ["VOCは、光化学オキシダントや浮遊粒子状物質（SPM）の原因物質の一つとされている。", "VOC排出規制は、大気汚染防止法に基づく法規制と事業者の自主的取組を組み合わせたベストミックスの考え方で進められている。", "我が国のVOC総排出量は、基準年である2000年度と比較して増加を続けている。", "VOCには、トルエンやキシレンなどの物質が含まれる。", "e→AS（給油所における蒸発ガス回収装置の認定制度）は、VOC対策の一つとして位置づけられる。"], "answer": [2], "explanation": "誤っているのは(3)です。我が国のVOC総排出量は、2000年度を基準として大幅に削減が進んでおり、2024年度時点で基準年比約6割の削減が達成されています。「増加を続けている」は誤りです。"}, {"id": 217, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "石綿（アスベスト）に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　我が国で工業的に使用されてきた石綿の大部分はクリソタイル（白石綿）である。\nb　石綿は、現在でも新規の製造・使用が認められている。\nc　建築物の解体等工事における事前調査は、令和5年10月1日から有資格者による実施が義務化されている。\nd　石綿による健康被害を救済する法律として、石綿健康被害救済法がある。", "options": ["a,c,d", "a,b,c", "b,c,d", "a,b,d", "a,b,c,d"], "answer": [0], "explanation": "a・c・dが正しい記述です。bは誤り（石綿の製造・使用は原則として全面禁止されている）。"}, {"id": 218, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "気候変動に関する政府間パネル（IPCC）の評価報告書に関する次の記述のうち、正しいものはどれか。", "options": ["IPCCは、気候変動に関する科学的知見を評価し、報告書として取りまとめる政府間機構である。", "IPCCは、独自に温室効果ガスの排出削減目標を各国に義務付ける権限を持つ機関である。", "IPCCの評価報告書は、これまでに一度しか公表されたことがない。", "IPCCの評価報告書は、気候変動の自然科学的根拠のみを扱い、影響・適応・緩和策には触れない。", "IPCCは、気候変動枠組条約とは無関係に設立された民間団体である。"], "answer": [0], "explanation": "正しいのは(1)です。IPCCは世界気象機関（WMO）と国連環境計画（UNEP）により設立された政府間機構で、気候変動に関する科学的知見を評価し、数年おきに評価報告書（第4次、第5次、第6次等）を公表しています。各国への削減目標の義務付け権限は持たず、影響・適応・緩和策も含めて評価します。"}, {"id": 219, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "光化学オキシダント及び光化学スモッグに関する次の記述のうち、正しいものはどれか。", "options": ["光化学オキシダントは、窒素酸化物（NOx）と揮発性有機化合物（VOC）が紫外線を受けて反応することにより生成される二次汚染物質である。", "光化学オキシダントの環境基準達成率は、近年ほぼ100%で推移しており、良好な状態が続いている。", "光化学スモッグ注意報が発令されるのは、主に冬季の朝方である。", "光化学オキシダントは、工場や事業場からそのまま排出される一次汚染物質である。", "光化学オキシダントの主成分はPM2.5である。"], "answer": [0], "explanation": "正しいのは(1)です。光化学オキシダントはNOxとVOCが紫外線により光化学反応を起こして生成される二次生成物質です。(2)は誤り（達成率はむしろ極めて低い水準が続いている）、(3)は誤り（主に夏季の日中に発生しやすい）、(4)は誤り（二次汚染物質であり一次排出ではない）、(5)は誤り（主成分はオゾン等）。"}, {"id": 220, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "特定工場における公害防止組織の整備に関する法律の適用業種に関する次の記述のうち、正しいものはどれか。", "options": ["同法の対象となる特定工場は、製造業、電気供給業、ガス供給業、熱供給業に属する事業を行う工場に限定される。", "同法の対象となる特定工場は、業種を問わず、ばい煙発生施設を設置する全ての施設が対象となる。", "同法は、特定工場のうち、公害防止管理者を選任した工場にのみ適用される。", "同法の対象施設には、飲食店やオフィスビルも幅広く含まれる。", "同法は、公害防止管理者を選任していない特定工場には適用されない。"], "answer": [0], "explanation": "正しいのは(1)です。特定工場法の対象業種は「製造業、電気供給業、ガス供給業、熱供給業」に属する工場（政令で定める規模以上）に限定されています。"}, {"id": 221, "domain": "公害総論", "sub": "正誤組み合わせ", "type": "single", "q": "気候変動適応法に関する次の記述のうち、誤っているものはどれか。", "options": ["気候変動適応法は、温室効果ガスの排出削減（緩和策）とは異なり、気候変動の影響への対応（適応策）を推進する法律である。", "同法に基づき、国立環境研究所内に気候変動適応情報プラットフォームが整備されている。", "地方公共団体は、地域気候変動適応計画を策定するよう努めることとされている。", "気候変動適応法の対象には、熱中症対策や自然災害への対応強化は含まれない。", "同法は、農業・防災・健康など様々な分野における適応策の総合的推進を目指している。"], "answer": [3], "explanation": "誤っているのは(4)です。気候変動適応法は熱中症対策や自然災害への対応強化などを含む幅広い分野の適応策を対象としています。"}, {"id": 222, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "令和8年版環境白書に示された2024年度のPM2.5に関する環境基準達成率について、正しい組合せはどれか。", "options": ["一般局99.5%・自排局100%", "一般局100%・自排局100%", "一般局95.0%・自排局98.0%", "一般局99.5%・自排局99.5%", "一般局90.0%・自排局95.0%"], "answer": [0], "explanation": "2024年度のPM2.5環境基準達成率は一般局99.5%・自排局100%でした。一般局は2023年度の100%からわずかに低下している点が注目ポイントです。"}, {"id": 223, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "2024年度における光化学オキシダントの環境基準（当時の1時間値0.06ppm以下）を達成した一般局の数として、令和8年版環境白書に示されている数値に最も近いものはどれか。", "options": ["0局", "10局程度", "100局程度", "500局程度", "1,000局以上"], "answer": [0], "explanation": "2024年度は環境基準を達成した一般局が0局となり、達成率は実質0%でした。2021〜2023年度は1〜2局が達成していたので、2024年度に初めて達成局がゼロになった点が変化点です。"}, {"id": 224, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "光化学オキシダントの環境基準の改正に関する次の記述のうち、正しいものはどれか。", "options": ["令和8年4月1日から、オゾンとして「8時間値が0.07ppm以下」かつ「日最高8時間値の1年平均値が0.04ppm以下」であることが環境基準となった。", "令和8年4月1日から、環境基準は「1時間値0.04ppm以下」に強化された。", "光化学オキシダントの環境基準は、昭和48年の制定以来、一度も改正されたことがない。", "今回の改正で、測定方法として新たに中性ヨウ化カリウム溶液を用いる吸光光度法が追加された。", "今回の改正は、二酸化窒素の環境基準と同時に見直されたものである。"], "answer": [0], "explanation": "正しいのは(1)です。令和8年1月30日告示・4月1日施行で、評価基準が「1時間値0.06ppm以下」から「8時間値0.07ppm以下、かつ日最高8時間値の1年平均値0.04ppm以下」に変更されました。測定方法もヨウ化カリウム法が削除され2手法に絞られています。"}, {"id": 225, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "令和8年版環境白書によると、2025年の光化学オキシダント注意報等の発令延日数として最も近いものはどれか。", "options": ["約5日", "約20日", "約47日", "約100日", "約200日"], "answer": [2], "explanation": "2025年の光化学オキシダント注意報等の発令延日数は47日（16都府県）で、月別では8月が最多の19日でした。"}, {"id": 226, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "2024年度の二酸化窒素（NO2）、浮遊粒子状物質（SPM）、一酸化炭素（CO）の環境基準達成率（一般局・自排局）に関する記述として、正しいものはどれか。", "options": ["3物質とも一般局・自排局共に100%達成した。", "3物質とも一般局・自排局共に90%台にとどまった。", "NO2のみ達成率が90%を下回った。", "SPMは自排局のみ未達成の局があった。", "COは環境基準が定められていないため、達成率は算出されていない。"], "answer": [0], "explanation": "2024年度、二酸化窒素・浮遊粒子状物質・一酸化炭素は、いずれも一般局・自排局共に環境基準達成率100%でした。"}, {"id": 227, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "2024年度の二酸化硫黄（SO2）の環境基準達成率に関する記述として、正しいものはどれか。", "options": ["一般局99.6%、自排局100%であり、一般局はわずかに100%に届いていない。", "一般局・自排局共に100%であった。", "一般局80%、自排局85%程度にとどまった。", "一般局のみ環境基準が設定されており、自排局には設定されていない。", "SO2の環境基準は令和8年度に廃止された。"], "answer": [0], "explanation": "2024年度のSO2環境基準達成率は一般局99.6%・自排局100%で、NO2・SPM・COが100%だったのに対し、SO2の一般局のみわずかに届いていない点が細かい出題ポイントです。"}, {"id": 228, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "石綿の事前調査義務に関する令和8年からの規制強化について、正しい記述はどれか。", "options": ["令和8年1月1日から、一定の工作物の解体等工事について、新設の「工作物石綿事前調査者」による事前調査が義務化された。", "令和8年1月1日から、建築物の解体等工事の事前調査義務が初めて導入された。", "工作物の事前調査義務化は、建築物よりも先に施行されていた。", "工作物石綿事前調査者の資格制度は、令和8年時点でまだ検討段階にあり施行されていない。", "工作物の事前調査は、有資格者ではなく施工業者が自己判断で行えばよいとされている。"], "answer": [0], "explanation": "正しいのは(1)です。建築物の事前調査義務化は令和5年10月1日から先行して施行されており、工作物への拡大が令和8年1月1日でした。(2)(3)は順序が誤り、(4)(5)も誤りです。"}, {"id": 229, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "水銀の大気排出対策に関する省令改正について、令和8年版環境白書等から読み取れる記述として、正しいものはどれか。", "options": ["水銀規制は5年ごとを目安に点検・見直しが行われており、令和6年9月の中央環境審議会第三次答申を受けて令和7年2月に省令が改正された。", "水銀規制の見直しは今回が初めてであり、過去に点検が行われたことはない。", "水俣条約に基づく大気汚染防止法の水銀規制は、令和8年4月に初めて施行された。", "水銀排出施設の届出制度は、今回の改正で新設された制度である。", "水銀規制の点検は、10年ごとに実施することが条約で定められている。"], "answer": [0], "explanation": "正しいのは(1)です。水銀規制は施行後、定期的（目安として5年ごと）に点検されており、令和6年9月の第三次答申を受け令和7年2月に省令が改正されました。改正大気汚染防止法自体は平成30年（2018年）4月1日に施行済みです。"}, {"id": 230, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "令和8年版環境白書に示された2024年度の悪臭苦情件数の推移に関する記述として、正しいものはどれか。", "options": ["2021年度をピークに増加を続けており、2024年度も過去最多を更新した。", "2018年度から増加傾向が続いていたが、2021年度を境に減少傾向に転じ、2024年度は約11,076件であった。", "2024年度の悪臭苦情件数は、統計開始以来最少を記録した。", "悪臭苦情は近年ほぼ横ばいで、増減の傾向は見られない。", "悪臭苦情件数は令和8年版白書には記載がなく、把握できない。"], "answer": [1], "explanation": "2018年度から増加していた悪臭苦情件数は2021年度を境に減少傾向に転じ、2024年度は約11,076件（前年度比659件減）でした。「ずっと増え続けている」という誤答パターンに注意が必要です。"}, {"id": 231, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "2024年度の騒音苦情・振動苦情の発生源別割合に関する記述として、正しいものはどれか。", "options": ["騒音苦情・振動苦情とも、発生源として最も多いのは建設作業である。", "騒音苦情の発生源として最も多いのは工場・事業場であり、振動苦情は建設作業である。", "騒音苦情・振動苦情とも、発生源として最も多いのは自動車である。", "騒音苦情の発生源として最も多いのは近隣騒音（生活騒音）である。", "振動苦情の発生源として最も多いのは工場・事業場である。"], "answer": [0], "explanation": "2024年度、騒音苦情は建設作業が41.1%で最多、振動苦情も建設作業が72.5%で最多でした。両方とも建設作業が発生源のトップという点がポイントです。"}, {"id": 232, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "新幹線鉄道騒音の環境基準達成率の推移に関する記述として、正しいものはどれか。", "options": ["2023年度の55.6%から2024年度は43.7%へ、10ポイント以上低下した。", "2023年度から2024年度にかけて、達成率はほぼ横ばいであった。", "新幹線鉄道騒音の達成率は、近年一貫して上昇傾向にある。", "2024年度の達成率は80%を超えた。", "新幹線鉄道騒音には環境基準が定められていない。"], "answer": [0], "explanation": "新幹線鉄道騒音の環境基準達成率は2023年度55.6%から2024年度43.7%へと大きく低下しました。図表で見ると直近1年での急落が確認できる、出題されやすいポイントです。"}, {"id": 233, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "航空機騒音の環境基準達成率（2024年度）に関する記述として、令和8年版環境白書の内容に最も近いものはどれか。", "options": ["588地点中506地点で達成し、達成率は約86.1%であった。", "全588地点で達成し、達成率は100%であった。", "達成率は40%台にとどまり、新幹線鉄道騒音と同水準であった。", "航空機騒音の測定地点は全国で10地点程度に限られている。", "航空機騒音の環境基準は令和8年度に廃止された。"], "answer": [0], "explanation": "2024年度の航空機騒音の環境基準達成率は588地点中506地点で約86.1%でした。新幹線鉄道騒音（43.7%）と比べると、達成率は高い水準を保っています。"}, {"id": 234, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "一般地域における騒音の環境基準達成率（2024年度）に関する記述として、正しいものはどれか。", "options": ["2,315地点中2,091地点で達成し、達成率は約90.3%であった。", "達成率は50%程度にとどまった。", "全地点で環境基準を達成した。", "一般地域の騒音については、環境基準ではなく指針値のみが定められている。", "達成率は70%台であった。"], "answer": [0], "explanation": "2024年度の一般地域における騒音の環境基準達成率は2,315地点中2,091地点で約90.3%でした。"}, {"id": 235, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "道路に面する地域における騒音の環境基準に関する2024年度のデータとして、正しいものはどれか。", "options": ["評価対象約962万7,900戸のうち、約4.4%にあたる約42万5,000戸が基準を超過していた。", "評価対象戸数のうち、約半数が基準を超過していた。", "道路に面する地域では、達成率が90%を下回った。", "道路に面する地域については、環境基準の評価は実施されていない。", "超過戸数は前年度比で倍増した。"], "answer": [0], "explanation": "2024年度、道路に面する地域では評価対象約962万7,900戸のうち約42万5,000戸（約4.4%）が基準を超過していました。つまり達成率は約95.6%と高水準であり、「90%を下回った」は誤りです。"}, {"id": 236, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "令和8年版環境白書に示された有害大気汚染物質（環境基準設定4物質）の2024年度の達成状況として、正しいものはどれか。", "options": ["ベンゼンが1地点で環境基準を超過し、他の3物質（トリクロロエチレン、テトラクロロエチレン、ジクロロメタン）は全地点で達成した。", "4物質すべてが全地点で環境基準を達成した。", "4物質すべてで複数地点の超過が確認された。", "ジクロロメタンのみ、環境基準ではなく指針値が定められている。", "有害大気汚染物質の環境基準は、令和8年度から新たに設定された。"], "answer": [0], "explanation": "2024年度、環境基準が設定されている4物質のうちベンゼンが1地点で基準を超過し、他の3物質は全地点で達成しました。"}, {"id": 237, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "揮発性有機化合物（VOC）の総排出量に関する令和8年版環境白書の記述として、正しいものはどれか。", "options": ["2024年度の総排出量は、基準年である2000年度と比較して約6割削減された。", "2024年度の総排出量は、2000年度比で約2割の削減にとどまった。", "VOC排出量は2000年度以降、ほぼ横ばいで推移している。", "VOC排出量の削減目標は達成されておらず、削減率は算出されていない。", "VOCの排出量は増加を続け、2000年度比で倍増した。"], "answer": [0], "explanation": "2024年度のVOC総排出量は、基準年（2000年度）比で約6割削減されました。法規制と事業者の自主的取組を組み合わせたベストミックスの成果とされています。"}, {"id": 238, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "令和8年版環境白書のテーマ及び令和7年版との比較に関する記述として、正しいものはどれか。", "options": ["令和8年版は「循環経済で日本列島を強く豊かに」がテーマであり、令和7年版はGX・ESG投資が主題であった。", "令和7年版・令和8年版とも同一のテーマ（脱炭素）で一貫している。", "令和8年版のテーマは「生物多様性の保全」である。", "環境白書は隔年でしか発行されないため、令和7年版は存在しない。", "令和8年版のテーマは、令和6年版と全く同じである。"], "answer": [0], "explanation": "令和8年版環境白書のテーマは「循環経済（サーキュラーエコノミー）で日本列島を強く豊かに」で、前年の令和7年版（GX・ESG投資が主題）から力点が変化しています。環境白書は毎年発行されます。"}, {"id": 239, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "石綿（アスベスト）の大気環境モニタリングに関する2024年度のデータとして、令和8年版環境白書の内容に最も近いものはどれか。", "options": ["全国44地点で調査が行われ、特に高い濃度は確認されなかった。", "全国1,000地点以上で調査が行われた。", "調査の結果、複数地点で高濃度の石綿が検出された。", "石綿の大気環境モニタリングは、令和8年度から新たに開始された。", "石綿のモニタリングは水質のみを対象としている。"], "answer": [0], "explanation": "2024年度、石綿の大気環境モニタリングは全国44地点で実施され、特に高い濃度は確認されませんでした。"}, {"id": 240, "domain": "公害総論", "sub": "統計データ", "type": "single", "q": "光化学オキシダントの新たな評価指標（8時間値の日最高値の年間99パーセンタイル値の3年平均値）の地域別動向に関する記述として、正しいものはどれか。", "options": ["2022〜2024年度は2021〜2023年度と比較して、関東・東海・阪神地域で上昇し、福岡・山口地域は横ばいであった。", "全国すべての地域で低下傾向を示した。", "新しい評価指標は、まだ算出が開始されていない。", "関東地域のみ改善が見られ、他の地域は横ばいであった。", "この指標は、PM2.5専用の評価指標であり、光化学オキシダントには使用されない。"], "answer": [0], "explanation": "新指標（8時間値年間99パーセンタイル値の3年平均）でみると、2022〜2024年度は前の3年間と比べて関東・東海・阪神地域で上昇し、福岡・山口地域は横ばいでした。他の大気汚染物質が改善傾向にある中、光化学オキシダントが悪化方向にあるという対比構造が出題されやすいポイントです。"}, {"id": 241, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "大気汚染防止法におけるばい煙の定義に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。「ばい煙」とは、燃料その他の物の燃焼に伴い発生する（ ア ）及び（ イ ）、物の燃焼・合成・分解に伴い発生する（ ウ ）を含む物質であって、政令で定めるものをいう。", "options": ["ア：いおう酸化物　イ：ばいじん　ウ：有害物質", "ア：窒素酸化物　イ：粉じん　ウ：有害物質", "ア：いおう酸化物　イ：粉じん　ウ：温室効果ガス", "ア：ばいじん　イ：いおう酸化物　ウ：騒音", "ア：いおう酸化物　イ：ばいじん　ウ：温室効果ガス"], "answer": [0], "explanation": "ばい煙は「いおう酸化物」「ばいじん」「有害物質（カドミウム、塩素、フッ素化合物、鉛、窒素酸化物等）」を含む物質として大気汚染防止法に定義されています。"}, {"id": 242, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "大気汚染防止法のK値規制に関する記述中の（　）に入る語句として、正しいものはどれか。K値規制は、いおう酸化物の排出量を、排出口の高さと（ ア ）を用いた式で算出される許容排出量以下に抑える規制方式であり、地域ごとに定められる（ イ ）の値が小さいほど、規制は厳しくなる。", "options": ["ア：K値　イ：K値", "ア：排出ガス量　イ：総量規制基準", "ア：K値　イ：総量規制基準", "ア：煙突の本数　イ：K値", "ア：排出ガス量　イ：K値"], "answer": [0], "explanation": "K値規制は「排出口の高さ」と地域ごとに定められる「K値」を用いた式（q=K×10⁻³×He²、He：補正された排出口の高さ）により許容排出量を算出する方式で、K値が小さいほど規制は厳しくなります。"}, {"id": 243, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "大気汚染防止法における総量規制に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。総量規制は、（ ア ）地域を対象に、工場・事業場が集中し、K値規制のみでは（ イ ）を確保できない地域において、いおう酸化物・窒素酸化物の（ ウ ）を定めて排出量を規制する制度である。", "options": ["ア：指定　イ：環境基準　ウ：総量規制基準", "ア：全国一律　イ：排出基準　ウ：濃度基準", "ア：指定　イ：排出基準　ウ：濃度基準", "ア：指定　イ：環境基準　ウ：濃度規制", "ア：全国一律　イ：環境基準　ウ：総量規制基準"], "answer": [0], "explanation": "総量規制は「指定地域」において、K値規制だけでは「環境基準」を確保できない地域を対象に、事業場ごとの「総量規制基準」を定めて排出総量を管理する制度です。"}, {"id": 244, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "有害大気汚染物質に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。有害大気汚染物質とは、継続的に摂取される場合には人の健康を（ ア ）おそれがある物質で大気汚染の原因となるもの（（ イ ）を除く）をいい、事業者はその排出又は飛散を（ ウ ）よう努めなければならない。", "options": ["ア：損なう　イ：ばい煙及び特定粉じん　ウ：抑制する", "ア：直ちに害する　イ：ばいじん　ウ：ゼロにする", "ア：損なう　イ：一般粉じん　ウ：抑制する", "ア：損なう　イ：ばい煙及び特定粉じん　ウ：届け出る", "ア：改善する　イ：ばい煙　ウ：抑制する"], "answer": [0], "explanation": "有害大気汚染物質は「継続的に摂取される場合に人の健康を損なうおそれがある物質」で、既に規制対象となっている「ばい煙及び特定粉じん」は除かれます。事業者は排出・飛散の「抑制」に努める義務（努力義務）があります。"}, {"id": 245, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "光化学オキシダントの生成メカニズムに関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。窒素酸化物と（ ア ）が、太陽光（紫外線）を受けて光化学反応を起こすことにより、オゾンを主成分とする（ イ ）汚染物質である光化学オキシダントが生成される。", "options": ["ア：揮発性有機化合物（VOC）　イ：二次", "ア：いおう酸化物　イ：一次", "ア：揮発性有機化合物（VOC）　イ：一次", "ア：粒子状物質　イ：二次", "ア：いおう酸化物　イ：二次"], "answer": [0], "explanation": "光化学オキシダントは、窒素酸化物と揮発性有機化合物（VOC）が紫外線を受けて光化学反応を起こすことで生成される「二次汚染物質」です。"}, {"id": 246, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "揮発性有機化合物（VOC）の排出規制に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。VOC排出規制は、大気汚染防止法に基づく（ ア ）と、事業者の（ イ ）を適切に組み合わせた、いわゆる（ ウ ）の考え方により進められている。", "options": ["ア：法規制　イ：自主的取組　ウ：ベストミックス", "ア：総量規制　イ：自主的取組　ウ：ゼロエミッション", "ア：法規制　イ：罰則強化　ウ：ベストミックス", "ア：K値規制　イ：自主的取組　ウ：ベストミックス", "ア：法規制　イ：自主的取組　ウ：デカップリング"], "answer": [0], "explanation": "VOC排出規制は、大規模施設等を対象とする「法規制」と、中小事業者等の「自主的取組」を組み合わせた「ベストミックス」の考え方で進められています。"}, {"id": 247, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "自動車から排出される窒素酸化物及び粒子状物質の特定地域における総量の削減等に関する特別措置法（自動車NOx・PM法）に関する記述中の（　）に入る語句として、正しいものはどれか。同法は、（ ア ）地域において、自動車から排出される（ イ ）及び粒子状物質の総量を削減するため、車種規制等の対策を実施することを目的とする。", "options": ["ア：対策　イ：窒素酸化物", "ア：全国　イ：いおう酸化物", "ア：対策　イ：光化学オキシダント", "ア：全国　イ：窒素酸化物", "ア：対策　イ：ばいじん"], "answer": [0], "explanation": "自動車NOx・PM法は、大都市圏等の「対策地域」を指定し、その地域における自動車からの「窒素酸化物」及び粒子状物質の排出総量を削減するため、車種規制等の措置を講じる法律です。"}, {"id": 248, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "大気汚染防止法における特定粉じん及び一般粉じんに関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。「特定粉じん」とは（ ア ）をいい、それ以外の粉じんは「一般粉じん」とされる。特定粉じん発生施設については、（ イ ）による規制が行われる。", "options": ["ア：石綿　イ：敷地境界基準", "ア：石綿　イ：K値規制", "ア：石綿以外のセラミック繊維　イ：敷地境界基準", "ア：石綿　イ：総量規制", "ア：土壌由来の粉じん　イ：敷地境界基準"], "answer": [0], "explanation": "「特定粉じん」は石綿を指し、それ以外は「一般粉じん」です。特定粉じん発生施設は「敷地境界基準」により規制されます。"}, {"id": 249, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "特定特殊自動車排出ガスの規制等に関する法律（オフロード法）に関する記述中の（　）に入る語句として、正しいものはどれか。オフロード法は、公道を走行しない（ ア ）（建設機械、農業機械等）から排出される排出ガスによる大気の汚染の防止を図るため、（ イ ）の性能等に関する規制を行う法律である。", "options": ["ア：特定特殊自動車　イ：特定原動機", "ア：一般自動車　イ：特定原動機", "ア：特定特殊自動車　イ：排気管", "ア：産業機械　イ：エンジン全般", "ア：特定特殊自動車　イ：燃料"], "answer": [0], "explanation": "オフロード法は、建設機械・農業機械等の「特定特殊自動車」に搭載される「特定原動機」の排出ガス性能に関する規制（型式指定制度等）を行う法律です。2024年には規制が強化されています。"}, {"id": 250, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "水銀等の排出抑制に関する自主的取組に関する記述中の（　）に入る語句として、正しいものはどれか。大気汚染防止法における水銀規制では、法規制の対象となる「水銀排出施設」に加え、それ以外の施設のうち水銀等の排出量が相当程度あるものについては、設置者による（ ア ）に基づく排出抑制を求める仕組みが導入されている。", "options": ["自主的取組", "罰則付き義務規制", "総量規制基準", "K値規制", "敷地境界基準"], "answer": [0], "explanation": "水銀排出施設（法規制対象）以外の施設については、設置者による「自主的取組」により排出抑制を促す仕組みが採用されています。法規制と自主的取組を組み合わせている点はVOC規制と似た構造です。"}, {"id": 251, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "大気汚染による健康被害の歴史に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。1960年代、三重県（ ア ）市では、石油コンビナートからのいおう酸化物等により、気管支ぜん息等の健康被害である（ イ ）が発生し、大気汚染防止対策の契機の一つとなった。", "options": ["ア：四日市　イ：四日市ぜんそく", "ア：水俣　イ：水俣病", "ア：四日市　イ：イタイイタイ病", "ア：富山　イ：四日市ぜんそく", "ア：四日市　イ：新潟水俣病"], "answer": [0], "explanation": "四日市市で発生した「四日市ぜんそく」は、四大公害病の一つで、大気汚染防止法制定（1968年）の契機の一つとされています。"}, {"id": 252, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "光化学オキシダントの環境基準（令和8年4月1日施行）に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。改正後の環境基準は、オゾンとして「（ ア ）が0.07ppm以下」であり、かつ「日最高（ ア ）の（ イ ）が0.04ppm以下」であることとされている。", "options": ["ア：8時間値　イ：1年平均値", "ア：1時間値　イ：1年平均値", "ア：8時間値　イ：3年平均値", "ア：24時間値　イ：1年平均値", "ア：8時間値　イ：日最高値"], "answer": [0], "explanation": "令和8年4月1日施行の新基準は「8時間値が0.07ppm以下」かつ「日最高8時間値の1年平均値が0.04ppm以下」です。旧基準の「1時間値0.06ppm以下」から変更されました。"}, {"id": 253, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "有害大気汚染物質の対策の考え方に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。有害大気汚染物質のうち、健康リスクの程度等を考慮して優先的に対策に取り組むべき物質を（ ア ）といい、このうち環境基準又は（ イ ）が定められている物質がある。", "options": ["ア：優先取組物質　イ：指針値", "ア：特定物質　イ：許容濃度", "ア：優先取組物質　イ：規制基準", "ア：指定物質　イ：指針値", "ア：優先取組物質　イ：暴露限界値"], "answer": [0], "explanation": "「優先取組物質」（現在23物質）のうち、科学的知見が蓄積された物質については「環境基準」（4物質）または「指針値」（複数物質）が設定されています。"}, {"id": 254, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "ばい煙発生施設の届出制度に関する記述中の（　）に入る語句の組合せとして、正しいものはどれか。ばい煙発生施設を設置しようとする者は、その施設の設置の日の（ ア ）までに、施設の種類、構造、使用方法、（ イ ）等を都道府県知事に届け出なければならない。", "options": ["ア：60日前　イ：排出ガス量", "ア：30日前　イ：排出ガス量", "ア：60日前　イ：従業員数", "ア：14日前　イ：排出ガス量", "ア：60日前　イ：排出基準"], "answer": [0], "explanation": "ばい煙発生施設の設置の届出は、設置日の「60日前」までに行う必要があり、施設の種類・構造・使用方法・「排出ガス量」等を記載します。"}, {"id": 255, "domain": "大気概論", "sub": "語群選択", "type": "single", "q": "大気汚染防止法における事故時の措置に関する記述中の（　）に入る語句として、正しいものはどれか。ばい煙発生施設等の事故により、ばい煙又は特定物質が大量に排出された場合、その施設の設置者は、直ちに（ ア ）を講ずるとともに、その事故を（ イ ）に通報しなければならない。", "options": ["ア：応急の措置　イ：都道府県知事等", "ア：施設の廃棄　イ：環境大臣", "ア：応急の措置　イ：警察署", "ア：損害賠償　イ：都道府県知事等", "ア：応急の措置　イ：近隣住民のみ"], "answer": [0], "explanation": "事故時には設置者は「応急の措置」（排出の停止等）を講ずるとともに、事故の状況を「都道府県知事等」に速やかに通報する義務があります。"}, {"id": 256, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "硫黄酸化物（SOx）に関する次の記述のうち、正しいものはどれか。", "options": ["SOxは主に化石燃料中の硫黄分の燃焼により発生し、主成分は二酸化硫黄（SO2）である。", "SOxは主に自動車の排出ガスから発生し、工場等からの発生は少ない。", "SOxの環境基準は、令和8年度に廃止された。", "SOxは、光化学オキシダントの主原因物質である。", "SOxは、温室効果ガスの一種として京都議定書の対象となっている。"], "answer": [0], "explanation": "正しいのは(1)です。SOxは化石燃料（石炭・重油等）に含まれる硫黄分の燃焼により発生し、主成分はSO2です。(2)は誤り（SOxは主に固定発生源＝工場等から発生し、自動車由来は少ない）。"}, {"id": 257, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "窒素酸化物（NOx）に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　燃焼により発生するNOxは、排出時点では大部分が一酸化窒素（NO）である。\nb　NOxには、燃料中の窒素分に由来するフューエルNOxと、燃焼用空気中の窒素が高温下で酸化されて生じるサーマルNOxがある。\nc　NOxの環境基準は、一酸化窒素（NO）について定められている。\nd　自動車排出ガス中のNOxは、車種規制等により削減対策が進められている。", "options": ["a,b,d", "a,b,c", "b,c,d", "a,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・dが正しい記述です。cは誤り（環境基準は一酸化窒素（NO）ではなく二酸化窒素（NO2）について定められています）。"}, {"id": 258, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "一酸化炭素（CO）に関する次の記述のうち、誤っているものはどれか。", "options": ["COは、燃料の不完全燃焼により発生する。", "COは、血液中のヘモグロビンと強く結合し、酸素運搬能力を低下させる。", "COの発生源としては、かつては自動車排出ガスの寄与が大きかったが、排出ガス規制の強化により大幅に低減した。", "COの環境基準達成率は、近年極めて低い水準で推移している。", "COは、無色・無臭の気体である。"], "answer": [3], "explanation": "誤っているのは(4)です。COの環境基準達成率は近年ほぼ100%を維持しており、極めて低いというのは誤りです。他の記述は正しい内容です。"}, {"id": 259, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "浮遊粒子状物質（SPM）及び微小粒子状物質（PM2.5）に関する次の記述のうち、正しいものはどれか。", "options": ["SPMは粒径10μm以下の粒子状物質、PM2.5は粒径2.5μm以下の粒子状物質と定義されている。", "PM2.5はSPMに完全に含まれない、全く別の粒子である。", "PM2.5の環境基準達成率は、SPMより著しく低い水準で推移している。", "SPMには、燃焼由来の一次粒子のみが含まれ、二次生成粒子は含まれない。", "PM2.5の主な健康影響として、皮膚疾患が知られている。"], "answer": [0], "explanation": "正しいのは(1)です。SPMは粒径10μm以下、PM2.5は粒径2.5μm以下と定義されており、PM2.5はSPMに含まれるより微小な粒子群です。(3)は誤り（近年はPM2.5の達成率も高水準）、(4)は誤り（SPMには二次生成粒子も含まれる）、(5)は誤り（主な健康影響は呼吸器・循環器系）。"}, {"id": 260, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "ハロカーボン類に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　ハロカーボン類には、フロン類（CFC、HCFC、HFC等）が含まれる。\nb　CFC（クロロフルオロカーボン）は、モントリオール議定書により生産等が規制されている。\nc　HFC（ハイドロフルオロカーボン）は、オゾン層は破壊しないが、強力な温室効果を持つ物質がある。\nd　我が国の大気中のハロカーボン類の濃度は、全ての種類で一貫して減少を続けている。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（CFC等オゾン層破壊物質は減少傾向にある一方、代替フロンであるHFC等、種類によっては近年増加している物質もあります）。"}, {"id": 261, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "有害大気汚染物質と健康影響の組合せに関する次のa〜eの記述のうち、正しい組合せはどれか。\na　ベンゼン　―　造血器系への影響（白血病等）\nb　トリクロロエチレン　―　肝臓・腎臓への影響\nc　水銀　―　中枢神経系への影響\nd　ヒ素　―　骨への影響（イタイイタイ病様の症状）\ne　アスベスト　―　中皮腫・肺がん", "options": ["a,b,c,e", "a,b,d,e", "a,c,d,e", "b,c,d,e", "a,b,c,d,e"], "answer": [0], "explanation": "a・b・c・eが正しい組合せです。dは誤り（骨への影響＝イタイイタイ病はカドミウムが原因であり、ヒ素の典型的な健康影響ではありません）。"}, {"id": 262, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "大気汚染の植物に対する影響に関する次の記述のうち、正しいものはどれか。", "options": ["光化学オキシダントは、植物の葉に白斑状・褐色斑状の被害を生じさせることがある。", "SOxやNOxは、植物には全く影響を与えない。", "大気汚染による植物被害は、都市部よりも大気汚染物質の少ない山間部で顕著に多く報告されている。", "酸性雨は、植物の生育には影響を与えないことが確認されている。", "オゾンは植物にとって有益な物質であり、被害を生じさせることはない。"], "answer": [0], "explanation": "正しいのは(1)です。光化学オキシダント（オゾン等）は植物の葉に白斑状・褐色斑状の可視害を生じさせることが知られています。(2)(4)(5)は誤り（いずれも植物に悪影響を及ぼしうる）、(3)は誤り（大気汚染物質濃度の高い地域で被害が多い）。"}, {"id": 263, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "K値規制に関する次の記述のうち、誤っているものはどれか。", "options": ["K値規制は、いおう酸化物を対象とした排出規制方式である。", "K値規制における許容排出量は、排出口の高さが高いほど大きくなる。", "K値は全国一律の値が定められており、地域による差はない。", "K値規制は、複数の排出口がある場合、その合計値で規制される場合がある。", "K値規制は、大気拡散の効果を反映した規制方式である。"], "answer": [2], "explanation": "誤っているのは(3)です。K値は地域の大気汚染の状況等に応じて、都道府県ごと・地域ごとに異なる値が定められており、全国一律ではありません。"}, {"id": 264, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "特定粉じん（石綿）に係る規制に関する次の記述のうち、正しいものはどれか。", "options": ["特定粉じん発生施設の設置には、都道府県知事等への届出が必要である。", "特定粉じん発生施設に対する規制基準は、K値規制と同一の方式である。", "石綿の除去作業を伴う建築物等の解体作業について、大気汚染防止法上の規制は一切ない。", "特定粉じんの排出規制は、総量規制のみで行われる。", "特定粉じんは、一般粉じんと同様の規制手法（発生施設への構造基準）のみで規制される。"], "answer": [0], "explanation": "正しいのは(1)です。特定粉じん発生施設の設置には届出が必要です。(2)は誤り（K値規制ではなく敷地境界基準による）、(3)は誤り（解体等作業の規制あり）、(4)(5)も誤りです。"}, {"id": 265, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "一般粉じんに関する次の記述のうち、誤っているものはどれか。", "options": ["一般粉じん発生施設には、堆積場や破砕機・摩砕機等が該当する。", "一般粉じん発生施設に対しては、構造・使用・管理に関する基準（構造基準等）が定められている。", "一般粉じんには濃度に関する排出基準（敷地境界基準）が定められており、特定粉じんと全く同じ方式で規制される。", "一般粉じん発生施設の設置には、届出が必要である。", "一般粉じんの発生源には、セメント製造業やコークス製造業などが含まれる。"], "answer": [2], "explanation": "誤っているのは(3)です。一般粉じんは濃度規制ではなく「構造基準等」（施設の構造・使用・管理に関する基準）により規制される点が、敷地境界基準（濃度規制）による特定粉じんとの大きな違いです。"}, {"id": 266, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "温室効果ガスに関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　温室効果ガスには、二酸化炭素、メタン、一酸化二窒素、フロン類等が含まれる。\nb　地球温暖化係数（GWP）は、二酸化炭素を基準（1）として、他のガスの温室効果の強さを相対的に表した指標である。\nc　メタンの地球温暖化係数は、二酸化炭素より小さい。\nd　我が国の温室効果ガス排出量のうち、最も排出量割合が大きいのは二酸化炭素である。", "options": ["a,b,d", "a,b,c", "b,c,d", "a,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・dが正しい記述です。cは誤り（メタンの地球温暖化係数は二酸化炭素の数十倍と、より大きい値です）。"}, {"id": 267, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "自動車排出ガス対策に関する次の記述のうち、誤っているものはどれか。", "options": ["自動車NOx・PM法における車種規制は、対策地域内に使用の本拠を有する古い排出基準の自動車について、車検を通じて排出基準に適合しないものの使用を制限する仕組みである。", "自動車単体規制（排出ガス規制）は、道路運送車両法に基づく保安基準等により定められている。", "オフロード法は、公道を走る一般乗用車を主な規制対象としている。", "電動化（EV・HV等）の普及は、自動車からの大気汚染物質排出削減に寄与すると考えられている。", "ディーゼル車の排出ガス対策として、粒子状物質減少装置（DPF）等が用いられる。"], "answer": [2], "explanation": "誤っているのは(3)です。オフロード法は建設機械・農業機械等の「特定特殊自動車」（公道を走らない機械）を対象としており、一般乗用車は対象ではありません。"}, {"id": 268, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "揮発性有機化合物（VOC）の発生源に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　塗装工程における塗料の使用は、VOCの主要な発生源の一つである。\nb　印刷工程におけるインキや溶剤の使用も、VOCの発生源となる。\nc　VOCは、工場・事業場からのみ発生し、家庭からは発生しない。\nd　接着剤の使用も、VOCの発生源となりうる。", "options": ["a,b,d", "a,b,c", "b,c,d", "a,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・dが正しい記述です。cは誤り（VOCは塗料・接着剤・洗浄剤等を通じて家庭からも発生しうる）。"}, {"id": 269, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "大気汚染防止法における緊急時の措置に関する次の記述のうち、正しいものはどれか。", "options": ["大気の汚染が著しくなり、人の健康又は生活環境に係る被害が生ずるおそれがある場合、都道府県知事はばい煙排出者に対しばい煙量の減少等を要請できる。", "緊急時の措置は、大気汚染防止法ではなく騒音規制法に定められている。", "緊急時であっても、都道府県知事はばい煙排出者に対して排出量の削減を要請することはできない。", "緊急時の措置の発動は、環境大臣の許可を事前に得なければ行うことができない。", "緊急時の措置は、工場・事業場ではなく一般家庭のみを対象としている。"], "answer": [0], "explanation": "正しいのは(1)です。大気汚染防止法には、大気の汚染が著しくなった場合の緊急時の措置（要請・命令等）が定められており、都道府県知事がばい煙排出者等に対応を求めることができます。"}, {"id": 270, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "四大公害病に関する次のa〜dの組合せのうち、正しいものの組合せはどれか。\na　水俣病　―　熊本県水俣湾　―　有機水銀\nb　新潟水俣病　―　新潟県阿賀野川流域　―　有機水銀\nc　イタイイタイ病　―　富山県神通川流域　―　カドミウム\nd　四日市ぜんそく　―　三重県四日市市　―　水質汚濁", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい組合せです。dは誤り（四日市ぜんそくの原因はいおう酸化物等による「大気汚染」であり、水質汚濁ではありません）。"}, {"id": 271, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "酸性雨に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　酸性雨は、大気中のいおう酸化物・窒素酸化物が硫酸・硝酸等に変化し、雨に溶け込むことで生じる。\nb　酸性雨は、発生源から遠く離れた地域にも影響を及ぼす越境汚染の一例とされる。\nc　我が国では、酸性雨によりこれまで森林の顕著な衰退が確認されたことは一度もないとされている。\nd　酸性雨は、湖沼の酸性化や建造物・文化財の腐食などの影響を及ぼすことがある。", "options": ["a,b,d", "a,b,c", "b,c,d", "a,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・dが正しい記述です。cは誤り（酸性雨による森林衰退は「確認されていない」という調査結果はあるものの、「一度もないとされている」という断定は言い過ぎで、実際には継続的なモニタリングにより注意深く監視され続けている段階です）。"}, {"id": 272, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "光化学オキシダントの発生しやすい気象条件に関する次の記述のうち、正しいものはどれか。", "options": ["強い日射があり、気温が高く、風が弱い夏季の日中に発生しやすい。", "曇天・降雨時に最も発生しやすい。", "冬季の早朝に最も発生しやすい。", "気象条件は光化学オキシダントの発生に影響しない。", "強風時に発生量が最大となる。"], "answer": [0], "explanation": "正しいのは(1)です。光化学反応は紫外線を必要とするため、日射が強く気温が高い夏季の日中、かつ拡散されにくい弱風時に光化学オキシダント濃度が高くなりやすいとされています。"}, {"id": 273, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "大気汚染防止法における上乗せ排出基準に関する次の記述のうち、正しいものはどれか。", "options": ["都道府県は、地域の大気汚染の状況に応じて、国の排出基準より厳しい基準（上乗せ基準）を条例で定めることができる。", "上乗せ基準は、国の基準より緩やかな基準を定める制度である。", "上乗せ基準は、いおう酸化物についてのみ認められている。", "上乗せ基準を定めることができるのは環境大臣のみであり、都道府県には権限がない。", "上乗せ基準の設定には、国会の承認が必要である。"], "answer": [0], "explanation": "正しいのは(1)です。都道府県は地域の実情に応じ、条例により国の基準より厳しい「上乗せ基準」を定めることができます。"}, {"id": 274, "domain": "大気概論", "sub": "正誤組み合わせ", "type": "single", "q": "特定工場における公害防止組織の整備に関する法律に関する次の記述のうち、大気概論の観点から誤っているものはどれか。", "options": ["同法の対象となる特定工場は、製造業、電気供給業、ガス供給業、熱供給業に属する事業を行う工場に限定される。", "大気関係公害防止管理者は、ばい煙発生施設等の構造・使用方法に係る技術的事項を管理する。", "公害防止管理者の資格には、大気関係のほか水質関係・騒音関係など複数の区分がある。", "公害防止管理者は、大気汚染防止法に定める排出基準の遵守状況にかかわらず、その職務範囲は変化しない。", "公害防止管理者の選任状況は、都道府県知事等への届出により把握される。"], "answer": [3], "explanation": "誤っているのは(4)です。公害防止管理者の実務上の職務は、排出基準の遵守状況（順守できているか、逸脱の兆候がないか等）を踏まえて重点的に対応すべき事項が変わりうるものであり、「かかわらず職務範囲は変化しない」という断定は実態に即していません。"}, {"id": 275, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "令和8年版環境白書に示された2024年度のPM2.5環境基準達成率（一般局）に関する記述として、正しいものはどれか。", "options": ["2023年度の100%から2024年度は99.5%へとわずかに低下した。", "2023年度から2024年度にかけて一貫して100%を維持している。", "2024年度の達成率は80%台にとどまった。", "PM2.5の環境基準達成率は令和8年版白書には記載がない。", "自排局の達成率は2024年度に90%を下回った。"], "answer": [0], "explanation": "2024年度のPM2.5環境基準達成率は一般局99.5%・自排局100%で、一般局は2023年度の100%からわずかに低下しました。"}, {"id": 276, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "2024年度における光化学オキシダントの環境基準達成局数（一般局、当時の基準による）に関する記述として、正しいものはどれか。", "options": ["達成局は0局となり、達成率は実質0%であった。", "達成局は500局を超え、達成率は50%を上回った。", "達成率はPM2.5とほぼ同水準の99%台であった。", "光化学オキシダントには環境基準が存在しないため、達成率は算出されていない。", "達成局数は前年度から倍増した。"], "answer": [0], "explanation": "2024年度、光化学オキシダントの環境基準を達成した一般局は0局で、達成率は実質0%でした。2021〜2023年度は1〜2局が達成していたため、2024年度に初めてゼロとなった点が変化点です。"}, {"id": 277, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "令和8年4月1日に施行された光化学オキシダントの環境基準改正に関する記述として、正しいものはどれか。", "options": ["評価基準が「1時間値0.06ppm以下」から「8時間値0.07ppm以下、かつ日最高8時間値の1年平均値0.04ppm以下」に変更された。", "評価基準が「8時間値0.06ppm以下」から「1時間値0.04ppm以下」に変更された。", "測定方法が新たに3種類に拡大された。", "この改正により、環境基準の達成が大幅に容易になった。", "改正は令和7年4月に施行された。"], "answer": [0], "explanation": "令和8年1月30日告示・4月1日施行で、評価基準が「1時間値0.06ppm以下」から「8時間値0.07ppm以下、かつ日最高8時間値の1年平均値0.04ppm以下」に変更されました。測定方法は3種類から2種類に絞られています。"}, {"id": 278, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "2024年度の二酸化窒素（NO2）、浮遊粒子状物質（SPM）、一酸化炭素（CO）の環境基準達成率について、令和8年版環境白書に示されている内容として正しいものはどれか。", "options": ["一般局・自排局共に100%を達成した。", "一般局は100%だが、自排局は90%台にとどまった。", "NO2のみ達成率が低下し、90%を下回った。", "3物質とも達成率は算出されていない。", "SPMのみ環境基準が撤廃された。"], "answer": [0], "explanation": "2024年度、NO2・SPM・COはいずれも一般局・自排局共に環境基準達成率100%でした。"}, {"id": 279, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "2024年度の二酸化硫黄（SO2）の環境基準達成率に関する記述として、正しいものはどれか。", "options": ["一般局99.6%、自排局100%と、一般局のみわずかに100%に届かなかった。", "一般局・自排局共に100%を達成した。", "一般局・自排局共に達成率は70%台にとどまった。", "SO2は環境基準が定められていない物質である。", "自排局のみ環境基準が定められている。"], "answer": [0], "explanation": "2024年度のSO2環境基準達成率は一般局99.6%・自排局100%で、NO2・SPM・COの100%と比べると一般局のみわずかに届いていない点が細かい出題ポイントです。"}, {"id": 280, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "揮発性有機化合物（VOC）の総排出量に関する令和8年版環境白書の記述として、正しいものはどれか。", "options": ["2024年度の総排出量は、基準年である2000年度と比較して約6割削減された。", "2024年度の総排出量は、2000年度比でほぼ横ばいであった。", "VOC排出量は2000年度以降、一貫して増加している。", "VOCの排出削減目標は設定されていない。", "VOC総排出量は2000年度比で倍増した。"], "answer": [0], "explanation": "2024年度のVOC総排出量は、基準年（2000年度）比で約6割削減されました。法規制と事業者の自主的取組を組み合わせたベストミックスの成果です。"}, {"id": 281, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "令和8年版環境白書に示された有害大気汚染物質（環境基準設定4物質）の2024年度の達成状況として、正しいものはどれか。", "options": ["ベンゼンが1地点で環境基準を超過し、他の3物質は全地点で達成した。", "4物質すべてが全地点で達成した。", "4物質すべてで複数地点の超過が確認された。", "有害大気汚染物質の環境基準はまだ1物質も設定されていない。", "トリクロロエチレンが複数地点で超過した。"], "answer": [0], "explanation": "2024年度、環境基準が設定されている4物質（ベンゼン、トリクロロエチレン、テトラクロロエチレン、ジクロロメタン）のうちベンゼンが1地点で基準を超過し、他の3物質は全地点で達成しました。"}, {"id": 282, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "石綿（アスベスト）の事前調査義務化の対象拡大（令和8年1月1日施行）に関する記述として、正しいものはどれか。", "options": ["煙突・貯蔵タンク等の「工作物」の解体等工事についても、新設資格「工作物石綿事前調査者」による事前調査が義務化された。", "建築物の事前調査義務化が、令和8年1月1日に初めて導入された。", "工作物の事前調査義務化は、工場の生産設備には適用されない。", "この改正により、石綿含有建材の使用が全面的に解禁された。", "工作物石綿事前調査者の資格は、講習を受けずに誰でも取得できる。"], "answer": [0], "explanation": "令和8年1月1日から、煙突・貯蔵タンク等の「工作物」の解体等にも新設資格「工作物石綿事前調査者」による事前調査が義務化されました。建築物の事前調査義務化は令和5年10月1日から既に施行済みです。"}, {"id": 283, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "水銀の大気排出対策に関する省令改正（令和7年2月）に関する記述として、正しいものはどれか。", "options": ["令和6年9月の中央環境審議会第三次答申を受け、令和7年2月に大気汚染防止法施行規則等の一部を改正する省令が公布された。", "水銀規制の見直しは今回が初めてで、過去に点検が行われたことはない。", "水俣条約に基づく大気汚染防止法の水銀規制は、令和8年4月に初めて施行された。", "水銀排出施設の届出制度は、今回新設された制度である。", "改正により、水銀規制は全て撤廃された。"], "answer": [0], "explanation": "令和6年9月の中央環境審議会「第三次答申」を受け、令和7年2月17日に省令が改正されました。「第三次」という表現から過去に複数回の点検が行われていることが分かります（改正大気汚染防止法自体は平成30年4月1日施行済み）。"}, {"id": 284, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "2025年の光化学オキシダント注意報等の発令延日数に関する令和8年版環境白書の記述として、最も近いものはどれか。", "options": ["約47日（16都府県）", "約5日", "約150日", "約300日", "発令実績はゼロであった"], "answer": [0], "explanation": "2025年の光化学オキシダント注意報等の発令延日数は47日（16都府県）で、月別では8月が最多の19日でした。"}, {"id": 285, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "光化学オキシダントの新たな評価指標（8時間値の日最高値の年間99パーセンタイル値の3年平均値）の地域別動向に関する記述として、正しいものはどれか。", "options": ["2022〜2024年度は2021〜2023年度と比較して、関東・東海・阪神地域で上昇し、福岡・山口地域は横ばいであった。", "全国すべての地域で顕著に低下した。", "新指標は令和8年度にはまだ算出されていない。", "関東地域のみ改善が見られた。", "この指標はPM2.5専用であり、光化学オキシダントには使用されない。"], "answer": [0], "explanation": "新指標でみると、2022〜2024年度は前の3年間と比べて関東・東海・阪神地域で上昇し、福岡・山口地域は横ばいでした。他の大気汚染物質が改善傾向にある中、光化学オキシダントが悪化方向にあるという対比構造がポイントです。"}, {"id": 286, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "自動車NOx・PM法に基づく対策の目標年度に関する記述として、正しいものはどれか。", "options": ["2026年度までに、対策地域の全常時監視測定局で環境基準の安定的・継続的な達成を目指すとされている。", "目標年度は2020年度であり、既に達成・完了している。", "自動車NOx・PM法には具体的な目標年度は設定されていない。", "目標年度は2050年度（カーボンニュートラルと同時期）とされている。", "対策地域は全国全域が指定されている。"], "answer": [0], "explanation": "自動車NOx・PM法に基づく対策では、2026年度までに対策地域の全常時監視測定局で環境基準の安定的・継続的な達成を目指す方針が示されています。中間目標年度が近づいている点は要注意です。"}, {"id": 287, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "オフロード法（特定特殊自動車排出ガスの規制等に関する法律）の規制強化に関する記述として、正しいものはどれか。", "options": ["2024年に規制が強化され、これは制度創設以来累計4回目の強化であった。", "オフロード法は2024年に初めて制定された。", "2024年の改正で、規制対象から建設機械が除外された。", "オフロード法の規制強化は、これまで一度も行われたことがない。", "2024年の改正は、自動車NOx・PM法の対策地域拡大に関するものであった。"], "answer": [0], "explanation": "オフロード法（建設機械等の排出ガス規制）は2024年に規制が再強化され、これは累計4回目の強化とされています。"}, {"id": 288, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "石綿の大気環境モニタリングに関する2024年度のデータとして、令和8年版環境白書の内容に最も近いものはどれか。", "options": ["全国44地点で調査が行われ、特に高い濃度は確認されなかった。", "全国1,000地点以上で調査が行われた。", "調査の結果、複数地点で高濃度の石綿が検出された。", "石綿の大気環境モニタリングは令和8年度から新たに開始された。", "石綿のモニタリングは実施されていない。"], "answer": [0], "explanation": "2024年度、石綿の大気環境モニタリングは全国44地点で実施され、特に高い濃度は確認されませんでした。"}, {"id": 289, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "令和8年版環境白書のテーマに関する記述として、正しいものはどれか。", "options": ["「循環経済（サーキュラーエコノミー）で日本列島を強く豊かに」がテーマであり、前年の令和7年版はGX・ESG投資が主題であった。", "テーマは「脱炭素社会の実現」であり、令和7年版と同一である。", "令和8年版のテーマは「生物多様性の保全」である。", "環境白書は令和8年度から隔年発行に変更された。", "令和8年版には大気環境に関する記載が一切含まれていない。"], "answer": [0], "explanation": "令和8年版環境白書のテーマは「循環経済（サーキュラーエコノミー）で日本列島を強く豊かに」で、前年の令和7年版（GX・ESG投資が主題）から力点が変化しています。"}, {"id": 290, "domain": "大気概論", "sub": "統計データ", "type": "single", "q": "2024年度の非メタン炭化水素（NMHC）濃度に関する令和8年版環境白書の記述として、最も近いものはどれか。", "options": ["一般局0.10ppmC、自排局0.11ppmCで、緩やかな低下傾向にある。", "一般局・自排局とも急激に上昇している。", "NMHCは大気汚染防止法上、測定・公表の対象外である。", "NMHC濃度は2000年度以降、横ばいで一切変化していない。", "NMHCは光化学オキシダントの生成には関与しない物質である。"], "answer": [0], "explanation": "2024年度の非メタン炭化水素（NMHC）濃度は一般局0.10ppmC・自排局0.11ppmCで、緩やかな低下傾向にあります。NMHCは光化学オキシダント生成の原因物質の一つとして継続的にモニタリングされています。"}, {"id": 291, "domain": "大気特論", "sub": "燃料性状", "type": "single", "q": "液体燃料に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　ガソリン、灯油、軽油は、いずれもJISにより規格が定められている石油系液体燃料である。\nb　重油は、一般にA重油・B重油・C重油に分類され、粘度や硫黄分の含有量が異なる。\nc　灯油は、JISにおいて「煙点」の規格が定められている燃料の一つである。\nd　液体燃料の発熱量は、燃料の種類にかかわらず常に同一の値である。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（発熱量は燃料の種類・組成によって異なります）。"}, {"id": 292, "domain": "大気特論", "sub": "燃料性状", "type": "single", "q": "気体燃料に関する次の記述のうち、誤っているものはどれか。", "options": ["LNG（液化天然ガス）は、天然ガスを冷却して液化したものである。", "LPG（液化石油ガス）は、常温でも比較的低い圧力を加えることで液化できる特徴がある。", "LNGは、LPGと比較して常温常圧における沸点が高い。", "都市ガスの主成分は、多くの場合メタンである。", "気体燃料は、固体燃料や液体燃料と比べて、一般に燃焼管理が行いやすいとされる。"], "answer": [2], "explanation": "誤っているのは(3)です。LNGの主成分メタンの沸点（約-162℃）は、LPGの主成分プロパン・ブタンの沸点（-42℃、-0.5℃程度）よりも「低い」ため、「LNGの方が沸点が高い」というのは誤りです。"}, {"id": 293, "domain": "大気特論", "sub": "燃料性状", "type": "single", "q": "石炭に関する次の記述のうち、正しいものはどれか。", "options": ["石炭は、炭化の進行度合いにより無煙炭、歴青炭、亜歴青炭、褐炭等に分類され、一般に炭化が進んだものほど固定炭素の割合が高い傾向がある。", "石炭には、いおう分や灰分は一切含まれない。", "石炭の発熱量は、炭種にかかわらず常に同一である。", "石炭は、燃焼させても灰が生じない燃料である。", "石炭の元素分析では、炭素・水素以外の成分（窒素、いおう等）は測定対象外である。"], "answer": [0], "explanation": "正しいのは(1)です。石炭は炭化の進行度により無煙炭・歴青炭・亜歴青炭・褐炭等に分類され、一般に炭化が進んだ（石炭化度が高い）ものほど固定炭素の割合が高く、水分・揮発分は少なくなる傾向があります。"}, {"id": 294, "domain": "大気特論", "sub": "燃料性状", "type": "single", "q": "燃料の分類に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　常温で加圧することにより液化するガス燃料には、LPGが該当する。\nb　JISにおいて煙点の規格が定められている石油系液体燃料には、灯油が該当する。\nc　固定炭素の割合が最も大きい石炭は、一般に無煙炭とされる。\nd　気体燃料には、灰分や固定炭素という概念が液体・固体燃料と全く同様に適用される。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（灰分・固定炭素は主に固体燃料の性状を表す指標であり、気体燃料には通常適用されない概念です）。"}, {"id": 295, "domain": "大気特論", "sub": "燃料性状", "type": "single", "q": "水素及びメタンの燃焼特性に関する次の記述のうち、誤っているものはどれか。", "options": ["水素は、燃焼により水（水蒸気）のみを生成し、炭素分を含まないため二酸化炭素を排出しない。", "メタンは炭化水素の一種であり、燃焼により二酸化炭素と水を生成する。", "水素は、他の炭化水素系燃料と比較して、単位発熱量あたりの燃焼生成物の質量・体積の傾向が異なる。", "水素とメタンは、いずれも常温常圧で液体として存在する燃料である。", "水素の燃焼反応は、炭化水素の燃焼反応よりも反応式の構成元素が少ない。"], "answer": [3], "explanation": "誤っているのは(4)です。水素・メタンはいずれも常温常圧では「気体」として存在する物質であり、「液体として存在する」は誤りです（LNGのように冷却・加圧すれば液化はしますが、常温常圧では気体です）。"}, {"id": 296, "domain": "大気特論", "sub": "燃料性状", "type": "single", "q": "燃料中の硫黄分に関する次の記述のうち、正しいものはどれか。", "options": ["燃料中の硫黄分は、燃焼により主に二酸化硫黄（一部三酸化硫黄）に変化する。", "燃料中の硫黄分は、燃焼によって窒素酸化物にのみ変化する。", "重油に含まれる硫黄分は、常に石炭よりも多い。", "燃料の脱硫は、燃焼後の排煙脱硫のみで行われ、燃料自体の脱硫という概念は存在しない。", "燃料中の硫黄分の含有量は、大気汚染物質の排出量には影響しない。"], "answer": [0], "explanation": "正しいのは(1)です。燃料中の硫黄分は燃焼により主に二酸化硫黄（SO2）に酸化され、一部はさらに酸化されて三酸化硫黄（SO3）となります。燃料の脱硫（重油の直接脱硫等）も対策の一つとして行われています。"}, {"id": 297, "domain": "大気特論", "sub": "燃料性状", "type": "single", "q": "エマルション燃料に関する次の記述のうち、正しいものはどれか。", "options": ["エマルション燃料は、重油等の燃料に水を微細な液滴として分散させたものであり、燃焼改善等を目的として用いられることがある。", "エマルション燃料は、燃料と水が完全に分離した状態のものをいう。", "エマルション燃料は、気体燃料にのみ適用される概念である。", "エマルション燃料の使用は、NOx低減効果とは無関係である。", "エマルション燃料は、固体燃料（石炭）を粉砕したものをいう。"], "answer": [0], "explanation": "正しいのは(1)です。エマルション燃料は、重油などの燃料に微細な水滴を分散させた燃料で、燃焼時の水分の急激な蒸発（マイクロエクスプロージョン）により燃焼が改善され、NOx低減等の効果が期待される場合があります。"}, {"id": 298, "domain": "大気特論", "sub": "燃料性状", "type": "single", "q": "ガスタービンにおける燃焼の特徴に関する次の記述のうち、誤っているものはどれか。", "options": ["ガスタービンは、圧縮した空気中で燃料を連続的に燃焼させ、高温高圧の燃焼ガスでタービンを回転させる原動機である。", "ガスタービンの燃料には、気体燃料・液体燃料のいずれも使用されることがある。", "ガスタービンは、ボイラーと全く同じ燃焼方式を採用する設備である。", "ガスタービンの排熱を利用した排熱回収ボイラーを組み合わせるコンバインドサイクル発電が行われることがある。", "ガスタービンの燃焼温度は、NOx生成量に影響を与える要因の一つである。"], "answer": [2], "explanation": "誤っているのは(3)です。ガスタービンは連続的な燃焼・タービン回転を特徴とする原動機であり、ボイラー（缶体内での燃焼により蒸気を発生させる設備）とは燃焼方式・構造が異なります。「全く同じ」は誤りです。"}, {"id": 299, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "組成（容積％）がCH4：80、C2H6：20の気体燃料1m³_Nを完全燃焼させるときの理論酸素量（m³_N）はいくらか。ただし、CH4 + 2O2 → CO2 + 2H2O、C2H6 + 3.5O2 → 2CO2 + 3H2Oとする。", "options": ["1.50", "1.90", "2.10", "2.30", "2.50"], "answer": [3], "explanation": "CH4の酸素消費量＝0.80×2＝1.60。C2H6の酸素消費量＝0.20×3.5＝0.70。合計＝1.60＋0.70＝2.30。よって正解は(4)の2.30です。"}, {"id": 300, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "上記の気体燃料（CH4：80％、C2H6：20％）1m³_Nを、理論空気量で完全燃焼させたときの理論乾き燃焼ガス量（m³_N）はいくらか。ただし、空気中の酸素濃度は21％とし、生成するCO2量はCH4由来0.80m³_N、C2H6由来0.40m³_Nとする。", "options": ["8.5", "9.9", "10.7", "11.7", "12.7"], "answer": [1], "explanation": "理論空気量＝理論酸素量÷0.21＝2.30÷0.21≒10.95m³_N。窒素量＝理論空気量－理論酸素量＝10.95－2.30＝8.65m³_N。CO2量＝0.80＋0.40＝1.20m³_N。理論乾き燃焼ガス量＝CO2量＋窒素量＝1.20＋8.65＝9.85m³_N。最も近い選択肢は(2)の9.9です。数値の丸め方によって多少の差が出るため、計算過程（酸素量→空気量→窒素量→CO2量の合算）の理解を優先してください。"}, {"id": 301, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "炭素（C）1kgを完全燃焼させるために必要な理論酸素量（m³_N）はいくらか。ただし、C + O2 → CO2とし、炭素の原子量を12、標準状態における気体のモル体積を22.4L/molとする。", "options": ["1.87", "2.24", "2.87", "3.24", "4.87"], "answer": [0], "explanation": "炭素1kg＝1000g÷12g/mol≒83.3mol。反応式より炭素1molに対し酸素1molが必要なので、必要な酸素は83.3mol。体積に換算すると83.3mol×22.4L/mol≒1866L≒1.87m³_N。よって正解は(1)です。"}, {"id": 302, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "乾き燃焼排ガス中の二酸化炭素（CO2）濃度に関する次の記述のうち、正しいものはどれか。", "options": ["燃焼用空気量が理論空気量に近づく（過剰空気が少なくなる）ほど、乾き燃焼排ガス中のCO2濃度は高くなる傾向がある。", "過剰空気量が多いほど、乾き燃焼排ガス中のCO2濃度は高くなる傾向がある。", "燃焼用空気量は、乾き燃焼排ガス中のCO2濃度には全く影響しない。", "乾き燃焼排ガス中のCO2濃度は、燃料の種類にかかわらず常に同一の値になる。", "CO2濃度は、燃焼状態の良否を判断する指標としては用いられない。"], "answer": [0], "explanation": "正しいのは(1)です。過剰空気が少ない（理論空気量に近い）ほど、燃焼ガス全体に占めるCO2の割合（濃度）は相対的に高くなります。逆に過剰空気が多いほど、窒素等で希釈されCO2濃度は低くなる傾向があります。CO2濃度（またはO2濃度）は燃焼管理の指標として広く用いられます。"}, {"id": 303, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "重油（発熱量、元素組成が既知）の燃焼計算において、理論空気量を求めるために最低限必要な情報の組合せとして、正しいものはどれか。", "options": ["燃料の元素組成（炭素・水素・硫黄・酸素等の質量割合）", "燃料の価格及び購入量", "燃焼設備の設置年数", "排出口の色及び形状", "工場の敷地面積"], "answer": [0], "explanation": "正しいのは(1)です。理論空気量の計算には、燃料中の炭素・水素・硫黄等の元素組成（質量割合）から各元素の燃焼に必要な酸素量を積み上げて求める必要があり、元素組成データが不可欠です。"}, {"id": 304, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "ボイラーにおける基準空気比に関する次の記述のうち、正しいものはどれか。", "options": ["空気比とは、実際に供給した空気量を理論空気量で除した値である。", "空気比が1.0を下回る（理論空気量より少ない）状態は、常に望ましい完全燃焼状態を意味する。", "空気比は、燃焼室熱負荷や燃焼装置の性能とは無関係に一律の値が定められている。", "空気比が大きいほど、一般に排ガス量は少なくなる。", "空気比の概念は、固体燃料の燃焼には適用されない。"], "answer": [0], "explanation": "正しいのは(1)です。空気比＝実際供給空気量÷理論空気量で定義されます。空気比が1.0を下回る場合は酸素不足で不完全燃焼（一酸化炭素の発生等）が生じやすくなるため、通常は1.0をやや上回る適切な空気比で運転されます。空気比が大きいほど排ガス量は増加する傾向があります。"}, {"id": 305, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "燃焼室熱負荷に関する次の記述のうち、正しいものはどれか。", "options": ["燃焼室熱負荷は、燃焼室の容積あたりの発生熱量を表す指標の一つである。", "燃焼室熱負荷は、燃料の発熱量とは無関係に決まる値である。", "燃焼室熱負荷が高いほど、常に燃焼状態は改善される。", "燃焼室熱負荷は、ボイラーの設計・運転管理には用いられない指標である。", "燃焼室熱負荷は、燃焼室の表面積のみによって決まる。"], "answer": [0], "explanation": "正しいのは(1)です。燃焼室熱負荷は、燃焼室の単位容積あたりに投入される熱量（発熱量×燃料使用量／燃焼室容積）を表す指標で、ボイラーなどの設計・運転管理において重要な指標の一つです。"}, {"id": 306, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "拡大Zeldovich機構（サーマルNOx生成機構）に関する次の記述のうち、正しいものはどれか。", "options": ["拡大Zeldovich機構は、燃焼用空気中の窒素と酸素が高温下で反応してNOが生成する過程を説明する反応機構の一つである。", "拡大Zeldovich機構は、燃料中の窒素分に由来するフューエルNOxの生成のみを説明する機構である。", "拡大Zeldovich機構によれば、燃焼温度が低いほどNOx生成量は増加する。", "拡大Zeldovich機構は、いおう酸化物の生成機構を説明する理論である。", "拡大Zeldovich機構は、燃焼工学とは無関係な理論である。"], "answer": [0], "explanation": "正しいのは(1)です。拡大Zeldovich機構は、高温の燃焼場において空気中の窒素と酸素（及び関連するラジカル種）が反応してサーマルNOx（一酸化窒素）が生成する過程を説明する、代表的な反応機構です。一般に燃焼温度が「高い」ほどNOx生成量は増加します。"}, {"id": 307, "domain": "大気特論", "sub": "燃焼装置", "type": "single", "q": "油燃焼バーナーに関する次の記述のうち、誤っているものはどれか。", "options": ["油燃焼バーナーは、液体燃料を微粒化（霧化）して燃焼させる装置である。", "霧化方式には、圧力噴霧式、回転噴霧式、蒸気（空気）噴霧式などがある。", "燃料の粒径が小さいほど、一般に燃焼効率は向上しやすい傾向がある。", "油燃焼バーナーは、気体燃料専用のバーナーであり、液体燃料には使用できない。", "バーナーの選定には、燃料の性状や燃焼負荷等が考慮される。"], "answer": [3], "explanation": "誤っているのは(4)です。油燃焼バーナーはその名の通り「液体燃料（重油等）」を微粒化して燃焼させるためのバーナーであり、気体燃料専用ではありません。「気体燃料用バーナー」は別に存在します。"}, {"id": 308, "domain": "大気特論", "sub": "燃焼装置", "type": "single", "q": "気体燃料用バーナーと液体燃料用油バーナーの違いに関する次の記述のうち、正しいものはどれか。", "options": ["気体燃料用バーナーは、燃料をあらかじめ微粒化する必要がなく、ガス自体を空気と混合して燃焼させる構造である。", "気体燃料用バーナーも、液体燃料用バーナーと全く同じ霧化機構を備えている。", "液体燃料用バーナーは、霧化を必要としない構造である。", "気体燃料用・液体燃料用のいずれのバーナーも、燃焼用空気との混合方式に違いはない。", "気体燃料は、霧化しなければ燃焼させることができない。"], "answer": [0], "explanation": "正しいのは(1)です。気体燃料はもともとガス状であるため、液体燃料のような微粒化（霧化）の工程は不要で、ガスと空気を適切に混合する構造のバーナーが用いられます。液体燃料用バーナーは、燃焼効率向上のため燃料の霧化（微粒化）を行う点が特徴です。"}, {"id": 309, "domain": "大気特論", "sub": "燃焼装置", "type": "single", "q": "通風装置（送風機・誘引通風機等）に関する次の記述のうち、誤っているものはどれか。", "options": ["押込通風は、燃焼用空気を燃焼室に送り込む方式の通風である。", "誘引通風は、燃焼室及び煙道内のガスを誘引ファン等で引き出す方式の通風である。", "平衡通風は、押込通風と誘引通風を組み合わせた通風方式である。", "通風装置は、燃焼用空気の供給及び燃焼ガスの排出のいずれにも関与しない設備である。", "通風力（ドラフト）は、煙突効果（自然通風）によっても得られることがある。"], "answer": [3], "explanation": "誤っているのは(4)です。通風装置は、まさに燃焼用空気の供給（押込通風）や燃焼ガスの排出（誘引通風）に関与する重要な設備であり、「いずれにも関与しない」は誤りです。"}, {"id": 310, "domain": "大気特論", "sub": "燃焼装置", "type": "single", "q": "燃焼監視・制御に用いる温度計に関する次の記述のうち、正しいものはどれか。", "options": ["熱電対温度計は、2種類の異なる金属線の接合部に生じる熱起電力を利用して温度を測定する。", "放射温度計は、対象物に直接接触させなければ温度を測定できない方式である。", "温度計の種類は、測定対象の温度範囲や設置条件にかかわらず、常に同一のものが使用される。", "熱電対温度計は、極めて低温領域の測定にのみ用いられる。", "燃焼設備における温度測定は、燃焼管理には一切用いられない。"], "answer": [0], "explanation": "正しいのは(1)です。熱電対温度計は、異種金属の接合部に生じる熱起電力（ゼーベック効果）を利用して温度を測定する方式です。放射温度計は非接触で測定できる点が特徴で、熱電対とは異なります。"}, {"id": 311, "domain": "大気特論", "sub": "燃焼装置", "type": "single", "q": "すす（黒煙）の発生に関する次の記述のうち、誤っているものはどれか。", "options": ["すすは、燃料中の炭素分が不完全燃焼により未燃のまま残留・凝集したものである。", "空気比が不足し酸素供給が不十分な状態では、すすが発生しやすくなる傾向がある。", "燃料と空気の混合が不十分な場合も、すすの発生要因となりうる。", "すすの発生は、燃焼用空気量とは全く無関係である。", "すすの発生を抑制するには、燃料と空気の適切な混合や十分な酸素供給が重要である。"], "answer": [3], "explanation": "誤っているのは(4)です。すすの発生は、燃焼用空気量（酸素供給の十分性）と密接に関係しており、空気比が不足すると不完全燃焼によりすすが発生しやすくなります。「全く無関係」は誤りです。"}, {"id": 312, "domain": "大気特論", "sub": "燃焼装置", "type": "single", "q": "二段燃焼法に関する次の記述のうち、正しいものはどれか。", "options": ["二段燃焼法は、燃焼用空気を2段階に分けて供給することで、局所的な高温領域を抑え、NOx生成を抑制する技術である。", "二段燃焼法は、ばいじんの発生を抑制するための集じん技術である。", "二段燃焼法は、いおう酸化物の除去を目的とした排煙処理技術である。", "二段燃焼法は、燃料を2種類同時に使用する方式をいう。", "二段燃焼法は、NOx生成量を増加させる燃焼方式である。"], "answer": [0], "explanation": "正しいのは(1)です。二段燃焼法は、燃焼用空気を主燃焼域と後段の追加空気供給域に分けて供給することで、局所的な高温・高酸素濃度領域を抑え、サーマルNOxの生成を抑制する燃焼技術（燃焼管理によるNOx低減対策）です。"}, {"id": 313, "domain": "大気特論", "sub": "燃焼装置", "type": "single", "q": "バナジウムアタック（高温腐食）に関する次の記述のうち、正しいものはどれか。", "options": ["バナジウムアタックは、重油等に含まれるバナジウム化合物が高温下でボイラーの伝熱面等を腐食させる現象である。", "バナジウムアタックは、天然ガス（LNG）の燃焼特有の現象である。", "バナジウムアタックは、低温部でのみ発生し、高温部では発生しない。", "バナジウムアタックへの対策として、燃料中のバナジウム分を増加させることが有効とされる。", "バナジウムアタックは、大気汚染物質の排出量には一切関係しない、単なる設備劣化の問題である。"], "answer": [0], "explanation": "正しいのは(1)です。バナジウムアタックは、重油等に含まれるバナジウム化合物（灰分中の五酸化バナジウム等）が高温の燃焼灰中で低融点の化合物を形成し、ボイラーの過熱器等の金属を腐食させる高温腐食現象です。対策としては添加剤の使用や燃料の選定等が行われます。"}, {"id": 314, "domain": "大気特論", "sub": "燃焼装置", "type": "single", "q": "酸素計及び二酸化炭素計による燃焼管理に関する次の記述のうち、正しいものはどれか。", "options": ["排ガス中の酸素濃度や二酸化炭素濃度を測定することで、燃焼用空気量が適切かどうかを判断する材料が得られる。", "酸素計・二酸化炭素計の測定値は、燃焼管理には一切利用されない。", "排ガス中の酸素濃度が高いほど、常に燃焼効率は向上する。", "二酸化炭素濃度の測定は、いおう酸化物の測定と全く同じ原理・目的で行われる。", "酸素計・二酸化炭素計は、燃焼設備の運転開始時にのみ一度だけ使用されるものである。"], "answer": [0], "explanation": "正しいのは(1)です。排ガス中の酸素濃度・二酸化炭素濃度は、空気比（過不足）の目安として日常的な燃焼管理に活用されます。酸素濃度が高すぎる場合は過剰空気が多く（熱損失増）、低すぎる場合は不完全燃焼のリスクが高まるため、適切な範囲での管理が重要です。"}, {"id": 315, "domain": "大気特論", "sub": "排煙脱硫", "type": "single", "q": "石灰スラリー吸収法（湿式排煙脱硫）に関する次の記述のうち、誤っているものはどれか。", "options": ["石灰スラリー吸収法は、石灰石等を水に懸濁させたスラリーで排ガス中のいおう酸化物を吸収する方法である。", "石灰スラリー吸収法の副生成物として、石こう（せっこう）が生成することがある。", "石灰スラリー吸収法は、いおう酸化物だけでなく、窒素酸化物の除去も主目的とする方法である。", "石灰スラリー吸収法は、湿式排煙脱硫技術の代表的な方式の一つである。", "石灰スラリーによる吸収反応では、亜硫酸カルシウムを経て石こう（硫酸カルシウム）が生成する。"], "answer": [2], "explanation": "誤っているのは(3)です。石灰スラリー吸収法は「いおう酸化物（SOx）」の除去を主目的とする脱硫技術であり、窒素酸化物の除去（脱硝）が主目的ではありません。"}, {"id": 316, "domain": "大気特論", "sub": "排煙脱硫", "type": "single", "q": "水酸化マグネシウムスラリー吸収法に関する次の記述のうち、正しいものはどれか。", "options": ["水酸化マグネシウムスラリー吸収法は、水酸化マグネシウムを吸収剤として用いる湿式排煙脱硫技術である。", "水酸化マグネシウムスラリー吸収法は、窒素酸化物の除去を目的とした乾式技術である。", "水酸化マグネシウムスラリー吸収法では、石灰石を吸収剤として用いる。", "水酸化マグネシウムスラリー吸収法は、いかなる排ガス中のいおう酸化物にも適用できない。", "水酸化マグネシウムスラリー吸収法は、燃焼前の燃料処理技術である。"], "answer": [0], "explanation": "正しいのは(1)です。水酸化マグネシウムスラリー吸収法は、水酸化マグネシウム（Mg(OH)2）を吸収剤として用いる湿式の排煙脱硫技術で、石灰スラリー吸収法と並ぶ代表的な脱硫方式の一つです。"}, {"id": 317, "domain": "大気特論", "sub": "排煙脱硫", "type": "single", "q": "脱硫プロセスの分類に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　湿式脱硫法は、水や薬液のスラリー・溶液を用いていおう酸化物を吸収する方法である。\nb　乾式脱硫法には、活性炭や石灰石粉末等を用いる方法がある。\nc　湿式脱硫法は、乾式脱硫法と比較して、一般に脱硫効率が高い傾向があるとされる。\nd　脱硫プロセスは、必ず燃焼前の燃料処理でのみ行われ、排ガス処理として行われることはない。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（脱硫は「燃焼前の燃料脱硫」だけでなく「燃焼後の排煙脱硫」としても広く行われています。石灰スラリー吸収法などはまさに排煙脱硫技術です）。"}, {"id": 318, "domain": "大気特論", "sub": "排煙脱硫", "type": "single", "q": "排煙脱硫の効率に影響を与える要因に関する次の記述のうち、誤っているものはどれか。", "options": ["吸収液（スラリー等）とガスの接触面積・接触時間は、脱硫効率に影響を与える要因の一つである。", "液ガス比（吸収液量とガス量の比）は、脱硫効率に影響を与えることがある。", "吸収剤（石灰石等）の粒径や反応性は、脱硫効率に影響を与えることがある。", "排ガス中のいおう酸化物濃度は、脱硫効率には一切影響しない。", "吸収塔の構造（充塡塔、スプレー塔等）も、脱硫性能に影響を与える要因の一つである。"], "answer": [3], "explanation": "誤っているのは(4)です。排ガス中のいおう酸化物濃度も、吸収反応の進行速度等を通じて脱硫効率に影響を与えうる要因であり、「一切影響しない」は誤りです。"}, {"id": 319, "domain": "大気特論", "sub": "排煙脱硫", "type": "single", "q": "重油の直接脱硫（燃料脱硫）に関する次の記述のうち、正しいものはどれか。", "options": ["重油の直接脱硫は、水素化処理等により燃料中の硫黄分そのものを低減する技術である。", "重油の直接脱硫は、燃焼後の排ガスを処理する技術である。", "重油の直接脱硫は、いおう酸化物ではなく窒素酸化物の低減を目的とする技術である。", "重油の直接脱硫は、脱硫の効果が全く確認されていない技術である。", "重油の直接脱硫は、石灰スラリー吸収法と全く同じ処理原理を用いる。"], "answer": [0], "explanation": "正しいのは(1)です。重油の直接脱硫は、精製段階で水素化処理等により燃料に含まれる硫黄分自体を低減する「燃料脱硫」技術で、燃焼後の排ガスを処理する「排煙脱硫」（石灰スラリー吸収法等）とは異なるアプローチです。"}, {"id": 320, "domain": "大気特論", "sub": "排煙脱硫", "type": "single", "q": "石灰スラリー吸収法における副生成物の処理に関する次の記述のうち、誤っているものはどれか。", "options": ["副生成物として生成する石こうは、建材（せっこうボード等）の原料として有効活用されることがある。", "石こうの品質を高めるため、酸化工程（酸化空気の吹き込み等）が行われることがある。", "副生成物の処理・利用方法は、脱硫プロセス全体のコストや環境負荷にも関わる検討事項である。", "石灰スラリー吸収法からは、いかなる副生成物も一切生じない。", "副生成物の性状は、吸収剤の種類や反応条件によって変化することがある。"], "answer": [3], "explanation": "誤っているのは(4)です。石灰スラリー吸収法では石こう（亜硫酸カルシウム又は硫酸カルシウム）等の副生成物が生じるのが通常であり、「いかなる副生成物も一切生じない」は誤りです。"}, {"id": 321, "domain": "大気特論", "sub": "排煙脱硫", "type": "single", "q": "排煙脱硫技術の選定に関する次の記述のうち、正しいものはどれか。", "options": ["排煙脱硫技術の選定には、排ガス量、いおう酸化物濃度、設置スペース、コスト等、複数の要素が考慮される。", "排煙脱硫技術は、いかなる状況でも同一の方式を選定すればよく、条件による使い分けは不要である。", "排煙脱硫技術の選定にコストは一切考慮されない。", "排煙脱硫技術は、湿式のみが存在し、乾式の技術は存在しない。", "排煙脱硫技術の選定は、大気汚染防止法の排出基準とは無関係に行われる。"], "answer": [0], "explanation": "正しいのは(1)です。排煙脱硫技術の選定にあたっては、排ガス量・濃度・設置スペース・コスト・遵守すべき排出基準など、複数の技術的・経済的要素を総合的に考慮する必要があります。"}, {"id": 322, "domain": "大気特論", "sub": "排煙脱硫", "type": "single", "q": "湿式排煙脱硫における吸収塔の型式（スプレー塔、充塡塔等）に関する次の記述のうち、誤っているものはどれか。", "options": ["スプレー塔は、吸収液を細かい液滴として噴霧し、ガスと接触させる方式の吸収塔である。", "充塡塔は、充塡物によりガスと液の接触面積を増やす方式の吸収塔である。", "吸収塔の型式によって、圧力損失や必要な設置スペースが異なることがある。", "吸収塔の型式は、脱硫効率には全く影響を及ぼさない。", "吸収塔内でのガスと液の流れ方向（向流・並流等）も、性能に影響を与える要因の一つである。"], "answer": [3], "explanation": "誤っているのは(4)です。吸収塔の型式（スプレー塔、充塡塔等）は、ガスと液の接触効率に直結するため、脱硫効率に大きく影響します。「全く影響を及ぼさない」は誤りです。"}, {"id": 323, "domain": "大気特論", "sub": "排煙脱硫", "type": "single", "q": "排煙脱硫装置の運転管理に関する次の記述のうち、正しいものはどれか。", "options": ["吸収液のpHや吸収剤の供給量は、脱硫効率を維持するための運転管理項目の一つとなりうる。", "排煙脱硫装置は、一度設計・設置すれば運転管理は一切不要である。", "吸収液の性状（濃度等）は、脱硫効率とは無関係である。", "排煙脱硫装置の点検・整備は、法令上求められていない。", "吸収液の循環・補給は、脱硫性能の維持には関係しない。"], "answer": [0], "explanation": "正しいのは(1)です。吸収液のpHや吸収剤の供給量、循環量などは、脱硫効率を安定的に維持するための重要な運転管理項目です。"}, {"id": 324, "domain": "大気特論", "sub": "排煙脱硫", "type": "single", "q": "重油焚き設備におけるSO3（三酸化硫黄）の生成に関する次の記述のうち、正しいものはどれか。", "options": ["燃料中のいおう分の一部は、燃焼過程でSO2からさらに酸化され、SO3として生成することがある。", "SO3は、いかなる燃焼過程でも一切生成しない物質である。", "SO3の生成は、大気汚染や設備腐食とは無関係である。", "SO3は、必ずSO2よりも生成量が多い。", "SO3の生成は、触媒（バナジウム化合物等）の存在とは無関係である。"], "answer": [0], "explanation": "正しいのは(1)です。燃料中のいおう分は主にSO2として生成しますが、一部はさらに酸化されSO3として生成することがあります（灰中のバナジウム化合物等が酸化を促進する触媒的な働きをすることも知られています）。SO3は白煙や低温腐食、酸性ミストの原因ともなりえます。"}, {"id": 325, "domain": "大気特論", "sub": "排煙脱硝", "type": "single", "q": "アンモニア接触還元法（選択的触媒還元法、SCR法）に関する次の記述のうち、誤っているものはどれか。", "options": ["アンモニア接触還元法は、アンモニアを還元剤として触媒上で窒素酸化物を窒素と水に還元する方法である。", "アンモニア接触還元法は、脱硝技術の代表的な方式の一つである。", "アンモニア接触還元法は、一般に選択的無触媒還元法（SNCR法）よりも高いNOx除去率が得られるとされる。", "アンモニア接触還元法は、いおう酸化物の除去を主目的とする技術である。", "アンモニア接触還元法では、アンモニアの過剰供給（アンモニアスリップ）に注意する必要がある。"], "answer": [3], "explanation": "誤っているのは(4)です。アンモニア接触還元法は「窒素酸化物（NOx）」の除去（脱硝）を目的とした技術であり、いおう酸化物の除去（脱硫）が主目的ではありません。"}, {"id": 326, "domain": "大気特論", "sub": "排煙脱硝", "type": "single", "q": "排ガス再循環によるNOx低減に関する次の記述のうち、正しいものはどれか。", "options": ["排ガス再循環法は、排ガスの一部を燃焼用空気に混合することで、燃焼温度を下げてサーマルNOxの生成を抑制する技術である。", "排ガス再循環法は、窒素酸化物ではなく、いおう酸化物の低減を主目的とする技術である。", "排ガス再循環法は、燃焼温度を上昇させることでNOx低減を図る技術である。", "排ガス再循環法は、触媒を用いて排ガス中のNOxを分解する技術である。", "排ガス再循環法は、燃焼装置の外部で行う排煙処理技術に分類され、燃焼技術には分類されない。"], "answer": [0], "explanation": "正しいのは(1)です。排ガス再循環法は、排ガスの一部を燃焼用空気に混合することで酸素濃度を下げつつ燃焼温度の過度な上昇を抑え、サーマルNOxの生成を抑制する「燃焼技術（燃焼管理による対策）」の一つです。"}, {"id": 327, "domain": "大気特論", "sub": "排煙脱硝", "type": "single", "q": "選択的無触媒還元法（SNCR法）に関する次の記述のうち、正しいものはどれか。", "options": ["SNCR法は、触媒を用いずに、高温領域でアンモニアや尿素を吹き込みNOxを還元する方法である。", "SNCR法は、SCR法よりも常に高いNOx除去率が得られる方法である。", "SNCR法は、触媒を必須の構成要素とする方法である。", "SNCR法は、いおう酸化物の除去技術である。", "SNCR法は、低温領域（100℃以下）で最も効果を発揮する技術である。"], "answer": [0], "explanation": "正しいのは(1)です。SNCR法（選択的無触媒還元法）は、触媒を用いずに高温領域（一般に900〜1000℃程度）でアンモニアや尿素を吹き込み、窒素酸化物を還元する方法です。触媒を用いるSCR法と比較すると、一般にNOx除去率はやや低いとされます。"}, {"id": 328, "domain": "大気特論", "sub": "排煙脱硝", "type": "single", "q": "窒素酸化物（NOx）の生成を抑制する燃焼技術に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　二段燃焼法は、燃焼用空気を分割供給することでNOx生成を抑制する技術である。\nb　排ガス再循環法は、燃焼温度を下げることでサーマルNOxの生成を抑制する技術である。\nc　低NOxバーナーは、燃焼条件を工夫してNOx生成を抑制するよう設計されたバーナーである。\nd　これらの燃焼技術は、いずれも排煙脱硝装置と同一の触媒反応を利用している。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（二段燃焼法・排ガス再循環法・低NOxバーナーは、いずれも「燃焼条件の工夫」によりNOx生成自体を抑える燃焼技術であり、触媒を用いる排煙脱硝技術とは異なる仕組みです）。"}, {"id": 329, "domain": "大気特論", "sub": "排煙脱硝", "type": "single", "q": "脱硝装置の設置位置（触媒の配置）に関する次の記述のうち、正しいものはどれか。", "options": ["脱硝装置（SCR法）は、集じん装置の前段（高ダスト側）に設置される場合と、後段（低ダスト側）に設置される場合がある。", "脱硝装置は、必ず集じん装置の後段にのみ設置される。", "脱硝装置の設置位置は、脱硝性能や触媒の劣化リスクには一切関係しない。", "脱硝装置は、排煙脱硫装置よりも必ず後段に設置されなければならない。", "脱硝装置の設置位置は、排ガスの温度条件とは無関係に決定される。"], "answer": [0], "explanation": "正しいのは(1)です。SCR法による脱硝装置は、触媒の活性温度域を確保しやすい高温段階（集じん装置の前段、高ダスト側）に設置される場合と、集じん・脱硫後の低ダスト側に設置される場合があり、設備設計によって異なります。"}, {"id": 330, "domain": "大気特論", "sub": "排煙脱硝", "type": "single", "q": "脱硝触媒の劣化要因に関する次の記述のうち、誤っているものはどれか。", "options": ["排ガス中のダスト（ばいじん）による目詰まりや摩耗は、触媒劣化の要因の一つとなりうる。", "特定の物質（触媒毒となる成分等）による被毒は、触媒性能を低下させる要因となりうる。", "高温での長期使用による熱劣化（シンタリング等）も、触媒性能低下の要因となりうる。", "脱硝触媒は、いかなる条件下でも劣化することがなく、半永久的に使用できる。", "触媒の劣化に応じて、交換や再生などの対応が必要となる場合がある。"], "answer": [3], "explanation": "誤っているのは(4)です。脱硝触媒は、ダストによる目詰まり・摩耗、被毒、熱劣化等により経年的に性能が低下することが知られており、「半永久的に使用できる」は誤りです。"}, {"id": 331, "domain": "大気特論", "sub": "排煙脱硝", "type": "single", "q": "アンモニアスリップ（未反応アンモニアの排出）に関する次の記述のうち、正しいものはどれか。", "options": ["アンモニアスリップとは、脱硝反応で消費されなかった余剰のアンモニアが排ガス中に残留・排出される現象をいう。", "アンモニアスリップは、脱硝性能が高いほど必ず増加する現象である。", "アンモニアスリップは、大気汚染や設備への影響とは無関係な、望ましい現象である。", "アンモニアスリップを抑制するには、アンモニアの供給量をできるだけ多くすることが有効である。", "アンモニアスリップという概念は、SCR法には存在しない。"], "answer": [0], "explanation": "正しいのは(1)です。アンモニアスリップは、脱硝反応で使いきれなかった余剰アンモニアが排ガス中に漏れ出す現象で、下流設備への付着（硫安等の生成による閉塞）や二次的な大気汚染の要因になりうるため、適切なアンモニア注入量の管理が重要です（過剰供給はむしろスリップを助長します）。"}, {"id": 332, "domain": "大気特論", "sub": "排煙脱硝", "type": "single", "q": "窒素酸化物の化学分析法に関する次の記述のうち、正しいものはどれか。", "options": ["ザルツマン法は、窒素酸化物（特に二酸化窒素）の分析に用いられる吸光光度法の一つである。", "窒素酸化物の分析には、いかなる化学分析法も確立されていない。", "窒素酸化物の化学分析法は、必ず自動計測法よりも精度が劣る。", "窒素酸化物の分析法は、いおう酸化物の分析法と全く同一の試薬・原理を用いる。", "窒素酸化物の化学分析には、いかなる吸収液も使用されない。"], "answer": [0], "explanation": "正しいのは(1)です。ザルツマン法は、大気中や排ガス中の窒素酸化物（NO2等）を吸収液に吸収させ、発色反応による吸光度から濃度を求める化学分析法（吸光光度法）の一つとして知られています。"}, {"id": 333, "domain": "大気特論", "sub": "燃料分析", "type": "single", "q": "燃料の元素分析法に関する次の記述のうち、正しいものはどれか。", "options": ["元素分析により、燃料中の炭素・水素・窒素・硫黄等の含有割合（質量割合）を明らかにすることができる。", "元素分析の結果は、燃焼計算（理論空気量の算定等）には利用されない。", "元素分析は、固体燃料には適用できず、液体・気体燃料にのみ用いられる。", "元素分析により、燃料の発熱量が自動的に法令で定められた一定値になる。", "元素分析法は、燃料の種類にかかわらず、同一の測定原理・装置構成しか存在しない。"], "answer": [0], "explanation": "正しいのは(1)です。元素分析により燃料中の炭素・水素・窒素・硫黄などの含有割合を求めることができ、その結果は燃焼計算（理論空気量・理論燃焼ガス量の算定等）に活用されます。固体燃料（石炭等）にも適用されます。"}, {"id": 334, "domain": "大気特論", "sub": "燃料分析", "type": "single", "q": "燃料の発熱量測定法（ボンベ熱量計を用いる方法等）に関する次の記述のうち、誤っているものはどれか。", "options": ["ボンベ熱量計（断熱式熱量計）は、既知量の燃料を燃焼させ、発生した熱量を水の温度上昇等から求める装置である。", "発熱量には、水蒸気の凝縮潜熱を含む高発熱量と、含まない低発熱量の区別がある。", "気体燃料の発熱量測定には、ボンベ熱量計とは別の方式（ガス熱量計等）が用いられることがある。", "発熱量の測定値は、燃料の品質管理や燃焼計算の基礎データとして活用される。", "発熱量は、燃料の種類や組成にかかわらず、常に一定の値となる。"], "answer": [4], "explanation": "誤っているのは(5)です。発熱量は燃料の種類・組成（炭素・水素等の含有割合）によって異なる値をとるものであり、「常に一定の値」というのは誤りです。"}, {"id": 335, "domain": "大気特論", "sub": "燃料分析", "type": "single", "q": "ガソリン、灯油、軽油に関するJIS規格に関する次の記述のうち、正しいものはどれか。", "options": ["灯油には、燃焼性を示す指標の一つとして「煙点」の規格が定められている。", "ガソリン、灯油、軽油には、いかなるJIS規格も定められていない。", "軽油の規格には、セタン価等、着火性に関する指標は含まれていない。", "JIS規格は、燃料の品質を保証する目的とは無関係に定められている。", "ガソリンの規格には、オクタン価に関する指標は含まれていない。"], "answer": [0], "explanation": "正しいのは(1)です。灯油のJIS規格には、燃焼時にすすを生じにくいかを示す「煙点」の規格が定められています。ガソリンには着火性・アンチノック性を示す「オクタン価」、軽油には「セタン価」に関する規格が定められています。"}, {"id": 336, "domain": "大気特論", "sub": "燃料分析", "type": "single", "q": "JISによる気体燃料試験方法に関する次の記述のうち、正しいものはどれか。", "options": ["気体燃料の試験方法には、発熱量やガス組成（各成分の容積割合）等を求める方法が含まれる。", "気体燃料には、いかなる試験方法もJISで定められていない。", "気体燃料の試験方法は、液体燃料の試験方法と全く同一の手順で行われる。", "気体燃料の試験には、常に高価な専用装置が1種類のみ存在する。", "気体燃料の組成分析には、ガスクロマトグラフ法は使用されない。"], "answer": [0], "explanation": "正しいのは(1)です。JISに定められた気体燃料の試験方法には、発熱量測定やガス組成（メタン・エタン等各成分の容積割合）を求める分析（ガスクロマトグラフ法等）が含まれます。"}, {"id": 337, "domain": "大気特論", "sub": "燃料分析", "type": "single", "q": "石炭の元素分析及び工業分析に関する次の記述のうち、誤っているものはどれか。", "options": ["工業分析では、水分・灰分・揮発分・固定炭素の割合を求める。", "元素分析では、炭素・水素・窒素・硫黄・酸素等の元素組成（質量割合）を求める。", "石炭の炭化度が進むほど、一般に固定炭素の割合が増加する傾向がある。", "石炭の工業分析・元素分析の結果は、燃焼計算や大気汚染物質の排出量推定に活用される。", "石炭の分析結果は、炭種や産地にかかわらず、常に同一の数値となる。"], "answer": [4], "explanation": "誤っているのは(5)です。石炭の分析結果（水分、灰分、揮発分、固定炭素の割合や元素組成）は、炭種・産地によって大きく異なるものであり、「常に同一の数値」というのは誤りです。"}, {"id": 338, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "排ガス中の二酸化硫黄自動計測システムに関する次の記述のうち、正しいものはどれか。", "options": ["紫外線吸収方式は、二酸化硫黄が特定波長の紫外線を吸収する性質を利用した自動計測方式の一つである。", "二酸化硫黄の自動計測には、いかなる光学的手法も用いられない。", "紫外線吸収方式による計測器は、定期的な校正が一切不要である。", "二酸化硫黄の自動計測システムは、排出基準の遵守状況の確認には利用されない。", "紫外線吸収方式は、窒素酸化物の計測にのみ用いられ、二酸化硫黄には適用されない。"], "answer": [0], "explanation": "正しいのは(1)です。紫外線吸収方式は、二酸化硫黄が特定波長の紫外線を吸収する性質を利用して濃度を連続的に測定する自動計測方式の一つで、広く実用化されています。"}, {"id": 339, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "排ガス中の窒素酸化物自動計測器（化学発光方式）に関する次の記述のうち、正しいものはどれか。", "options": ["化学発光方式は、一酸化窒素（NO）とオゾンとの反応により生じる発光を利用して濃度を測定する方式である。", "化学発光方式は、二酸化硫黄の測定に特化した方式である。", "化学発光方式による測定では、二酸化窒素（NO2）を直接発光反応させて測定する。", "化学発光方式は、いかなる較正・校正も不要な方式である。", "化学発光方式は、赤外線の吸収を利用する方式である。"], "answer": [0], "explanation": "正しいのは(1)です。化学発光方式は、一酸化窒素（NO）とオゾン（O3）が反応する際に生じる化学発光を検出して濃度を求める方式です。二酸化窒素（NO2）を測定する場合は、一旦NOに変換（コンバーター）してから測定することがあります。"}, {"id": 340, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "赤外線吸収方式による窒素酸化物自動計測器に関する次の記述のうち、正しいものはどれか。", "options": ["赤外線吸収方式は、窒素酸化物が特定波長の赤外線を吸収する性質を利用した測定方式の一つである。", "赤外線吸収方式は、いおう酸化物の測定にのみ用いられる方式である。", "赤外線吸収方式による計測器は、化学発光方式よりも常に精度が劣る。", "赤外線吸収方式は、可視光線を利用する測定方式である。", "赤外線吸収方式は、窒素酸化物の測定には全く用いられない方式である。"], "answer": [0], "explanation": "正しいのは(1)です。赤外線吸収方式（非分散形赤外線分析計：NDIR）は、対象ガスが特定波長の赤外線を吸収する性質を利用する測定方式で、窒素酸化物を含む様々なガス成分の測定に応用されます。"}, {"id": 341, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "排ガス試料採取管に関する次の記述のうち、誤っているものはどれか。", "options": ["試料採取管の材質は、対象ガス成分と反応・吸着しにくいものを選定する必要がある。", "採取管の閉塞（ダストの付着等）を防ぐため、フィルター等が用いられることがある。", "採取管の設置位置は、ガスの流れが安定した箇所を選定することが望ましい。", "試料採取管の設計・選定は、測定対象物質や排ガス条件（温度、湿分等）とは無関係に一律でよい。", "採取管は、必要に応じて加熱（保温）し、水分の凝縮を防ぐ設計とされることがある。"], "answer": [3], "explanation": "誤っているのは(4)です。試料採取管の設計・選定は、測定対象物質の性質や排ガスの温度・湿分等の条件に応じて適切に行う必要があり、「無関係に一律でよい」は誤りです。"}, {"id": 342, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "排ガス中の一酸化炭素の分析方法に関する次の記述のうち、正しいものはどれか。", "options": ["非分散形赤外線分析計（NDIR）は、一酸化炭素の分析方法の一つとして広く用いられている。", "一酸化炭素は、赤外線を全く吸収しない性質を持つ。", "一酸化炭素の分析には、イオン電極法のみが用いられる。", "一酸化炭素の自動計測には、化学発光法が標準的に用いられる。", "一酸化炭素の分析方法は、いおう酸化物の分析方法と全く同一である。"], "answer": [0], "explanation": "正しいのは(1)です。一酸化炭素は特定波長の赤外線を吸収する性質を持つため、非分散形赤外線分析計（NDIR）による分析・連続測定が広く行われています。"}, {"id": 343,
