<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="公害大気1種">
<meta name="application-name" content="公害大気1種">
<title>公害防止管理者 大気関係第1種 練習問題</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1f2a33; --sub:#5b6b78; --line:#e2e8ee;
  --brand:#1f7a4d; --brand2:#2e9e66; --accent:#0e6b8a;
  --ok:#1f7a4d; --okbg:#e7f5ee; --ng:#c0392b; --ngbg:#fdecea; --warn:#b9770a;
  --shadow:0 2px 10px rgba(20,40,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
header.app{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow)}
header.app h1{margin:0;font-size:19px;letter-spacing:.02em}
header.app p{margin:6px 0 0;font-size:12.5px;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.muted{color:var(--sub);font-size:12.5px}
label.fld{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px;font-weight:600}
select,button{font-family:inherit}
select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border:none;border-radius:12px;
  background:var(--brand);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px;transition:filter .15s}
.btn:active{filter:brightness(.93)}
.btn.sec{background:#eef2f5;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--sub);box-shadow:none;border:none;font-weight:600;font-size:13.5px;margin-top:10px}
.btn.small{width:auto;padding:9px 14px;font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{margin-top:0}
.hidden{display:none!important}
.toplink{display:inline-block;margin-top:14px;color:var(--accent);font-size:13px;text-decoration:none}
.toplink:active{opacity:.7}

/* dashboard */
.dash-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.stat{background:#f7faf8;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat .n{font-size:20px;font-weight:800;color:var(--brand)}
.stat .l{font-size:11px;color:var(--sub)}
.bar{height:8px;background:#eef2f5;border-radius:6px;overflow:hidden;margin-top:4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand))}
.domrow{margin:9px 0}
.domrow .t{display:flex;justify-content:space-between;font-size:12.5px}
.domrow .t b{font-weight:700}

/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.pill{display:inline-block;background:#eef5f0;color:var(--brand);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.pill.multi{background:#fff4e2;color:var(--warn)}
.qtext{font-size:16.5px;font-weight:600;margin:10px 0 14px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.opt:active{background:#f6f9f7}
.opt.sel{border-color:var(--brand);background:#eef7f1}
.opt .mk{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #c4cfd6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;margin-top:1px}
.opt.sq .mk{border-radius:6px}
.opt.sel .mk{background:var(--brand);border-color:var(--brand)}
.opt .tx{flex:1;font-size:14.5px}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.opt.correct .mk{background:var(--ok);border-color:var(--ok)}
.opt.wrong .mk{background:var(--ng);border-color:var(--ng)}
.expl{margin-top:14px;border-radius:11px;padding:13px 14px;font-size:13.5px;border:1px solid var(--line);background:#f7faf8}
.expl .exbody{white-space:pre-wrap}
.expl.ok{border-color:#bfe3cf;background:var(--okbg)}
.expl.ng{border-color:#f3c4bd;background:var(--ngbg)}
.expl .h{font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.expl .h.ok{color:var(--ok)} .expl .h.ng{color:var(--ng)}
.expl .sub{font-size:12px;color:var(--sub);margin-bottom:6px}
.progress{height:6px;background:#e7edf1;border-radius:5px;overflow:hidden;margin-top:8px}
.progress > i{display:block;height:100%;background:var(--brand);transition:width .25s}

/* result */
.score{text-align:center;padding:8px 0 4px}
.score .big{font-size:40px;font-weight:800;color:var(--brand);line-height:1.1}
.score .pct{font-size:14px;color:var(--sub)}
.verdict{text-align:center;font-weight:800;font-size:16px;margin:6px 0 2px}
.verdict.pass{color:var(--ok)} .verdict.fail{color:var(--ng)}
.foot{margin-top:22px;text-align:center;color:#9aa7b1;font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>🏭 公害防止管理者 大気関係第1種</h1>
    <p id="subt">練習問題 ／ 読み込み中…</p>
  </header>

  <!-- ========== HOME ========== -->
  <section id="home">
    <div class="card" id="dashCard">
      <h2>📊 学習ダッシュボード</h2>
      <div class="dash-grid">
        <div class="stat"><div class="n" id="stTotal">0</div><div class="l">累計解答数</div></div>
        <div class="stat"><div class="n" id="stAcc">–</div><div class="l">通算正答率</div></div>
        <div class="stat"><div class="n" id="stWrong">0</div><div class="l">復習対象</div></div>
      </div>
      <div id="domStats"></div>
    </div>

    <div class="card">
      <h2>🔁 復習モード</h2>
      <p class="muted">間違えた問題だけを再演習します。</p>
      <button class="btn sec" id="btnReview">間違えた問題を復習する</button>
    </div>

    <div class="card">
      <h2>📝 通常演習</h2>
      <label class="fld">出題分野（公式6科目）</label>
      <select id="selDomain"></select>
      <label class="fld">出題数</label>
      <select id="selCount">
        <option value="10">10問（さくっと）</option>
        <option value="20">20問</option>
        <option value="30" selected>30問</option>
        <option value="65">65問（本番想定）</option>
        <option value="all">全問</option>
      </select>
      <label class="fld">出題順</label>
      <select id="selOrder">
        <option value="random" selected>ランダム</option>
        <option value="order">順番通り</option>
      </select>
      <button class="btn" id="btnStart">スタート ▶</button>
      <p class="muted" style="margin-top:12px">合格目安：本番は各科目6割。本アプリでは正答率60%を合格ラインの目安にしています。選択肢は実行時にシャッフルされます。</p>
    </div>

    <a class="toplink" href="../">← 学習アプリTOPへ</a><br>
    <button class="btn ghost" id="btnReset">学習記録をリセット</button>
  </section>

  <!-- ========== QUIZ ========== -->
  <section id="quiz" class="hidden">
    <div class="card">
      <div class="qmeta">
        <span><span id="qIndex">1</span> / <span id="qTotal">10</span></span>
        <span>正解 <b id="qScore">0</b></span>
      </div>
      <div class="progress"><i id="qBar" style="width:0%"></i></div>
      <div style="margin-top:12px">
        <span class="pill" id="qDomain">分野</span>
        <span class="pill multi hidden" id="qMulti">複数選択：あてはまるものをすべて選べ</span>
      </div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="qOpts"></div>
      <div id="qExpl"></div>
      <button class="btn" id="btnAnswer">解答する</button>
      <button class="btn sec hidden" id="btnNext">次へ ▶</button>
      <button class="btn ghost" id="btnAbort">中断してトップへ</button>
    </div>
  </section>

  <!-- ========== RESULT ========== -->
  <section id="result" class="hidden">
    <div class="card">
      <h2>🏁 結果</h2>
      <div class="score">
        <div class="big"><span id="rScore">0</span> / <span id="rTotal">0</span></div>
        <div class="pct" id="rPct">正答率 0%</div>
      </div>
      <div class="verdict" id="rVerdict"></div>
      <div id="rDom" style="margin-top:12px"></div>
      <button class="btn sec hidden" id="btnReviewWrong" style="margin-top:16px">間違えた問題をすぐ復習 🔁</button>
      <button class="btn" id="btnHome">トップへ戻る</button>
    </div>
  </section>

  <div class="foot">study-apps ／ 公害防止管理者 大気関係第1種 ／ 全 <span id="footN">0</span> 問</div>
</div>

<script>

const BANK = /*__DATA__*/{"meta": {"exam": "公害防止管理者 大気関係第1種", "title": "公害防止管理者(大気1種) 問題バンク", "version": "2026-09-01-final", "source": "公式出題範囲(産業環境管理協会)に基づく独自作成。公式・民間の過去問傾向を参照した本番難度・5肢択一・選択肢ランダム化・複数選択対応・詳細解説。大気有害物質特論は令和7年度国家試験の出題形式・難易度分析に基づく新規作成(過去問の転載なし)。公害総論30問は令和7年度の出題形式分析に基づき全面刷新(誤答設計7条ルール適用)。大気概論30問も同ルールで全面刷新。大気特論30問も同ルールで全面刷新。ばいじん・粉じん特論30問も同ルールで全面刷新。大規模大気特論30問も同ルールで全面刷新。 2026年9月、330問追加(510問)。公害総論20問の正解番号バグ修正、全510問の内部整合性チェック完了、6科目横断で約131問の外部ファクトチェックを実施(石綿クリソタイル比率・優先取組物質数の2件を修正)。", "format": "5肢択一(single/multi)。本番は各科目6割で合格。", "passing": "正答率60%目安", "count": 510, "multi_select": 0, "categories": ["公害総論", "大気概論", "大気特論", "ばいじん・粉じん特論", "大規模大気特論", "大気有害物質特論"], "category_counts": {"ばいじん・粉じん特論": 90, "大気概論": 80, "大気特論": 90, "大気有害物質特論": 80, "公害総論": 90, "大規模大気特論": 80}, "live_app": "https://pythonzero-apex.github.io/study-apps/komu1/"}, "questions": [{"id": 1, "domain": "公害総論", "sub": "環境基本法及び環境関連法規", "type": "single", "q": "次は環境基本法第1条(目的)の条文の一部である。(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「この法律は、環境の保全について、(ア)を定め、並びに国、地方公共団体、事業者及び国民の(イ)を明らかにするとともに、環境の保全に関する施策の基本となる事項を定めることにより、環境の保全に関する施策を(ウ)に推進し、……」", "options": ["(ア)基本理念　(イ)責務　(ウ)総合的かつ計画的", "(ア)基本理念　(イ)権利　(ウ)総合的かつ計画的", "(ア)行動計画　(イ)責務　(ウ)総合的かつ計画的", "(ア)基本理念　(イ)責務　(ウ)自主的かつ積極的", "(ア)基本方針　(イ)義務　(ウ)一体的かつ効率的"], "answer": [0], "explanation": "環境基本法第1条は、①基本理念を定めること、②国・地方公共団体・事業者・国民の責務を明らかにすること、③施策の基本となる事項を定めることの3点を手段として掲げ、環境保全施策を「総合的かつ計画的に」推進することを目的としている。国民について定めているのは「権利」ではなく「責務」であり、また基本法が定めるのは個別の「行動計画」ではなく「基本理念」である点が要点。"}, {"id": 2, "domain": "公害総論", "sub": "環境基本法及び環境関連法規", "type": "single", "q": "環境基本法が定める基本理念に関する記述として、誤っているものはどれか。", "options": ["国際的協調による地球環境保全の積極的推進が掲げられている。", "循環型社会の形成を国際的に主導することが、理念の一つとされている。", "これらの理念は、第3条から第5条にかけて規定されている。", "環境の恵沢の享受と将来の世代への継承が、理念の一つとされている。", "環境への負荷の少ない持続的発展が可能な社会の構築が掲げられている。"], "answer": [1], "explanation": "環境基本法の基本理念は第3条～第5条の3つ、すなわち「環境の恵沢の享受と継承等」「環境への負荷の少ない持続的発展が可能な社会の構築等」「国際的協調による地球環境保全の積極的推進」である。循環型社会の形成は、別法である循環型社会形成推進基本法が扱う事項であり、環境基本法の基本理念として掲げられているものではない。"}, {"id": 3, "domain": "公害総論", "sub": "環境基本法及び環境関連法規", "type": "single", "q": "環境基本法に定める環境基準に関する記述として、誤っているものはどれか。", "options": ["大気の汚染、水質の汚濁、土壌の汚染及び騒音について定めるものとされている。", "常に適切な科学的判断が加えられ、必要な改定がなされなければならない。", "事業者が排出口で遵守すべき限度であり、違反には罰則が科される基準である。", "政府は、環境基準の確保を図るため必要な施策を総合的に講ずるものとされる。", "人の健康を保護し、生活環境を保全する上で維持されることが望ましい基準である。"], "answer": [2], "explanation": "環境基準は行政上の目標であって、個々の事業者を直接拘束するものではない。排出口で遵守が求められ違反に罰則が伴うのは「排出基準(規制基準)」であり、両者は性格がまったく異なる。なお環境基準の対象は大気・水質・土壌・騒音の4分野であり、振動・地盤沈下・悪臭は典型7公害に含まれるものの環境基準の対象外である点も頻出。"}, {"id": 4, "domain": "公害総論", "sub": "環境基本法及び環境関連法規", "type": "single", "q": "環境基準に関する次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「環境基準のうち、地域や水域の(ア)ごとに基準値を定めるものについては、その(ア)を当てはめる地域又は水域の指定を、政令で定める場合を除き(イ)が行う。また環境基準は、(ウ)が加えられ、必要な改定がなされなければならないとされている。」", "options": ["(ア)等級　(イ)環境大臣　(ウ)5年ごとの定期的な見直し", "(ア)類型　(イ)環境大臣　(ウ)常に適切な科学的判断", "(ア)区分　(イ)都道府県知事　(ウ)5年ごとの定期的な見直し", "(ア)類型　(イ)都道府県知事　(ウ)常に適切な科学的判断", "(ア)類型　(イ)市町村長　(ウ)常に適切な科学的判断"], "answer": [3], "explanation": "水質汚濁や騒音の環境基準は地域・水域の「類型」ごとに値が定められ、その当てはめ(類型指定)は、政令で定める国が行う場合を除き都道府県知事が行う。また第16条第3項は「常に適切な科学的判断が加えられ、必要な改定がなされなければならない」と定めており、年数を区切った定期見直しを義務づけたものではない。"}, {"id": 5, "domain": "公害総論", "sub": "環境基本法及び環境関連法規", "type": "single", "q": "環境基本法に定義される公害(いわゆる典型7公害)に該当しないものはどれか。", "options": ["振動", "土壌の汚染", "地盤沈下", "悪臭", "光害"], "answer": [4], "explanation": "典型7公害は、大気の汚染、水質の汚濁、土壌の汚染、騒音、振動、地盤沈下、悪臭の7つである。光害(ひかりがい)は夜間照明による生活環境への影響として環境省がガイドラインを示しているが、環境基本法の公害の定義には含まれていない。"}, {"id": 6, "domain": "公害総論", "sub": "環境基本法及び環境関連法規", "type": "single", "q": "環境基本計画に関する記述として、正しいものはどれか。", "options": ["政府が定めるもので、案は環境大臣が中央環境審議会の意見を聴いて作成する。", "公害防止計画と一体のものとして、市町村長が策定することとされている。", "法的な位置づけはなく、環境省の内部方針として運用されているものである。", "都道府県知事が策定し、環境大臣の認可を受けることとされている。", "事業者ごとに策定し、所管する大臣へ届け出ることが義務づけられている。"], "answer": [0], "explanation": "環境基本計画は環境基本法第15条に基づき政府が定める計画で、環境大臣が中央環境審議会の意見を聴いて案を作成し、閣議決定を経て確定する。都道府県や事業者が作成主体となるものではなく、法律に根拠をもつ正式な計画である。"}, {"id": 7, "domain": "公害総論", "sub": "環境基本法及び環境関連法規", "type": "single", "q": "環境影響評価法に関する記述として、誤っているものはどれか。", "options": ["準備書について、環境の保全の見地から住民等が意見を述べられる。", "評価書の公告及び縦覧を経ずに、対象事業に着手することができる。", "規模が大きく環境影響の程度が著しいおそれのある事業を第一種事業という。", "第二種事業については、環境影響評価を行うか否かを個別に判定する。", "方法書の手続により、調査・予測・評価の方法について意見を求める。"], "answer": [1], "explanation": "評価書の公告・縦覧が完了するまで、事業者は対象事業に着手することができない。これは環境影響評価の結果を事業内容に反映させるための担保措置である。なお第二種事業について実施の要否を個別に判定する手続をスクリーニング、方法書により調査手法を絞り込む手続をスコーピングという。"}, {"id": 8, "domain": "公害総論", "sub": "環境基本法及び環境関連法規", "type": "single", "q": "大気汚染防止法及び水質汚濁防止法に定める健康被害に係る損害賠償責任に関する記述として、誤っているものはどれか。", "options": ["事業活動に伴う健康被害に係る損害が、責任の対象とされている。", "大気汚染防止法ではばい煙等、水質汚濁防止法では有害物質等が対象となる。", "被害者側が事業者の過失を立証しなければ、賠償を請求できない。", "天災その他の不可抗力が競合したときの賠償額について定めが置かれている。", "事業者に故意又は過失がなくても、損害賠償の責任を負うこととされている。"], "answer": [2], "explanation": "両法が定めるのは無過失責任であり、被害者が事業者の故意・過失を立証する必要はない。公害による健康被害では因果関係や過失の立証が被害者にとって著しく困難であることを踏まえた制度で、これが通常の不法行為責任との最大の違いである。"}, {"id": 9, "domain": "公害総論", "sub": "公害防止組織法体系", "type": "single", "q": "公害防止組織法に定める公害防止統括者に関する記述として、誤っているものはどれか。", "options": ["常時使用する従業員の数が21人以上の特定工場で選任が必要となる。", "選任に当たって、国家試験の合格等の資格は求められていない。", "工場長など、その工場の事業の実施を統括管理する者が充てられる。", "資格を有する者のうちから選任し、都道府県知事の認可を受ける。", "特定工場において、公害防止に関する業務を統括管理する者である。"], "answer": [3], "explanation": "公害防止統括者は工場の事業実施を統括管理する立場の者(工場長など)が充てられ、資格要件はない。また手続は認可ではなく届出であり、選任した日から30日以内に都道府県知事等へ届け出る。資格が必要なのは公害防止管理者と公害防止主任管理者である。"}, {"id": 10, "domain": "公害総論", "sub": "公害防止組織法体系", "type": "single", "q": "公害防止組織法に定める公害防止主任管理者に関する記述として、誤っているものはどれか。", "options": ["選任すべき事由が生じた日から30日以内に選任しなければならない。", "ばい煙発生施設と汚水等排出施設の両方を設置する特定工場が対象となる。", "公害防止統括者を補佐し、公害防止管理者を指揮する職務を担う。", "選任には、国家試験の合格又は資格認定講習の修了が必要とされる。", "排出ガス量と排出水量のいずれか一方が基準以上であれば選任を要する。"], "answer": [4], "explanation": "公害防止主任管理者は、ばい煙発生施設と汚水等排出施設の両方を有し、かつ排出ガス量・排出水量がともに一定規模以上である特定工場に置かれる。「いずれか一方」ではなく「両方」の要件を満たす必要があり、この「かつ」を「または」に置き換える出題は頻出である。"}, {"id": 11, "domain": "公害総論", "sub": "公害防止組織法体系", "type": "single", "q": "公害防止組織法に基づく選任等に関する次の記述中の(ア)～(ウ)に入る語句・数値の組合せとして、正しいものはどれか。\n\n「公害防止統括者を選任すべき事由が発生したときは、その日から(ア)日以内に選任しなければならない。選任したときは、その日から(ア)日以内に(イ)に届け出る。また、統括者、主任管理者及び管理者には、それぞれ(ウ)を選任しなければならない。」", "options": ["(ア)30　(イ)都道府県知事等　(ウ)代理者", "(ア)30　(イ)環境大臣　(ウ)代理者", "(ア)60　(イ)都道府県知事等　(ウ)代理者", "(ア)30　(イ)都道府県知事等　(ウ)副管理者", "(ア)14　(イ)市町村長　(ウ)代理者"], "answer": [0], "explanation": "選任も届出も「30日以内」で統一されており、届出先は都道府県知事等(政令市では市長)である。また統括者・主任管理者・管理者のいずれについても、事故や休暇などで職務を行えない場合に備えて代理者を選任する義務がある。「副管理者」という職は法律上存在しない。"}, {"id": 12, "domain": "公害総論", "sub": "環境の現状", "type": "single", "q": "我が国の大気汚染に係る環境基準の達成状況に関する記述として、誤っているものはどれか。", "options": ["二酸化硫黄の環境基準達成率は、近年ほぼ100%で推移している。", "微小粒子状物質(PM2.5)の達成率は、近年低下を続けている。", "二酸化窒素の環境基準達成率は、近年ほぼ100%で推移している。", "一酸化炭素の環境基準達成率は、長期にわたり100%が続いている。", "光化学オキシダントの環境基準達成率は、極めて低い水準にとどまる。"], "answer": [1], "explanation": "PM2.5の環境基準達成率は、常時監視が始まった当初は低かったものの、その後は改善が進み近年は高い水準に達している。低下を続けているという記述は事実と逆である。一方、光化学オキシダントは達成率がほぼ0%という極端に低い状態が長く続いており、この対比が繰り返し問われる。"}, {"id": 13, "domain": "公害総論", "sub": "環境の現状", "type": "single", "q": "光化学オキシダントに関する記述として、誤っているものはどれか。", "options": ["窒素酸化物と揮発性有機化合物が、太陽紫外線を受けて生成する。", "主成分はオゾンであり、その他にPANやアルデヒド類を含む。", "生成には日射を必要とせず、夜間に濃度が最も高くなる。", "日射が強く気温が高い夏季に、濃度が高くなる傾向がある。", "前駆物質の削減対策として、VOCの排出抑制が進められている。"], "answer": [2], "explanation": "光化学オキシダントは、窒素酸化物と揮発性有機化合物が太陽紫外線を受けた光化学反応によって生成する二次汚染物質である。したがって日射が不可欠であり、濃度が高くなるのは日射の強い日中である。夜間に最も高くなるという記述は生成機構と矛盾する。"}, {"id": 14, "domain": "公害総論", "sub": "環境の現状", "type": "single", "q": "公共用水域における生活環境項目(BOD又はCOD)の環境基準達成率について、河川・湖沼・海域を達成率の高い順に並べたものとして、正しいものはどれか。", "options": ["河川　＞　湖沼　＞　海域", "海域　＞　河川　＞　湖沼", "湖沼　＞　河川　＞　海域", "河川　＞　海域　＞　湖沼", "海域　＞　湖沼　＞　河川"], "answer": [3], "explanation": "達成率は河川が最も高く、次いで海域、湖沼が最も低いという関係が長年続いている。湖沼は水の滞留時間が長く、流入した窒素・りんが蓄積して富栄養化が進みやすいことが背景にある。この3水域の順序は繰り返し問われる定番事項である。"}, {"id": 15, "domain": "公害総論", "sub": "環境の現状", "type": "single", "q": "地下水の水質に関する記述として、誤っているものはどれか。", "options": ["揮発性有機化合物による汚染は、過去の使用に起因する事例が多い。", "硝酸性窒素の主な発生源として、施肥や家畜排せつ物が挙げられる。", "概況調査では、硝酸性窒素及び亜硝酸性窒素の基準超過率が最も高い。", "ひ素やふっ素は、自然に由来して基準を超過する場合がある。", "トリクロロエチレンは水に溶けず、地下水汚染の原因とならない。"], "answer": [4], "explanation": "トリクロロエチレンは水にわずかに溶け、かつ水より重く難分解性であるため、地下深部まで到達して長期にわたる地下水汚染を引き起こす代表的な物質である。かつて金属部品の脱脂洗浄などに広く使われ、その使用に起因する汚染が現在も検出されている。"}, {"id": 16, "domain": "公害総論", "sub": "環境の現状", "type": "single", "q": "我が国の産業廃棄物の排出・処理状況に関する記述として、誤っているものはどれか。", "options": ["総排出量の半分以上が、最終処分場に埋め立てられている。", "最終処分される割合は、総排出量の数%程度にとどまっている。", "不法投棄の件数は、ピーク時と比べて大幅に減少している。", "年間の総排出量は、近年おおむね4億トン前後で推移している。", "再生利用される割合は、おおむね5割程度となっている。"], "answer": [0], "explanation": "産業廃棄物は、中間処理による減量化と再生利用が進んだ結果、最終処分される割合は総排出量の数%程度にとどまっている。半分以上が埋め立てられているという記述は、最終処分率と再生利用率を取り違えたものである。"}, {"id": 17, "domain": "公害総論", "sub": "環境の現状", "type": "single", "q": "産業廃棄物の排出量に関する次の記述中の(ア)(イ)に入る語句の組合せとして、正しいものはどれか。\n\n「種類別にみると、排出量が最も多いのは(ア)である。また業種別にみると、排出量が最も多いのは(イ)である。」", "options": ["(ア)燃え殻　(イ)鉄鋼業", "(ア)汚泥　(イ)電気・ガス・熱供給・水道業", "(ア)がれき類　(イ)電気・ガス・熱供給・水道業", "(ア)汚泥　(イ)建設業", "(ア)動物のふん尿　(イ)農業・林業"], "answer": [1], "explanation": "種類別では汚泥が全体の約4割を占めて最も多く、次いで動物のふん尿、がれき類と続く。業種別では電気・ガス・熱供給・水道業が最も多く、次いで農業・林業、建設業となる。上位の顔ぶれは共通しているため、順位を入れ替えた選択肢が作られやすい。"}, {"id": 18, "domain": "公害総論", "sub": "環境の現状", "type": "single", "q": "我が国の一般廃棄物に関する記述として、誤っているものはどれか。", "options": ["総排出量は、近年おおむね減少傾向で推移している。", "1人1日当たりの排出量は、900グラム前後で推移している。", "事業活動に伴って生じた廃棄物は、産業廃棄物に分類される。", "その処理については、市町村が責任を負うこととされている。", "焼却による中間処理の割合が高いことが、我が国の特徴である。"], "answer": [2], "explanation": "事業活動に伴って生じる廃棄物のうち、法令で定める20種類に該当するものが産業廃棄物であり、それ以外は事業系一般廃棄物として扱われる。オフィスから出る紙くずなどがその例で、事業活動由来であればすべて産業廃棄物になるわけではない。"}, {"id": 19, "domain": "公害総論", "sub": "環境の現状", "type": "single", "q": "我が国の公害苦情の状況に関する記述として、正しいものはどれか。", "options": ["典型7公害に当たらない苦情は、統計の対象外とされている。", "公害苦情の件数は、統計開始以来一貫して増加を続けている。", "苦情件数が最も多い典型7公害は、地盤沈下に関するものである。", "苦情件数が最も多い典型7公害は、騒音に関するものである。", "公害苦情の受付は、環境省が一括して行うこととされている。"], "answer": [3], "explanation": "典型7公害の苦情では騒音が最も多く、次いで大気汚染が続く。苦情の受付は地方公共団体の公害苦情相談窓口が担い、廃棄物投棄など典型7公害以外の苦情も「その他」として調査対象に含まれている。件数は年により増減しており、一貫した増加傾向にはない。"}, {"id": 20, "domain": "公害総論", "sub": "環境の現状", "type": "single", "q": "我が国の温室効果ガスに関する記述として、誤っているものはどれか。", "options": ["メタンや一酸化二窒素も、算定・報告の対象に含まれている。", "六ふっ化硫黄の地球温暖化係数は、二酸化炭素よりも大きい。", "算定の対象には、二酸化炭素のほか複数のガスが含まれている。", "各ガスの排出量は、地球温暖化係数により二酸化炭素に換算する。", "我が国の排出量の内訳では、メタンが最大の割合を占めている。"], "answer": [4], "explanation": "我が国の温室効果ガス排出量は、二酸化炭素換算で全体の9割以上を二酸化炭素が占めている。メタンや一酸化二窒素、ふっ素系ガスは対象に含まれるものの、排出量に占める割合はいずれも小さい。なお六ふっ化硫黄の地球温暖化係数は二酸化炭素の2万倍を超える。"}, {"id": 21, "domain": "公害総論", "sub": "個別の環境問題", "type": "single", "q": "地球温暖化に関する国際的な枠組みについての記述として、誤っているものはどれか。", "options": ["パリ協定で削減目標の提出義務を負うのは、先進国に限られる。", "パリ協定は、産業革命前からの気温上昇の抑制目標を掲げている。", "気候変動枠組条約は、1992年の地球サミットで採択された。", "京都議定書では、先進国に排出削減の数値目標が定められた。", "パリ協定は、2015年のCOP21において採択されたものである。"], "answer": [0], "explanation": "パリ協定は、先進国と途上国の区別なくすべての締約国が自国の削減目標(NDC)を提出・更新する仕組みを採用した点が、先進国のみに数値目標を課した京都議定書との決定的な違いである。この両者の対比は繰り返し問われる。"}, {"id": 22, "domain": "公害総論", "sub": "個別の環境問題", "type": "single", "q": "オゾン層の保護に関する記述として、正しいものはどれか。", "options": ["オゾン層の破壊は、二酸化炭素の増加が主な原因とされている。", "モントリオール議定書により、特定フロン等の生産と消費が規制された。", "代替フロンのHFCには、オゾン層破壊の作用があるとされている。", "オゾンホールは、北極上空において最も顕著に観測されている。", "ウィーン条約により、フロンの具体的な削減スケジュールが定められた。"], "answer": [1], "explanation": "オゾン層破壊の原因はクロロフルオロカーボン(CFC)などの塩素・臭素を含む物質であり、二酸化炭素ではない。枠組みを定めたのがウィーン条約、具体的な規制スケジュールを定めたのがモントリオール議定書という役割分担も要点。代替フロンHFCは塩素を含まずオゾン層は破壊しないが、温室効果が強いため別途削減対象となっている。オゾンホールが顕著なのは南極上空である。"}, {"id": 23, "domain": "公害総論", "sub": "個別の環境問題", "type": "single", "q": "酸性雨に関する記述として、誤っているものはどれか。", "options": ["主な原因物質は、硫黄酸化物と窒素酸化物であるとされる。", "原因物質は長距離を輸送され、越境汚染の性格をもつ。", "湖沼や土壌への影響はなく、被害は建造物に限られる。", "東アジア地域では、国際的な監視ネットワークがある。", "一般に、pHが5.6以下の雨を酸性雨として扱うことが多い。"], "answer": [2], "explanation": "酸性雨は建造物や文化財を損傷させるだけでなく、湖沼の酸性化による水生生物への影響、土壌からの栄養塩の溶脱や樹木の衰退など、広範な生態系影響をもたらす。被害が建造物に限られるという記述は誤りである。なお大気中の二酸化炭素が溶けた雨の pH が約5.6 になることから、この値が目安とされている。"}, {"id": 24, "domain": "公害総論", "sub": "個別の環境問題", "type": "single", "q": "ダイオキシン類に関する記述として、誤っているものはどれか。", "options": ["水に溶けにくく脂溶性が高いため、生物に蓄積しやすい。", "対策特別措置法の対象は、PCDD、PCDF及びコプラナーPCBである。", "各異性体の毒性は、毒性等価係数により換算して評価される。", "毒性等価係数は、異性体の種類によらず一定の値とされる。", "主な発生源の一つとして、廃棄物の焼却過程が挙げられる。"], "answer": [3], "explanation": "毒性等価係数(TEF)は異性体ごとに異なる値が与えられており、最も毒性が強い2,3,7,8-四塩化ジベンゾ-パラ-ジオキシンを1として相対的に定められている。各異性体の濃度にTEFを乗じて合計したものが毒性等量(TEQ)であり、係数が一律であればこの換算の意味自体が失われる。"}, {"id": 25, "domain": "公害総論", "sub": "個別の環境問題", "type": "single", "q": "水域の富栄養化に関する記述として、誤っているものはどれか。", "options": ["赤潮やアオコの発生と、密接な関係があるとされる。", "有機物の分解に伴い、底層で貧酸素状態が生じやすい。", "主な原因物質として、窒素及びりんが挙げられている。", "湖沼や内湾などの閉鎖性水域で問題となりやすい。", "原因物質はりんであり、窒素は富栄養化に関与しない。"], "answer": [4], "explanation": "富栄養化には窒素とりんの双方が関与する。一般に海域ではりん、湖沼では窒素とりんの両方が制限要因となりやすく、このため水質総量削減でも窒素とりんの両方が対象とされている。片方だけを原因とする記述は誤りである。"}, {"id": 26, "domain": "公害総論", "sub": "個別の環境問題", "type": "single", "q": "都市部のヒートアイランド現象に関する記述として、正しいものはどれか。", "options": ["人工排熱の増加と、地表面被覆の人工化が主な要因とされる。", "主な原因は温室効果ガスの増加であり、都市構造は関与しない。", "緑地や水面の増加が、現象を助長する要因とされている。", "成層圏オゾンの増加により、地表付近の気温が上昇する現象である。", "郊外に比べて都市部の気温が低くなる現象を指している。"], "answer": [0], "explanation": "ヒートアイランド現象は、空調や自動車などからの人工排熱の増加、アスファルトやコンクリートによる地表面被覆の人工化、風通しを妨げる過密な都市形態の3つが主な要因とされる。緑地や水面は蒸発散により気温を下げるため、その増加は現象の緩和策として位置づけられる。"}, {"id": 27, "domain": "公害総論", "sub": "環境管理手法", "type": "single", "q": "環境マネジメントシステムの国際規格ISO14001に関する記述として、誤っているものはどれか。", "options": ["組織の環境パフォーマンスの向上を目的とするものである。", "製品の環境性能を認証し、環境ラベルを付与する規格である。", "組織が運用する環境マネジメントシステムの国際規格である。", "PDCAサイクルによる継続的改善を基本的な考え方とする。", "認証は、第三者である審査機関の審査を経て与えられる。"], "answer": [1], "explanation": "ISO14001が認証するのは組織のマネジメントシステムであって、製品そのものの環境性能ではない。製品への環境ラベルはISO14020シリーズが扱う別の枠組みであり、両者を取り違えさせる出題が繰り返されている。"}, {"id": 28, "domain": "公害総論", "sub": "環境管理手法", "type": "single", "q": "ライフサイクルアセスメント(LCA)の実施手順に関する次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「LCAは、まず目的及び調査範囲の設定を行い、次に投入資源や排出物を定量化する(ア)を実施する。続いて、その結果を環境影響の観点から評価する(イ)を行い、最後に(ウ)を行って結論を導く。」", "options": ["(ア)インベントリ分析　(イ)解釈　(ウ)ライフサイクル影響評価", "(ア)スクリーニング　(イ)ライフサイクル影響評価　(ウ)解釈", "(ア)インベントリ分析　(イ)ライフサイクル影響評価　(ウ)解釈", "(ア)インベントリ分析　(イ)リスク評価　(ウ)検証", "(ア)ライフサイクル影響評価　(イ)インベントリ分析　(ウ)解釈"], "answer": [2], "explanation": "LCAは「目的及び調査範囲の設定 → インベントリ分析 → ライフサイクル影響評価 → 解釈」の4段階で構成される。投入・排出を積み上げて定量化するのがインベントリ分析、その結果を地球温暖化や酸性化といった影響領域に換算するのが影響評価であり、順序の入れ替えが典型的な誤答パターンとなる。"}, {"id": 29, "domain": "公害総論", "sub": "環境管理手法", "type": "single", "q": "PRTR制度(化学物質排出移動量届出制度)に関する記述として、正しいものはどれか。", "options": ["届け出られた排出量は、公表されない取扱いとなっている。", "届出の対象となるのは、大気への排出量に限られている。", "事業者が国から排出枠の割当てを受ける仕組みである。", "対象物質の排出量と移動量を、事業者が届け出る制度である。", "化学物質の製造を許可制とする仕組みを定めている。"], "answer": [3], "explanation": "PRTRは、対象化学物質を扱う事業者が環境への排出量と廃棄物等としての移動量を自ら把握して届け出る制度である。集計結果は公表され、大気だけでなく公共用水域や土壌への排出も対象となる。排出枠の割当てや製造の許可制とは性格がまったく異なる。"}, {"id": 30, "domain": "公害総論", "sub": "環境管理手法", "type": "single", "q": "次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「循環型社会形成推進基本法は、処理の優先順位を、発生抑制、(ア)、再生利用、(イ)、適正処分の順としている。また、汚染の防止に要する費用は汚染者が負担すべきとする考え方を(ウ)という。」", "options": ["(ア)再使用　(イ)熱回収　(ウ)拡大生産者責任", "(ア)再使用　(イ)最終処分　(ウ)汚染者負担原則", "(ア)分別収集　(イ)熱回収　(ウ)予防原則", "(ア)熱回収　(イ)再使用　(ウ)汚染者負担原則", "(ア)再使用　(イ)熱回収　(ウ)汚染者負担原則"], "answer": [4], "explanation": "優先順位は、発生抑制(リデュース)→再使用(リユース)→再生利用(マテリアルリサイクル)→熱回収(サーマルリカバリー)→適正処分の5段階である。熱回収を再使用より前に置く選択肢が典型的な誤り。汚染者負担原則(PPP)はOECDが1972年に提唱した考え方で、生産者に製品廃棄後の責任まで求める拡大生産者責任(EPR)とは別の概念である。"}, {"id": 31, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "大気汚染防止法の目的に関する記述として、誤っているものはどれか。", "options": ["温室効果ガスの排出削減を主たる目的とする法律である。", "工場等の事業活動に伴うばい煙等の排出の規制を内容としている。", "自動車排出ガスに係る許容限度を定めることを内容に含んでいる。", "有害大気汚染物質対策の推進についても規定が置かれている。", "健康被害が生じた場合の事業者の損害賠償責任を定めている。"], "answer": [0], "explanation": "大気汚染防止法は、ばい煙・揮発性有機化合物・粉じん・水銀等の排出規制、有害大気汚染物質対策、自動車排出ガスの許容限度などにより国民の健康保護と生活環境の保全を図り、あわせて健康被害に係る事業者の無過失損害賠償責任を定める法律である。温室効果ガスの削減を担うのは地球温暖化対策推進法であり、目的が異なる。"}, {"id": 32, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "大気汚染防止法に定める「ばい煙」に含まれないものはどれか。", "options": ["塩化水素", "石綿", "硫黄酸化物", "ばいじん", "窒素酸化物"], "answer": [1], "explanation": "ばい煙とは、燃料等の燃焼に伴い発生する硫黄酸化物、ばいじん、及び政令で定める有害物質(カドミウム、塩素及び塩化水素、ふっ素化合物、鉛、窒素酸化物)をいう。石綿はばい煙ではなく「特定粉じん」として、粉じんの規制体系の中で扱われる。"}, {"id": 33, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "ばい煙発生施設に関する大気汚染防止法上の手続として、誤っているものはどれか。", "options": ["届出が受理された日から60日を経過するまでは設置できない。", "施設の使用を廃止したときは、30日以内に届け出る。", "施設を譲り受けた者は、あらためて設置の届出をやり直す。", "施設を設置しようとする者は、60日前までに都道府県知事に届け出る。", "構造や使用方法を変更する場合も、事前の届出が必要となる。"], "answer": [2], "explanation": "施設を譲り受けたり借り受けたりした者、相続や合併があった場合の承継人は、従前の設置者の地位をそのまま承継し、承継の届出を行えばよい。設置の届出をやり直す必要はない。なお設置・変更は60日前までの事前届出、使用廃止や氏名等の変更は事後30日以内の届出という「60日と30日」の使い分けが頻出。"}, {"id": 34, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "大気汚染防止法の排出基準に関する記述として、誤っているものはどれか。", "options": ["特別排出基準は、汚染の著しい地域の新設施設に適用される。", "上乗せ排出基準は、都道府県が条例で定めることができる。", "総量規制基準は、指定地域内の一定規模以上の工場に適用される。", "上乗せ排出基準は、国の一般排出基準より緩やかに定められる。", "一般排出基準は、施設の種類ごとに環境省令で定められる。"], "answer": [3], "explanation": "上乗せ排出基準は、国の基準では不十分な地域について都道府県が条例でより厳しい基準を定める仕組みであり、「上乗せ」の語のとおり緩和方向には働かない。特別排出基準が汚染の著しい地域の新設施設に限って厳しく設定されるのと合わせ、規制強化の手段として整理して覚えるとよい。"}, {"id": 35, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "硫黄酸化物のいわゆるK値規制に関する記述として、誤っているものはどれか。", "options": ["硫黄酸化物に対して適用される排出基準の方式である。", "許容される排出量は、補正された排出口の高さの2乗に比例する。", "地域ごとに定められるK値が小さいほど、規制は厳しくなる。", "排出口を高くすると、許容される排出量は大きくなる。", "窒素酸化物とばいじんにも、同じ方式が適用されている。"], "answer": [4], "explanation": "K値規制は硫黄酸化物に固有の方式で、許容排出量qをq＝K×10⁻³×He²(Heは補正された排出口高さ)として与える。窒素酸化物やばいじんは濃度で規制されており、K値方式は用いられない。煙突を高くすれば地上濃度が下がるという拡散の考え方が式に組み込まれている点が特徴である。"}, {"id": 36, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "硫黄酸化物及び窒素酸化物の総量規制に関する記述として、誤っているものはどれか。", "options": ["指定地域内であれば、規模を問わず一律に適用される。", "硫黄酸化物と窒素酸化物について制度が設けられている。", "指定地域内の一定規模以上の工場等に適用される。", "施設ごとではなく、工場全体としての排出量を規制する。", "都道府県知事が総量削減計画を作成することとされている。"], "answer": [0], "explanation": "総量規制は、施設ごとの排出基準だけでは環境基準の確保が困難な地域について導入される制度で、対象は指定地域内の一定規模以上の工場等(特定工場等)に限られる。小規模な事業場まで一律に適用されるものではない。"}, {"id": 37, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "揮発性有機化合物(VOC)の排出規制に関する記述として、誤っているものはどれか。", "options": ["規制対象は、一定の規模以上の施設に限定されている。", "排出抑制は法規制だけで進めることとされている。", "固定発生源からのVOC排出量は、制度導入後に減少した。", "光化学オキシダント対策の一環として導入された制度である。", "塗装や印刷、接着、洗浄などの施設が規制対象となる。"], "answer": [1], "explanation": "VOC対策は、法規制と事業者の自主的取組を適切に組み合わせる「ベストミックス」の考え方で進められている。大規模施設を法規制で押さえ、中小規模は自主的取組に委ねる設計であり、法規制だけで進める制度ではない。"}, {"id": 38, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "大気汚染防止法における粉じんの規制に関する記述として、誤っているものはどれか。", "options": ["一般粉じん発生施設には、構造・使用・管理の基準が定められる。", "特定粉じん発生施設には、敷地境界基準が定められている。", "一般粉じん発生施設には、排出口での濃度基準が定められる。", "粉じんは、一般粉じんと特定粉じんに区分されている。", "特定粉じんとしては、石綿が指定されている。"], "answer": [2], "explanation": "一般粉じん発生施設に課されるのは、集じん機の設置や散水、囲いの設置といった構造・使用・管理に関する基準であり、排出口濃度による規制ではない。一方、特定粉じん(石綿)については敷地境界における濃度基準が定められている。"}, {"id": 39, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "一般粉じん発生施設に関する次の記述中の(ア)(イ)に入る数値の組合せとして、正しいものはどれか。\n\n「鉱物又は土石の堆積場は、面積が(ア)m²以上のものが該当する。またコークス炉は、原料処理能力が1日当たり(イ)トン以上のものが該当する。」", "options": ["(ア)500　(イ)50", "(ア)5,000　(イ)50", "(ア)500　(イ)100", "(ア)1,000　(イ)50", "(ア)1,000　(イ)100"], "answer": [3], "explanation": "一般粉じん発生施設は施行令で規模要件が定められており、鉱物又は土石の堆積場は面積1,000m²以上、コークス炉は原料処理能力50t/日以上が対象となる。このほかベルトコンベア等はベルト幅75cm以上、ふるいは原動機の定格出力15kW以上といった要件があり、数値の入替えが典型的な誤答パターンとなる。"}, {"id": 40, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "有害大気汚染物質に関する記述として、誤っているものはどれか。", "options": ["継続的な摂取により健康被害が生ずるおそれのある物質をいう。", "事業者の自主的な排出抑制が対策の柱とされている。", "ベンゼンなどについては、環境基準が定められている。", "指定物質については、指定物質抑制基準が定められる。", "対象物質には、いずれも排出口での排出基準が定められる。"], "answer": [4], "explanation": "有害大気汚染物質は、ばい煙のように排出口濃度で一律規制する仕組みにはなっていない。低濃度で長期にわたる曝露が問題となる性質から、事業者の自主管理とモニタリングを軸とし、ベンゼンなど一部について環境基準や指定物質抑制基準が置かれている。"}, {"id": 41, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "事故時及び緊急時の措置に関する記述として、誤っているものはどれか。", "options": ["緊急時の措置は、気象条件が回復するまで公表されない。", "事故によりばい煙等が大量に排出されたときは、応急措置を講ずる。", "事故時には、その状況を都道府県知事に通報しなければならない。", "緊急時には、都道府県知事が一般にその事態を周知する。", "緊急時には、ばい煙量の減少について協力を求めることができる。"], "answer": [0], "explanation": "緊急時の措置は、気象条件により大気汚染が著しくなると認められるときに都道府県知事が一般にその事態を周知し、あわせて排出量の減少等の協力を求めるものである。周知そのものが被害の未然防止の中核であり、事後まで公表されない仕組みではない。"}, {"id": 42, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "ばい煙発生施設の設置者の義務に関する記述として、正しいものはどれか。", "options": ["改善命令に代えて、一時停止を命ずることはできない。", "ばい煙量等の測定結果は、記録して保存する義務がある。", "測定は、都道府県知事が実施することとされている。", "改善命令は、実際に基準を超過した後でなければ出せない。", "測定結果の記録は、その年度内に廃棄することとされる。"], "answer": [1], "explanation": "設置者は自らばい煙量又はばい煙濃度を測定し、その結果を記録して一定期間保存しなければならない。また改善命令は、排出基準に適合しないばい煙を継続して排出する「おそれ」がある段階で発することができ、施設の使用の一時停止を命ずることもできる。"}, {"id": 43, "domain": "大気概論", "sub": "大気環境の現状", "type": "single", "q": "二酸化硫黄に係る環境基準に関する次の記述中の(ア)(イ)に入る数値の組合せとして、正しいものはどれか。\n\n「1時間値の1日平均値が(ア)ppm以下であり、かつ、1時間値が(イ)ppm以下であること。」", "options": ["(ア)0.04　(イ)0.06", "(ア)0.06　(イ)0.1", "(ア)0.04　(イ)0.1", "(ア)0.02　(イ)0.1", "(ア)0.1　(イ)0.04"], "answer": [2], "explanation": "二酸化硫黄の環境基準は「1時間値の1日平均値が0.04ppm以下、かつ1時間値が0.1ppm以下」である。1日平均値と1時間値で二段構えになっている点、および0.04と0.1という数値の組合せが要点。0.04～0.06のゾーンで示されるのは二酸化窒素であり、両者の混同を狙う出題が多い。"}, {"id": 44, "domain": "大気概論", "sub": "大気環境の現状", "type": "single", "q": "二酸化窒素に係る環境基準に関する記述として、誤っているものはどれか。", "options": ["ゾーン内にある地域では、現状程度の水準を維持することとされる。", "ゾーンを超える地域では、ゾーン内への低減が目標とされている。", "自動車排出ガス測定局では、一般局に比べ濃度が高い傾向がある。", "単一の値で定められており、幅をもった基準とはなっていない。", "1日平均値が0.04～0.06ppmのゾーン内又はそれ以下とされる。"], "answer": [3], "explanation": "二酸化窒素の環境基準は「1時間値の1日平均値が0.04ppmから0.06ppmまでのゾーン内又はそれ以下」という、幅(ゾーン)をもった特徴的な定め方をしている点が他の物質と異なる。単一の値で示されるという記述は、この特徴と正反対である。"}, {"id": 45, "domain": "大気概論", "sub": "大気環境の現状", "type": "single", "q": "粒子状物質に関する次の記述中の(ア)～(ウ)に入る語句・数値の組合せとして、正しいものはどれか。\n\n「浮遊粒子状物質は粒径(ア)μm以下の粒子をいい、微小粒子状物質は粒径(イ)μm以下の粒子をいう。微小粒子状物質には、大気中の反応により生成する(ウ)によるものも含まれる。」", "options": ["(ア)10　(イ)5.0　(ウ)二次生成", "(ア)2.5　(イ)10　(ウ)二次生成", "(ア)10　(イ)2.5　(ウ)一次排出", "(ア)50　(イ)2.5　(ウ)二次生成", "(ア)10　(イ)2.5　(ウ)二次生成"], "answer": [4], "explanation": "浮遊粒子状物質(SPM)は粒径10μm以下、微小粒子状物質(PM2.5)は粒径2.5μm以下と定義され、PM2.5はSPMに含まれる関係にある。またPM2.5には、硫黄酸化物や窒素酸化物、VOCが大気中で反応して生じる硫酸塩・硝酸塩などの二次生成粒子が相当の割合で含まれる。"}, {"id": 46, "domain": "大気概論", "sub": "大気環境の現状", "type": "single", "q": "我が国の大気環境基準の達成状況に関する記述として、正しいものはどれか。", "options": ["光化学オキシダントの達成率は、極めて低い水準が続いている。", "一酸化炭素は、環境基準が未達成の測定局が多くを占める。", "微小粒子状物質の達成率は、監視開始以来低下し続けている。", "浮遊粒子状物質の達成率は、5割程度にとどまっている。", "二酸化硫黄の達成率は、近年になって低下を続けている。"], "answer": [0], "explanation": "二酸化硫黄・一酸化炭素・二酸化窒素・浮遊粒子状物質はいずれも達成率がほぼ100%で推移し、微小粒子状物質も改善が進んでいる。その中で光化学オキシダントだけが達成率ほぼ0%という状態が長く続いており、この一点だけが突出して未達成である構図を押さえておきたい。"}, {"id": 47, "domain": "大気概論", "sub": "大気環境の現状", "type": "single", "q": "大気汚染状況の常時監視に関する記述として、誤っているものはどれか。", "options": ["測定結果は国に報告され、とりまとめて公表されている。", "測定局の設置と運営は、環境省が直接行うこととされる。", "都道府県知事が、大気の汚染の状況を常時監視することとされる。", "一般環境大気測定局と自動車排出ガス測定局に区分される。", "自動車排出ガス測定局は、交通量の多い道路沿道に置かれる。"], "answer": [1], "explanation": "常時監視は都道府県知事(政令市長を含む)の事務であり、測定局の設置・運営も地方公共団体が担う。環境省は報告を受けて全国の結果を取りまとめ公表する立場である。一般局と自排局の区分は、沿道の濃度が高く出る二酸化窒素などの評価で重要になる。"}, {"id": 48, "domain": "大気概論", "sub": "大気環境の現状", "type": "single", "q": "越境大気汚染に関する記述として、誤っているものはどれか。", "options": ["黄砂も、越境的に生じる現象の一つとされている。", "東アジアでは、国際的な協力の枠組みが設けられている。", "国内の濃度は国内発生源だけで決まり、越境の寄与はない。", "大陸からの移流により、国内の濃度が影響を受けることがある。", "微小粒子状物質の一部は、越境的な寄与があるとされる。"], "answer": [2], "explanation": "微小粒子状物質やオゾン、酸性雨原因物質は数百～数千kmの規模で輸送されるため、国内濃度には国外由来の寄与が含まれる。このため東アジア酸性雨モニタリングネットワーク(EANET)など国際的な監視・協力の枠組みが設けられている。"}, {"id": 49, "domain": "大気概論", "sub": "発生機構と大気化学", "type": "single", "q": "燃焼における窒素酸化物の生成に関する記述として、誤っているものはどれか。", "options": ["フューエルNOxは、燃料中の窒素分に由来して生じる。", "プロンプトNOxは、火炎帯で急速に生成するものである。", "サーマルNOxの生成は、火炎温度が高いほど増加する。", "フューエルNOxは、燃料の種類によらず一定量生成する。", "サーマルNOxは、燃焼用空気中の窒素が高温で酸化して生じる。"], "answer": [3], "explanation": "フューエルNOxは燃料中に含まれる窒素分が酸化して生じるため、その量は燃料の窒素含有率に依存する。都市ガスのように窒素分をほとんど含まない燃料ではフューエルNOxはわずかで、重質油や石炭では多くなる。燃料によらず一定という記述は生成機構と矛盾する。"}, {"id": 50, "domain": "大気概論", "sub": "発生機構と大気化学", "type": "single", "q": "低NOx燃焼技術に関する記述として、誤っているものはどれか。", "options": ["二段燃焼は、燃焼用空気を分割して供給する方法である。", "排ガス再循環は、燃焼温度を下げてNOxを抑制する。", "低酸素燃焼は、過剰空気を減らしてNOxを抑制する。", "低NOxバーナーは、火炎の温度分布を制御して抑制する。", "燃焼温度を高くするほど、サーマルNOxは減少する。"], "answer": [4], "explanation": "サーマルNOxの生成速度は火炎温度に対して指数関数的に増大するため、温度を上げれば生成量は増える。低NOx燃焼技術はいずれも、最高火炎温度を下げるか、高温域での酸素濃度を下げることを狙った手法である。"}, {"id": 51, "domain": "大気概論", "sub": "発生機構と大気化学", "type": "single", "q": "硫黄酸化物の発生に関する記述として、誤っているものはどれか。", "options": ["燃焼用空気中の窒素が酸化されることで生成する。", "燃料中に含まれる硫黄分が、燃焼により酸化されて生じる。", "大部分は二酸化硫黄であり、一部が三酸化硫黄となる。", "排出量は、使用する燃料の硫黄含有率に強く依存する。", "重油に含まれる硫黄分は、都市ガスに比べて多い。"], "answer": [0], "explanation": "燃焼用空気中の窒素が酸化されて生じるのはサーマルNOxであり、硫黄酸化物の生成機構ではない。硫黄酸化物はもっぱら燃料中の硫黄分に由来するため、低硫黄燃料への転換が排出削減に直接効くという点が窒素酸化物との大きな違いである。"}, {"id": 52, "domain": "大気概論", "sub": "発生機構と大気化学", "type": "single", "q": "大気汚染物質に関する次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「発生源から直接排出される物質を(ア)、大気中の反応により生成する物質を(イ)という。光化学オキシダントは(ウ)に分類される。」", "options": ["(ア)一次汚染物質　(イ)複合汚染物質　(ウ)二次汚染物質", "(ア)一次汚染物質　(イ)二次汚染物質　(ウ)二次汚染物質", "(ア)発生源物質　(イ)二次汚染物質　(ウ)一次汚染物質", "(ア)二次汚染物質　(イ)一次汚染物質　(ウ)二次汚染物質", "(ア)一次汚染物質　(イ)二次汚染物質　(ウ)一次汚染物質"], "answer": [1], "explanation": "二酸化硫黄、一酸化窒素、一酸化炭素、ばいじんなどが一次汚染物質、光化学オキシダント(オゾン)や硫酸塩・硝酸塩粒子、PANなどが二次汚染物質である。二次汚染物質は発生源を直接規制しても濃度が下がりにくく、前駆物質の削減という間接的な対策が必要になる点が重要。"}, {"id": 53, "domain": "大気概論", "sub": "発生機構と大気化学", "type": "single", "q": "光化学オキシダントの濃度変化に関する記述として、誤っているものはどれか。", "options": ["注意報の発令は、夏季に集中する傾向がみられる。", "前駆物質の排出削減にもかかわらず、濃度の改善は緩やかである。", "濃度は日射の影響を受けず、季節による変動はみられない。", "濃度は、日中に上昇して午後にピークを迎えることが多い。", "日射が強く風の弱い日に、高い濃度となりやすい。"], "answer": [2], "explanation": "光化学オキシダントは日射による光化学反応で生成するため、日中に濃度が上がり午後にピークを示す明確な日変化と、夏季に高くなる季節変化をもつ。日射の影響を受けないという記述は生成機構と矛盾する。なお前駆物質は減っているのに濃度が下がりにくいという状況が、対策上の課題となっている。"}, {"id": 54, "domain": "大気概論", "sub": "発生機構と大気化学", "type": "single", "q": "対流圏におけるヒドロキシルラジカル(OH)に関する記述として、正しいものはどれか。", "options": ["OHラジカルは、成層圏にだけ存在する化学種である。", "クロロフルオロカーボンは、対流圏でOHと速やかに反応する。", "OHラジカルの濃度は、夜間に最も高くなるとされている。", "対流圏の物質の酸化は、OHラジカルが起点となることが多い。", "メタンは、OHラジカルとは反応しない安定な物質である。"], "answer": [3], "explanation": "OHラジカルは対流圏における酸化反応の出発点となる化学種で、日射により生成するため日中に濃度が高い。メタンや揮発性有機化合物はOHと反応して分解されるが、クロロフルオロカーボン(CFC)は水素原子をもたずOHとほとんど反応しないため対流圏で分解されず、成層圏まで到達してオゾン層を破壊する。"}, {"id": 55, "domain": "大気概論", "sub": "大気汚染の影響", "type": "single", "q": "粒子状物質の吸入と生体影響に関する記述として、誤っているものはどれか。", "options": ["粒径の大きい粒子は、鼻腔や咽頭で捕捉されやすい。", "粒径の小さい粒子ほど、肺の深部にまで達しやすい。", "気道では、線毛運動によって異物が排出されている。", "肺胞領域には線毛がなく、粒子が滞留しやすいとされる。", "粒径が小さい粒子ほど、鼻腔で捕捉される割合が高い。"], "answer": [4], "explanation": "慣性の大きい粗大粒子は上気道で衝突・捕捉されるのに対し、粒径が小さいほど気流に乗って気管支から肺胞領域まで到達しやすい。微小粒子状物質が健康影響の観点から重視されるのは、この深部到達性と、肺胞に線毛による排出機構がないことによる。"}, {"id": 56, "domain": "大気概論", "sub": "大気汚染の影響", "type": "single", "q": "我が国の四大公害病のうち、大気汚染に起因するものはどれか。", "options": ["四日市ぜんそく", "イタイイタイ病", "慢性ひ素中毒症", "水俣病", "新潟水俣病"], "answer": [0], "explanation": "四大公害病は水俣病、新潟水俣病、イタイイタイ病、四日市ぜんそくであり、このうち大気汚染に起因するのは四日市ぜんそくである。石油コンビナートから排出された硫黄酸化物により閉塞性呼吸器疾患が多発し、硫黄酸化物対策が進む契機となった。"}, {"id": 57, "domain": "大気概論", "sub": "大気汚染の影響", "type": "single", "q": "大気汚染物質による植物への影響に関する記述として、誤っているものはどれか。", "options": ["被害の程度は、植物の種類や生育段階によって異なる。", "ふっ化水素は、二酸化硫黄より高い濃度でなければ影響しない。", "二酸化硫黄は、気孔から侵入して葉に被害を生じさせる。", "オゾンによる被害は、葉の表面に微細な斑点として現れる。", "PANによる被害は、葉の裏面に光沢を生じることがある。"], "answer": [1], "explanation": "ふっ化水素は植物に対する毒性が極めて強く、二酸化硫黄よりはるかに低い濃度で葉の先端や縁の壊死といった被害を生じる。このため植物被害は、ふっ素化合物の排出を検知する指標としても用いられてきた。"}, {"id": 58, "domain": "大気概論", "sub": "大気汚染防止法の規制体系", "type": "single", "q": "水銀の排出規制に関する記述として、誤っているものはどれか。", "options": ["水銀排出施設の設置には、事前の届出が必要とされる。", "水銀排出施設ごとに、排出基準が定められている。", "水銀は、ばい煙に含まれる有害物質として規制される。", "水俣条約を踏まえ、大気汚染防止法に規定が設けられた。", "石炭火力発電所などが、水銀排出施設に指定されている。"], "answer": [2], "explanation": "水銀は、ばい煙・揮発性有機化合物・粉じんとは別建ての「水銀等」として規制体系が組まれている。水銀に関する水俣条約の締結を受けた法改正により、石炭火力発電所、非鉄金属製造施設、廃棄物焼却炉、セメントクリンカー製造施設などが水銀排出施設に指定された。"}, {"id": 59, "domain": "大気概論", "sub": "気象と拡散", "type": "single", "q": "逆転層と大気汚染の関係に関する記述として、誤っているものはどれか。", "options": ["接地逆転層は、夜間から早朝にかけて生じやすい。", "逆転層の下では、汚染物質が拡散しにくくなる。", "沈降性逆転は、高気圧に覆われたときに生じやすい。", "逆転層があると、汚染物質は上方へよく拡散する。", "上空にいくほど気温が高くなる層を、逆転層という。"], "answer": [3], "explanation": "逆転層は上方ほど気温が高く、鉛直方向の対流が抑えられるため、その下では汚染物質が上方へ拡散できず滞留して高濃度になりやすい。放射冷却による接地逆転、高気圧下の下降流による沈降性逆転が代表例で、いずれも大気汚染が悪化しやすい条件である。"}, {"id": 60, "domain": "大気概論", "sub": "気象と拡散", "type": "single", "q": "煙の拡散に関する記述として、誤っているものはどれか。", "options": ["有効煙突高さは、実煙突高さに煙の上昇高さを加えたものである。", "排出ガスの速度が大きいほど、煙の上昇高さは大きくなる。", "排出ガスの温度が高いほど、煙の上昇高さは大きくなる。", "大気が不安定なときは、ルーピング形の煙が現れやすい。", "有効煙突高さは、実煙突高さと等しくなるよう定められる。"], "answer": [4], "explanation": "有効煙突高さは実煙突高さと煙の上昇高さの和であり、両者が等しくなることはない。上昇高さは排出ガスの噴出速度による運動量と、周囲との温度差による浮力によって決まる。K値規制で用いる補正された排出口高さもこの考え方に基づいている。"}, {"id": 61, "domain": "大気特論", "sub": "燃料", "type": "single", "q": "同じ体積を完全燃焼させたとき、高発熱量と低発熱量の差が最も大きい気体燃料はどれか。", "options": ["プロパン", "一酸化炭素", "水素", "メタン", "エタン"], "answer": [0], "explanation": "高発熱量と低発熱量の差は、燃焼で生成する水蒸気の凝縮潜熱に相当するため、生成水分量が多い燃料ほど差が大きい。1molあたりの生成水は、一酸化炭素0、水素1、メタン2、エタン3、プロパン4であり、プロパンが最大となる。生成水がない一酸化炭素では両者が一致する。"}, {"id": 62, "domain": "大気特論", "sub": "燃料", "type": "single", "q": "重油の性状に関する記述として、誤っているものはどれか。", "options": ["バナジウムを含む場合、高温腐食の原因となることがある。", "A重油はC重油に比べて硫黄分が多いのが一般的である。", "C重油はA重油に比べて動粘度が高く、加熱が必要となる。", "硫黄分は、燃焼により硫黄酸化物となって排出される。", "残留炭素分が多い重油ほど、ばいじんを生じやすい。"], "answer": [1], "explanation": "重油はA・B・Cの順に重質となり、動粘度・残留炭素・灰分・硫黄分のいずれもC重油の方が多い。A重油の方が硫黄分が多いという記述は逆である。バナジウムは重質油に含まれ、灰の融点を下げて高温腐食を招く。"}, {"id": 63, "domain": "大気特論", "sub": "燃料", "type": "single", "q": "石炭の性状に関する次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「工業分析では、水分、灰分、揮発分、(ア)を求める。(ア)を揮発分で除した値を(イ)といい、この値が大きい石炭ほど着火が(ウ)なる傾向がある。」", "options": ["(ア)固定炭素　(イ)発熱量比　(ウ)しにくく", "(ア)全硫黄　(イ)燃料比　(ウ)しやすく", "(ア)固定炭素　(イ)燃料比　(ウ)しにくく", "(ア)固定炭素　(イ)燃料比　(ウ)しやすく", "(ア)全炭素　(イ)燃料比　(ウ)しにくく"], "answer": [2], "explanation": "工業分析で求めるのは水分・灰分・揮発分・固定炭素の4項目で、固定炭素/揮発分を燃料比という。燃料比が大きい石炭は揮発分が少なく、着火しにくく火炎が短くなるため、燃焼装置の設計に影響する。無煙炭は燃料比が大きく、褐炭は小さい。"}, {"id": 64, "domain": "大気特論", "sub": "燃料", "type": "single", "q": "気体燃料に関する記述として、誤っているものはどれか。", "options": ["液化石油ガスの主成分は、プロパンやブタンである。", "気体燃料は、液体燃料に比べて空気との混合が容易である。", "都市ガスは、重油に比べて硫黄分が極めて少ない。", "気体燃料は、液体燃料に比べてばいじんを生じやすい。", "天然ガスの主成分は、メタンである。"], "answer": [3], "explanation": "気体燃料は空気と分子レベルで混合しやすく、局所的な酸素不足が起こりにくいため、ばいじん(すす)の発生は液体燃料や固体燃料に比べて格段に少ない。硫黄分もほとんど含まないため、硫黄酸化物対策の面でも有利である。"}, {"id": 65, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "炭素1kgを完全燃焼させるのに必要な理論空気量として、最も近い値はどれか。ただし空気中の酸素は体積で21%とする。", "options": ["11.2 m³N", "21.0 m³N", "1.9 m³N", "4.5 m³N", "8.9 m³N"], "answer": [4], "explanation": "C＋O₂→CO₂より、炭素1kg(=1/12 kmol)に必要な酸素は1/12 kmol、標準状態で22.4×(1/12)＝1.87 m³N。これを空気に換算すると1.87÷0.21＝8.9 m³N/kgとなる。この値は燃焼計算の基本定数として覚えておくとよい。"}, {"id": 66, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "プロパンを空気比1.1で完全燃焼させたとき、乾き排ガス中の酸素濃度として最も近い値はどれか。", "options": ["2.1 %", "3.5 %", "4.8 %", "6.2 %", "1.0 %"], "answer": [0], "explanation": "C₃H₈＋5O₂→3CO₂＋4H₂Oより理論空気量は5÷0.21＝23.8。空気比1.1では過剰空気が2.38、うち酸素は0.5。乾き排ガス量はCO₂3＋窒素18.8＋過剰空気2.38＝24.2となり、酸素濃度は0.5÷24.2＝約2.1%。水蒸気を除いて計算するのが乾きガス基準である。"}, {"id": 67, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "実測のばいじん濃度が0.10 g/m³N、そのときの排ガス中酸素濃度が10%であった。標準酸素濃度6%に換算した値として最も近いものはどれか。", "options": ["0.10 g/m³N", "0.14 g/m³N", "0.19 g/m³N", "0.25 g/m³N", "0.07 g/m³N"], "answer": [1], "explanation": "酸素補正は C＝Cs×(21−On)/(21−Os) で行う。0.10×(21−6)/(21−10)＝0.10×15/11＝0.136≒0.14 g/m³N。空気で薄めて見かけの濃度を下げる操作を排除するための補正であり、実測酸素濃度が標準値より高いほど補正後の値は大きくなる。"}, {"id": 68, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "完全燃焼している排ガスの乾きガス基準の酸素濃度が5%であった。このときの空気比として最も近い値はどれか。", "options": ["1.05", "1.19", "1.31", "1.45", "1.60"], "answer": [2], "explanation": "完全燃焼時の空気比は近似的に m＝21/(21−O₂) で求められる。21/(21−5)＝21/16＝1.31。酸素濃度が高いほど空気比が大きく、過剰空気が多いことを意味する。この簡便式は運転管理の現場でも用いられる。"}, {"id": 69, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "メタン1 m³Nを空気比1.2で完全燃焼させたときの湿り排ガス量として、最も近い値はどれか。", "options": ["16.2 m³N", "8.6 m³N", "10.5 m³N", "12.4 m³N", "14.8 m³N"], "answer": [3], "explanation": "CH₄＋2O₂→CO₂＋2H₂Oより理論空気量は2÷0.21＝9.52。理論湿り排ガス量はCO₂1＋H₂O2＋窒素7.52＝10.52。空気比1.2では過剰空気1.90が加わり、10.52＋1.90＝12.4 m³Nとなる。水蒸気を含めるのが湿りガス基準である。"}, {"id": 70, "domain": "大気特論", "sub": "燃焼計算", "type": "single", "q": "空気比を過大にした場合に生じる現象として、誤っているものはどれか。", "options": ["排ガス量が増加し、排ガスとして持ち出される熱損失が増える。", "乾き排ガス中の酸素濃度が高くなる。", "サーマルNOxの生成が増えることがある。", "排ガス量が増え、集じん装置の負荷が大きくなる。", "燃焼効率が高まり、熱効率は単調に向上する。"], "answer": [4], "explanation": "空気比を上げると未燃分は減るが、加熱する必要のない空気を余分に送り込むことになるため、ある点を超えると排ガス損失が増えて熱効率はむしろ低下する。空気比には熱効率が最大となる最適値が存在し、単調に向上することはない。"}, {"id": 71, "domain": "大気特論", "sub": "燃焼方法及び燃焼装置", "type": "single", "q": "油バーナーに関する記述として、誤っているものはどれか。", "options": ["油圧噴霧式は、広い負荷範囲にわたり微粒化を維持できる。", "油圧噴霧式は、油を高圧で噴出させて微粒化する方式である。", "高圧気流噴霧式は、蒸気や空気の噴流により微粒化する。", "回転式は、回転カップの遠心力により油を微粒化する。", "高圧気流噴霧式は、ターンダウン比を大きくとりやすい。"], "answer": [0], "explanation": "油圧噴霧式は油圧そのもので微粒化するため、負荷を下げて油量を絞ると油圧も下がり微粒化が悪化する。したがってターンダウン比(調整幅)は小さい。広い負荷範囲に対応できるのは、微粒化を油圧に依存しない高圧気流噴霧式や回転式である。"}, {"id": 72, "domain": "大気特論", "sub": "燃焼方法及び燃焼装置", "type": "single", "q": "予混合燃焼と拡散燃焼に関する記述として、誤っているものはどれか。", "options": ["拡散燃焼は、予混合燃焼に比べて火炎が長くなる傾向がある。", "拡散燃焼は、局所的な高温域が生じにくくNOxが少ない。", "予混合燃焼は、燃料と空気をあらかじめ混合して燃焼させる。", "拡散燃焼は、燃料と空気が拡散しながら混合して燃焼する。", "予混合燃焼では、逆火に注意する必要がある。"], "answer": [1], "explanation": "拡散燃焼では燃料と空気の界面付近に量論比に近い高温の火炎面が形成されるため、局所的な高温域が生じやすくサーマルNOxの発生には不利に働く。低NOx化では、この高温域をいかに崩すかが設計の主眼となる。"}, {"id": 73, "domain": "大気特論", "sub": "燃焼方法及び燃焼装置", "type": "single", "q": "流動層燃焼に関する記述として、誤っているものはどれか。", "options": ["低品位の燃料や含水率の高い燃料も燃焼させやすい。", "層内の伝熱が良好で、温度分布が比較的均一である。", "燃焼温度が高いため、炉内での脱硫はできない。", "層内に石灰石を投入することで、炉内脱硫が可能である。", "燃焼温度が800～900℃程度と低く、サーマルNOxが少ない。"], "answer": [2], "explanation": "流動層燃焼の大きな利点は、800～900℃という比較的低い温度で燃焼できることにある。この温度域は石灰石による脱硫反応に適しており、層内に石灰石を投入して炉内脱硫を行える。燃焼温度が低いためサーマルNOxも抑えられる。"}, {"id": 74, "domain": "大気特論", "sub": "燃焼方法及び燃焼装置", "type": "single", "q": "ボイラーの低温腐食に関する記述として、誤っているものはどれか。", "options": ["排ガス温度を酸露点より高く保つことが対策となる。", "低酸素燃焼は、三酸化硫黄の生成を抑える効果がある。", "低硫黄燃料への転換は、酸露点を下げる効果がある。", "空気予熱器の入口側で最も起こりやすい。", "三酸化硫黄と水蒸気から生じる硫酸の凝縮が原因となる。"], "answer": [3], "explanation": "低温腐食は排ガス温度が酸露点を下回る箇所で生じるため、排ガスが最も冷える空気予熱器やエコノマイザーの低温端、すなわち出口側で起こりやすい。入口側は高温であり、硫酸の凝縮は生じにくい。"}, {"id": 75, "domain": "大気特論", "sub": "燃焼方法及び燃焼装置", "type": "single", "q": "高温腐食及び灰付着に関する記述として、正しいものはどれか。", "options": ["高温腐食は、排ガスが露点以下に冷える箇所で起こる。", "灰の融点が高いほど、伝熱面への溶融付着が起こりやすい。", "ナトリウム分は、高温腐食の抑制に働くとされている。", "高温腐食の対策として、排ガス温度の上昇が有効である。", "重油中のバナジウムは、灰の融点を下げて高温腐食を招く。"], "answer": [4], "explanation": "重油中のバナジウムは燃焼により五酸化バナジウムとなり、ナトリウム分と共存すると灰の融点を大きく下げる。溶融した灰が伝熱面に付着して金属の保護皮膜を壊すことで高温腐食が進行する。露点以下で起こるのは低温腐食であり、機構が異なる。"}, {"id": 76, "domain": "大気特論", "sub": "燃焼方法及び燃焼装置", "type": "single", "q": "微粉炭燃焼に関する記述として、誤っているものはどれか。", "options": ["粉砕動力が不要で、設備構成が簡素になる。", "石炭を微粉砕し、空気とともにバーナーへ搬送する。", "粒径を細かくするほど、燃焼が速く進む傾向がある。", "灰の一部は、クリンカとして炉底から排出される。", "多量の灰を含むため、集じん装置が不可欠である。"], "answer": [0], "explanation": "微粉炭燃焼では石炭を数十μmまで粉砕する必要があり、ミルの動力や搬送設備、灰処理設備を含めて設備構成はむしろ複雑で大がかりになる。粉砕動力が不要という記述は方式の前提と矛盾する。"}, {"id": 77, "domain": "大気特論", "sub": "排煙脱硫技術", "type": "single", "q": "湿式石灰石こう法に関する記述として、誤っているものはどれか。", "options": ["吸収塔内でのスケール付着が運転上の課題となる。", "副生物として硫酸マグネシウムが得られる。", "石灰石スラリーで二酸化硫黄を吸収する方式である。", "吸収液に空気を吹き込み、酸化して石こうを得る。", "副生する石こうは、建材などに利用される。"], "answer": [1], "explanation": "石灰石(炭酸カルシウム)を用いる方式であるから、副生するのは石こう(硫酸カルシウム二水塩)である。硫酸マグネシウムが得られるのは水酸化マグネシウムスラリーを用いる方式であり、吸収剤と副生物の組合せを入れ替える出題が頻出する。"}, {"id": 78, "domain": "大気特論", "sub": "排煙脱硫技術", "type": "single", "q": "排煙脱硫の方式と副生物又は吸収剤の組合せとして、誤っているものはどれか。", "options": ["ダブルアルカリ法 ── 水酸化ナトリウム", "活性炭法 ── 硫酸", "石灰石こう法 ── 水酸化マグネシウム", "石灰石こう法 ── 石こう", "水酸化マグネシウム法 ── 硫酸マグネシウム"], "answer": [2], "explanation": "石灰石こう法の吸収剤は石灰石又は消石灰であり、水酸化マグネシウムを用いるものではない。ダブルアルカリ法は水酸化ナトリウム溶液で吸収したのち石灰で再生する方式、活性炭法は吸着した二酸化硫黄を酸化・水洗して硫酸として回収する乾式法である。"}, {"id": 79, "domain": "大気特論", "sub": "排煙脱硫技術", "type": "single", "q": "ダブルアルカリ法に関する記述として、正しいものはどれか。", "options": ["吸収と再生を同じ塔内で行うため、設備が簡素である。", "活性炭に吸着させたのち、加熱して硫黄を回収する。", "吸収剤を用いず、排ガスの冷却によって脱硫する方式である。", "水酸化ナトリウム溶液で吸収し、石灰で再生する方式である。", "吸収液としてスラリーを用い、塔内で石こうを析出させる。"], "answer": [3], "explanation": "ダブルアルカリ法は、吸収塔では溶解度の高いナトリウム塩溶液を用いて吸収し、塔外の別工程で石灰を加えて石こうを析出させ吸収液を再生する。吸収塔内にスラリーを流さないためスケール付着が起こりにくいことが最大の利点である。"}, {"id": 80, "domain": "大気特論", "sub": "排煙脱硫技術", "type": "single", "q": "湿式排煙脱硫装置の運転上のトラブルに関する記述として、誤っているものはどれか。", "options": ["吸収液のpHが下がると、脱硫率が低下する。", "酸化が不十分だと、石こうの品質が低下する。", "スケールの付着は、圧力損失の増大を招く。", "ミストの飛散は、後流機器の腐食原因となりうる。", "吸収液のpHは、高いほど運転上の問題が生じない。"], "answer": [4], "explanation": "pHを高くしすぎると炭酸カルシウムなどのスケールが析出しやすくなり、吸収塔やノズルの閉塞を招く。脱硫率とスケール抑制はpHに関して相反するため、適正範囲に保つ管理が必要であり、高ければ高いほどよいものではない。"}, {"id": 81, "domain": "大気特論", "sub": "排煙脱硫技術", "type": "single", "q": "乾式及び半乾式の排煙脱硫に関する記述として、誤っているものはどれか。", "options": ["排ガスの再加熱が必要となる点が、最大の短所である。", "噴霧乾燥法では、消石灰スラリーを噴霧して乾燥させる。", "活性炭法では、二酸化硫黄を吸着させて処理する。", "排水処理設備が不要又は簡素にできる利点がある。", "湿式法に比べて、一般に脱硫率は低い傾向がある。"], "answer": [0], "explanation": "排ガスの再加熱(白煙防止や腐食防止のためのGGH)が必要になるのは、排ガスを飽和状態まで冷やす湿式法の特徴である。乾式・半乾式では排ガス温度がさほど下がらないため再加熱の負担が小さく、これがむしろ利点として挙げられる。"}, {"id": 82, "domain": "大気特論", "sub": "窒素酸化物排出防止技術", "type": "single", "q": "燃焼改善による窒素酸化物の抑制に関する記述として、誤っているものはどれか。", "options": ["水又は蒸気の噴射は、火炎温度を下げる効果がある。", "空気比を大きくするほど、サーマルNOxは減少する。", "低酸素燃焼は、火炎中の酸素濃度を下げて抑制する。", "二段燃焼は、燃焼用空気を分割して供給する方法である。", "排ガス再循環は、燃焼ガスの一部を炉内に戻す方法である。"], "answer": [1], "explanation": "空気比を上げると火炎中の酸素濃度が高まり、サーマルNOxの生成は増加する。低NOx燃焼の基本は、酸素濃度と火炎温度をいずれも下げることにあり、空気比の増大はその逆方向の操作となる。"}, {"id": 83, "domain": "大気特論", "sub": "窒素酸化物排出防止技術", "type": "single", "q": "アンモニア接触還元法(選択接触還元法)に関する記述として、誤っているものはどれか。", "options": ["窒素酸化物は、窒素と水に還元される。", "触媒には、酸化チタン系のものが用いられる。", "触媒を用いないため、設備費が安いことが利点である。", "触媒の存在下でアンモニアを還元剤として用いる。", "反応温度は、おおむね300～400℃程度である。"], "answer": [2], "explanation": "選択接触還元法は名称のとおり触媒を必須とする方式で、触媒層の設置と触媒の交換費用を要する。触媒を用いないのは無触媒還元法であり、こちらは設備が簡素な反面、850～1000℃という高温域が必要で脱硝率も低い。"}, {"id": 84, "domain": "大気特論", "sub": "窒素酸化物排出防止技術", "type": "single", "q": "無触媒還元法に関する記述として、誤っているものはどれか。", "options": ["反応に適した温度域は、850～1000℃程度である。", "触媒が不要なため、設備が比較的簡素である。", "接触還元法に比べて、脱硝率は低い傾向がある。", "常温付近で高い脱硝率が得られる点が特徴である。", "アンモニア又は尿素を高温域に吹き込む方式である。"], "answer": [3], "explanation": "無触媒還元法は、触媒の助けなしに還元反応を進めるために高温を必要とし、850～1000℃という限られた温度域でのみ有効に働く。温度が低すぎると未反応アンモニアが漏出し、高すぎるとアンモニアが酸化されてかえってNOxを生じる。"}, {"id": 85, "domain": "大気特論", "sub": "窒素酸化物排出防止技術", "type": "single", "q": "排煙脱硝に関する次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「選択接触還元法では、(ア)を還元剤として触媒層に導き、窒素酸化物を(イ)と水に還元する。反応温度域は、無触媒還元法に比べて(ウ)。」", "options": ["(ア)アンモニア　(イ)窒素　(ウ)高い", "(ア)オゾン　(イ)窒素　(ウ)低い", "(ア)アンモニア　(イ)一酸化窒素　(ウ)低い", "(ア)メタン　(イ)窒素　(ウ)高い", "(ア)アンモニア　(イ)窒素　(ウ)低い"], "answer": [4], "explanation": "選択接触還元法はアンモニアを還元剤とし、窒素酸化物を無害な窒素と水に変える。触媒を用いることで300～400℃という比較的低い温度で反応が進む点が、850～1000℃を要する無触媒還元法との決定的な違いである。"}, {"id": 86, "domain": "大気特論", "sub": "窒素酸化物排出防止技術", "type": "single", "q": "排ガス再循環によるNOx抑制に関する記述として、正しいものはどれか。", "options": ["燃焼ガスの一部を戻し、酸素濃度と火炎温度を下げる。", "燃焼用空気を予熱して、火炎温度を高める方法である。", "再循環率を上げるほど、燃焼は安定する傾向がある。", "フューエルNOxの抑制に、特に大きな効果がある。", "排ガスを触媒層に導き、窒素に還元する方法である。"], "answer": [0], "explanation": "排ガス再循環は、酸素を消費した燃焼ガスを炉内に戻すことで火炎の酸素濃度を薄め、同時に熱容量の増加により火炎温度を下げる。主な効果はサーマルNOxの抑制であり、再循環率を上げすぎると燃焼が不安定になるため限度がある。"}, {"id": 87, "domain": "大気特論", "sub": "測定・分析", "type": "single", "q": "排ガスの試料採取に関する記述として、誤っているものはどれか。", "options": ["水分の凝縮が問題となる場合は、採取管を加熱する。", "曲がりや弁の直後は、代表性の高い採取位置である。", "ガス流の乱れが少ない直管部を採取位置として選ぶ。", "ダスト濃度の測定では、等速吸引を行う必要がある。", "採取管は、目的成分と反応しにくい材質を選ぶ。"], "answer": [1], "explanation": "曲がりやダンパー、弁の直後は流れが偏り旋回も生じるため、断面を代表する試料が採れない。採取位置は上流側にも下流側にも十分な直管長を確保できる場所を選ぶのが原則である。"}, {"id": 88, "domain": "大気特論", "sub": "測定・分析", "type": "single", "q": "二酸化硫黄の自動計測器に関する記述として、誤っているものはどれか。", "options": ["紫外線蛍光法は、励起後の蛍光強度から求める。", "共存ガスによる干渉に留意する必要がある。", "いずれの方式も、前処理なしで直接測定できる。", "溶液導電率法は、吸収液の導電率変化から求める。", "赤外線吸収法は、特定波長の吸収量から求める。"], "answer": [2], "explanation": "排ガスにはダストや水分、共存ガスが含まれるため、除じん・除湿といった前処理を経てから計測器に導くのが通常である。前処理なしに直接測定できるという記述は、実際の計測系の構成と合わない。"}, {"id": 89, "domain": "大気特論", "sub": "測定・分析", "type": "single", "q": "窒素酸化物の自動計測器に用いる化学発光法に関する記述として、誤っているものはどれか。", "options": ["発光強度は、一酸化窒素の濃度に比例する。", "二酸化窒素は、還元して一酸化窒素として測定する。", "オゾン発生器を内蔵した構成となっている。", "二酸化窒素を、そのまま直接発光させて測定する。", "一酸化窒素とオゾンの反応で生じる発光を利用する。"], "answer": [3], "explanation": "化学発光法が検出するのは一酸化窒素とオゾンの反応による発光であり、二酸化窒素はそのままでは発光しない。このため二酸化窒素はコンバーターで一酸化窒素に還元してから測定し、還元の有無による差から二酸化窒素分を求める。"}, {"id": 90, "domain": "大気特論", "sub": "測定・分析", "type": "single", "q": "排ガス中の成分分析に関する記述として、正しいものはどれか。", "options": ["ジルコニア式酸素計は、常温で作動する方式である。", "ガスクロマトグラフ法は、無機ガスには適用できない。", "酸素濃度の測定には、化学発光法が用いられる。", "赤外線吸収法は、酸素や窒素の測定に適している。", "磁気式酸素計は、酸素の常磁性を利用している。"], "answer": [4], "explanation": "酸素は常磁性を示す数少ない気体であり、磁気式酸素計はこの性質を利用する。ジルコニア式は数百℃の高温で作動する固体電解質式である。また酸素や窒素のような等核二原子分子は赤外線を吸収しないため、赤外線吸収法では測定できない。"}, {"id": 91, "domain": "ばいじん・粉じん特論", "sub": "ダストの性質と処理計画", "type": "single", "q": "ダストの性質に関する記述として、誤っているものはどれか。", "options": ["粒子径が小さいほど、重力による沈降速度は大きくなる。", "空気力学的粒子径は、同じ沈降速度をもつ球で表した粒子径である。", "粒子径が小さいほど、単位質量当たりの表面積は大きくなる。", "微細な粒子ほど、付着や凝集が起こりやすい傾向がある。", "見掛け電気抵抗率は、電気集じんの性能を左右する。"], "answer": [0], "explanation": "ストークス域では沈降速度は粒子径の2乗に比例するため、粒子径が小さいほど沈降速度は急激に小さくなる。微細粒子が重力沈降室で捕集できず、慣性力や電気力、ろ過に頼らざるを得ないのはこのためである。"}, {"id": 92, "domain": "ばいじん・粉じん特論", "sub": "ダストの性質と処理計画", "type": "single", "q": "密度2,000 kg/m³、粒子径10 µmの球形粒子の重力沈降速度として、最も近い値はどれか。ただしストークス域とし、空気の粘度を1.8×10⁻⁵ Pa·s、重力加速度を9.8 m/s²とする。", "options": ["2.0 mm/s", "6.0 mm/s", "20 mm/s", "60 mm/s", "0.6 mm/s"], "answer": [1], "explanation": "ストークスの沈降速度は vs＝ρp d²g/(18µ) で与えられる。2000×(10×10⁻⁶)²×9.8÷(18×1.8×10⁻⁵)＝1.96×10⁻⁶÷3.24×10⁻⁴＝6.0×10⁻³ m/s＝6.0 mm/s。粒子径が2乗で効くため、径が半分になれば沈降速度は4分の1になる。"}, {"id": 93, "domain": "ばいじん・粉じん特論", "sub": "ダストの性質と処理計画", "type": "single", "q": "集じん率90%の装置と集じん率95%の装置を直列に設置したときの総合集じん率として、正しいものはどれか。", "options": ["95.0 %", "98.0 %", "99.5 %", "99.9 %", "92.5 %"], "answer": [2], "explanation": "直列接続では通過率どうしを掛け合わせる。通過率は0.10と0.05であるから、総合通過率は0.10×0.05＝0.005、総合集じん率は1−0.005＝0.995＝99.5%となる。集じん率を単純に足したり平均したりしてはならない点が要点である。"}, {"id": 94, "domain": "ばいじん・粉じん特論", "sub": "ダストの性質と処理計画", "type": "single", "q": "集じん装置の処理計画に関する記述として、誤っているものはどれか。", "options": ["要求される出口濃度から、必要な集じん率が定まる。", "ガス温度や露点は、装置の材質選定に影響する。", "腐食性ガスの共存は、材質選定上の制約となる。", "処理ガス量が変動しても、集じん性能は変化しない。", "処理ガス量と入口ダスト濃度が、装置選定の基礎となる。"], "answer": [3], "explanation": "処理ガス量が変われば装置内のガス流速が変わり、サイクロンでは遠心力、電気集じん装置では滞留時間、バグフィルターではろ過速度が変化するため、集じん性能は当然影響を受ける。負荷変動を見込んだ設計が必要である。"}, {"id": 95, "domain": "ばいじん・粉じん特論", "sub": "ダストの性質と処理計画", "type": "single", "q": "集じん装置の圧力損失に関する記述として、正しいものはどれか。", "options": ["重力沈降室は、集じん装置の中で圧力損失が最も大きい。", "電気集じん装置は、サイクロンより圧力損失が大きい。", "圧力損失は、運転動力費とは無関係である。", "バグフィルターの圧力損失は、払落しにより増加する。", "実用範囲では、ベンチュリスクラバーの圧力損失が最も大きい。"], "answer": [4], "explanation": "ベンチュリスクラバーはスロート部で高速のガス流を作るため、実用される集じん装置の中で圧力損失が最も大きい。重力沈降室と電気集じん装置は流速が低く圧力損失が小さい。バグフィルターの圧力損失は付着したダスト層により増大し、払落しによって回復する。"}, {"id": 96, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "重力沈降室に関する記述として、誤っているものはどれか。", "options": ["数µm以下の微細粒子も、高い効率で捕集できる。", "重力による粒子の沈降を利用した装置である。", "構造が簡単で、圧力損失が小さい。", "粗大な粒子の予備的な除去に用いられる。", "同じ処理量では、装置が大形になりやすい。"], "answer": [0], "explanation": "沈降速度が粒子径の2乗に比例するため、数µm以下の粒子は沈降にきわめて長い時間を要し、現実的な大きさの装置では捕集できない。重力沈降室は、後段の装置の負荷を軽くするための粗除去(プレクリーナー)として位置づけられる。"}, {"id": 97, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "サイクロン内で粒子の円周方向速度が20 m/s、回転半径が0.5 mであるときの遠心効果として、最も近い値はどれか。ただし重力加速度は9.8 m/s²とする。", "options": ["41", "82", "160", "8", "20"], "answer": [1], "explanation": "遠心効果は遠心加速度と重力加速度の比で、Z＝v²/(rg)＝20²/(0.5×9.8)＝400/4.9＝81.6≒82。すなわち重力の約82倍の力が働くことを意味する。半径を小さくするほど遠心効果は大きくなり、小口径のサイクロンほど微細粒子に有効となる。"}, {"id": 98, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "サイクロン(遠心力集じん装置)に関する記述として、誤っているものはどれか。", "options": ["小口径のものを並列に配置する方式がある。", "入口ガス速度を上げると、圧力損失は増加する。", "口径を大きくするほど、微細粒子の捕集率は高くなる。", "旋回流による遠心力で、粒子を壁面へ分離する。", "同じ処理量では、小口径の方が微細粒子に有効である。"], "answer": [2], "explanation": "遠心効果は回転半径に反比例するため、口径が大きいほど遠心力は弱まり微細粒子の捕集率は低下する。処理量を確保しつつ性能を上げるために、小口径のサイクロンを多数並列にしたマルチサイクロンが用いられる。"}, {"id": 99, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "電気集じん装置に関する次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「放電極にはふつう(ア)コロナが用いられる。粒径の大きい粒子は主に(イ)によって荷電され、粒径の小さい粒子ではイオンの熱運動による(ウ)の寄与が大きくなる。」", "options": ["(ア)負　(イ)拡散荷電　(ウ)電界荷電", "(ア)負　(イ)電界荷電　(ウ)慣性荷電", "(ア)正　(イ)拡散荷電　(ウ)電界荷電", "(ア)負　(イ)電界荷電　(ウ)拡散荷電", "(ア)正　(イ)電界荷電　(ウ)拡散荷電"], "answer": [3], "explanation": "工業用の電気集じん装置では、火花電圧が高く安定な負コロナが用いられる(オゾン発生を嫌う室内用には正コロナ)。荷電機構は、電界による強制的な付着である電界荷電が粗大粒子で支配的、イオンの熱運動による拡散荷電が微細粒子で支配的となる。"}, {"id": 100, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "電気集じん装置におけるダストの電気抵抗率に関する記述として、誤っているものはどれか。", "options": ["電気抵抗率が低すぎると、再飛散が起こりやすい。", "電気抵抗率が高すぎると、逆電離が起こりやすい。", "逆電離が生じると、集じん率は低下する。", "適正な電気抵抗率の範囲が存在する。", "電気抵抗率が高いほど、集じん性能は向上する。"], "answer": [4], "explanation": "電気抵抗率が高すぎるとダスト層に電荷が滞留して層内で放電(逆電離)が起こり、集じん率が大きく低下する。低すぎれば集じん極で電荷を失って再飛散する。おおむね10⁴～10¹¹Ω·cm程度の範囲が適正とされ、高ければよいというものではない。"}, {"id": 101, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "電気集じん装置の一段式と二段式に関する記述として、誤っているものはどれか。", "options": ["二段式は、高濃度・高温の排ガス処理に最も適する。", "一段式は、荷電と集じんを同一の電界で行う。", "二段式は、荷電部と集じん部を分離した構造である。", "二段式は、比較的低濃度の処理に適している。", "一段式は、工業用の大形装置に広く用いられる。"], "answer": [0], "explanation": "二段式は荷電部と集じん部を分けることで低いオゾン発生と小形化を実現しており、空調用など比較的清浄で低温・低濃度の用途に向く。高濃度・高温の工業排ガスに用いられるのは一段式である。"}, {"id": 102, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "処理ガス量6,000 m³/h、ろ布面積500 m²のバグフィルターにおける見掛けろ過速度(A/C比)として、正しいものはどれか。", "options": ["0.02 m/min", "0.20 m/min", "2.0 m/min", "12 m/min", "120 m/min"], "answer": [1], "explanation": "見掛けろ過速度は処理ガス量をろ布面積で除して求める。6,000÷500＝12 m/h、これを分に直すと12÷60＝0.20 m/min。一般に0.5～2 m/min程度が用いられ、この値を上げすぎると圧力損失の増大と目詰まり、ダストの押込みによる漏れを招く。"}, {"id": 103, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "ろ過集じん装置(バグフィルター)に関する記述として、誤っているものはどれか。", "options": ["払落し方式には、パルスジェット式や振動式がある。", "ろ布の耐熱温度が、使用条件の制約となる。", "ろ布の目開きより小さい粒子は、素通りしてしまう。", "ろ布表面に堆積した一次付着層が、捕集に寄与する。", "微細粒子に対しても、高い集じん率が得られる。"], "answer": [2], "explanation": "バグフィルターの捕集は、ろ布そのものよりも表面に形成されたダスト層(一次付着層)が主役であり、さらに慣性衝突・さえぎり・拡散といった機構が働くため、目開きよりはるかに小さい粒子も高い効率で捕集できる。ふるい分けだけで説明できるものではない。"}, {"id": 104, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "ダスト層の圧力損失に関する記述として、誤っているものはどれか。", "options": ["空隙率が小さくなるほど、圧力損失は大きくなる。", "ダスト層が厚くなるほど、圧力損失は大きくなる。", "粒子径が小さいほど、圧力損失は大きくなる。", "空隙率が小さくなるほど、圧力損失は小さくなる。", "コゼニー・カルマンの式で扱うことができる。"], "answer": [3], "explanation": "コゼニー・カルマンの式では圧力損失が(1−ε)²/ε³に比例するため、空隙率εが小さくなると圧力損失は急激に増大する。微細粒子が緻密に堆積すると空隙率が下がり、払落しをしても圧力損失が戻りにくくなる。"}, {"id": 105, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "洗浄集じん装置に関する記述として、正しいものはどれか。", "options": ["スプレー塔は、洗浄集じん装置には分類されない。", "洗浄集じん装置では、排水処理が不要である。", "ベンチュリスクラバーは、圧力損失が小さい方式である。", "洗浄集じん装置は、可燃性ダストの処理には適さない。", "充塡層式は、充塡物の表面で気液を接触させる方式である。"], "answer": [4], "explanation": "洗浄集じん装置には、スプレー塔、充塡層式、ベンチュリスクラバー、サイクロンスクラバー、ジェットスクラバーなどがある。液を用いるため排水処理が必要になる一方、可燃性・爆発性のダストや高温ガスを安全に扱えることが利点である。"}, {"id": 106, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "慣性力集じん装置に関する記述として、誤っているものはどれか。", "options": ["サブミクロンの粒子を、高効率で捕集できる。", "気流の方向を急変させ、粒子の慣性を利用する。", "ルーバー形や衝突板形などの構造がある。", "粗大粒子の予備除去に用いられることが多い。", "気流の方向変換が急なほど、捕集効率は高くなる。"], "answer": [0], "explanation": "慣性力集じん装置は粒子の慣性を利用するため、慣性の小さいサブミクロン粒子は気流に追随してしまい捕集できない。重力沈降室と同様、後段装置の負荷を下げる粗除去用として位置づけられる。"}, {"id": 107, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "集じん装置と主たる捕集機構の組合せとして、誤っているものはどれか。", "options": ["重力沈降室 ── 重力", "ベンチュリスクラバー ── 静電気力", "サイクロン ── 遠心力", "電気集じん装置 ── 静電気力", "バグフィルター ── ろ過"], "answer": [1], "explanation": "ベンチュリスクラバーは、スロート部で微細化した液滴に粒子が慣性衝突することで捕集する。静電気力を主たる機構とするのは電気集じん装置であり、両者を入れ替える組合せ問題が出題されやすい。"}, {"id": 108, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の原理・構造・特性", "type": "single", "q": "集じん装置の性能を表す指標に関する記述として、正しいものはどれか。", "options": ["集じん率が同じであれば、出口濃度も等しくなる。", "分離速度は、装置の圧力損失を表す指標である。", "部分集じん率は、粒子径ごとの捕集の程度を表す。", "集じん率は、出口濃度を入口濃度で除した値である。", "通過率が大きいほど、集じん性能は高い。"], "answer": [2], "explanation": "部分集じん率(分級集じん率)は粒子径ごとの捕集率を示し、装置の得手不得手を評価できる。集じん率は(入口−出口)/入口で定義され、出口/入口は通過率である。同じ集じん率でも入口濃度が違えば出口濃度は異なる。"}, {"id": 109, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の維持・管理", "type": "single", "q": "バグフィルターで湿りガスを処理する場合の留意点として、誤っているものはどれか。", "options": ["起動時と停止時に、結露が起こりやすい。", "結露するとダストが固着し、払落しが困難になる。", "保温や予熱が、結露防止の対策となる。", "露点以下まで冷却すると、払落し性が向上する。", "ガス温度を露点より高く保つ必要がある。"], "answer": [3], "explanation": "露点以下まで冷却すると水分が凝縮してダストが吸湿・固着し、払落しが効かなくなって圧力損失が回復しなくなる。ろ布の目詰まりや腐食の原因にもなるため、常に露点より十分高い温度で運転することが鉄則である。"}, {"id": 110, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の維持・管理", "type": "single", "q": "電気集じん装置の維持管理に関する記述として、誤っているものはどれか。", "options": ["槌打装置により、電極に付着したダストを払い落とす。", "払落しの際、ダストの再飛散に留意する必要がある。", "碍子部の汚損は、絶縁不良の原因となる。", "荷電電圧の低下は、性能低下の兆候となりうる。", "ダストが厚く堆積するほど、集じん性能は向上する。"], "answer": [4], "explanation": "集じん極にダストが厚く堆積すると、ダスト層での電圧降下により有効な電界が弱まり、逆電離も起こりやすくなって性能は低下する。このため槌打などにより適切な間隔でダストを払い落とす必要がある。"}, {"id": 111, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の維持・管理", "type": "single", "q": "集じん装置の維持管理に関する記述として、誤っているものはどれか。", "options": ["圧力損失は、低いほど装置の状態が良好といえる。", "圧力損失の監視は、異常の早期発見に有効である。", "ダクトからの空気の漏込みは、性能低下を招く。", "ホッパー内のダスト滞留は、閉塞の原因となる。", "処理ガス量の増加は、集じん率低下を招くことがある。"], "answer": [0], "explanation": "バグフィルターで圧力損失が異常に低い場合は、ろ布の破損や取付部からの漏れによりガスがろ過されずに素通りしている疑いがある。圧力損失は高すぎても低すぎても異常のサインであり、適正範囲での監視が求められる。"}, {"id": 112, "domain": "ばいじん・粉じん特論", "sub": "集じん装置の維持・管理", "type": "single", "q": "ろ過材(ろ布)に関する記述として、誤っているものはどれか。", "options": ["酸やアルカリに対する耐性も、選定条件となる。", "材質にかかわらず、耐熱温度は同一である。", "ガラス繊維は、比較的高温に耐える材質である。", "ポリエステルは、耐熱温度が比較的低い。", "使用条件に応じて、表面処理を施すことがある。"], "answer": [1], "explanation": "ろ布の耐熱温度は材質により大きく異なり、ポリエステルは130℃程度、ガラス繊維は250℃を超える使用にも耐える。処理ガスの温度・湿度・化学的性質に応じて材質を選定することが、バグフィルター設計の要点である。"}, {"id": 113, "domain": "ばいじん・粉じん特論", "sub": "粉じん発生施設と対策", "type": "single", "q": "一般粉じんの発生防止対策に関する記述として、誤っているものはどれか。", "options": ["破砕機では、散水により発じんを抑えることがある。", "防風壁の設置が、飛散防止に有効な場合がある。", "屋外の堆積場では、対策を要しないとされている。", "堆積場では、散水や防じんカバーが用いられる。", "コンベアでは、覆いや集じん装置が用いられる。"], "answer": [2], "explanation": "屋外の堆積場は風による飛散が起こりやすく、一般粉じん発生施設として構造・使用・管理の基準が課される。散水設備、防じんカバー、防風壁の設置などが具体的な措置として求められる。"}, {"id": 114, "domain": "ばいじん・粉じん特論", "sub": "粉じん発生施設と対策", "type": "single", "q": "石綿(アスベスト)に関する次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「石綿のうち、我が国で最も多く使用されたのは(ア)である。石綿は繊維状の(イ)であり、大気汚染防止法では(ウ)として規制されている。」", "options": ["(ア)クリソタイル　(イ)有機高分子　(ウ)特定粉じん", "(ア)クリソタイル　(イ)けい酸塩鉱物　(ウ)一般粉じん", "(ア)アモサイト　(イ)炭酸塩鉱物　(ウ)特定粉じん", "(ア)クリソタイル　(イ)けい酸塩鉱物　(ウ)特定粉じん", "(ア)クロシドライト　(イ)けい酸塩鉱物　(ウ)特定粉じん"], "answer": [3], "explanation": "石綿は天然の繊維状けい酸塩鉱物で、白石綿と呼ばれるクリソタイルが使用量の大半を占めた。ほかに青石綿のクロシドライト、茶石綿のアモサイトがある。大気汚染防止法では特定粉じんとして指定され、敷地境界における濃度基準が定められている。"}, {"id": 115, "domain": "ばいじん・粉じん特論", "sub": "粉じん発生施設と対策", "type": "single", "q": "石綿の繊維計数測定に関する記述として、誤っているものはどれか。", "options": ["位相差顕微鏡を用いて、繊維の本数を計数する。", "長さと幅の比(アスペクト比)により計数対象を判別する。", "交差する繊維の取扱いには、一定の規則がある。", "枝分かれした繊維の計数にも、規則が定められている。", "繊維の本数ではなく、質量濃度として求める方法である。"], "answer": [4], "explanation": "石綿の健康影響は繊維の本数と形状に依存するため、評価は質量濃度ではなく単位体積当たりの繊維本数(本/L)で行う。位相差顕微鏡により、長さ5µm以上でアスペクト比3以上といった規則に従って計数する。"}, {"id": 116, "domain": "ばいじん・粉じん特論", "sub": "ばいじん・粉じんの測定", "type": "single", "q": "ピトー管で測定した動圧が100 Pa、排ガスの密度が1.2 kg/m³であるときの流速として、最も近い値はどれか。", "options": ["12.9 m/s", "16.7 m/s", "25.8 m/s", "4.1 m/s", "8.3 m/s"], "answer": [0], "explanation": "動圧Pdと流速vの関係は Pd＝ρv²/2 であるから、v＝√(2Pd/ρ)＝√(2×100/1.2)＝√166.7＝12.9 m/s。実際のJIS測定ではピトー管係数を乗じるが、基本式はこの関係に基づく。"}, {"id": 117, "domain": "ばいじん・粉じん特論", "sub": "ばいじん・粉じんの測定", "type": "single", "q": "ばいじん濃度測定における等速吸引に関する次の記述中の(ア)(イ)に入る語句の組合せとして、正しいものはどれか。\n\n「吸引速度がダクト内の流速より小さいとき、慣性の大きい粗大粒子の割合は(ア)評価される。この誤差は、粒子径が大きいほど(イ)なる。」", "options": ["(ア)過大に　(イ)小さく", "(ア)過大に　(イ)大きく", "(ア)過小に　(イ)小さく", "(ア)過大に　(イ)変わらなく", "(ア)過小に　(イ)大きく"], "answer": [1], "explanation": "吸引速度が流速より小さいと、ノズル前方で気流が広がるのに対し慣性の大きい粗大粒子は直進してノズルに入るため、粗大粒子の割合が過大に評価される。慣性が大きい粒子ほど気流に追随しないので、誤差は粒子径が大きいほど大きくなる。等速吸引はこの偏りを避けるための操作である。"}, {"id": 118, "domain": "ばいじん・粉じん特論", "sub": "ばいじん・粉じんの測定", "type": "single", "q": "ばいじん濃度の測定に関する記述として、誤っているものはどれか。", "options": ["乾き排ガス量を求めて、濃度に換算する。", "測定に先立ち、流速分布を把握する必要がある。", "ろ紙は、捕集の前後で乾燥させる必要はない。", "円筒ろ紙や円形ろ紙を用いて、ばいじんを捕集する。", "捕集量は、ろ紙の質量差から求める。"], "answer": [2], "explanation": "ろ紙は吸湿するため、捕集の前後で規定条件により乾燥・恒量化してから秤量しなければ、水分による質量変化が測定値に混入してしまう。質量差で濃度を求める方法である以上、この前処理は不可欠である。"}, {"id": 119, "domain": "ばいじん・粉じん特論", "sub": "ばいじん・粉じんの測定", "type": "single", "q": "ばいじん濃度の測定位置に関する記述として、正しいものはどれか。", "options": ["ダクト断面の1点で測定すれば、代表値が得られる。", "流速分布の測定は、ばいじん測定には不要である。", "測定孔の位置は、作業性を基準に決めてよい。", "流れの乱れが少ない直管部から、測定位置を選ぶ。", "曲がりの直後は、代表性の高い測定位置である。"], "answer": [3], "explanation": "ばいじんは断面内で濃度も流速も一様ではないため、乱れの少ない直管部を選び、断面を複数の等面積区分に分けて各点で等速吸引を行う必要がある。曲がりや弁の直後は偏流や旋回が生じ、代表的な試料が得られない。"}, {"id": 120, "domain": "ばいじん・粉じん特論", "sub": "ばいじん・粉じんの測定", "type": "single", "q": "粒子径の測定・表示に関する記述として、正しいものはどれか。", "options": ["光散乱法では、粒子の質量を直接測定している。", "ふるい分け法は、サブミクロン粒子の測定に適する。", "粒径分布は、算術平均値だけで十分に表現できる。", "顕微鏡法では、粒子の形状を観察することはできない。", "空気力学的粒子径は、慣性や沈降の挙動を表すのに適する。"], "answer": [4], "explanation": "空気力学的粒子径は、同じ沈降速度をもつ密度1,000 kg/m³の球の直径として定義され、慣性衝突や沈降といった集じん機構を扱うのに適した表現である。ふるい分け法は数十µm以上が対象で、サブミクロン域には適用できない。"}, {"id": 121, "domain": "大規模大気特論", "sub": "拡散現象一般", "type": "single", "q": "大気中の乱流拡散に関する記述として、誤っているものはどれか。", "options": ["乱流拡散係数は、分子拡散係数とほぼ等しい。", "乱流拡散は、渦の運動による物質の混合現象である。", "乱流拡散係数は、分子拡散係数よりはるかに大きい。", "乱流の強さは、大気安定度によって変化する。", "不安定な大気では、鉛直方向の拡散が活発になる。"], "answer": [0], "explanation": "大気中の実際の拡散は、分子の熱運動による分子拡散ではなく渦による乱流拡散が支配的で、乱流拡散係数は分子拡散係数より数桁大きい。煙が短時間で大きく広がるのはこのためであり、両者を同程度とみなすことはできない。"}, {"id": 122, "domain": "大規模大気特論", "sub": "拡散現象一般", "type": "single", "q": "大気安定度と煙の拡散形態に関する記述として、誤っているものはどれか。", "options": ["中立に近いとき、煙は円錐状に広がる形態をとる。", "安定なとき、煙は最も激しく上下に拡散する。", "気温減率が乾燥断熱減率より大きいとき、大気は不安定である。", "不安定なとき、煙は大きく上下に波打つ形態をとる。", "安定なとき、煙は水平方向に薄く広がる形態をとる。"], "answer": [1], "explanation": "安定な大気では鉛直方向の運動が抑えられるため、煙は薄い層状に広がるファニング形となり、鉛直拡散はきわめて弱い。上下に激しく波打つルーピング形が現れるのは、日中の日射で地表が加熱された不安定な条件である。"}, {"id": 123, "domain": "大規模大気特論", "sub": "拡散現象一般", "type": "single", "q": "低層大気の対流と風に関する記述として、誤っているものはどれか。", "options": ["地表付近では、摩擦により風速が小さくなる。", "接地境界層では、高度とともに風速が増す傾向がある。", "地表面の粗度は、風速の鉛直分布に影響しない。", "日射による地表面の加熱は、自由対流を生じさせる。", "風速が大きいときは、機械的な乱流の寄与が大きくなる。"], "answer": [2], "explanation": "地表面の粗度が大きいほど摩擦の影響が上方まで及び、風速の鉛直分布(風速プロファイル)は緩やかになる。市街地と平坦な海面とで風速分布が異なるのはこのためで、拡散計算でも粗度は重要なパラメータとなる。"}, {"id": 124, "domain": "大規模大気特論", "sub": "拡散現象一般", "type": "single", "q": "濃度の平均化時間と拡散幅に関する記述として、誤っているものはどれか。", "options": ["煙軸の蛇行が、平均化時間による違いを生む要因となる。", "短時間平均では、瞬間的な高濃度が現れやすい。", "評価目的に応じて、適切な平均化時間を選ぶ必要がある。", "平均化時間を変えても、拡散幅は変化しない。", "平均化時間が長いほど、見かけの拡散幅は大きくなる。"], "answer": [3], "explanation": "平均化時間を長くとると、その間に煙軸が左右に蛇行した範囲全体が濃度分布に含まれるため、見かけの水平拡散幅は広がり、ピーク濃度は下がる。1時間値と日平均値で評価が異なるのはこの効果によるものである。"}, {"id": 125, "domain": "大規模大気特論", "sub": "拡散現象一般", "type": "single", "q": "大気安定度に関する次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「乾燥断熱減率はおよそ(ア)である。実際の気温減率がこれより大きいとき大気は(イ)であり、逆転層のように気温が高度とともに上昇する場合は(ウ)である。」", "options": ["(ア)1℃/100m　(イ)安定　(ウ)不安定", "(ア)0.1℃/100m　(イ)不安定　(ウ)強い安定", "(ア)10℃/100m　(イ)不安定　(ウ)強い安定", "(ア)1℃/1000m　(イ)安定　(ウ)強い安定", "(ア)1℃/100m　(イ)不安定　(ウ)強い安定"], "answer": [4], "explanation": "乾燥断熱減率は約0.98℃/100m、おおむね1℃/100mである。実際の気温減率がこれを上回れば持ち上げられた空気塊は周囲より軽くなり上昇を続けるため不安定、逆転層では逆に強く抑えられるため強い安定となる。"}, {"id": 126, "domain": "大規模大気特論", "sub": "拡散現象一般", "type": "single", "q": "逆転層と大気汚染に関する記述として、誤っているものはどれか。", "options": ["逆転層の下では、汚染物質の濃度が低下しやすい。", "接地逆転層は、夜間の放射冷却により形成される。", "沈降性逆転は、高気圧圏内の下降流により生じる。", "逆転層は、鉛直方向の拡散を抑える働きをする。", "フュミゲーションは、逆転層の消散時に起こりやすい。"], "answer": [0], "explanation": "逆転層は蓋のように働いて鉛直拡散を抑えるため、その下では汚染物質が滞留して濃度が上昇しやすい。朝方に接地逆転層が下から崩れると、上空に滞留していた煙が一気に地上へ降りてくるフュミゲーション(いぶし)が生じる。"}, {"id": 127, "domain": "大規模大気特論", "sub": "拡散現象一般", "type": "single", "q": "有効煙突高さに関する記述として、正しいものはどれか。", "options": ["実煙突高さによって決まり、排出条件には依存しない。", "実煙突高さと煙の上昇高さの和として表される。", "排出ガスの温度が高いほど、小さくなる。", "排出ガスの噴出速度が大きいほど、小さくなる。", "風速が大きいほど、煙の上昇高さは大きくなる。"], "answer": [1], "explanation": "有効煙突高さHeは、実煙突高さHsに煙上昇高さΔHを加えたものである。ΔHは噴出速度による運動量と、周囲空気との温度差による浮力で決まるため、ガス温度と噴出速度が大きいほど大きく、風速が大きいほど吹き流されて小さくなる。"}, {"id": 128, "domain": "大規模大気特論", "sub": "拡散現象一般", "type": "single", "q": "煙の上昇高さに影響する要因に関する記述として、誤っているものはどれか。", "options": ["風速が大きいほど、小さくなる傾向がある。", "大気が安定なほど、上昇は抑えられる傾向がある。", "排出ガスの量が増えても、上昇高さは変化しない。", "排出ガスの温度が高いほど、浮力により大きくなる。", "排出ガスの噴出速度が大きいほど、大きくなる。"], "answer": [2], "explanation": "排出ガス量が増えれば、運ばれる熱量(浮力)と運動量がともに増えるため、煙上昇高さは大きくなる。実際の推算式でも、排出ガス量と温度差の積で表される浮力フラックスが主要な変数となっている。"}, {"id": 129, "domain": "大規模大気特論", "sub": "拡散濃度の計算法", "type": "single", "q": "正規形プルームモデルに関する記述として、誤っているものはどれか。", "options": ["拡散幅σyとσzは、大気安定度と距離により定まる。", "地表面での反射を、鏡像法により考慮する。", "濃度は、風速に反比例する形で表される。", "拡散幅σyとσzは、距離によらず一定である。", "連続点源からの濃度分布を、正規分布で近似する。"], "answer": [3], "explanation": "拡散幅σy、σzは風下距離とともに増大し、その増え方は大気安定度に依存する。パスキル・ギフォード線図はこの関係を安定度階級ごとに与えたもので、距離によらず一定であればプルームは広がらないことになってしまう。"}, {"id": 130, "domain": "大規模大気特論", "sub": "拡散濃度の計算法", "type": "single", "q": "正規形プルーム式により、煙軸下の地表濃度を求める。排出量Q＝2 m³/s、風速u＝1.3 m/s、σy＝250 m、σz＝200 m、有効煙突高さHe＝200 mのときの濃度として、最も近い値はどれか。ただしexp(−0.5)＝0.61とする。", "options": ["12 ppm", "24 ppm", "0.6 ppm", "2.4 ppm", "5.9 ppm"], "answer": [4], "explanation": "地表濃度は C＝Q/(π u σy σz)×exp(−He²/(2σz²)) で求める。分母は π×1.3×250×200＝2.04×10⁵、Q/分母＝9.79×10⁻⁶。指数部はHe＝σzより−0.5となりexp(−0.5)＝0.61。9.79×10⁻⁶×0.61＝5.97×10⁻⁶、すなわち約5.9 ppmとなる。"}, {"id": 131, "domain": "大規模大気特論", "sub": "拡散濃度の計算法", "type": "single", "q": "プルームモデルにおいて、有効煙突高さを2倍にしたときの最大着地濃度は、もとの何倍になるか。ほかの条件は変わらないものとする。", "options": ["1/4倍", "1/8倍", "2倍", "4倍", "1/2倍"], "answer": [0], "explanation": "最大着地濃度は有効煙突高さの2乗に反比例するため、Heを2倍にすると1/4になる。煙突を高くすることが地表濃度の低減に大きく効くのはこのためで、K値規制が排出口高さの2乗で許容排出量を定めているのも同じ関係に基づく。"}, {"id": 132, "domain": "大規模大気特論", "sub": "拡散濃度の計算法", "type": "single", "q": "最大着地濃度に関する記述として、誤っているものはどれか。", "options": ["最大着地濃度が現れる距離は、大気安定度により変わる。", "有効煙突高さに比例して大きくなる。", "風速に反比例する形で表される。", "有効煙突高さの2乗に反比例する。", "排出量に比例して大きくなる。"], "answer": [1], "explanation": "最大着地濃度は有効煙突高さの2乗に反比例するのであって、比例するのではない。煙源が高いほど地表に届くまでに拡散が進み、着地濃度は急激に小さくなる。この関係が煙突高さ設計の基本的な根拠となっている。"}, {"id": 133, "domain": "大規模大気特論", "sub": "拡散濃度の計算法", "type": "single", "q": "風速が2倍、有効煙突高さが2倍になったときの最大着地濃度は、もとの何倍になるか。ほかの条件は変わらないものとする。", "options": ["1/2倍", "1/4倍", "1/8倍", "1/16倍", "変わらない"], "answer": [2], "explanation": "最大着地濃度は風速に反比例し、有効煙突高さの2乗に反比例する。風速2倍で1/2、有効煙突高さ2倍で1/4となるから、両者を合わせて1/2×1/4＝1/8倍となる。強風時に着地濃度が下がる一方、無風に近い条件で高濃度が生じやすいのはこの関係による。"}, {"id": 134, "domain": "大規模大気特論", "sub": "拡散濃度の計算法", "type": "single", "q": "拡散式に関する次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「連続的に排出される煙の拡散には(ア)モデルが用いられ、瞬間的な放出には(イ)モデルが用いられる。地形が複雑で流れ場が一様でない場合には、(ウ)モデルが用いられることがある。」", "options": ["(ア)プルーム　(イ)格子　(ウ)パフ", "(ア)プルーム　(イ)パフ　(ウ)ボックス", "(ア)格子　(イ)パフ　(ウ)プルーム", "(ア)プルーム　(イ)パフ　(ウ)格子", "(ア)パフ　(イ)プルーム　(ウ)格子"], "answer": [3], "explanation": "連続点源の定常的な拡散にはプルームモデル、瞬間放出や無風時にはパフモデルを用いる。いずれも解析解であり、地形や風の場が複雑で解析解が成り立たない場合には、空間を格子に分割して拡散方程式を数値的に解く格子モデルが使われる。"}, {"id": 135, "domain": "大規模大気特論", "sub": "拡散濃度の計算法", "type": "single", "q": "パフモデルに関する記述として、正しいものはどれか。", "options": ["連続点源からの定常的な拡散に限って適用される。", "風速がゼロに近い条件では、適用できない。", "拡散幅を考慮しない点が、プルームモデルとの違いである。", "地形の影響を厳密に取り扱えることが特徴である。", "瞬間的に放出された煙塊の拡散を扱うモデルである。"], "answer": [4], "explanation": "パフモデルは瞬間放出された煙塊(パフ)が移流しながら三次元的に拡散していく過程を扱う。プルームモデルは風速で割る形になるため無風・弱風時には発散してしまうが、パフモデルはそうした条件にも適用できる利点がある。"}, {"id": 136, "domain": "大規模大気特論", "sub": "拡散濃度の計算法", "type": "single", "q": "長期平均濃度の予測に関する記述として、誤っているものはどれか。", "options": ["短期の最大濃度をそのまま年平均値として用いる。", "風向を16方位などに区分して集計する方法がある。", "各方位の出現頻度を重みとして、濃度を合成する。", "風速階級と安定度階級を組み合わせて集計する。", "年間の気象データを用いることが一般的である。"], "answer": [0], "explanation": "短期の最大濃度は特定の気象条件下で生じる値であり、年間を通じて継続するものではない。長期平均濃度は、風向・風速・安定度の各階級の出現頻度で重みづけして合成することにより求める。"}, {"id": 137, "domain": "大規模大気特論", "sub": "大気環境濃度の予測手法", "type": "single", "q": "大気環境影響評価における拡散計算に関する記述として、誤っているものはどれか。", "options": ["地形の影響を受ける場合は、風洞実験を行うこともある。", "拡散計算の結果は、実測との照合を要しない。", "現況の気象観測データが、計算の基礎資料となる。", "既存発生源の寄与を、あわせて考慮する必要がある。", "予測結果は、環境基準との対比により評価される。"], "answer": [1], "explanation": "拡散計算はモデルによる推定であり、パラメータの選び方や地形の扱いにより結果が変わるため、可能な範囲で実測値と照合して妥当性を確認する検証作業が欠かせない。照合を経ずに結果を確定的なものとして扱うことはできない。"}, {"id": 138, "domain": "大規模大気特論", "sub": "大気環境濃度の予測手法", "type": "single", "q": "大気拡散の実験的手法に関する記述として、正しいものはどれか。", "options": ["室内実験の結果は、そのまま実大気に適用できる。", "実験的手法は、数値計算に完全に置き換えられている。", "風洞実験は、複雑地形での拡散把握に用いられる。", "野外トレーサー実験は、実施が容易で費用も安い。", "風洞実験では、相似則を考慮する必要はない。"], "answer": [2], "explanation": "山地や建物が近接するなど解析解では扱いにくい条件では、縮尺模型を用いた風洞実験が有効である。ただし実大気との相似則(幾何学的・力学的・熱的相似)を満たす必要があり、結果をそのまま適用できるわけではない。"}, {"id": 139, "domain": "大規模大気特論", "sub": "大気環境濃度の予測手法", "type": "single", "q": "拡散幅σy、σzの求め方に関する記述として、誤っているものはどれか。", "options": ["パスキル・ギフォード線図が、代表的な資料である。", "安定度階級は、日射量や風速などから判定される。", "不安定なほど、拡散幅は大きくなる傾向がある。", "拡散幅は、排出源の高さによって決まる量である。", "大気安定度階級ごとに、風下距離の関数として与えられる。"], "answer": [3], "explanation": "拡散幅は大気安定度と風下距離によって決まる量であり、排出源の高さで定まるものではない。安定度階級は日射量・雲量・風速などから判定され、階級ごとに距離との関係が線図や近似式として整理されている。"}, {"id": 140, "domain": "大規模大気特論", "sub": "大気環境濃度の予測手法", "type": "single", "q": "拡散モデルの適用に関する記述として、誤っているものはどれか。", "options": ["平坦地では、正規形プルームモデルが適用しやすい。", "海陸風がある地域では、風向の日変化に留意する。", "逆転層が存在する場合、その影響を考慮する。", "建物の影響が大きい場合、ダウンウォッシュを考慮する。", "どのような地形でも、同一のモデルで十分に扱える。"], "answer": [4], "explanation": "正規形プルームモデルは平坦で一様な流れ場を前提としており、複雑地形や海陸風、建物によるダウンウォッシュが効く条件ではそのままでは適用できない。条件に応じてモデルを選び直すか、風洞実験や数値モデルで補う必要がある。"}, {"id": 141, "domain": "大規模大気特論", "sub": "大気環境濃度の予測手法", "type": "single", "q": "拡散計算に関する次の記述中の(ア)(イ)に入る語句の組合せとして、正しいものはどれか。\n\n「正規形プルーム式では、地表面を完全反射面とみなす(ア)を用いて地表濃度を求める。また煙軸下の地表濃度は、有効煙突高さHeとσzの比により定まる(イ)の項を含む。」", "options": ["(ア)鏡像法　(イ)指数関数", "(ア)鏡像法　(イ)対数関数", "(ア)差分法　(イ)指数関数", "(ア)重ね合わせ法　(イ)三角関数", "(ア)鏡像法　(イ)一次関数"], "answer": [0], "explanation": "地表面で汚染物質が消滅せず跳ね返ると考える扱いを鏡像法といい、地表面に対して対称な位置に仮想の煙源を置いて濃度を重ね合わせる。地表濃度にはexp(−He²/(2σz²))という指数関数の項が現れ、Heとσzの比で急激に変化する。"}, {"id": 142, "domain": "大規模大気特論", "sub": "大規模設備の大気汚染防止対策", "type": "single", "q": "微粉炭火力発電所の排煙処理設備の一般的な配置順序として、正しいものはどれか。", "options": ["電気集じん装置 → 脱硝装置 → 脱硫装置", "脱硝装置 → 電気集じん装置 → 脱硫装置", "脱硫装置 → 脱硝装置 → 電気集じん装置", "電気集じん装置 → 脱硫装置 → 脱硝装置", "脱硫装置 → 電気集じん装置 → 脱硝装置"], "answer": [1], "explanation": "脱硝装置は触媒が働く300～400℃の高温域に置く必要があるため最上流に配置し、次いで温度が下がった位置で電気集じん装置によりばいじんを除去し、最後に湿式脱硫装置で硫黄酸化物を除く。温度条件が配置順序を決めている点が要点である。"}, {"id": 143, "domain": "大規模大気特論", "sub": "大規模設備の大気汚染防止対策", "type": "single", "q": "低低温形電気集じん装置に関する記述として、誤っているものはどれか。", "options": ["三酸化硫黄が凝縮し、後段の負荷が軽減される。", "低硫黄炭でも、高い集じん性能が得られやすい。", "ガス温度を高く保つほど、集じん率は向上する。", "ガス温度を酸露点付近まで下げて運転する方式である。", "ダストの電気抵抗率が下がり、集じん率が向上する。"], "answer": [2], "explanation": "低低温形は、ガス温度を90～100℃程度まで下げることで硫酸ミストをダストに凝縮させ、電気抵抗率を下げて逆電離を防ぐ方式である。温度を高く保つ従来形とは設計思想が逆であり、高温ほど良いというものではない。"}, {"id": 144, "domain": "大規模大気特論", "sub": "大規模設備の大気汚染防止対策", "type": "single", "q": "排煙処理設備のガスガスヒーター(GGH)に関する記述として、正しいものはどれか。", "options": ["外部燃料を燃焼させて、排ガスを加熱する装置である。", "設置すると、煙突からの拡散はかえって悪化する。", "脱硝装置の触媒温度を下げるために用いられる。", "脱硫後の低温ガスを再加熱し、白煙の発生を防ぐ。", "脱硫塔の入口で、ガスを冷却する目的で用いられる。"], "answer": [3], "explanation": "GGHは脱硫塔入口の高温ガスから熱を回収し、その熱で脱硫後の低温・飽和状態のガスを再加熱する熱交換器である。外部燃料を使わずに排ガス温度を上げることで、白煙防止と煙の上昇高さ確保の両方に寄与する。"}, {"id": 145, "domain": "大規模大気特論", "sub": "大規模設備の大気汚染防止対策", "type": "single", "q": "廃棄物焼却施設から排出される物質に関する次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「塩化ビニルなどの塩素を含む廃棄物の燃焼により(ア)が生じる。また、燃焼条件によっては(イ)が生成し、その低減には急冷や(ウ)の吹込みが有効である。」", "options": ["(ア)硫化水素　(イ)ダイオキシン類　(ウ)活性炭", "(ア)塩化水素　(イ)ダイオキシン類　(ウ)石灰石", "(ア)塩化水素　(イ)アンモニア　(ウ)活性炭", "(ア)塩化水素　(イ)ダイオキシン類　(ウ)尿素", "(ア)塩化水素　(イ)ダイオキシン類　(ウ)活性炭"], "answer": [4], "explanation": "塩素分は燃焼により塩化水素となり、消石灰の吹込みや湿式洗浄で除去する。ダイオキシン類は300℃付近での再合成が問題となるため、排ガスの急冷により滞留時間を短くし、活性炭や活性コークスの吹込みとバグフィルターの組合せで吸着除去する。"}, {"id": 146, "domain": "大規模大気特論", "sub": "大規模設備の大気汚染防止対策", "type": "single", "q": "廃棄物焼却施設の排ガス対策に関する記述として、誤っているものはどれか。", "options": ["ダイオキシン類は、300℃付近での滞留により減少する。", "塩化水素は、消石灰の吹込みにより除去できる。", "ダイオキシン類は、活性炭の吹込みにより吸着除去できる。", "水銀の除去にも、活性炭が用いられることがある。", "ばいじんの除去には、バグフィルターが用いられる。"], "answer": [0], "explanation": "300℃付近はダイオキシン類が再合成されやすい温度域であり、この温度で長く滞留させることは生成を促してしまう。対策はむしろ逆で、高温域から一気に200℃以下まで急冷して再合成の機会を与えないことが基本となる。"}, {"id": 147, "domain": "大規模大気特論", "sub": "大規模設備の大気汚染防止対策", "type": "single", "q": "製鉄所における大気汚染防止対策に関する記述として、誤っているものはどれか。", "options": ["原料ヤードでは、散水や防風壁が用いられる。", "製鉄所の排ガスには、集じん装置を要しない。", "焼結炉の排ガスには、硫黄酸化物や窒素酸化物が含まれる。", "コークス炉は、一般粉じん発生施設に該当する。", "転炉の排ガス処理には、集じん装置が用いられる。"], "answer": [1], "explanation": "焼結炉、転炉、電気炉などは多量のばいじんを発生する代表的な施設であり、電気集じん装置やバグフィルターが不可欠である。原料ヤードやコークス炉からの粉じん飛散対策とあわせ、製鉄所は多面的な対策を要する事業場である。"}, {"id": 148, "domain": "大規模大気特論", "sub": "大規模設備の大気汚染防止対策", "type": "single", "q": "セメント製造施設の大気汚染防止対策に関する記述として、誤っているものはどれか。", "options": ["原料中の成分により、窒素酸化物が生じる。", "捕集したダストは、原料として再利用されることがある。", "原料や製品の輸送過程では、粉じんは発生しない。", "キルンからの排ガスには、多量のばいじんが含まれる。", "集じんには、電気集じん装置やバグフィルターを用いる。"], "answer": [2], "explanation": "原料や製品であるクリンカ・セメントの搬送、貯蔵、積出しの各過程は粉じんの発生源であり、密閉化、集じん装置、散水などの対策が必要となる。実際、コンベアや堆積場は一般粉じん発生施設として規制の対象である。"}, {"id": 149, "domain": "大規模大気特論", "sub": "大規模設備の大気汚染防止対策", "type": "single", "q": "大規模設備における硫黄酸化物対策に関する記述として、誤っているものはどれか。", "options": ["排煙脱硫装置の設置が、代表的な対策である。", "石油精製では、脱硫した燃料油が供給される。", "流動層燃焼では、炉内脱硫が可能である。", "煙突を高くすれば、排出量そのものが減少する。", "低硫黄燃料への転換が、有効な対策となる。"], "answer": [3], "explanation": "煙突を高くすると地表濃度は下がるが、排出される硫黄酸化物の総量は変わらない。かつては高煙突化が広く行われたが、広域汚染や越境汚染の問題を招いたため、現在は総量規制と脱硫による排出量そのものの削減が対策の中心である。"}, {"id": 150, "domain": "大規模大気特論", "sub": "大規模設備の大気汚染防止対策", "type": "single", "q": "大規模設備の大気汚染防止対策に関する記述として、正しいものはどれか。", "options": ["個別施設の基準を守れば、地域の環境基準も達成される。", "高煙突化は、現在も排出削減の中心的手法である。", "拡散計算は、設備計画の段階では不要である。", "脱硫と脱硝は、同一の装置で同時に処理される。", "総量規制は、地域全体の排出量を抑える仕組みである。"], "answer": [4], "explanation": "施設ごとの排出基準を守っても、多数の発生源が集中する地域では環境基準が達成されないことがある。この積み上がりに対応するのが総量規制であり、地域全体の排出総量に上限を設ける考え方に立っている。設備計画では拡散計算による事前評価が欠かせない。"}, {"id": 151, "domain": "大気有害物質特論", "sub": "有害物質の発生過程", "type": "single", "q": "カドミウム及びその化合物に関する記述として、誤っているものはどれか。", "options": ["沸点は約1800℃と高く、製錬時の温度域では蒸気になりにくい。", "銅、鉛、亜鉛の製錬施設は、主要な排出施設として位置づけられている。", "亜鉛の製錬工程において、副生成物として回収されることが多い。", "硫化カドミウムは、古くから黄色系の顔料として利用されてきた。", "融点は約321℃であり、鉛の融点よりわずかに低い。"], "answer": [0], "explanation": "カドミウムの沸点は約765℃であり、金属としては低い部類に入る。このため製錬炉の温度域では容易に蒸気となり、冷却されて微細なヒュームとして排ガス中に移行する。この揮発しやすさこそがカドミウム対策の要点であり、「蒸気になりにくい」という記述は事実と逆である。なお融点は約321℃で、鉛(約327.5℃)よりわずかに低い。"}, {"id": 152, "domain": "大気有害物質特論", "sub": "有害物質の発生過程", "type": "single", "q": "有害物質とその主な発生施設の組合せとして、誤っているものはどれか。", "options": ["カドミウム ── 亜鉛の製錬施設", "塩素 ── アルミニウムの電解製錬施設", "ふっ素化合物 ── 湿式りん酸製造施設", "ふっ素化合物 ── ガラス製造施設", "塩化水素 ── 廃棄物焼却施設"], "answer": [1], "explanation": "アルミニウムの電解製錬では、電解浴に氷晶石(Na3AlF6)などのふっ化物を用いるため、排ガス中で問題となるのはふっ素化合物であり、塩素ではない。塩素が問題となるのは塩素製造施設や金属塩化物の製造施設などである。なおガラス製造では融剤として蛍石(CaF2)を用い、湿式りん酸製造ではりん鉱石中のふっ素が放出されるため、いずれもふっ素化合物が対象となる。"}, {"id": 153, "domain": "大気有害物質特論", "sub": "有害物質の発生過程", "type": "single", "q": "ふっ素化合物に関する記述として、誤っているものはどれか。", "options": ["ふっ化水素は水に極めてよく溶け、その水溶液はガラスを侵す性質をもつ。", "ふっ化水素は弱酸に分類されるが、金属や耐火物に対する腐食性が強い。", "四ふっ化けい素は水にほとんど溶けず、水洗による除去は期待できない。", "湿式りん酸の製造工程では、りん鉱石に含まれるふっ素が排ガス中に移行する。", "水酸化カルシウムを用いると、ふっ化カルシウムとして固定・除去できる。"], "answer": [2], "explanation": "四ふっ化けい素(SiF4)は水と速やかに反応してヘキサフルオロけい酸(H2SiF6)と二酸化けい素(SiO2)を生成するため、水吸収による除去が有効である。したがって「水洗による除去は期待できない」は誤り。ただし生成した二酸化けい素がスケールとなって装置を閉塞させるため、実際の運転ではその対策が課題となる。"}, {"id": 154, "domain": "大気有害物質特論", "sub": "有害物質の発生過程", "type": "single", "q": "塩素及び塩化水素の性質に関する記述として、正しいものはどれか。", "options": ["塩素は空気より軽く、漏えい時には上方へ拡散しやすい。", "塩化水素は常温では無臭であり、漏えいの早期発見が難しい。", "塩素は水酸化ナトリウム水溶液とは反応せず、アルカリ吸収は適用できない。", "塩素は黄緑色の刺激臭をもつ気体であり、水への溶解度は塩化水素より小さい。", "塩化水素は水に溶けにくいため、水吸収による処理には適さない。"], "answer": [3], "explanation": "塩素は黄緑色で刺激臭のある気体であり、水への溶解度は塩化水素に比べてはるかに小さい。塩化水素は水に極めてよく溶けるため水吸収が有効であり、「水に溶けにくい」とする記述は誤り。塩素は空気より重く低所に滞留するため「空気より軽い」も誤り。塩化水素は強い刺激臭をもつので「無臭」も誤り。また塩素はアルカリと反応して次亜塩素酸塩と塩化物を生じるため、アルカリ吸収は有効である。"}, {"id": 155, "domain": "大気有害物質特論", "sub": "有害物質の発生過程", "type": "single", "q": "大気汚染防止法において、事故時の措置の対象となる特定物質に該当しないものはどれか。", "options": ["シアン化水素", "ホスゲン", "アンモニア", "ホルムアルデヒド", "二酸化炭素"], "answer": [4], "explanation": "特定物質は、事故時に人の健康又は生活環境に係る被害を生ずるおそれのある物質として政令で定められているもので、アンモニア、ホルムアルデヒド、シアン化水素、ホスゲンなどが指定されている。二酸化炭素は地球温暖化の原因物質ではあるが、急性の被害を想定した特定物質には含まれていない。"}, {"id": 156, "domain": "大気有害物質特論", "sub": "有害物質の発生過程", "type": "single", "q": "鉛及びその化合物に関する記述として、誤っているものはどれか。", "options": ["鉛はカドミウムより沸点が低く、製錬時にはカドミウムより先に揮発する。", "鉛の融点は約327℃であり、比較的低温で溶融する。", "酸化鉛(II)はリサージとも呼ばれ、ガラスや顔料の原料に用いられる。", "鉛蓄電池の製造工程は、鉛を含む粉じんの発生源となる。", "製錬排ガス中の鉛は、蒸気が冷却されて生じた微細粒子として存在することが多い。"], "answer": [0], "explanation": "鉛の沸点は約1750℃、カドミウムの沸点は約765℃であり、先に揮発するのはカドミウムである。この揮発性の差は、製錬排ガス中で両者の挙動が異なる理由でもある。なお鉛の融点は約327℃、酸化鉛(II)(PbO)はリサージ(密陀僧)と呼ばれる。"}, {"id": 157, "domain": "大気有害物質特論", "sub": "有害物質の発生過程", "type": "single", "q": "常温・常圧における特定物質の性状に関する記述として、誤っているものはどれか。", "options": ["硫酸は、不揮発性の液体である。", "黄りんは、無臭の気体である。", "アンモニアは、特有の刺激臭をもつ気体である。", "ホルムアルデヒドは、刺激臭をもつ気体である。", "フェノールは、特異臭をもつ固体である。"], "answer": [1], "explanation": "黄りん(白りん)は常温で固体であり、空気中で自然発火する性質をもつため水中で保管される。気体ではない。フェノールは常温で固体(融点約41℃)、硫酸は不揮発性の液体、アンモニアとホルムアルデヒドは刺激臭のある気体である。"}, {"id": 158, "domain": "大気有害物質特論", "sub": "ガス吸収", "type": "single", "q": "ガス吸収装置に関する記述として、誤っているものはどれか。", "options": ["ぬれ壁塔は、液を管壁に沿って液膜状に流下させる構造である。", "サイクロンスクラバーは、ガスを旋回上昇させ、噴霧液滴との接触を図る。", "ベンチュリスクラバーは、圧力損失が小さく、微細粒子の捕集には適さない。", "スプレー塔は、圧力損失が比較的小さく、ダストによる閉塞が起こりにくい。", "段塔は、棚段上の液層にガスを分散させて接触させる構造である。"], "answer": [2], "explanation": "ベンチュリスクラバーは、スロート部で高速となったガス流に液を噴射して微細な液滴を生成させ、慣性衝突により微細粒子を高効率で捕集する装置である。その代わり圧力損失は非常に大きい。「圧力損失が小さく微細粒子に適さない」は事実と逆である。"}, {"id": 159, "domain": "大気有害物質特論", "sub": "ガス吸収", "type": "single", "q": "ガス吸収における物質移動の律速に関する記述として、誤っているものはどれか。", "options": ["溶解度の大きいガスの吸収は、ガス側境膜抵抗が支配的となる。", "溶解度の小さいガスの吸収は、液側境膜抵抗が支配的となる。", "塩化水素やアンモニアの水への吸収は、ガス側境膜抵抗が支配的である。", "ふっ化水素の水への吸収は、液側境膜抵抗が支配的である。", "液側境膜抵抗が支配的な場合、液の乱れを大きくすることが吸収促進に有効である。"], "answer": [3], "explanation": "ふっ化水素は水に極めてよく溶ける(溶解度が大きい)ガスであるため、その吸収はガス側境膜抵抗が支配的となる。液側境膜抵抗が支配的になるのは、二酸化炭素や酸素、一酸化窒素のように溶解度の小さいガスである。溶解度の大小と律速側の対応は、この分野で繰り返し問われる要点である。"}, {"id": 160, "domain": "大気有害物質特論", "sub": "ガス吸収", "type": "single", "q": "ベンチュリスクラバーに関する記述として、誤っているものはどれか。", "options": ["後段に気液分離器(ミストセパレーター)を設ける必要がある。", "スロート部でガス流速を高め、噴射した液を微細化して接触させる。", "圧力損失が大きく、動力費が高くなる傾向がある。", "微細な粒子に対しても高い捕集効率が得られる。", "スロート部のガス流速を下げるほど、捕集効率は高くなる。"], "answer": [4], "explanation": "ベンチュリスクラバーの捕集効率は、スロート部のガス流速が高いほど液滴が微細化され、また液滴と粒子の相対速度も大きくなるため向上する。流速を下げれば効率は低下する。ただし流速の上昇は圧力損失の増大を伴うため、実際の運転条件は効率と動力費のバランスで決まる。"}, {"id": 161, "domain": "大気有害物質特論", "sub": "ガス吸収", "type": "single", "q": "充塡塔に関する記述として、正しいものはどれか。", "options": ["単位容積当たりの気液接触面積が大きく、吸収効率が高い。", "ダストを多く含む排ガスの処理に最も適した方式である。", "液の供給を停止しても、吸収性能はほとんど低下しない。", "圧力損失は、ベンチュリスクラバーより大きいのが一般的である。", "充塡物の材質は、耐食性の高い金属製のものに限られる。"], "answer": [0], "explanation": "充塡塔は充塡物により気液接触面積を大きく確保できるため、吸収効率が高い。一方、充塡層はダストにより閉塞しやすいのでダスト濃度の高い排ガスには適さず、液の供給が止まれば充塡物が濡れないため吸収は成立しない。圧力損失はベンチュリスクラバーより小さく、充塡物にはセラミックスやプラスチックも広く用いられる。"}, {"id": 162, "domain": "大気有害物質特論", "sub": "ガス吸収", "type": "single", "q": "排ガス中の有害物質と、その吸収に用いる薬剤の組合せとして、誤っているものはどれか。", "options": ["ふっ化水素 ── 水酸化カルシウムスラリー", "アンモニア ── 水酸化ナトリウム水溶液", "二酸化硫黄 ── 炭酸ナトリウム水溶液", "塩化水素 ── 水酸化ナトリウム水溶液", "塩素 ── 水酸化ナトリウム水溶液"], "answer": [1], "explanation": "アンモニアはアルカリ性のガスであるため、アルカリである水酸化ナトリウム水溶液では吸収できない。硫酸などの酸性溶液を用いるのが適切である。他の選択肢はいずれも酸性ガスをアルカリで中和吸収する組合せであり、正しい。酸性ガスとアルカリ性ガスの取り違えは頻出の出題パターンである。"}, {"id": 163, "domain": "大気有害物質特論", "sub": "ガス吸収", "type": "single", "q": "段塔(棚段塔)に関する記述として、誤っているものはどれか。", "options": ["ガス流量が過小になると、液が孔から落下する漏液が生じやすい。", "ガス流量が過大になると、液が上段へ持ち去られるフラッディングが生じる。", "圧力損失は段数によらず一定であり、段数を増やしても増加しない。", "泡鐘トレイや多孔板トレイなどが用いられる。", "各段で気液が接触し、段数を増やすことで吸収効率を高められる。"], "answer": [2], "explanation": "段塔の圧力損失は各段での気液接触に伴う損失の積み重ねであるため、段数を増やせばほぼ比例して増大する。段数の増加は吸収効率の向上と引き換えに圧力損失(動力費)の増加を招くという関係にある。"}, {"id": 164, "domain": "大気有害物質特論", "sub": "ガス吸着", "type": "single", "q": "ガス吸着に関する記述として、誤っているものはどれか。", "options": ["ラングミュアの式は、単分子層の形
