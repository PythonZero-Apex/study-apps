 "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "イオンクロマトグラフによる排ガス中成分の濃度測定に関する次の記述のうち、正しいものはどれか。", "options": ["イオンクロマトグラフ法は、試料中のイオン成分を分離カラムで分離し、検出器で定量する分析法である。", "イオンクロマトグラフ法は、気体成分を直接、前処理なしに導入して分析する方法である。", "イオンクロマトグラフ法は、陽イオンの分析にのみ用いられ、陰イオンには使用できない。", "イオンクロマトグラフ法では、検量線の作成は不要である。", "イオンクロマトグラフ法は、窒素酸化物の自動連続計測にのみ用いられる方式である。"], "answer": [0], "explanation": "正しいのは(1)です。イオンクロマトグラフ法は、試料溶液中のイオン成分（塩化物イオン、硫酸イオン等）を分離カラムで分離し、電気伝導度検出器等で定量する分析法です。排ガス中の対象成分をまず吸収液に吸収させ、イオンとして分析するのが一般的です。"}, {"id": 344, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "排ガス自動計測器の校正（ゼロ校正・スパン校正）に関する次の記述のうち、誤っているものはどれか。", "options": ["ゼロ校正は、既知の濃度がゼロ（またはそれに近い）標準ガス等を用いて計測器の基準点を確認する作業である。", "スパン校正は、既知の高濃度標準ガス等を用いて計測器の感度（目盛り）を確認・調整する作業である。", "校正は、計測器の測定精度を維持するために定期的に実施することが望ましい。", "自動計測器は、一度校正すれば、その後永続的に校正が不要になる。", "校正の頻度や方法は、対象物質や計測器の種類によって異なる場合がある。"], "answer": [3], "explanation": "誤っているのは(4)です。自動計測器は経時的なドリフト（感度変化）等が生じうるため、定期的な校正が必要であり、「永続的に校正が不要」というのは誤りです。"}, {"id": 345, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "排ガス中の硫黄酸化物の（手）分析に関する次の記述のうち、正しいものはどれか。", "options": ["排ガス中のいおう酸化物は、吸収液に吸収させた後、滴定法や比色法等により定量することができる。", "いおう酸化物の分析には、いかなる化学分析法も存在しない。", "いおう酸化物の分析結果は、排出基準の遵守状況確認には利用されない。", "いおう酸化物の分析は、常に自動計測器のみで行われ、手分析法は用いられない。", "いおう酸化物の分析には、必ず放射性物質を用いる必要がある。"], "answer": [0], "explanation": "正しいのは(1)です。排ガス中のいおう酸化物は、専用の吸収液（過酸化水素水等）に吸収させたのち、中和滴定法や比色法（イオンクロマトグラフ法を含む）等により定量する化学分析（手分析）が行われることがあります。"}, {"id": 346, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "排ガス自動計測器の設置・維持管理に関する次の記述のうち、正しいものはどれか。", "options": ["大気汚染防止法の総量規制等の対象となる大規模な排出施設では、排ガス濃度の自動計測器の設置が求められる場合がある。", "自動計測器の設置は、いかなる施設にも法令上求められていない。", "自動計測器のデータは、行政への報告や排出基準の遵守状況の確認には一切利用されない。", "自動計測器は、設置後の点検・保守が一切不要な機器である。", "自動計測器の記録データは、いかなる場合も保存・記録する必要がない。"], "answer": [0], "explanation": "正しいのは(1)です。総量規制の対象となる大規模な工場・事業場等では、いおう酸化物・窒素酸化物等の排出濃度を継続的に把握するための自動計測器の設置が求められる場合があります。データは行政への報告や自主管理にも活用されます。"}, {"id": 347, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "紫外線吸収方式による二酸化硫黄自動計測器の測定原理に関する次の記述のうち、正しいものはどれか。", "options": ["二酸化硫黄が特定の紫外線波長を吸収する度合い（吸光度）から濃度を算出する。", "二酸化硫黄が発する蛍光の強さから濃度を算出する方式であり、紫外線の吸収は測定に利用しない。", "紫外線吸収方式は、二酸化硫黄以外のあらゆるガス成分にも全く同じ較正係数で適用できる。", "紫外線吸収方式による測定は、試料ガス中の水分やダストの影響を一切受けない。", "紫外線吸収方式は、可視光領域の光のみを利用する方式である。"], "answer": [0], "explanation": "正しいのは(1)です。紫外線吸収方式は、対象ガス（二酸化硫黄）が特定の紫外線波長を吸収する性質を利用し、その吸光度から濃度を算出する測定原理です（紫外線蛍光法という別方式では蛍光強度を利用しますが、本設問の「吸収方式」は吸光度を利用する方式です）。"}, {"id": 348, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "排ガス中の窒素酸化物の分析における妨害物質の影響に関する次の記述のうち、正しいものはどれか。", "options": ["水分や共存ガス成分が、窒素酸化物の測定値に妨害（干渉）を与える場合があり、必要に応じて除湿や補正が行われる。", "窒素酸化物の測定は、いかなる共存成分の影響も受けない。", "妨害物質の影響を除去する処理は、測定精度には無関係である。", "水分の存在は、窒素酸化物の測定精度には一切影響しない。", "妨害物質対策は、化学発光方式にのみ必要で、赤外線吸収方式には不要である。"], "answer": [0], "explanation": "正しいのは(1)です。排ガス中の水分や共存ガス成分（CO2等）は、測定方式によっては妨害（干渉）要因となりうるため、除湿装置の設置や補正計算等の対策が講じられることがあります。これはどの測定方式にも共通しうる留意点です。"}, {"id": 349, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "排ガス自動計測データの活用に関する次の記述のうち、誤っているものはどれか。", "options": ["自動計測データは、排出基準の遵守状況を継続的に確認する手段として活用される。", "自動計測データは、燃焼管理や脱硫・脱硝装置の運転調整の参考としても活用されることがある。", "自動計測データの異常値は、設備の不具合の早期発見につながることがある。", "自動計測データは、いかなる目的にも一切活用されず、記録するだけの無意味なデータである。", "自動計測データの保存・管理体制は、事業者の環境管理体制の一部として位置づけられる。"], "answer": [3], "explanation": "誤っているのは(4)です。自動計測データは、排出基準遵守の確認、運転管理、異常の早期発見など多岐にわたって活用される重要なデータであり、「一切活用されない」は誤りです。"}, {"id": 350, "domain": "大気特論", "sub": "排ガス自動計測", "type": "single", "q": "排ガス自動計測器の測定原理のまとめとして、次のa〜dの組合せのうち、正しいものの組合せはどれか。\na　紫外線吸収方式　―　二酸化硫黄の測定に用いられることがある\nb　化学発光方式　―　窒素酸化物の測定に用いられることがある\nc　非分散形赤外線分析計（NDIR）　―　一酸化炭素や二酸化炭素の測定に用いられることがある\nd　これらの測定原理は、いずれも互いに完全に同一であり、区別する意味がない", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい組合せです。dは誤り（各測定原理は対象ガスの物理・化学的性質に応じて異なる仕組みを利用しており、「完全に同一」ではありません）。"}, {"id": 351, "domain": "ばいじん・粉じん特論", "sub": "粒子基礎_重力慣性集じん", "type": "single", "q": "ダストの粒子径及び粒子径分布に関する次の記述のうち、誤っているものはどれか。", "options": ["ダストの粒子径は、実際には均一ではなく、ある分布（粒子径分布）を持つのが一般的である。", "粒子径分布を表す方法として、対数正規分布による近似がしばしば用いられる。", "集じん装置の集じん効率は、対象となる粒子径によって異なる傾向がある。", "微細な粒子ほど、一般に集じんが容易になる傾向がある。", "粒子径分布の把握は、適切な集じん装置の選定において重要な情報となる。"], "answer": [3], "explanation": "誤っているのは(4)です。一般に粒子径が小さいほど（微細な粒子ほど）、慣性力や重力の影響が相対的に小さくなるため、多くの集じん方式では捕集が「難しく」なる傾向があります。「容易になる」は誤りです。"}, {"id": 352, "domain": "ばいじん・粉じん特論", "sub": "粒子基礎_重力慣性集じん", "type": "single", "q": "重力集じん装置における粒子の沈降速度に関する次の記述のうち、正しいものはどれか。", "options": ["微小な球形粒子がストークスの法則に従う領域では、粒子径が大きいほど終末沈降速度は大きくなる傾向がある。", "終末沈降速度は、粒子の密度には無関係に決まる。", "終末沈降速度は、流体（ガス）の粘度には無関係に決まる。", "重力集じん装置は、微細な粒子（サブミクロン粒子）の捕集に最も適した高効率の集じん方式である。", "終末沈降速度は、粒子径にかかわらず常に一定である。"], "answer": [0], "explanation": "正しいのは(1)です。ストークスの法則が成立する領域では、終末沈降速度は粒子径の2乗、粒子と流体の密度差に比例し、流体の粘度に反比例します。粒子径が大きいほど終末沈降速度は大きくなります。重力集じん装置は構造が簡単な反面、比較的大きな粒子にしか高い効率を発揮できません。"}, {"id": 353, "domain": "ばいじん・粉じん特論", "sub": "粒子基礎_重力慣性集じん", "type": "single", "q": "粒子の終末沈降速度に関する次の記述のうち、正しいものはどれか。ただし、ストークスの法則が成立する条件下とする。", "options": ["粒子径が2倍になると、終末沈降速度は理論上4倍になる。", "粒子径が2倍になると、終末沈降速度は理論上2倍になる。", "粒子径が2倍になっても、終末沈降速度は変化しない。", "粒子径が2倍になると、終末沈降速度は理論上半分になる。", "粒子径と終末沈降速度の間には、いかなる関係性もない。"], "answer": [0], "explanation": "正しいのは(1)です。ストークスの法則によれば、終末沈降速度は粒子径の2乗に比例するため、粒子径が2倍になると終末沈降速度は理論上2²＝4倍になります。"}, {"id": 354, "domain": "ばいじん・粉じん特論", "sub": "粒子基礎_重力慣性集じん", "type": "single", "q": "慣性力集じん装置（障害物形式等）に関する次の記述のうち、誤っているものはどれか。", "options": ["慣性力集じん装置は、ガスの流れに障害物等を設けて急激に方向転換させ、慣性によりダストを分離捕集する方式である。", "粒子の慣性が大きい（粒子径が大きい、密度が大きい）ほど、一般に捕集されやすい傾向がある。", "慣性力集じん装置は、微細な粒子に対しても電気集じん装置と同等以上の高い集じん効率を発揮する。", "慣性力集じん装置は、比較的構造が簡単で、前処理（プレクリーナー）として用いられることがある。", "ガスの流速や障害物の形状は、慣性力集じん装置の性能に影響を与える要因となりうる。"], "answer": [2], "explanation": "誤っているのは(3)です。慣性力集じん装置は、比較的大きな粒子の捕集には有効ですが、微細な粒子に対する捕集効率は電気集じん装置やバグフィルターに比べて一般に劣り、「同等以上の高い集じん効率」というのは誤りです。"}, {"id": 355, "domain": "ばいじん・粉じん特論", "sub": "粒子基礎_重力慣性集じん", "type": "single", "q": "集じん装置の集じん率（集じん効率）に関する次の記述のうち、正しいものはどれか。", "options": ["集じん率は、入口ダスト濃度と出口ダスト濃度の差を入口ダスト濃度で除して求めることができる。", "集じん率は、常に100％を超える値をとる。", "集じん率は、対象とする粒子径にかかわらず常に一定の値になる。", "集じん率は、入口濃度が高いほど自動的に低下する固定の関係にある。", "集じん率は、集じん装置の運転条件（流速等）とは無関係に決まる。"], "answer": [0], "explanation": "正しいのは(1)です。集じん率（η）＝（入口ダスト濃度－出口ダスト濃度）÷入口ダスト濃度、として定義されます。集じん率は0〜100%（1未満）の範囲で表され、粒子径や運転条件（流速等）によって変化します。"}, {"id": 356, "domain": "ばいじん・粉じん特論", "sub": "粒子基礎_重力慣性集じん", "type": "single", "q": "並列に配置した複数の集じん装置における全体集じん率の考え方に関する次の記述のうち、正しいものはどれか。", "options": ["並列配置された各集じん装置の処理風量の割合と、それぞれの集じん率を踏まえて、全体としての集じん率を算出することができる。", "並列配置では、各装置の集じん率は全体の集じん率には一切影響しない。", "並列配置の全体集じん率は、常に最も性能の低い装置の集じん率と等しくなる。", "並列配置の全体集じん率は、常に最も性能の高い装置の集じん率と等しくなる。", "並列配置という概念は、集じん装置の設計には用いられない。"], "answer": [0], "explanation": "正しいのは(1)です。複数の集じん装置を並列に配置する場合、それぞれの処理風量の分担割合と各装置の集じん率を加重平均的に考慮することで、系全体としての集じん率を評価できます。"}, {"id": 357, "domain": "ばいじん・粉じん特論", "sub": "粒子基礎_重力慣性集じん", "type": "single", "q": "集じん装置の選定に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　対象とするダストの粒子径分布は、集じん装置選定の重要な検討要素の一つである。\nb　処理ガス量や温度・湿度等のガス性状も、集じん装置選定に影響する要素である。\nc　要求される集じん効率（排出基準の達成）も、選定の重要な判断材料となる。\nd　集じん装置の選定において、設置スペースやコストは一切考慮する必要がない。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（設置スペースやコストも、実際の設備選定においては重要な検討要素です）。"}, {"id": 358, "domain": "ばいじん・粉じん特論", "sub": "粒子基礎_重力慣性集じん", "type": "single", "q": "試料（ダスト粒子）の頻度分布に関する次の記述のうち、正しいものはどれか。", "options": ["粒子径の頻度分布は、粒子群の中でどの粒子径がどの程度の割合で存在するかを表すものである。", "頻度分布は、粒子径にかかわらず、常に左右対称の正規分布になる。", "頻度分布のデータは、集じん装置の性能評価には利用されない。", "粒子径の頻度分布という概念は、気体の性質を表す指標であり、粒子には適用されない。", "頻度分布は、測定条件にかかわらず、常に同一の形状を示す。"], "answer": [0], "explanation": "正しいのは(1)です。頻度分布は、ダスト粒子群の中で各粒子径がどの程度の頻度（割合）で存在するかを表すもので、対象とするダストの発生源や条件によって形状は異なります（対数正規分布で近似されることが多いですが、必ずしも左右対称の正規分布とは限りません）。"}, {"id": 359, "domain": "ばいじん・粉じん特論", "sub": "粒子基礎_重力慣性集じん", "type": "single", "q": "ダストの拡散係数に関する次の記述のうち、誤っているものはどれか。", "options": ["微小な粒子は、ブラウン運動により拡散する性質を持つ。", "拡散係数は、粒子径が小さいほど一般に大きくなる傾向がある。", "拡散による捕集は、バグフィルターなどの集じん機構の一つとして考えられている。", "拡散係数は、粒子径の大小にかかわらず常に一定の値をとる。", "拡散による捕集効果は、特に微細な粒子（サブミクロン粒子）において重要になる傾向がある。"], "answer": [3], "explanation": "誤っているのは(4)です。拡散係数は粒子径によって変化する値であり（一般に粒子径が小さいほど拡散係数は大きくなる傾向）、「常に一定」というのは誤りです。"}, {"id": 360, "domain": "ばいじん・粉じん特論", "sub": "粒子基礎_重力慣性集じん", "type": "single", "q": "集じん装置に対するダスト濃度の影響に関する次の記述のうち、正しいものはどれか。", "options": ["入口ダスト濃度が変化すると、集じん装置の性能（集じん率等）に影響が生じる場合がある。", "入口ダスト濃度は、集じん装置の性能には一切影響を与えない。", "入口ダスト濃度が高いほど、集じん率は必ず低下する。", "入口ダスト濃度が低いほど、集じん率は必ず低下する。", "ダスト濃度という概念は、集じん装置の設計・評価には用いられない。"], "answer": [0], "explanation": "正しいのは(1)です。集じん装置の種類（電気集じん装置、バグフィルター等）によっては、入口ダスト濃度の変化が集じん性能に影響を与える場合があります（一律に「高いほど低下」「低いほど低下」と単純化できるものではありません）。"}, {"id": 361, "domain": "ばいじん・粉じん特論", "sub": "サイクロン", "type": "single", "q": "サイクロン（遠心力集じん装置）の遠心効果に関する次の記述のうち、正しいものはどれか。", "options": ["サイクロン内のガス流速が大きいほど、一般に遠心効果（分離力）は大きくなる傾向がある。", "サイクロンの遠心効果は、ガス流速には無関係に決まる。", "サイクロンの半径が大きいほど、遠心効果は常に大きくなる。", "サイクロンは、遠心力ではなく静電気力を利用して粒子を分離する装置である。", "サイクロンの遠心効果は、粒子の密度には無関係である。"], "answer": [0], "explanation": "正しいのは(1)です。サイクロンは旋回流によって生じる遠心力を利用して粒子を分離する装置で、一般にガス流速（旋回速度）が大きいほど遠心効果（分離力）は大きくなる傾向があります。ただし、サイクロン半径が大きいほど遠心効果が大きくなるとは限らず（半径が大きいと旋回速度が同じでも遠心加速度は下がる場合がある）、慎重な理解が必要です。"}, {"id": 362, "domain": "ばいじん・粉じん特論", "sub": "サイクロン", "type": "single", "q": "サイクロンの構造・性能に関する次の記述のうち、誤っているものはどれか。", "options": ["サイクロンは、比較的構造が簡単で、圧力損失が過度に大きくない集じん装置とされる。", "サイクロンは、微細な粒子（サブミクロン粒子）に対しても極めて高い集じん効率を発揮する装置である。", "サイクロンは、前処理（プレクリーナー）として他の集じん装置と組み合わせて使用されることがある。", "サイクロンの集じん効率は、対象とする粒子径によって異なる傾向がある。", "サイクロンには、単胴形やマルチサイクロン（多数のサイクロンを並列配置したもの）など、いくつかの形式がある。"], "answer": [1], "explanation": "誤っているのは(2)です。サイクロンは比較的大きな粒子の捕集には有効ですが、微細な粒子（サブミクロン粒子）に対する捕集効率は電気集じん装置やバグフィルターに比べて一般に劣ります。「極めて高い集じん効率」は誤りです。"}, {"id": 363, "domain": "ばいじん・粉じん特論", "sub": "サイクロン", "type": "single", "q": "円柱状捕集体（障害物形式）を用いた集じん装置の集じん率ηに関する次の記述のうち、正しいものはどれか。", "options": ["円柱状捕集体の集じん率は、粒子の慣性パラメータ（慣性衝突係数等）に依存する傾向がある。", "円柱状捕集体の集じん率は、ガス流速には全く依存しない。", "円柱状捕集体の集じん率は、粒子径には全く依存しない。", "円柱状捕集体の集じん率は、常に100％である。", "円柱状捕集体という概念は、集じん理論には存在しない。"], "answer": [0], "explanation": "正しいのは(1)です。円柱状捕集体（障害物）による慣性衝突捕集の効率は、粒子の慣性パラメータ（粒子径・密度・ガス流速・捕集体径等から求まる無次元数）に依存し、この値が大きいほど捕集効率が高くなる傾向があります。"}, {"id": 364, "domain": "ばいじん・粉じん特論", "sub": "サイクロン", "type": "single", "q": "サイクロンにおける圧力損失に関する次の記述のうち、正しいものはどれか。", "options": ["サイクロンの圧力損失は、ガス流速が大きいほど一般に増加する傾向がある。", "サイクロンの圧力損失は、ガス流速には無関係である。", "サイクロンには、圧力損失という概念は存在しない。", "サイクロンの圧力損失は、集じん率とは全く無関係な指標である。", "サイクロンの圧力損失は、常に電気集じん装置よりも大きい。"], "answer": [0], "explanation": "正しいのは(1)です。サイクロンの圧力損失は、一般にガス流速の2乗にほぼ比例して増加する傾向があり、流速を上げると集じん効率は向上する一方、圧力損失（送風動力）も増加するというトレードオフの関係があります。"}, {"id": 365, "domain": "ばいじん・粉じん特論", "sub": "サイクロン", "type": "single", "q": "マルチサイクロン（多管式サイクロン）に関する次の記述のうち、正しいものはどれか。", "options": ["マルチサイクロンは、小口径のサイクロンを多数並列に配置することで、単胴形サイクロンよりも高い集じん効率を狙う方式である。", "マルチサイクロンは、単胴形サイクロンよりも常に集じん効率が低い。", "マルチサイクロンは、バグフィルターと全く同一の捕集原理を用いる。", "マルチサイクロンには、遠心力は一切作用しない。", "マルチサイクロンは、電気集じん装置の別名である。"], "answer": [0], "explanation": "正しいのは(1)です。マルチサイクロンは、小口径のサイクロン（旋回半径が小さいほど遠心効果が高まりやすい）を多数並列に配置することで、単胴形の大型サイクロンよりも高い集じん効率を狙う方式です。"}, {"id": 366, "domain": "ばいじん・粉じん特論", "sub": "サイクロン", "type": "single", "q": "サイクロンの捕集効率に影響を与える要因に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　サイクロンの直径（口径）は、捕集効率に影響を与える要因の一つである。\nb　処理ガス量（流速）は、捕集効率に影響を与える要因の一つである。\nc　対象粒子の密度・粒子径は、捕集効率に影響を与える要因の一つである。\nd　サイクロンの捕集効率は、いかなる条件下でも常に一定である。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（サイクロンの捕集効率は、口径・流速・粒子の性状など複数の要因によって変化します）。"}, {"id": 367, "domain": "ばいじん・粉じん特論", "sub": "電気集じん装置", "type": "single", "q": "電気集じん装置の集じん原理に関する次の記述のうち、誤っているものはどれか。", "options": ["電気集じん装置は、コロナ放電により粒子を帯電させ、電界の作用で集じん極に捕集する装置である。", "電気集じん装置は、比較的低い圧力損失で運転できる特徴を持つ。", "電気集じん装置は、微細な粒子に対しても比較的高い捕集効率を発揮しうる集じん方式である。", "電気集じん装置は、静電気力ではなく、もっぱら重力のみを利用する集じん装置である。", "電気集じん装置の集じん性能は、粉じんの電気抵抗率の影響を受けることがある。"], "answer": [3], "explanation": "誤っているのは(4)です。電気集じん装置は、コロナ放電で帯電させた粒子を「電界（静電気力）」の作用で集じん極に引き寄せて捕集する装置であり、「もっぱら重力のみを利用する」は誤りです。"}, {"id": 368, "domain": "ばいじん・粉じん特論", "sub": "電気集じん装置", "type": "single", "q": "電気集じん装置における逆電離現象に関する次の記述のうち、正しいものはどれか。", "options": ["逆電離現象は、集じん極上に堆積したダスト層の電気抵抗率が高すぎる場合に、堆積層内で異常な放電（局所的な絶縁破壊）が生じる現象である。", "逆電離現象は、電気抵抗率が極めて低いダストにおいてのみ発生する現象である。", "逆電離現象が発生すると、一般に集じん効率が向上する。", "逆電離現象は、電気集じん装置の性能には全く影響を与えない。", "逆電離現象は、湿式集じん装置特有の現象であり、乾式電気集じん装置には発生しない。"], "answer": [0], "explanation": "正しいのは(1)です。逆電離現象は、電気抵抗率が高すぎるダストが集じん極上に厚く堆積した際、堆積層内の電圧降下が大きくなり、局所的な絶縁破壊（異常放電）が生じる現象で、一般に集じん効率を「低下」させる望ましくない現象です。"}, {"id": 369, "domain": "ばいじん・粉じん特論", "sub": "電気集じん装置", "type": "single", "q": "電気集じん装置内での粒子の移動速度（ドリフト速度）に関する次の記述のうち、正しいものはどれか。", "options": ["粒子の移動速度（ドリフト速度）は、粒子の帯電量や印加電界の強さ等に影響を受ける。", "粒子の移動速度は、印加電圧の強さには無関係に決まる。", "粒子の移動速度は、粒子径にかかわらず常に一定である。", "粒子の移動速度という概念は、電気集じん装置の性能評価には用いられない。", "粒子の移動速度は、集じん極までの距離のみによって決まる。"], "answer": [0], "explanation": "正しいのは(1)です。電気集じん装置内での粒子の移動速度（ドリフト速度）は、粒子の帯電量、印加電界の強さ、粒子径、ガスの粘性等の複数の要因に影響を受けます。この移動速度は、後述のドイッチェの式にも用いられる重要なパラメータです。"}, {"id": 370, "domain": "ばいじん・粉じん特論", "sub": "電気集じん装置", "type": "single", "q": "電気集じん装置の性能評価に用いられる「ドイッチェの式」に関する次の記述のうち、正しいものはどれか。", "options": ["ドイッチェの式は、集じん率を、集じん極の面積・処理ガス量・粒子の移動速度（ドリフト速度）等から推定する式である。", "ドイッチェの式は、バグフィルターの圧力損失を求めるための式である。", "ドイッチェの式は、サイクロンの遠心力を計算するための式である。", "ドイッチェの式には、集じん極の面積という要素は含まれない。", "ドイッチェの式は、粒子の移動速度とは無関係な理論式である。"], "answer": [0], "explanation": "正しいのは(1)です。ドイッチェの式（Deutsch-Andersonの式）は、電気集じん装置の集じん率を η＝1－exp(－wA/Q)（w：粒子の移動速度、A：集じん極面積、Q：処理ガス量）という形で推定する代表的な理論式です。"}, {"id": 371, "domain": "ばいじん・粉じん特論", "sub": "電気集じん装置", "type": "single", "q": "ドイッチェの式 η＝1－exp(－wA/Q) について、集じん極面積Aを2倍にした場合（w、Qは一定とする）の集じん率ηの変化に関する次の記述のうち、正しいものはどれか。", "options": ["集じん極面積Aを大きくすると、指数関数の効果により、集じん率ηは高くなる（1に近づく）方向に変化する。", "集じん極面積Aを大きくしても、集じん率ηは全く変化しない。", "集じん極面積Aを大きくすると、集じん率ηは必ず低下する。", "集じん極面積Aと集じん率ηの間には、いかなる関係もない。", "集じん極面積Aを大きくすると、集じん率ηは常に2倍になる。"], "answer": [0], "explanation": "正しいのは(1)です。η＝1－exp(－wA/Q)の式において、A（集じん極面積）が大きくなると指数部の絶対値（wA/Q）が大きくなり、exp(－wA/Q)は0に近づくため、ηは1（100%）に近づく方向に変化します。ただし、ηが単純に2倍になるわけではない点に注意が必要です。"}, {"id": 372, "domain": "ばいじん・粉じん特論", "sub": "電気集じん装置", "type": "single", "q": "電気集じん装置の各部の役割に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　放電極は、コロナ放電を発生させ、粒子を帯電させる役割を持つ。\nb　集じん極は、帯電した粒子を静電気力により捕集する役割を持つ。\nc　槌打装置（ラッピング装置）は、集じん極に堆積したダストを払い落とす役割を持つ。\nd　電気集じん装置には、放電極・集じん極という区別は存在しない。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（電気集じん装置は、コロナ放電を生じさせる「放電極」と、帯電粒子を捕集する「集じん極」という構造上の区別を持つのが基本構成です）。"}, {"id": 373, "domain": "ばいじん・粉じん特論", "sub": "電気集じん装置", "type": "single", "q": "電気集じん装置の運転における注意点に関する次の記述のうち、誤っているものはどれか。", "options": ["処理対象が可燃性・爆発性のガスを含む場合、火花放電による引火・爆発のリスクに注意が必要である。", "ダストの電気抵抗率が集じん性能に適した範囲から外れると、逆電離等により性能が低下することがある。", "槌打（払い落とし）の頻度や強さは、再飛散（一度捕集したダストが再び舞い上がる現象）に影響を与えることがある。", "電気集じん装置は、いかなる粉じんの性状であっても常に一定の高い集じん率を維持できる。", "印加電圧の設定は、集じん性能や火花放電の頻度に影響を与える運転パラメータの一つである。"], "answer": [3], "explanation": "誤っているのは(4)です。電気集じん装置の集じん性能は、粉じんの電気抵抗率や粒子径分布等の性状によって大きく変動しうるものであり、「いかなる性状であっても常に一定の高い集じん率」というのは誤りです。"}, {"id": 374, "domain": "ばいじん・粉じん特論", "sub": "電気集じん装置", "type": "single", "q": "焼結ダストのように電気抵抗率が変動しやすいダストの集じんに関する次の記述のうち、正しいものはどれか。", "options": ["電気抵抗率が電気集じんに適した範囲を外れる場合、集じん性能の低下や逆電離のリスクが高まることがある。", "電気抵抗率は、運転温度にかかわらず常に一定の値をとる。", "電気抵抗率が変動しても、電気集じん装置の性能には一切影響が生じない。", "焼結ダストは、電気集じん装置での捕集が不可能なダストである。", "電気抵抗率という概念は、バグフィルターの選定にのみ用いられ、電気集じん装置には無関係である。"], "answer": [0], "explanation": "正しいのは(1)です。焼結ダストのように運転温度領域によって電気抵抗率が変動しやすいダストでは、抵抗率が電気集じんに適した範囲を外れると、逆電離現象等により集じん性能が低下するリスクが高まります。"}, {"id": 375, "domain": "ばいじん・粉じん特論", "sub": "電気集じん装置", "type": "single", "q": "湿式電気集じん装置に関する次の記述のうち、正しいものはどれか。", "options": ["湿式電気集じん装置は、集じん極への水噴霧等により、堆積したダストを洗い流す方式の電気集じん装置である。", "湿式電気集じん装置は、乾式電気集じん装置と全く同じ構造であり、水を用いる点以外に違いはない。", "湿式電気集じん装置は、ミストや高抵抗率ダストの処理には全く適さない。", "湿式電気集じん装置には、逆電離現象は一切発生しない。", "湿式電気集じん装置は、槌打装置による払い落としが必須の構造である。"], "answer": [0], "explanation": "正しいのは(1)です。湿式電気集じん装置は、集じん極を水で洗浄することでダストを除去する方式で、乾式（槌打による払い落とし）とは異なり、高抵抗率のダストやミスト状の粒子にも対応しやすいという特徴があります。"}, {"id": 376, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "バグフィルターによる集じんの基本原理に関する次の記述のうち、誤っているものはどれか。", "options": ["バグフィルターは、ろ布を通してガスをろ過し、ダストを捕集する集じん装置である。", "バグフィルターは、微細な粒子に対しても比較的高い捕集効率を発揮しやすい集じん方式である。", "バグフィルターのろ布表面に形成される一次付着層（ダストケーキ）は、ろ過性能の向上に寄与することがある。", "バグフィルターは、いかなる温度の排ガスに対しても、前処理なしにそのまま使用できる。", "バグフィルターには、パルスジェット形など、払い落とし方式にいくつかの種類がある。"], "answer": [3], "explanation": "誤っているのは(4)です。ろ布には材質ごとに耐熱温度の上限があるため、高温の排ガスを処理する場合はろ布の常用耐用温度以下に冷却するなどの前処理が必要になる場合があり、「いかなる温度でもそのまま使用できる」は誤りです。"}, {"id": 377, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "バグフィルター用ろ布の材質と耐熱温度に関する次の記述のうち、正しいものはどれか。", "options": ["ろ布の材質（ガラス繊維、フッ素樹脂系繊維等）によって、常用耐熱温度は異なる。", "ろ布の材質にかかわらず、耐熱温度は常に同一である。", "ろ布は、いかなる材質であっても、無制限に高温のガスを処理できる。", "ろ布材質の選定にあたって、耐熱性は考慮する必要がない。", "ろ布材質の耐熱温度は、集じん性能とは全く無関係な情報である。"], "answer": [0], "explanation": "正しいのは(1)です。ろ布の材質（ガラス繊維、アラミド繊維、フッ素樹脂系繊維等）ごとに常用耐熱温度は異なり、処理する排ガスの温度条件に応じて適切な材質を選定する必要があります。"}, {"id": 378, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "ろ布の表面加工法に関する次の記述のうち、正しいものはどれか。", "options": ["ろ布表面の加工（コーティング等）は、耐食性や撥水・撥油性の向上等を目的として行われることがある。", "ろ布の表面加工は、集じん性能には一切影響を与えない。", "ろ布の表面加工法は、いかなる種類のろ布にも全く同一の方法が適用される。", "ろ布の表面加工は、耐熱性を低下させることのみを目的として行われる。", "ろ布に表面加工を施すことは、法令で禁止されている。"], "answer": [0], "explanation": "正しいのは(1)です。ろ布表面のコーティング等の加工は、耐食性・撥水撥油性の向上、粒子の捕集性能や払い落とし性の改善など、様々な目的で行われます。"}, {"id": 379, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "バグフィルターのダストの払い落とし方式に関する次の記述のうち、誤っているものはどれか。", "options": ["パルスジェット形は、圧縮空気を瞬時に吹き込むことでろ布を振動させ、ダストを払い落とす方式である。", "払い落としの頻度・強さは、ろ布の寿命や再飛散の程度に影響を与えることがある。", "払い落とし直後は、一次付着層が薄くなるため、一時的に捕集効率が低下することがある。", "払い落とし操作は、集じん性能の維持には一切関係のない、単なる清掃作業である。", "払い落とし方式には、パルスジェット形以外にも、機械振動形や逆洗形など複数の方式がある。"], "answer": [3], "explanation": "誤っているのは(4)です。払い落とし操作は、ろ布の目詰まりによる圧力損失の過度な上昇を防ぎ、集じん性能を安定的に維持するための重要な運転操作であり、「集じん性能の維持には一切関係のない」は誤りです。"}, {"id": 380, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "パルスジェット形払い落とし装置を用いるバグフィルターの構造に関する次の記述のうち、正しいものはどれか。", "options": ["含じんガスは、通常ろ布の外側から内側に向かって流入する構造となっている。", "含じんガスは、常にろ布の内側から外側に向かって流入する構造となっている。", "パルスジェット形は、ろ布の払い落としに液体（水）を用いる方式である。", "パルスジェット形バグフィルターには、集じん室を複数に区切るという設計上の配慮は不要である。", "パルスジェット形の払い落とし用気体は、常温の外気をそのまま使用しなければならない。"], "answer": [0], "explanation": "正しいのは(1)です。パルスジェット形バグフィルターでは、含じんガスは通常ろ布の外側から内側に流入し、ダストはろ布の外側表面に捕集されます。払い落とし時には、圧縮空気を瞬時にろ布の内側（上部等）から吹き込み、ろ布を振動させて外側のダストを払い落とします。"}, {"id": 381, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "バグフィルターの運転要領と維持管理に関する次の記述のうち、誤っているものはどれか。", "options": ["ダストの一次付着層が未形成と予測される運転開始時等には、プリコート粉を供給することがある。", "高温のガスを処理する場合は、ガスをろ布の常用耐用温度以下に冷却してから処理することが望ましい。", "ろ布の圧力損失の上昇は、目詰まりの進行を示す指標の一つとして監視されることがある。", "バグフィルターは、一度設置すれば、ろ布の交換や点検は不要である。", "結露による水分の付着は、ろ布の目詰まりや性能低下の原因となることがある。"], "answer": [3], "explanation": "誤っているのは(4)です。ろ布は使用に伴い摩耗・劣化するため、定期的な点検や交換が必要であり、「交換や点検は不要」というのは誤りです。"}, {"id": 382, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "バグフィルターの保守管理における留意点に関する次の記述のうち、正しいものはどれか。", "options": ["ろ布の破損は、集じん効率の低下や出口ダスト濃度の上昇につながることがあるため、定期的な点検が重要である。", "バグフィルターの保守管理には、圧力損失の監視は含まれない。", "ろ布の破損は、集じん性能には一切影響を与えない。", "バグフィルターは、保守管理の必要がない集じん方式として知られている。", "ろ布の交換周期は、使用条件にかかわらず、常に同一である。"], "answer": [0], "explanation": "正しいのは(1)です。ろ布の破損（ピンホールや破れ等）は出口ダスト濃度の急上昇につながりうるため、圧力損失の監視や定期点検を通じた早期発見が重要な保守管理項目です。"}, {"id": 383, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "ろ布材（撚糸・織り方）に関する次の記述のうち、正しいものはどれか。", "options": ["ろ布の撚糸には、フィラメント糸とステープル糸があり、それぞれ捕集性能等の特性が異なる。", "ろ布の織り方には違いがなく、いかなる織り方でも性能は同一である。", "ろ布材の選定は、集じん性能や耐久性には無関係に行われる。", "ろ布材には、天然繊維は一切使用されない。", "ろ布材の種類は、常に1種類のみに限定される。"], "answer": [0], "explanation": "正しいのは(1)です。ろ布の撚糸にはフィラメント糸（連続長繊維）とステープル糸（短繊維を紡いだもの）があり、織り方（平織、あや織、繻子織等）と合わせて、捕集性能・圧力損失・耐久性等の特性に違いが生じます。"}, {"id": 384, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "バグフィルターの集じん率η（コゼニー・カルマンの式との関連を含む）に関する次の記述のうち、正しいものはどれか。", "options": ["コゼニー・カルマンの式は、充塡層（ろ層等）内のガス流れに対する圧力損失を表す代表的な式の一つである。", "コゼニー・カルマンの式は、電気集じん装置の集じん率を求める式である。", "コゼニー・カルマンの式は、サイクロンの遠心力を求める式である。", "コゼニー・カルマンの式には、粒子径という要素は一切含まれない。", "コゼニー・カルマンの式は、燃焼計算に用いられる式である。"], "answer": [0], "explanation": "正しいのは(1)です。コゼニー・カルマンの式は、粒子の充塡層（一次付着層等）を通過するガスの圧力損失を、空隙率や粒子径等のパラメータから求める代表的な式で、バグフィルターのろ布上に堆積したダスト層の圧力損失評価等に用いられます。"}, {"id": 385, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "バグフィルターにおける圧力損失の管理に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　圧力損失は、ろ布の目詰まりの進行とともに上昇する傾向がある。\nb　圧力損失が過度に高くなると、送風機の負荷増大等の問題が生じることがある。\nc　払い落とし操作は、圧力損失を適切な範囲に維持するために行われる。\nd　圧力損失は、バグフィルターの運転管理には一切関係のない指標である。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（圧力損失は、バグフィルターの状態を把握するための重要な運転管理指標です）。"}, {"id": 386, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "洗浄集じん装置とバグフィルターの比較に関する次の記述のうち、正しいものはどれか。", "options": ["バグフィルターは、一般に洗浄集じん装置と比較して、微細な粒子に対する捕集効率が高い傾向があるとされる。", "バグフィルターは、洗浄集じん装置よりも常に圧力損失が低い。", "バグフィルターは、水を用いる集じん方式であり、洗浄集じん装置とは全く異なる原理で捕集する。", "バグフィルターと洗浄集じん装置は、集じん原理・構造ともに完全に同一である。", "バグフィルターは、湿分を含む排ガスの処理に最も適した方式であり、洗浄集じん装置は乾いた排ガスにしか使用できない。"], "answer": [0], "explanation": "正しいのは(1)です。バグフィルターは微細な粒子に対しても比較的高い捕集効率を発揮しやすい集じん方式として知られており、乾式のろ過捕集である点で、水を用いる洗浄集じん装置とは異なる原理で作動します。"}, {"id": 387, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "ろ布の目詰まり（ブラインディング）現象に関する次の記述のうち、正しいものはどれか。", "options": ["ろ布の目詰まりは、粘着性の高いダストや湿分の付着等により、払い落としでは除去しきれない状態になる現象である。", "ろ布の目詰まりは、集じん性能を向上させる望ましい現象である。", "ろ布の目詰まりは、圧力損失には一切影響を与えない。", "ろ布の目詰まりは、いかなるダストでも絶対に発生しない現象である。", "ろ布の目詰まりへの対策は、一切存在しない。"], "answer": [0], "explanation": "正しいのは(1)です。目詰まり（ブラインディング）は、粘着性の高いダストや湿分の付着等により、通常の払い落とし操作では除去しきれずろ布の通気性が低下する現象で、圧力損失の異常な上昇を招く望ましくない現象です。プリコート処理や適切な運転温度管理等が対策となります。"}, {"id": 388, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "バグフィルターにおけるダストの再飛散に関する次の記述のうち、正しいものはどれか。", "options": ["再飛散とは、一度捕集されたダストが払い落とし操作等により再びガス中に舞い上がる現象をいう。", "再飛散は、集じん効率を向上させる望ましい現象である。", "再飛散は、払い落としの強さや頻度とは無関係に発生する。", "再飛散という現象は、バグフィルターには存在しない。", "再飛散は、出口ダスト濃度を低下させる効果を持つ。"], "answer": [0], "explanation": "正しいのは(1)です。再飛散は、払い落とし時などに一度捕集されたダストが再びガス中に巻き上げられる現象で、払い落としの強さ・頻度によって発生の程度が変わることがあり、出口ダスト濃度を一時的に上昇させる要因となりえます。"}, {"id": 389, "domain": "ばいじん・粉じん特論", "sub": "バグフィルター", "type": "single", "q": "プリコート処理（プリコート粉の供給）に関する次の記述のうち、正しいものはどれか。", "options": ["プリコート処理は、運転開始時などにダストの一次付着層が形成されていない状態のろ布に、あらかじめ粉体を供給して保護層を形成させる操作である。", "プリコート処理は、ろ布を破損させることを目的として行われる。", "プリコート処理は、粘着性の高いダストの処理には一切効果がない。", "プリコート処理は、電気集じん装置に特有の操作である。", "プリコート処理は、法令で禁止されている操作である。"], "answer": [0], "explanation": "正しいのは(1)です。プリコート処理は、一次付着層が未形成の状態のろ布に、あらかじめ石灰等の粉体を供給して保護層（プリコート層）を形成させることで、ろ布の直接的な目詰まりや損傷を防ぐ操作です。"}, {"id": 390, "domain": "ばいじん・粉じん特論", "sub": "洗浄集じん装置", "type": "single", "q": "洗浄集じん装置（スクラバー）の性能に関する次の記述のうち、誤っているものはどれか。", "options": ["ベンチュリスクラバーは、基本流速が大きいほど、一般に微細なダストを捕集しやすい傾向がある。", "ため水式スクラバーでは、一般に基本流速が小さいほど集じん率が高くなる傾向がある。", "洗浄集じん装置は、集じんと同時にガスの吸収・冷却処理を行うことができる場合がある。", "洗浄集じん装置は、水分を含んだ排ガスの処理には全く適さない集じん方式である。", "洗浄集じん装置には、スプレー塔、ベンチュリスクラバー、ため水式など、いくつかの型式がある。"], "answer": [3], "explanation": "誤っているのは(4)です。洗浄集じん装置はそもそも液（多くは水）を用いてダストを捕集する方式であり、湿分を含む排ガスの処理にも対応できます。「全く適さない」は誤りです。"}, {"id": 391, "domain": "ばいじん・粉じん特論", "sub": "洗浄集じん装置", "type": "single", "q": "加圧水式洗浄集じん装置に関する次の記述のうち、正しいものはどれか。", "options": ["加圧水式洗浄集じん装置は、加圧した水をノズル等から噴霧してダストと接触させ、捕集する方式の一つである。", "加圧水式は、水を全く使用しない乾式の集じん方式である。", "加圧水式洗浄集じん装置は、いかなる場合も電気集じん装置よりも高い集じん効率を持つ。", "加圧水式洗浄集じん装置には、水の供給圧力という概念は存在しない。", "加圧水式洗浄集じん装置は、集じん機能のみを持ち、ガス吸収の機能は一切持たない。"], "answer": [0], "explanation": "正しいのは(1)です。加圧水式洗浄集じん装置は、加圧した水をノズルから噴霧し、微細な液滴とダストを接触させて捕集する湿式集じん方式の一つです。"}, {"id": 392, "domain": "ばいじん・粉じん特論", "sub": "洗浄集じん装置", "type": "single", "q": "洗浄集じん装置における液ガス比に関する次の記述のうち、正しいものはどれか。", "options": ["液ガス比は、供給する液量と処理ガス量の比を表す指標であり、集じん性能に影響を与えることがある。", "液ガス比は、集じん性能には一切関係しない指標である。", "液ガス比は、常に一定の固定値として法令で定められている。", "液ガス比が大きいほど、常に集じん性能は低下する。", "液ガス比という概念は、乾式集じん装置にのみ用いられる。"], "answer": [0], "explanation": "正しいのは(1)です。液ガス比（吸収液量／処理ガス量）は、洗浄集じん装置（湿式）における重要な運転パラメータの一つで、一般に液ガス比が適切に大きいほど捕集性能が向上する傾向がありますが、コスト等とのバランスも考慮されます。"}, {"id": 393, "domain": "ばいじん・粉じん特論", "sub": "洗浄集じん装置", "type": "single", "q": "洗浄集じん装置から排出される排水の処理に関する次の記述のうち、正しいものはどれか。", "options": ["洗浄集じん装置で発生する排水には、捕集したダストが含まれるため、適切な排水処理が必要となる場合がある。", "洗浄集じん装置からは、いかなる排水も発生しない。", "洗浄集じん装置の排水は、いかなる処理も行わずそのまま公共用水域に放流してよい。", "洗浄集じん装置の排水処理は、大気汚染防止法によってのみ規制される。", "洗浄集じん装置の排水には、ダスト成分は一切含まれない。"], "answer": [0], "explanation": "正しいのは(1)です。洗浄集じん装置では捕集したダストが排水中に含まれるため、水質汚濁防止法等に基づく適切な排水処理（沈殿・ろ過等）が必要となる場合があります。"}, {"id": 394, "domain": "ばいじん・粉じん特論", "sub": "石綿", "type": "single", "q": "石綿（アスベスト）の種類に関する次の記述のうち、正しいものはどれか。", "options": ["我が国で工業的に使用されてきた石綿の大部分はクリソタイル（白石綿）で、その他にアモサイト・クロシドライト等がある。", "石綿は、化学組成・種類にかかわらず、すべて同一の性質を持つ単一の物質である。", "クリソタイルは、我が国では一度も使用されたことがない種類の石綿である。", "石綿には、健康影響は一切確認されていない。", "石綿は、天然には存在しない人工繊維である。"], "answer": [0], "explanation": "正しいのは(1)です。我が国で工業的に使用されてきた石綿の9割以上はクリソタイル（白石綿）で、その他にアモサイト（茶石綿）、クロシドライト（青石綿）等があります。石綿は天然に産出する繊維状鉱物です。"}, {"id": 395, "domain": "ばいじん・粉じん特論", "sub": "石綿", "type": "single", "q": "石綿粉じんへの一般的な対策に関する次の記述のうち、誤っているものはどれか。", "options": ["石綿を含む製品の解体・除去作業では、粉じんの飛散防止対策（湿潤化、隔離養生等）が重要とされる。", "作業者は、必要に応じて防じんマスク等の保護具を着用することが求められる。", "石綿の除去作業に伴う集じんには、高性能フィルター（HEPAフィルター等）を備えた集じん・排気装置が用いられることがある。", "石綿の除去作業では、いかなる飛散防止措置も講じる必要がない。", "作業場周辺の石綿濃度は、必要に応じてモニタリングされることがある。"], "answer": [3], "explanation": "誤っているのは(4)です。石綿の除去作業は健康被害のリスクが高いため、湿潤化・隔離養生・集じん装置の使用など、法令に基づく厳格な飛散防止措置が求められており、「いかなる措置も講じる必要がない」は誤りです。"}, {"id": 396, "domain": "ばいじん・粉じん特論", "sub": "石綿", "type": "single", "q": "石綿濃度の測定方法に関する次の記述のうち、正しいものはどれか。", "options": ["石綿濃度の測定には、位相差顕微鏡等を用いて視野内の繊維数を計数する方法が用いられることがある。", "石綿濃度の測定には、いかなる顕微鏡的手法も用いられない。", "石綿濃度は、色を目視で確認するだけで正確に定量できる。", "石綿濃度の測定結果は、作業環境の管理には一切利用されない。", "石綿濃度の測定は、法令上いかなる場面でも求められていない。"], "answer": [0], "explanation": "正しいのは(1)です。石綿濃度（繊維数濃度）の測定には、フィルター上に捕集した試料を位相差顕微鏡等で観察し、視野内の繊維数を計数する方法（計数法）が広く用いられます。"}, {"id": 397, "domain": "ばいじん・粉じん特論", "sub": "石綿", "type": "single", "q": "総繊維数濃度の計算に関する次の問題を解きなさい。ある試料について、87番目の視野の計数を終えたところで繊維数（f）の累計が201になり、計数を終了した。1視野あたりの有効面積をA（cm²）、吸引したガス量をV（L）、ろ紙の有効ろ過面積をS（cm²）とするとき、総繊維数濃度（f/L）を求める式として、正しいものはどれか。", "options": ["（f／(A×87)）×S／V", "（f×A×87）／(S×V)", "f／V のみで、視野数や面積は考慮しない", "（f×V）／(A×87×S)", "（A×87）／(f×S×V)"], "answer": [0], "explanation": "正しいのは(1)です。総繊維数濃度は、「単位ろ紙面積あたりの繊維数（f÷計数した視野の総面積A×87）」に「ろ紙の有効ろ過面積S」を乗じて試料上の総繊維数を求め、それを「吸引したガス量V」で除すことで算出します（f／(A×87)×S／V）。実際の試験ではA・S・Vの具体的な数値が与えられ、この式に当てはめて計算します。"}, {"id": 398, "domain": "ばいじん・粉じん特論", "sub": "石綿", "type": "single", "q": "特定粉じん（石綿）発生施設に関する次の記述のうち、正しいものはどれか。", "options": ["特定粉じん発生施設の設置には、大気汚染防止法に基づく届出が必要とされる。", "特定粉じん発生施設には、いかなる規制も適用されない。", "特定粉じん発生施設は、一般粉じん発生施設と全く同一の規制方式（構造基準等）で規制される。", "特定粉じん発生施設からの石綿排出には、濃度規制（敷地境界基準）は適用されない。", "特定粉じん発生施設は、届出をせずに自由に設置・変更してよい。"], "answer": [0], "explanation": "正しいのは(1)です。特定粉じん（石綿）発生施設の設置には、大気汚染防止法に基づく都道府県知事等への届出が必要とされ、敷地境界における濃度規制（敷地境界基準）が適用されます。"}, {"id": 399, "domain": "ばいじん・粉じん特論", "sub": "石綿", "type": "single", "q": "各種石綿の特性に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　クリソタイル（白石綿）は、我が国で工業的に最も多く使用されてきた種類である。\nb　アモサイト（茶石綿）、クロシドライト（青石綿）も、石綿の種類の一つである。\nc　石綿は、耐熱性・耐薬品性等に優れる特性から、建材等に使用されてきた。\nd　石綿は、吸入することによる健康影響が全く確認されていない安全な物質である。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（石綿の吸入は中皮腫や肺がん等の重大な健康影響を引き起こすことが確認されています）。"}, {"id": 400, "domain": "ばいじん・粉じん特論", "sub": "石綿", "type": "single", "q": "石綿含有製品の解体等工事における事前調査に関する次の記述のうち、正しいものはどれか。", "options": ["建築物の解体等工事は、令和5年10月1日から有資格者による事前調査が義務化されている。", "石綿の事前調査は、いかなる工事にも一切求められていない。", "事前調査は、資格を持たない者が自由に実施してよいとされている。", "事前調査の対象は、建築物に限定され、工作物には一切適用されない。", "事前調査の結果は、記録・報告する必要が一切ない。"], "answer": [0], "explanation": "正しいのは(1)です。建築物の解体等工事は令和5年10月1日から有資格者による事前調査が義務化されており、令和8年1月1日からは一部の工作物にも対象が拡大されています（工作物石綿事前調査者）。"}, {"id": 401, "domain": "ばいじん・粉じん特論", "sub": "石綿", "type": "single", "q": "石綿繊維数の判定方法に関する次の記述のうち、正しいものはどれか。", "options": ["石綿繊維の判定には、長さ・幅の比（アスペクト比）等、繊維状かどうかを判断する一定の基準が用いられることがある。", "石綿繊維の判定には、いかなる基準も存在しない。", "石綿繊維は、色のみで他の繊維と完全に区別できる。", "石綿繊維数の判定には、聴覚を用いた検査方法が用いられる。", "石綿繊維の判定基準は、測定者ごとに全く自由に決めてよい。"], "answer": [0], "explanation": "正しいのは(1)です。石綿繊維（計数対象とする繊維）の判定には、長さ・幅・アスペクト比（長さ／幅の比）等、繊維状粒子として計数すべきかどうかを判断するための一定の基準（計数ルール）が定められています。"}, {"id": 402, "domain": "ばいじん・粉じん特論", "sub": "ダスト濃度測定_試料採取", "type": "single", "q": "排ガス中のダスト濃度測定における試料採取方法（等速吸引）に関する次の記述のうち、正しいものはどれか。", "options": ["ダスト濃度の正確な測定には、採取ノズルでの吸引速度をダクト内のガス流速とほぼ等しくする「等速吸引」が重要とされる。", "吸引速度は、ダクト内のガス流速とは無関係に、常に一定でよい。", "等速吸引という概念は、ダスト濃度測定には用いられない。", "吸引速度がダクト内流速より極端に速くても遅くても、測定結果には全く影響しない。", "等速吸引は、ガス状物質の測定にのみ適用される概念であり、ダストには無関係である。"], "answer": [0], "explanation": "正しいのは(1)です。ダスト（粒子状物質）の代表的な試料採取には、採取ノズルでの吸引速度をダクト内のガス流速とほぼ等しくする「等速吸引」が重要です。吸引速度が速すぎたり遅すぎたりすると、慣性の影響で粒子の採取に偏りが生じ、測定誤差の原因となります。"}, {"id": 403, "domain": "ばいじん・粉じん特論", "sub": "ダスト濃度測定_試料採取", "type": "single", "q": "ダスト濃度測定のための排ガス中水分量の測定に関する次の記述のうち、誤っているものはどれか。", "options": ["排ガス中の水分量は、乾き排ガス量への換算等、濃度計算に必要な情報の一つである。", "水分量の測定には、吸湿管等を用いて水分を吸収させ、その質量増加から求める方法がある。", "1本の吸湿管内で処理できる排ガスの吸引流量には、一定の目安（吸湿剤あたりの流量等）が示されることがある。", "排ガス中の水分量は、ダスト濃度の計算には一切関係しない情報である。", "水分量の測定結果は、ダストの試料採取条件の設定にも関わることがある。"], "answer": [3], "explanation": "誤っているのは(4)です。排ガス中の水分量は、乾き排ガス量への換算やダスト濃度の標準状態換算等に必要な重要な情報であり、「ダスト濃度の計算には一切関係しない」は誤りです。"}, {"id": 404, "domain": "ばいじん・粉じん特論", "sub": "ダスト濃度測定_試料採取", "type": "single", "q": "ピトー管による動圧測定に関する次の記述のうち、正しいものはどれか。", "options": ["ピトー管は、全圧と静圧の差（動圧）を測定し、そこからガスの流速を求めるために用いられる計測器である。", "ピトー管は、ガスの温度のみを測定する機器であり、流速の測定には用いられない。", "ピトー管の測定結果は、ダスト試料採取における等速吸引の設定には無関係である。", "ピトー管による動圧測定には、ピトー管係数という概念は用いられない。", "ピトー管は、ダストの化学成分を分析するための機器である。"], "answer": [0], "explanation": "正しいのは(1)です。ピトー管は、全圧と静圧の差（動圧）を測定し、その値からガスの流速を算出するために用いられる計測器で、ダスト試料採取の際の等速吸引条件（ノズルでの吸引速度設定）を決める上でも重要な情報を提供します。"}, {"id": 405, "domain": "ばいじん・粉じん特論", "sub": "ダスト濃度測定_試料採取", "type": "single", "q": "ピトー管で計測した動圧値からガス流速を求める計算の考え方に関する次の記述のうち、正しいものはどれか。", "options": ["動圧値が大きいほど、算出されるガス流速は大きくなる関係にある。", "動圧値とガス流速の間には、いかなる関係もない。", "動圧値が大きいほど、算出されるガス流速は小さくなる関係にある。", "ガス流速の算出には、動圧値以外の情報は一切不要である。", "動圧値からガス流速を求める際、ガスの密度は考慮する必要がない。"], "answer": [0], "explanation": "正しいのは(1)です。ピトー管による流速算出は、動圧とガス密度の関係式（流速は動圧の平方根に比例する形の式）に基づくため、動圧値が大きいほど算出される流速も大きくなります。実際の計算にはガス密度（温度・圧力等から換算）も必要です。"}, {"id": 406, "domain": "ばいじん・粉じん特論", "sub": "ダスト濃度測定_試料採取", "type": "single", "q": "マノメーター（圧力計）の指示値の異常に関する次の記述のうち、正しいものはどれか。", "options": ["マノメーターの指示値が異常な変動を示す場合、採取管の閉塞やリーク（漏れ）等のトラブルが疑われることがある。", "マノメーターの指示値の異常は、測定作業には全く影響を与えない。", "マノメーターは、温度を測定するための機器である。", "マノメーターの指示値は、いかなる場合も常に一定でなければならない。", "マノメーターの異常は、点検・確認する必要がない。"], "answer": [0], "explanation": "正しいのは(1)です。マノメーターの指示値に異常な変動（急激な低下や振動等）が見られる場合、採取管の閉塞、接続部からのガス漏れ、ダストによる詰まりなどのトラブルが疑われるため、測定の信頼性を保つために原因確認が必要です。"}, {"id": 407, "domain": "ばいじん・粉じん特論", "sub": "ダスト濃度測定_試料採取", "type": "single", "q": "排ガス中のダスト採取に用いる吸引ノズルに関する次の記述のうち、誤っているものはどれか。", "options": ["吸引ノズルの形状・口径は、等速吸引を実現するための重要な設計要素である。", "吸引ノズルは、ダクト内のガスの流れの方向に正しく向けて設置することが望ましい。", "吸引ノズルの材質は、対象ダストとの反応・付着のしにくさ等を考慮して選定されることがある。", "吸引ノズルの口径や形状は、測定結果の精度には一切影響しない。", "吸引ノズルを用いた採取では、ダクト内の複数点で測定を行うことが望ましい場合がある。"], "answer": [3], "explanation": "誤っているのは(4)です。吸引ノズルの口径・形状は、等速吸引の実現（測定精度）に直結する重要な要素であり、「一切影響しない」は誤りです。"}, {"id": 408, "domain": "ばいじん・粉じん特論", "sub": "ダスト濃度測定_試料採取", "type": "single", "q": "ダスト捕集器に使用するろ過材の特性に関する次の記述のうち、正しいものはどれか。", "options": ["ダスト測定用のろ過材（ろ紙等）は、対象とする粒子径の捕集効率や、排ガス条件（温度、水分等）への耐性が考慮されて選定される。", "ダスト測定用のろ過材は、いかなる粒子径のダストも100%捕集できるとは限らない。", "ろ過材の選定に、耐熱性や耐薬品性は一切考慮されない。", "ダスト測定用のろ過材の種類は、常に1種類のみである。", "ろ過材の質量変化は、ダスト濃度の算出には利用されない。"], "answer": [0], "explanation": "正しいのは(1)です。ダスト測定用のろ過材は、対象粒子径への捕集性能、排ガスの温度・水分・化学的性状への耐性等を考慮して選定され、採取前後の質量変化からダスト量を算出します。"}, {"id": 409, "domain": "ばいじん・粉じん特論", "sub": "ダスト濃度測定_試料採取", "type": "single", "q": "排ガス中のダストの流量計算（採取ガス量からのダスト濃度換算）に関する次の記述のうち、正しいものはどれか。", "options": ["ダスト濃度は、捕集したダストの質量を、標準状態に換算した吸引ガス量で除して求めることができる。", "ダスト濃度の計算には、吸引したガス量は一切考慮する必要がない。", "ダスト濃度は、常温常圧のガス量のみを用いて計算し、標準状態への換算は不要である。", "ダスト濃度の計算結果は、水分量の測定結果には一切影響を受けない。", "ダストの質量測定には、いかなる秤（はかり）も使用されない。"], "answer": [0], "explanation": "正しいのは(1)です。ダスト濃度は、フィルター等に捕集されたダストの質量を、標準状態（0℃、101.325kPa等）に換算した乾きガス量で除して算出するのが基本的な考え方です。水分量の測定結果は、この標準状態換算に必要な情報となります。"}, {"id": 410, "domain": "ばいじん・粉じん特論", "sub": "ダスト濃度測定_試料採取", "type": "single", "q": "排ガス中ダスト試料採取における測定位置の選定に関する次の記述のうち、正しいものはどれか。", "options": ["測定位置は、ガスの流れが乱れにくい直管部（整流された箇所）を選定することが望ましいとされる。", "測定位置は、ダクトの曲がり角や合流部の直後を優先して選定することが望ましい。", "測定位置の選定は、測定結果の精度には一切関係しない。", "測定位置は、常にダクトの最下流の排出口のみに限定される。", "測定位置の選定基準は、法令上一切定められていない。"], "answer": [0], "explanation": "正しいのは(1)です。測定位置は、ガスの流れが乱れやすい曲がり角や合流部の近傍を避け、流れが安定した直管部を選定することが、代表性のある測定結果を得るために望ましいとされています。"}, {"id": 411, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "鉛及びその化合物に関する次の記述のうち、誤っているものはどれか。", "options": ["鉛の沸点は約1750℃と高いが、400〜500℃程度から蒸発が盛んになり、鉛フュームが発生する。", "鉛の製錬工程では、焼結・還元等の高温プロセスにおいて鉛蒸気やヒュームが発生しやすい。", "鉛は蓄電池、顔料、はんだなど幅広い用途に使用されてきた。", "鉛中毒は主に呼吸器からの吸入によって生じ、消化器からの吸収は一切生じない。", "鉛は大気汚染防止法上の「有害物質」（ばい煙に含まれる物質）として排出規制の対象となっている。"], "answer": [3], "explanation": "誤っているのは(4)です。鉛は呼吸器からの吸入だけでなく、経口摂取（消化器からの吸収）によっても体内に取り込まれます。「一切生じない」は誤りです。"}, {"id": 412, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "有機塩素化合物の一般的な製造方法に関する次の記述のうち、正しいものはどれか。", "options": ["エチレンに塩素を付加させて1,2-ジクロロエタンを製造する反応は、塩化水素を副生しない。", "メタンの塩素化により塩化メチルを製造する反応は、塩化水素を副生しない。", "全ての有機塩素化合物の製造反応は、必ず塩化水素を副生する。", "エタンの塩素化による塩化エチルの製造は、塩化水素を副生しない。", "有機塩素化合物は、塩素を用いずに製造することができない。"], "answer": [0], "explanation": "正しいのは(1)です。エチレンへの塩素の「付加反応」により1,2-ジクロロエタンを製造する場合、塩素原子がそのまま分子に取り込まれるため塩化水素は副生しません。一方、メタンやエタンの「置換反応」による塩素化（塩化メチル、塩化エチルの製造等）では、水素原子が塩素に置き換わる際に塩化水素が副生します。"}, {"id": 413, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "特定物質の常温常圧における性状に関する次の組合せのうち、誤っているものはどれか。", "options": ["塩素　―　黄緑色の刺激臭を持つ気体", "臭素　―　赤褐色で密度の大きい液体", "二酸化硫黄　―　刺激臭を持つ気体", "ふっ化水素　―　無色で刺激性の強い気体", "アンモニア　―　赤褐色の刺激臭を持つ気体"], "answer": [4], "explanation": "誤っているのは(5)です。アンモニアは「無色」で特有の刺激臭を持つ気体であり、「赤褐色」ではありません。赤褐色の気体は二酸化窒素（NO2）や臭素蒸気が該当します。"}, {"id": 414, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "カドミウム及びその化合物に関する次の記述のうち、誤っているものはどれか。", "options": ["カドミウムは、亜鉛の製錬過程の副産物として得られることが多い。", "カドミウムは、ニッケルカドミウム電池や顔料等に用いられてきた。", "カドミウムによる慢性中毒は、腎機能障害等を引き起こすことが知られている。", "カドミウムは、大気汚染防止法上の有害物質（ばい煙に含まれる物質）として排出規制の対象となっている。", "カドミウムは常温で気体として存在し、大気中に直接気体の状態で放出される。"], "answer": [4], "explanation": "誤っているのは(5)です。カドミウムは常温では固体金属であり、高温での加熱・溶融時にヒューム（微粒子）として大気中に放出されます。「常温で気体」という記述は誤りです。"}, {"id": 415, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "水銀及びその化合物に関する次の記述のうち、正しいものはどれか。", "options": ["金属水銀は常温で液体の金属であり、蒸気圧を有するため常温でも蒸発しうる。", "水銀は常温で固体であり、蒸発することはない。", "水銀は大気汚染防止法上の排出規制対象とはされていない。", "水銀の主な発生源は自動車排出ガスであり、工場からの排出はほとんどない。", "水銀は有機化合物としてのみ存在し、無機水銀は自然界に存在しない。"], "answer": [0], "explanation": "正しいのは(1)です。金属水銀は常温で液体の金属という特異な性質を持ち、蒸気圧を有するため常温でも徐々に蒸発します。石炭火力発電所やセメント製造施設などが大気への主な発生源とされ、大気汚染防止法上も水銀排出施設に対する規制が定められています。"}, {"id": 416, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "ふっ素、ふっ化水素及びふっ化けい素に関する次の記述のうち、誤っているものはどれか。", "options": ["ふっ化水素は無色の気体で、水に非常に溶けやすい。", "ふっ素化合物は、アルミニウム製錬やガラス・ほうろう製造工程等から発生することがある。", "ふっ化水素は、ガラスを腐食させる性質を持つ。", "ふっ素化合物による健康影響として、骨や歯のフッ素症（斑状歯等）が知られている。", "ふっ化水素は、大気汚染防止法上の有害物質には含まれていない。"], "answer": [4], "explanation": "誤っているのは(5)です。ふっ素、ふっ化水素及びふっ化けい素は、大気汚染防止法施行令に定める「有害物質」（ばい煙に含まれる物質）の一つとして排出規制の対象となっています。"}, {"id": 417, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "窒素酸化物（NOx）の生成機構に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　燃料中の窒素分に由来して生成するNOxをフューエルNOxという。\nb　燃焼用空気中の窒素が高温下で酸素と反応して生成するNOxをサーマルNOxという。\nc　サーマルNOxの生成量は、燃焼温度が低いほど多くなる。\nd　燃焼により発生した直後のNOxは、大部分が二酸化窒素（NO2）である。", "options": ["a,b", "a,c", "b,d", "c,d", "a,d"], "answer": [0], "explanation": "a・bが正しい記述です。cは誤り（サーマルNOxは燃焼温度が「高い」ほど多く生成される）。dも誤り（発生直後は大部分が一酸化窒素（NO）であり、大気中で酸化されて二酸化窒素（NO2）に変化する）。"}, {"id": 418, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "有害大気汚染物質のうち、ベンゼンに関する次の記述のうち、誤っているものはどれか。", "options": ["ベンゼンは、揮発性有機化合物（VOC）の一種である。", "ベンゼンの主な発生源には、燃料の燃焼や自動車排出ガス、給油所等がある。", "ベンゼンの長期暴露による健康影響として、造血器系への影響（白血病等）が知られている。", "ベンゼンには、大気の環境基準が定められている。", "ベンゼンは、常温で固体の物質である。"], "answer": [4], "explanation": "誤っているのは(5)です。ベンゼンは常温で「液体」（無色の揮発性液体）です。「固体」という記述は誤りです。"}, {"id": 419, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "トリクロロエチレン及びテトラクロロエチレンに関する次の記述のうち、正しいものはどれか。", "options": ["いずれも金属の脱脂洗浄剤等として使用されてきた有機塩素系溶剤である。", "いずれも常温で気体の物質である。", "いずれも大気の環境基準は定められていない。", "いずれも自然界にのみ存在し、人工的に製造されることはない。", "いずれも水によく溶け、地下水汚染の原因とはならない。"], "answer": [0], "explanation": "正しいのは(1)です。トリクロロエチレン・テトラクロロエチレンは、いずれも金属部品の脱脂洗浄剤やドライクリーニング溶剤として使用されてきた有機塩素系溶剤で、常温では液体です。両物質とも大気の環境基準が定められており、水に溶けにくい性質から地下水汚染の原因物質としても知られています。"}, {"id": 420, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "ダイオキシン類の発生源に関する次の記述のうち、誤っているものはどれか。", "options": ["廃棄物の焼却過程は、ダイオキシン類の主要な発生源の一つである。", "ダイオキシン類は、燃焼温度が低く不完全燃焼となる条件で生成されやすい。", "ダイオキシン類には、ポリ塩化ジベンゾ-パラ-ジオキシン（PCDD）、ポリ塩化ジベンゾフラン（PCDF）等が含まれる。", "ダイオキシン類は、意図的に製造される工業製品としてのみ発生し、燃焼副生成物として生成することはない。", "ダイオキシン類の毒性は、異性体（同族体）によって強さが大きく異なる。"], "answer": [3], "explanation": "誤っているのは(4)です。ダイオキシン類は、廃棄物焼却等の燃焼過程における「副生成物」として非意図的に生成されるのが主な発生形態であり、「意図的に製造される工業製品としてのみ発生する」という記述は誤りです（かつて一部の農薬合成過程での副生も知られています）。"}, {"id": 421, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "アクリロニトリルに関する次の記述のうち、正しいものはどれか。", "options": ["アクリロニトリルは、合成繊維（アクリル繊維）や合成樹脂（ABS樹脂等）の原料として用いられる。", "アクリロニトリルは、有害大気汚染物質の指針値が定められていない物質である。", "アクリロニトリルは、常温で固体の物質である。", "アクリロニトリルには、毒性は確認されていない。", "アクリロニトリルは、天然にのみ存在し、工業的に製造されることはない。"], "answer": [0], "explanation": "正しいのは(1)です。アクリロニトリルはアクリル繊維やABS樹脂などの原料として広く工業的に使用される物質で、有害大気汚染物質の指針値が定められている物質の一つです。"}, {"id": 422, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "ヒ素及びその化合物に関する次の記述のうち、誤っているものはどれか。", "options": ["ヒ素は、非鉄金属製錬や石炭燃焼などに伴い排出されることがある。", "ヒ素化合物には、急性・慢性の健康影響が知られている。", "ヒ素は、大気の有害大気汚染物質の指針値が定められている物質の一つである。", "ヒ素による健康影響として、骨軟化症（イタイイタイ病様症状）が典型的な症状として知られている。", "ヒ素は半金属元素であり、化合物によって毒性の程度が異なる。"], "answer": [3], "explanation": "誤っているのは(4)です。骨軟化症（イタイイタイ病様の症状）はカドミウム中毒の典型的な健康影響であり、ヒ素の典型的な健康影響ではありません。ヒ素は皮膚障害や発がん性等が知られています。"}, {"id": 423, "domain": "大気有害物質特論", "sub": "性状_発生源", "type": "single", "q": "マンガン及びその化合物に関する次の記述のうち、正しいものはどれか。", "options": ["マンガンは、製鋼・合金製造等の工程で発生することがある有害大気汚染物質の指針値設定物質の一つである。", "マンガンは大気中には全く存在しない。", "マンガンの健康影響として、神経系への影響は確認されていない。", "マンガンは、常温で気体の物質である。", "マンガンは、有害大気汚染物質としての規制対象にはなっていない。"], "answer": [0], "explanation": "正しいのは(1)です。マンガンは製鋼・フェロマンガン製造などの工程から排出されることがあり、有害大気汚染物質の指針値が設定されている物質の一つです。神経系への影響（マンガン中毒によるパーキンソン病様症状等）も知られています。"}, {"id": 424, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "ガス吸収における処理操作の特徴に関する次の記述のうち、誤っているものはどれか。", "options": ["吸収装置は、ガスと液が大きな界面で接触するように工夫されている。", "吸収操作は、集じんやガスの冷却など、他の操作を兼ねることができる。", "吸収液を循環使用する場合、排水処理装置や再生設備が別途必要になる場合がある。", "ガス吸収は、吸着法と比較して、常に処理コストが高くなる。", "吸収液の選定にあたっては、対象ガスへの溶解度や反応性が考慮される。"], "answer": [3], "explanation": "誤っているのは(4)です。ガス吸収と吸着のコスト優劣は、対象ガスの濃度・性質・処理規模等の条件によって異なり、「常に」吸収の方が高コストになるとは一概には言えません。"}, {"id": 425, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "液分散形に分類されるガス吸収装置に関する次の記述のうち、誤っているものはどれか。", "options": ["スプレー塔は、液分散形に分類される。", "ベンチュリスクラバーは、液分散形に分類される。", "ぬれ壁塔は、ガス分散形に分類される。", "十字流接触装置は、液分散形に分類される。", "回転式（機械的に液を分散させる）スクラバーは、液分散形に分類される。"], "answer": [2], "explanation": "誤っているのは(3)です。ぬれ壁塔は、液が壁面を伝わって薄い液膜を形成する構造から「液分散形」に分類されます。「ガス分散形」という記述は誤りです。"}, {"id": 426, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "ガス分散形に分類されるガス吸収装置に関する次の記述のうち、正しいものはどれか。", "options": ["段塔（棚段塔）や充塡塔は、ガス分散形に分類される代表的な装置である。", "スプレー塔は、ガス分散形に分類される。", "ガス分散形の装置は、いずれも液を用いない乾式の装置である。", "ガス分散形は、液分散形と比較して常に圧力損失が小さい。", "ガス分散形の装置は、粒子状物質の除去にのみ使用され、ガス吸収には使用されない。"], "answer": [0], "explanation": "正しいのは(1)です。段塔（棚段塔）や充塡塔は、液中にガスを気泡状に分散させる、または充塡物を通じてガスと液を接触させる構造で、ガス分散形の代表例です。"}, {"id": 427, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "ガス吸着に用いる活性炭に関する次の記述のうち、誤っているものはどれか。", "options": ["ガス賦活炭は、石炭、木炭、ヤシ殻などに高温の水蒸気等を作用させてつくられる。", "添着炭は、木質原料等をりん酸などの薬品に浸漬した後、炭化させてつくられる。", "活性炭は、非極性物質よりも極性物質の吸着に優れている。", "アンモニアなど塩基性ガスの吸着には、酸性成分添着炭が有効とされる。", "活性炭は、炭素数の大きい炭化水素ほど吸着しやすい傾向がある。"], "answer": [2], "explanation": "誤っているのは(3)です。活性炭は一般に「非極性物質」の吸着に優れており、「極性物質の吸着に優れている」という記述は誤りです。極性の高い物質（水蒸気等）は活性炭にはあまり吸着されにくい傾向があります。"}, {"id": 428, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "触媒を用いた排ガス処理に関する次の記述のうち、正しいものはどれか。", "options": ["アンモニア接触還元法（選択的触媒還元法）は、窒素酸化物の除去に用いられる代表的な方法である。", "触媒燃焼法は、主に窒素酸化物の除去に用いられる方法である。", "触媒は、反応の前後でそれ自体が消費され、繰り返し使用することはできない。", "触媒による処理は、いおう酸化物の除去には一切適用されない。", "アンモニア接触還元法では、アンモニアを使用せずに窒素酸化物を分解する。"], "answer": [0], "explanation": "正しいのは(1)です。アンモニア接触還元法（選択的触媒還元法、SCR法）は、アンモニアを還元剤として触媒上で窒素酸化物を窒素と水に分解する、代表的な脱硝技術です。"}, {"id": 429, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "石灰スラリー吸収法及び水酸化マグネシウムスラリー吸収法に関する次の記述のうち、誤っているものはどれか。", "options": ["いずれも湿式の排煙脱硫方法として用いられる。", "いずれもいおう酸化物（SO2）の除去を目的とした処理法である。", "石灰スラリー吸収法では、副生成物として石こう（せっこう）が得られる場合がある。", "水酸化マグネシウムスラリー吸収法は、窒素酸化物（NOx）の除去を主目的とする方法である。", "いずれもアルカリ性の吸収液を用いる方法である。"], "answer": [3], "explanation": "誤っているのは(4)です。水酸化マグネシウムスラリー吸収法は、石灰スラリー吸収法と同様に「いおう酸化物（SOx）」の除去を目的とした湿式排煙脱硫技術であり、窒素酸化物の除去が主目的ではありません。"}, {"id": 430, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "洗浄集じん装置（スクラバー）の性能に関する次の記述のうち、誤っているものはどれか。", "options": ["ベンチュリスクラバーは、基本流速が大きいほど、微細なダストを捕集しやすい。", "ため水式スクラバーでは、一般に基本流速が小さいほど集じん率が高くなる。", "スプレー塔では、液ガス比が大きいほど、一般に集じん率が向上する傾向がある。", "洗浄集じん装置は、集じんとガスの吸収処理を同時に行うことができる場合がある。", "洗浄集じん装置は、水分を含んだ排ガスの処理には適さない。"], "answer": [4], "explanation": "誤っているのは(5)です。洗浄集じん装置はそもそも液（多くは水）を用いてダストを捕集する方式であり、湿分を含む排ガスの処理にも対応できます。「水分を含んだ排ガスの処理には適さない」という記述は誤りです。"}, {"id": 431, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "有害ガスの燃焼処理（直接燃焼法・触媒燃焼法）に関する次の記述のうち、正しいものはどれか。", "options": ["触媒燃焼法は、直接燃焼法と比較して、一般に低い温度で酸化分解を進めることができる。", "直接燃焼法は、触媒燃焼法より低い燃焼温度で処理が可能である。", "燃焼処理法は、揮発性有機化合物（VOC）の処理には全く適用されない。", "触媒燃焼法では、触媒は使用の有無にかかわらず反応速度に影響を与えない。", "燃焼処理法によって発生する熱は、一切回収・再利用することができない。"], "answer": [0], "explanation": "正しいのは(1)です。触媒燃焼法は触媒の作用により、直接燃焼法よりも「低い温度」で酸化分解反応を進行させることができ、燃料使用量の削減につながる利点があります。"}, {"id": 432, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "バグフィルターによる集じんに関する次の記述のうち、誤っているものはどれか。", "options": ["パルスジェット形払い落とし装置を用いるバグフィルターでは、含じんガスは常にろ布の外側から流入する。", "ダストの一次付着層が未形成と予測される場合は、プリコート粉を供給するとよい。", "高温のガスを処理する場合、ろ布の常用耐用温度以下に冷却してから処理することが望ましい。", "バグフィルターは、微細な粒子に対しても比較的高い捕集効率を得やすい集じん方式である。", "ろ布の材質には、耐熱性・耐薬品性等を考慮してさまざまな種類が使い分けられる。"], "answer": [0], "explanation": "誤っているのは(1)です。パルスジェット形払い落とし装置を用いるバグフィルターでは、含じんガスは通常「ろ布の外側から内側」に流入する形式が一般的ですが、払い落とし（クリーニング）は圧縮空気をろ布の内側（上部）から瞬時に吹き込むことで行われます。設問の「常に」という断定表現に注意が必要です（実際の過去問でも紛らわしい選択肢として出題されています）。"}, {"id": 433, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "排煙脱硝技術に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　選択的触媒還元法（SCR法）は、アンモニアを還元剤として触媒上でNOxを還元する方法である。\nb　選択的無触媒還元法（SNCR法）は、触媒を用いずに高温領域でアンモニアや尿素を吹き込みNOxを還元する方法である。\nc　SCR法は、一般にSNCR法よりも高いNOx除去率が得られるとされている。\nd　脱硝技術は、いおう酸化物（SOx）の除去技術に分類される。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（脱硝はいおう酸化物ではなく「窒素酸化物（NOx）」の除去技術です）。"}, {"id": 434, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "吸着塔の「破過曲線」に関する次の記述のうち、誤っているものはどれか。", "options": ["破過曲線とは、吸着塔の出口濃度が時間とともにどのように変化するかを示した曲線である。", "出口濃度が急激に立ち上がり始める点を「破過点」という。", "破過が生じるのは、吸着剤（活性炭等）の吸着容量が限界に近づき、対象物質を捕捉しきれなくなるためである。", "破過曲線の形状は、吸着剤の種類、ガス流速、対象物質の濃度等に影響を受けることはない。", "破過点に達した吸着剤は、交換又は再生（脱着処理）が必要となる。"], "answer": [3], "explanation": "誤っているのは(4)です。破過曲線の形状（破過点に至るまでの時間や曲線の勾配等）は、吸着剤の種類・充塡量、ガス流速、対象物質の濃度など複数の条件の影響を受けます。「影響を受けることはない」は誤りです。"}, {"id": 435, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "揮発性有機化合物（VOC）の処理技術に関する次の記述のうち、正しいものはどれか。", "options": ["VOCの処理技術には、燃焼法、吸着法、吸収法、生物処理法などがある。", "VOCは、いかなる技術によっても処理・除去することができない。", "VOCの処理には、必ず高温での直接燃焼が必要であり、他の方法は適用できない。", "活性炭による吸着法は、VOC処理には一切用いられない。", "VOC処理技術の選定は、濃度や風量にかかわらず常に同一の方式が最適である。"], "answer": [0], "explanation": "正しいのは(1)です。VOCの処理技術には燃焼法（直接燃焼・触媒燃焼・蓄熱燃焼）、吸着法（活性炭等）、吸収法、生物処理法など多様な方式があり、濃度・風量・成分等に応じて使い分けられます。"}, {"id": 436, "domain": "大気有害物質特論", "sub": "処理法", "type": "single", "q": "ガス吸収における物質移動の「二重境膜説」に関する次の記述のうち、正しいものはどれか。", "options": ["二重境膜説は、ガス相と液相の界面付近に、それぞれ薄い停滞膜（境膜）が存在し、そこでの分子拡散が物質移動の律速段階になるとする考え方である。", "二重境膜説は、ガス吸収ではなく、集じん装置の性能評価にのみ用いられる理論である。", "二重境膜説によれば、境膜の外側（主流部）でも濃度勾配が大きく、これが物質移動の主な抵抗となる。", "二重境膜説は、気液の界面において化学反応が起こらないことを前提とした理論では、成立しない。", "二重境膜説では、ガス境膜・液境膜のいずれか一方のみが物質移動抵抗を持つと仮定する。"], "answer": [0], "explanation": "正しいのは(1)です。二重境膜説は、気液界面の両側（ガス側・液側）にそれぞれ薄い停滞膜（境膜）があり、主流部は十分に混合されて濃度が均一である一方、境膜内の分子拡散が物質移動の律速段階になる、と考えるガス吸収の基礎理論です。ガス境膜・液境膜の両方が抵抗になりうる点が特徴です。"}, {"id": 437, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "大気汚染防止法における特定物質に関する次の記述のうち、正しいものはどれか。", "options": ["特定物質は、その排出により大気を汚染し、人の健康又は生活環境に急迫した危険をもたらすおそれがある物質として政令で定められている。", "特定物質は、有害大気汚染物質と全く同一の物質群を指す。", "特定物質に指定されている物質は、平常時の排出のみが規制対象であり、事故時の対応は規定されていない。", "特定物質の指定は、都道府県が個別に条例で定めている。", "特定物質には、ばい煙に該当する物質は一切含まれない。"], "answer": [0], "explanation": "正しいのは(1)です。特定物質は、事故時に大量排出された場合に急迫した危険をもたらすおそれがある物質として政令で指定されており（アンモニア、塩素、シアン化水素等28物質程度）、事故時の応急措置・通報義務の対象となります。"}, {"id": 438, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "特定物質が大量に漏えいする事故が発生した場合の対応に関する次の記述のうち、誤っているものはどれか。", "options": ["施設の設置者は、直ちに応急の措置（漏えいの停止、拡散防止等）を講じる必要がある。", "施設の設置者は、事故の状況を都道府県知事等に通報する義務がある。", "事故時の対応マニュアルや保護具の準備など、平常時からの備えが重要である。", "事故対応は、二次災害（引火・爆発・毒性物質の拡散等）の防止にも配慮する必要がある。", "特定物質の漏えい事故は、いかなる場合も直ちに全設備を稼働停止させることが法律上義務付けられている。"], "answer": [4], "explanation": "誤っているのは(5)です。事故時の対応は、漏えいした物質の種類・規模・状況に応じた「応急の措置」を講じることが求められますが、「いかなる場合も直ちに全設備を稼働停止させる」ことが一律に法律で義務付けられているわけではありません。"}, {"id": 439, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "アンモニアの漏えい事故時の対応に関する次の記述のうち、正しいものはどれか。", "options": ["アンモニアは水に非常によく溶けるため、散水（水噴霧）による吸収・希釈が漏えい対応の一つとして考えられる。", "アンモニアは、極めて不燃性の物質であり、火気の管理は一切不要である。", "アンモニアは無臭であるため、漏えいしても人が気づくことは難しい。", "アンモニアは、皮膚や粘膜への刺激性を持たない安全な物質である。", "アンモニアの漏えい対応では、風下側に留まって観察することが推奨される。"], "answer": [0], "explanation": "正しいのは(1)です。アンモニアは水に非常によく溶ける性質を持つため、散水による吸収・希釈が漏えい時の対応策の一つとなります。アンモニアは可燃性の範囲を持ち、強い刺激臭があり、粘膜への刺激性も強い物質です。風下側での対応は危険を伴うため避けるべきとされています。"}, {"id": 440, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "塩素の漏えい事故時の対応に関する次の記述のうち、誤っているものはどれか。", "options": ["塩素は空気より重く、地表付近に滞留しやすい性質がある。", "塩素は強い酸化性・毒性を持つ気体である。", "塩素の漏えい時には、風上側に退避することが基本とされる。", "塩素は、アンモニアと同様に不燃性かつ全く無害な気体である。", "塩素は黄緑色で特有の刺激臭を持つ気体である。"], "answer": [3], "explanation": "誤っているのは(4)です。塩素は強い酸化性・毒性を持つ有害な気体であり、「全く無害」というのは明確な誤りです。空気より重く地表に滞留しやすいため、退避時は風上・高所側への移動が基本とされます。"}, {"id": 441, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "シアン化水素に関する次の記述のうち、正しいものはどれか。", "options": ["シアン化水素は、極めて強い急性毒性を持つ気体であり、特定物質に指定されている。", "シアン化水素は、水に全く溶けない性質を持つ。", "シアン化水素は、常温で固体として存在する。", "シアン化水素には、毒性は確認されていない。", "シアン化水素は、大気汚染防止法上の規制対象には一切含まれていない。"], "answer": [0], "explanation": "正しいのは(1)です。シアン化水素は、細胞の呼吸を阻害する極めて強い急性毒性を持つ気体で、特定物質に指定されており事故時の措置の対象となります。"}, {"id": 442, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "ホルムアルデヒドに関する次の記述のうち、誤っているものはどれか。", "options": ["ホルムアルデヒドは、刺激臭を持つ気体で、水溶液はホルマリンと呼ばれる。", "ホルムアルデヒドは、シックハウス症候群の原因物質の一つとして知られている。", "ホルムアルデヒドは、可燃性・爆発性を持たない、燃焼と無縁の物質である。", "ホルムアルデヒドは、有害大気汚染物質の優先取組物質にも位置づけられている。", "ホルムアルデヒドは、樹脂原料や消毒剤等に用いられてきた物質である。"], "answer": [2], "explanation": "誤っているのは(3)です。ホルムアルデヒドは可燃性・爆発性を持つ物質であり、「燃焼と無縁」という記述は誤りです。取り扱いには火気管理上の注意が必要です。"}, {"id": 443, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "特定物質の性状に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　二酸化硫黄は、刺激臭を持つ無色の気体である。\nb　一酸化炭素は、無色・無臭の気体であり、血液中のヘモグロビンとの結合力が酸素より強い。\nc　硫化水素は、腐卵臭を持つ気体で、高濃度では逆に臭気を感じにくくなることがある。\nd　ホスゲンは、無臭で人体に無害な気体である。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（ホスゲンは特有の臭気を持ち、極めて強い毒性を有する気体で、「無害」ではありません）。"}, {"id": 444, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "特定物質の保護具・防護対策に関する次の記述のうち、正しいものはどれか。", "options": ["特定物質の漏えい対応に従事する者は、対象物質の性状に応じた適切な保護具（防毒マスク、保護衣等）を着用する必要がある。", "特定物質の取扱いにあたっては、保護具の着用は一切不要である。", "全ての特定物質に対して、同一の防毒マスク吸収缶で対応できる。", "保護具は、平常時の点検・整備は不要であり、事故発生時にのみ準備すればよい。", "特定物質の漏えい対応は、専門知識がなくても誰でも安全に行うことができる。"], "answer": [0], "explanation": "正しいのは(1)です。特定物質の性状（毒性、可燃性、反応性等）に応じて、適切な保護具を選定・着用する必要があります。防毒マスクの吸収缶は対象ガスの種類ごとに適合するものが異なるため、平常時からの点検・訓練も重要です。"}, {"id": 445, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "二硫化炭素に関する次の記述のうち、正しいものはどれか。", "options": ["二硫化炭素は、揮発性が高く引火性を有する液体である。", "二硫化炭素は、常温で気体として存在する。", "二硫化炭素は、人体への毒性が確認されていない安全な物質である。", "二硫化炭素は、特定物質には指定されていない。", "二硫化炭素は、水に極めてよく溶ける性質を持つ。"], "answer": [0], "explanation": "正しいのは(1)です。二硫化炭素は揮発性が高く引火性を持つ液体で、レーヨンやビスコース製造など化学工業で使用されてきました。神経毒性等も知られており、特定物質に指定されています。"}, {"id": 446, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "特定物質の爆発限界（爆発範囲）に関する次の記述のうち、正しいものはどれか。", "options": ["爆発限界とは、可燃性ガスと空気の混合気体が、点火源により爆発（燃焼）しうる濃度範囲をいう。", "爆発限界は、物質の毒性の強さを表す指標である。", "全ての可燃性ガスは、同一の爆発限界を持つ。", "爆発限界の外側の濃度であれば、常に安全であり火気管理は不要である。", "爆発限界は、温度や圧力の影響を一切受けない一定の値である。"], "answer": [0], "explanation": "正しいのは(1)です。爆発限界（爆発範囲）は、可燃性ガスが空気と混合した際に点火源があれば爆発的に燃焼しうる濃度範囲（下限界〜上限界）を指します。物質ごとに固有の値を持ち、温度・圧力等の条件によっても変動します。"}, {"id": 447, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "臭素に関する次の記述のうち、誤っているものはどれか。", "options": ["臭素は、常温で赤褐色の液体として存在する数少ない元素の一つである。", "臭素は、強い刺激臭と毒性・腐食性を有する。", "臭素は、密度が水より小さく、水に浮く性質を持つ。", "臭素の蒸気は、粘膜等への強い刺激性を持つ。", "臭素は特定物質に指定されている。"], "answer": [2], "explanation": "誤っているのは(3)です。臭素は密度が水よりも「大きく」、水に沈む重い液体です。「水に浮く」という記述は誤りです。"}, {"id": 448, "domain": "大気有害物質特論", "sub": "特定物質_緊急時措置", "type": "single", "q": "特定物質等の事故時における通報体制に関する次の記述のうち、正しいものはどれか。", "options": ["事故発生時、施設の設置者は速やかに都道府県知事等（又はその委任を受けた者）に通報する必要がある。", "事故時の通報は、事故発生から1か月以内に行えばよいとされている。", "事故の規模にかかわらず、通報義務は一切生じない。", "通報先は、必ず環境大臣でなければならない。", "事故時の通報は、口頭ではなく必ず書面のみで行わなければならない。"], "answer": [0], "explanation": "正しいのは(1)です。特定物質等の事故時には、施設の設置者が「直ちに」応急の措置を講じるとともに、都道府県知事等へ速やかに通報することが求められます。"}, {"id": 449, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "JISによる排ガス中の塩化水素の分析方法（イオンクロマトグラフ法）に関する次の記述のうち、正しいものはどれか。", "options": ["試料ガス中の塩化水素を吸収液に吸収させた後、イオンクロマトグラフにより塩化物イオン濃度を定量する。", "イオンクロマトグラフ法は、気体成分を直接、分離カラムに導入して分析する方法である。", "イオンクロマトグラフ法は、塩化水素の分析には適用できない。", "イオンクロマトグラフ法では、検量線を作成する必要はない。", "イオンクロマトグラフ法は、陽イオンの分析にのみ用いられ、陰イオン（塩化物イオン等）の分析には使用できない。"], "answer": [0], "explanation": "正しいのは(1)です。排ガス中の塩化水素をまず吸収液（純水等）に吸収させて塩化物イオンとし、イオンクロマトグラフでそのイオン濃度を定量する、という流れがJISによる分析方法の基本です。イオンクロマトグラフ法は陰イオン分析にも広く用いられます。"}, {"id": 450, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "JISによる排ガス中のふっ素化合物の分析方法（イオン電極法）に関する次の記述のうち、誤っているものはどれか。", "options": ["吸収液には、水酸化ナトリウム溶液等のアルカリ性吸収液が一般に用いられる。", "分析用試料溶液には、イオン強度調整用緩衝液を加える。", "イオン電極法は、フッ化物イオンに選択的に応答する電極を用いる分析法である。", "妨害イオンの影響を排除するための処理が必要な場合がある。", "イオン電極法による測定では、検量線の作成が不要である。"], "answer": [4], "explanation": "誤っているのは(5)です。イオン電極法においても、電位とイオン濃度の関係を表す検量線の作成は必要であり、「検量線の作成が不要」という記述は誤りです。"}, {"id": 451, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "排ガス中の鉛の分析方法に関する次の記述のうち、正しいものはどれか。", "options": ["フレーム原子吸光法、ICP発光分光分析法、ICP質量分析法など、複数の分析方法が用いられる。", "鉛の分析には、イオンクロマトグラフ法のみが用いられる。", "鉛の分析方法は、いずれも同一の検出下限値を持つ。", "鉛の分析には、吸光光度法以外の方法は一切使用できない。", "ICP質量分析法は、他の方法と比較して常に感度が低い方法である。"], "answer": [0], "explanation": "正しいのは(1)です。排ガス中の鉛の分析には、フレーム原子吸光法、ICP発光分光分析法、ICP質量分析法など複数の方法が用いられ、一般に検出感度はICP質量分析法が高く、フレーム原子吸光法は比較的低いとされています（方法により適用濃度範囲が異なる）。"}, {"id": 452, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "排ガス試料の採取方法に関する次の記述のうち、誤っているものはどれか。", "options": ["試料採取位置は、ダクトの直管部など、ガスの流れが安定した箇所を選定することが望ましい。", "採取したガス中の水分量やダスト等の影響を考慮し、必要に応じて前処理を行う。", "試料採取に用いる器具の材質は、対象物質と反応・吸着しにくいものを選定する必要がある。", "試料採取条件（採取時間、流量等）は、対象物質の分析方法にかかわらず常に同一でよい。", "採取前後で器具の洗浄やブランク試験を行い、汚染の有無を確認することが望ましい。"], "answer": [3], "explanation": "誤っているのは(4)です。試料採取条件（採取時間、吸引流量等）は、対象物質やその分析方法（求められる検出感度、妨害物質の有無等）に応じて適切に設定する必要があり、「常に同一でよい」という記述は誤りです。"}, {"id": 453, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "排ガス中の二酸化硫黄自動計測システムに関する次の記述のうち、正しいものはどれか。", "options": ["紫外線蛍光法は、二酸化硫黄の自動計測方法の一つとして用いられている。", "二酸化硫黄の自動計測には、電量法は一切使用されない。", "自動計測システムは、一度設置すれば校正・点検を行う必要が全くない。", "自動計測システムの測定結果は、規制目的には一切利用できない。", "二酸化硫黄の自動計測法は、常に手分析法よりも精度が劣る。"], "answer": [0], "explanation": "正しいのは(1)です。紫外線蛍光法は、排ガス中の二酸化硫黄濃度を連続的に自動計測する方法の一つとして広く用いられています。自動計測システムは定期的な校正・点検が必要で、規制の遵守状況の確認等にも活用されます。"}, {"id": 454, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "排ガス中の窒素酸化物自動計測器に関する次の記述のうち、誤っているものはどれか。", "options": ["化学発光法は、窒素酸化物の自動計測方法の一つとして広く用いられている。", "化学発光法は、一酸化窒素（NO）とオゾンとの反応による発光を利用する方法である。", "二酸化窒素（NO2）を測定する場合、化学発光法ではNO2を一旦NOに変換してから測定することがある。", "窒素酸化物の自動計測器は、いかなる場合も校正が不要である。", "窒素酸化物自動計測器は、排出基準の遵守状況の確認等に用いられる。"], "answer": [3], "explanation": "誤っているのは(4)です。窒素酸化物自動計測器も、他の自動計測器と同様に定期的な校正（ゼロ校正・スパン校正等）が必要であり、「いかなる場合も校正が不要」という記述は誤りです。"}, {"id": 455, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "燃料や試料の元素分析法・発熱量測定法に関する次の記述のうち、正しいものはどれか。", "options": ["元素分析により、燃料中の炭素・水素・窒素・硫黄等の含有割合を求めることができる。", "発熱量の測定には、ボンベ熱量計（断熱式熱量計）等が用いられることがある。", "元素分析の結果は、燃焼計算（理論空気量の算定等）には一切使用されない。", "発熱量には高発熱量と低発熱量の区別はなく、常に同一の値である。", "元素分析法は、固体燃料には適用できず、液体・気体燃料にのみ用いられる。"], "answer": [0], "explanation": "正しいのは(1)です。元素分析により燃料中の炭素・水素・窒素・硫黄などの含有割合を明らかにでき、この結果は理論空気量や排ガス量の燃焼計算にも活用されます。発熱量には水蒸気の凝縮潜熱を含む「高発熱量」と含まない「低発熱量」の区別があります。"}, {"id": 456, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "排ガス中の一酸化炭素の分析方法に関する次の記述のうち、正しいものはどれか。", "options": ["非分散形赤外線分析計（NDIR）は、一酸化炭素の分析方法の一つとして広く用いられている。", "一酸化炭素の分析には、イオン電極法のみが用いられる。", "一酸化炭素は、赤外線を全く吸収しない物質である。", "一酸化炭素の分析方法は、いおう酸化物の分析方法と全く同一である。", "一酸化炭素の自動計測には、化学発光法が標準的に用いられる。"], "answer": [0], "explanation": "正しいのは(1)です。一酸化炭素は特定の波長の赤外線を吸収する性質を持つため、非分散形赤外線分析計（NDIR）による分析・連続測定が広く行われています。"}, {"id": 457, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "有害物質の分析における検量線の作成に関する次の記述のうち、誤っているものはどれか。", "options": ["検量線は、既知濃度の標準溶液（標準ガス）を用いて、濃度と測定値（吸光度、電位等）の関係を求めるものである。", "検量線の直線性を確認するため、複数の濃度点で測定を行うことが望ましい。", "検量線は一度作成すれば、機器の状態にかかわらず永続的に使用できる。", "共存物質による妨害がある場合、検量線に影響が生じることがある。", "検量線の作成には、試料と同様の前処理を行った標準溶液を用いることが望ましい場合がある。"], "answer": [2], "explanation": "誤っているのは(3)です。検量線は機器の状態（経時変化、汚れ、光源の劣化等）によって変動しうるため、定期的な作成・確認（再校正）が必要であり、「永続的に使用できる」という記述は誤りです。"}, {"id": 458, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "有害物質の分析方法選定における妨害物質への対応に関する次の記述のうち、正しいものはどれか。", "options": ["共存する物質が測定対象物質の分析に影響（妨害）を及ぼす場合、前処理や分析条件の調整により妨害を排除・低減する必要がある。", "妨害物質の影響は、分析結果には一切影響を及ぼさない。", "妨害物質が存在する場合、分析自体を行うことができないため、常に分析を中止しなければならない。", "妨害物質への対応は、いかなる分析方法においても不要である。", "妨害物質の存在は、検量線の作成には無関係である。"], "answer": [0], "explanation": "正しいのは(1)です。共存物質による妨害が想定される場合、マスキング剤の添加、分離操作、分析条件（波長選択等）の調整などにより妨害を排除・低減する対応が必要です。"}, {"id": 459, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "水銀の大気排出施設における排出ガス中の水銀濃度測定に関する次の記述のうち、正しいものはどれか。", "options": ["水銀の測定方法には、還元気化-原子吸光法や還元気化-冷原子蛍光法などが用いられる。", "水銀の測定には、いかなる分析方法も確立されていない。", "水銀排出施設に対する測定義務は、大気汚染防止法上定められていない。", "水銀濃度の測定結果は、規制基準の遵守状況の確認に用いられることはない。", "水銀は気化しない性質を持つため、ガス状での測定は不可能である。"], "answer": [0], "explanation": "正しいのは(1)です。水銀の測定には、還元気化-原子吸光法や還元気化-冷原子蛍光法など、水銀を還元して気化させた上で検出する方法が用いられます。水銀排出施設には大気汚染防止法上の測定・記録義務があります。"}, {"id": 460, "domain": "大気有害物質特論", "sub": "測定_分析法", "type": "single", "q": "有害大気汚染物質のモニタリング（大気環境中の測定）に関する次の記述のうち、誤っているものはどれか。", "options": ["有害大気汚染物質の大気環境中の濃度は、全国の測定地点で継続的にモニタリングされている。", "モニタリングデータは、環境基準・指針値の達成状況の評価等に活用される。", "モニタリングの対象物質・地点数は、毎年度全く同一で見直しが行われることはない。", "測定結果は、国や地方公共団体により公表されることがある。", "モニタリング結果は、排出抑制対策の効果を検証する際の基礎データともなる。"], "answer": [2], "explanation": "誤っているのは(3)です。有害大気汚染物質のモニタリング対象物質や測定地点は、科学的知見の蓄積や行政上の必要性等に応じて見直されることがあり、「毎年度全く同一で見直しが行われることはない」という記述は誤りです。"}, {"id": 461, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "低層大気中の気温減率に関する次の記述のうち、正しいものはどれか。", "options": ["乾燥断熱減率は約9.8℃/kmであり、乾燥した空気塊が断熱的に上下移動する際の温度変化率を表す。", "乾燥断熱減率は、地域や季節によって大きく変動する値である。", "実際の大気中の気温減率（環境減率）は、常に乾燥断熱減率と完全に一致する。", "気温減率は、大気の安定・不安定を判断する材料にはならない。", "乾燥断熱減率は、湿潤断熱減率よりも小さい値である。"], "answer": [0], "explanation": "正しいのは(1)です。乾燥断熱減率は約9.8℃/km（0.0098℃/m）というほぼ一定の値で、空気塊が断熱的に上下移動する際の温度変化を表します。実際の大気（環境減率）はこの値と一致するとは限らず、その差が大気安定度の判断材料になります。乾燥断熱減率は湿潤断熱減率より大きい値です。"}, {"id": 462, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "大気の安定度に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　周囲より温度が高くなった気塊には、上昇に転じようとする浮力が働く。\nb　環境減率が乾燥断熱減率より小さい（気温の低下が緩やかな）場合、大気は安定な状態になりやすい。\nc　大気が不安定な状態では、鉛直方向の拡散が抑制され、汚染物質が拡散しにくくなる。\nd　中立の状態とは、気塊が変位しても元の位置に戻ろうとも、さらに変位し続けようともしない状態をいう。", "options": ["a,b,d", "a,b,c", "b,c,d", "a,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・dが正しい記述です。cは誤り（大気が「不安定」な状態では、鉛直方向の対流・拡散が「促進」され、汚染物質は拡散しやすくなります。逆に「安定」な状態で拡散が抑制されます）。"}, {"id": 463, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "逆転層に関する次の記述のうち、誤っているものはどれか。", "options": ["逆転層とは、高度が上がるにつれて気温が上昇する層をいう。", "逆転層は、大気の鉛直方向の混合・拡散を妨げる働きをする。", "逆転層の下に汚染物質が閉じ込められると、地表付近の濃度が高くなることがある。", "接地逆転層は、主に夜間の放射冷却によって地表付近に形成されやすい。", "逆転層が存在する大気は、逆転層が存在しない大気よりも常に汚染物質の拡散が促進される。"], "answer": [4], "explanation": "誤っているのは(5)です。逆転層は大気の鉛直混合を「妨げる」働きをするため、逆転層が存在する方がむしろ汚染物質の拡散は「抑制」されやすくなります。「常に拡散が促進される」は誤りです。"}, {"id": 464, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "混合層に関する次の記述のうち、誤っているものはどれか。", "options": ["混合層の上端には、しばしば逆転層が形成される。", "日射による地表面加熱により、日中の混合層の厚さは時間の経過とともに発達する傾向がある。", "混合層内部では、活発な熱対流により温位がほぼ一様になる傾向がある。", "混合層の厚さは、時間帯や気象条件にかかわらず常に一定である。", "混合層は、大気汚染物質が拡散する範囲の目安として扱われることがある。"], "answer": [3], "explanation": "誤っているのは(4)です。混合層の厚さは、日射の強さ・時間帯・季節・地表面の状態など気象条件によって変動し、「常に一定」ではありません。日中に発達し、夜間には縮小する傾向があります。"}, {"id": 465, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "煙の上昇（プルームライズ）に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　煙は、排出時の上向きの運動量の効果と、周囲より高温であることによる浮力の効果によって上昇する。\nb　CONCAWEの式は、浮力効果を主に考慮した上昇式の一つとされる。\nc　無風に近い状態で用いられる上昇式として、ブリッグスの式などが知られている。\nd　煙の上昇高さは、風速の影響を受けない。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（煙の上昇高さは風速の影響を強く受け、一般に風速が大きいほど上昇高さは小さくなる傾向があります）。"}, {"id": 466, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "ダウンウォッシュ（後流巻き込み現象）に関する次の記述のうち、正しいものはどれか。", "options": ["ダウンウォッシュとは、煙突からの排出速度が風速に対して相対的に小さい場合等に、煙が煙突や建屋の後流に巻き込まれて地表付近に降下しやすくなる現象をいう。", "ダウンウォッシュは、煙突が高いほど発生しやすくなる現象である。", "ダウンウォッシュは、風速が強いほど発生しにくくなる現象である。", "ダウンウォッシュを防ぐには、排出速度を風速に対して相対的に小さくすることが有効である。", "ダウンウォッシュは、地表濃度を低下させる望ましい現象として扱われる。"], "answer": [0], "explanation": "正しいのは(1)です。ダウンウォッシュは、排出速度が風速に対して相対的に小さい場合や、煙突周辺の建屋の影響により、煙が後流に巻き込まれて地表近くまで降下しやすくなる現象です。地表濃度を高めてしまう望ましくない現象であり、排出速度を風速より十分大きく保つことが対策の一つとされます。"}, {"id": 467, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "パスキルの大気安定度分類に関する次の記述のうち、誤っているものはどれか。", "options": ["パスキルの安定度分類は、風速や日射量（またはその代替指標）等をもとに大気の安定度をいくつかの階級に分類する方法である。", "一般に、日射が強く風速が弱い状況では、不安定側の階級に分類されやすい。", "夜間で風速が弱い状況では、安定側の階級に分類されやすい傾向がある。", "パスキルの安定度階級は、拡散幅（σy、σz）の推定に利用されることがある。", "パスキルの安定度分類は、風速や日射量にかかわらず、常に同一の階級となる。"], "answer": [4], "explanation": "誤っているのは(5)です。パスキルの安定度分類は、まさに風速や日射量等の気象条件に応じて階級が変わる分類方法であり、「常に同一の階級となる」は誤りです。"}, {"id": 468, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "正規形プルーム式による拡散濃度の計算に関する次の記述のうち、正しいものはどれか。", "options": ["正規形プルーム式は、汚染物質の風下方向の濃度分布が、水平・鉛直方向に正規分布（ガウス分布）に従うと仮定するモデルである。", "正規形プルーム式は、風速がゼロの無風状態を前提として組み立てられた式である。", "正規形プルーム式では、拡散幅（σy、σz）を考慮する必要はない。", "正規形プルーム式は、有効煙突高さを考慮しない計算式である。", "正規形プルーム式による濃度計算では、排出源からの距離にかかわらず、濃度は常に一定となる。"], "answer": [0], "explanation": "正しいのは(1)です。正規形プルーム式（ガウスプルームモデル）は、風下方向に流れる煙の水平・鉛直方向の濃度分布が正規分布に従うと仮定して濃度を推定する代表的なモデルで、拡散幅（σy、σz）や有効煙突高さ等をパラメータとして用います。"}, {"id": 469, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "パフ式（パフモデル）に関する次の記述のうち、正しいものはどれか。", "options": ["パフ式は、風速が弱く、汚染物質の拡散が定常状態とみなしにくい状況の濃度推定に用いられることがある。", "パフ式は、常に強風下での定常的な拡散状況にのみ適用される。", "パフ式とプルーム式は、全く同じ前提条件の下で使われるモデルである。", "パフ式は、事故時の急激なガス漏えいの拡散予測には利用できない。", "パフ式は、拡散幅の概念を一切使用しない計算方法である。"], "answer": [0], "explanation": "正しいのは(1)です。プルーム式が定常的な連続排出を前提とするのに対し、パフ式は風速が弱く定常状態を仮定しにくい状況や、瞬間的・断続的な排出（事故時の漏えい等）の拡散予測に用いられることがあります。"}, {"id": 470, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "複雑地形における大気拡散予測モデルに関する次の記述のうち、誤っているものはどれか。", "options": ["米国EPAが推奨するAERMODは、複雑地形や建屋影響にも対応可能な汎用的な拡散モデルの一つとされる。", "複雑地形上の拡散予測手法の一つとして、風洞実験を用いる方法がある。", "複雑地形における拡散は、平坦地における拡散と全く同じ挙動を示すため、特別なモデルを用いる必要はない。", "数値流体力学（CFD）を用いたシミュレーションも、複雑地形の拡散予測に活用されることがある。", "複雑地形では、地形による気流の乱れ（渦の発生等）が拡散挙動に影響を与えることがある。"], "answer": [2], "explanation": "誤っているのは(3)です。複雑地形では、地形による気流の乱れや局地風の影響で拡散挙動が平坦地と異なるため、AERMODや風洞実験、CFD解析など、地形の影響を考慮した特別な予測手法が用いられます。"}, {"id": 471, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "煙突からの汚染物質の拡散と最大着地濃度の関係に関する次の記述のうち、誤っているものはどれか。", "options": ["有効煙突高さが高いほど、一般に最大着地濃度は低くなる傾向がある。", "拡散幅（σy、σz）が大きくなるほど、一般に最大着地濃度は低くなる傾向がある。", "排出量が多いほど、一般に最大着地濃度は高くなる傾向がある。", "最大着地濃度が出現する風下距離は、大気安定度の影響を受けることがある。", "最大着地濃度は、排出条件や気象条件にかかわらず、常に一定の値をとる。"], "answer": [4], "explanation": "誤っているのは(5)です。最大着地濃度は、排出量・有効煙突高さ・風速・大気安定度など複数の条件によって変動するものであり、「常に一定の値」ではありません。"}, {"id": 472, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "有効煙突高さに関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　有効煙突高さは、実際の煙突の高さに、煙の上昇高さ（プルームライズ）を加えたものとして表される。\nb　有効煙突高さが高いほど、一般に地表への影響は小さくなる傾向がある。\nc　有効煙突高さは、排出ガスの温度や排出速度の影響を受けることがある。\nd　有効煙突高さは、実際の煙突の高さより常に低い値になる。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（有効煙突高さは実際の煙突高さに上昇高さを加えるため、通常は実際の煙突高さより「高く」なります）。"}, {"id": 473, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "接地逆転層（放射性逆転層）の形成条件に関する次の記述のうち、正しいものはどれか。", "options": ["接地逆転層は、晴れて風が弱い夜間に、地表面からの放射冷却によって形成されやすい。", "接地逆転層は、日中の強い日射によって最も発達しやすい。", "接地逆転層は、強風・曇天の条件下で最も発達しやすい。", "接地逆転層は、海上でのみ発生し、陸上では発生しない。", "接地逆転層は、季節や天候にかかわらず、常に一定の高さで発生する。"], "answer": [0], "explanation": "正しいのは(1)です。接地逆転層（放射性逆転層）は、晴天・弱風の夜間に地表面が放射冷却により急速に冷え、地表付近の気温が上空より低くなることで形成されやすくなります。"}, {"id": 474, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "大気境界層に関する次の記述のうち、誤っているものはどれか。", "options": ["大気境界層とは、地表面の影響を直接受ける、大気下層の層をいう。", "大気境界層の厚さは、時間帯や気象条件によって変化する。", "大気境界層の中では、地表摩擦の影響により風速が高度とともに変化する傾向がある。", "大気境界層より上空の自由大気では、地表摩擦の影響はほとんど無視できるとされる。", "大気境界層の厚さは、常に数十kmの規模である。"], "answer": [4], "explanation": "誤っているのは(5)です。大気境界層の厚さは一般に数百m〜数km程度とされ、「常に数十km」というのは誤りです。"}, {"id": 475, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "風速の鉛直分布に関する次の記述のうち、正しいものはどれか。", "options": ["地表付近では地表摩擦の影響により、一般に高度が上がるほど風速が大きくなる傾向がある。", "風速の鉛直分布は、高度にかかわらず常に一定である。", "地表粗度（建物や樹木等の状況）は、風速の鉛直分布に影響を与えない。", "風速の鉛直分布を表す方法として、べき乗則などが用いられることがある。", "大気安定度は、風速の鉛直分布には一切関係しない。"], "answer": [3], "explanation": "正しいのは(4)です。地表摩擦の影響で高度が上がるほど風速は大きくなる傾向があり、この関係を表すのにべき乗則（風速が高度のべき乗に比例するという近似式）が用いられることがあります。地表粗度や大気安定度も鉛直分布に影響を与えます。"}, {"id": 476, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "拡散幅（σy、σz）に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　σyは水平方向の拡散幅、σzは鉛直方向の拡散幅を表す。\nb　拡散幅は、風下距離が長くなるほど一般に大きくなる傾向がある。\nc　拡散幅は、大気安定度によって異なる値をとる。\nd　拡散幅は、風下距離にかかわらず常に一定の値である。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（拡散幅は風下距離とともに変化する値であり、「常に一定」ではありません）。"}, {"id": 477, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "トレーサー実験による大気拡散の検証に関する次の記述のうち、正しいものはどれか。", "options": ["トレーサー実験は、追跡が容易な物質（トレーサー）を放出し、その拡散状況を実測することで拡散モデルの妥当性等を検証する手法である。", "トレーサー実験は、理論計算のみで完結し、実測は一切行わない手法である。", "トレーサー実験に用いる物質は、必ず有害性の高い物質でなければならない。", "トレーサー実験は、風速や大気安定度が変化しない一定条件下でしか実施できない。", "トレーサー実験の結果は、拡散モデルの検証には一切利用されない。"], "answer": [0], "explanation": "正しいのは(1)です。トレーサー実験は、追跡しやすい物質を意図的に放出し、その拡散状況を実測することで、理論的な拡散モデルの妥当性を検証したり、パラメータを推定したりするために用いられる手法です。"}, {"id": 478, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "内部境界層に関する次の記述のうち、正しいものはどれか。", "options": ["内部境界層とは、地表面の性質（粗度、温度等）が急変する地点（海岸線等）の風下側に形成される、局所的な境界層をいう。", "内部境界層は、平坦で均一な地表面が続く内陸部のみで発生する現象である。", "内部境界層の発達は、地表面の性質の変化とは無関係である。", "内部境界層は、海岸線付近の煙の拡散挙動には全く影響を与えない。", "内部境界層は、常に一定の高さで発達し、風下距離の影響を受けない。"], "answer": [0], "explanation": "正しいのは(1)です。内部境界層は、海岸線のように地表面の性質（粗度や温度等）が急激に変化する地点の風下側で形成される局所的な境界層で、臨海部の工場等における煙の拡散挙動に影響を与えることがあります。"}, {"id": 479, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "煙の形状と大気安定度の関係に関する次の記述のうち、誤っているものはどれか。", "options": ["大気が不安定な状態では、煙が上下に大きく波打つような形状（ルーピング）になることがある。", "大気が安定な状態では、煙が水平方向にはあまり広がらず、細く伸びるような形状（ファニング）になることがある。", "中立に近い状態では、煙が円錐状に広がる形状（コーニング）になることがある。", "接地逆転層がある状態から不安定層に変わる境界付近では、煙が地表付近に降下しやすい形状（フューミゲーション）になることがある。", "煙の形状は、大気安定度にかかわらず、常に同一の円錐形状を示す。"], "answer": [4], "explanation": "誤っているのは(5)です。煙の形状（ルーピング、コーニング、ファニング、フューミゲーション等）は大気安定度によって大きく異なり、「常に同一の円錐形状」というのは誤りです。"}, {"id": 480, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "中立境界層に関する次の記述のうち、正しいものはどれか。", "options": ["中立境界層とは、気温減率がほぼ乾燥断熱減率に近く、大気が安定でも不安定でもない状態の境界層をいう。", "中立境界層は、強い日射がある日中にのみ形成される。", "中立境界層では、鉛直方向の対流が最も活発になる。", "中立境界層は、気象条件にかかわらず、常に同一の厚さを保つ。", "中立境界層という概念は、大気拡散の議論には用いられない。"], "answer": [0], "explanation": "正しいのは(1)です。中立状態は気温減率がほぼ乾燥断熱減率に等しく、気塊が変位しても加速も減速もしない、安定でも不安定でもない状態を指し、強風時などに生じやすいとされます。"}, {"id": 481, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "煙流の濃度分布に関する次の記述のうち、誤っているものはどれか。", "options": ["煙流の中心軸上の濃度は、一般に軸から離れるほど低くなる傾向がある。", "地表面での反射を考慮するモデルでは、地表を鏡のように扱い、仮想的な発生源（鏡像源）を設定して計算することがある。", "煙流の濃度分布は、風速が大きいほど一般に希釈されやすく、濃度は低くなる傾向がある。", "地表面が完全に汚染物質を吸収する条件では、地表面での反射は考慮されない。", "煙流の濃度分布は、気象条件にかかわらず、常に同一のパターンを示す。"], "answer": [4], "explanation": "誤っているのは(5)です。煙流の濃度分布は、風速・大気安定度・拡散幅等の気象条件によって形状やピーク位置が変化するため、「常に同一のパターン」というのは誤りです。"}, {"id": 482, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "風向の変動と気流の蛇行（メアンダリング）に関する次の記述のうち、正しいものはどれか。", "options": ["風向は、短時間のうちにも変動（蛇行）することがあり、これが長時間平均でみた汚染物質の拡がりに影響することがある。", "風向は、いかなる状況でも完全に一定に保たれる。", "風向の変動（蛇行）は、瞬間的な濃度分布には影響を与えるが、長時間平均濃度には全く影響しない。", "気流の蛇行は、風速が非常に強い状況でのみ生じる現象である。", "気流の蛇行という現象は、大気拡散の実務では考慮されない。"], "answer": [0], "explanation": "正しいのは(1)です。風向は短時間で変動（蛇行）することがあり、この変動を考慮することで、長時間平均でみた汚染物質の水平方向への拡がりをより実態に近く評価できるとされています。"}, {"id": 483, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "拡散シミュレーションモデルに関する次の記述のうち、誤っているものはどれか。", "options": ["シミュレーションモデルは、気象条件や地形条件を考慮して汚染物質の拡散状況を計算機上で再現・予測する手法である。", "シミュレーションモデルの計算結果の精度は、入力する気象データや排出源データの精度に影響される。", "シミュレーションモデルには、正規形プルームモデルのような比較的簡易なものから、複雑な数値流体力学モデルまで様々な種類がある。", "シミュレーションモデルは、実測値による検証を一切必要としない。", "シミュレーションモデルは、大規模な環境影響評価等において活用されることがある。"], "answer": [3], "explanation": "誤っているのは(4)です。シミュレーションモデルの妥当性・精度を確認するためには、実測値（トレーサー実験の結果や実際の測定局データ等）との比較・検証が重要であり、「一切必要としない」は誤りです。"}, {"id": 484, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "大気安定度が地表濃度に与える影響に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　不安定な大気では、鉛直方向の拡散が促進されるため、煙突近傍での地表濃度が比較的高くなることがある。\nb　安定な大気では、鉛直方向の拡散が抑制されるため、遠方まで煙が拡散しにくい状態が続くことがある。\nc　接地逆転層がある状態から日中に不安定層へ変わる過渡期には、上空に滞留していた汚染物質が一気に地表付近に取り込まれることがある（フューミゲーション）。\nd　大気安定度は、地表濃度には全く影響しない。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは誤り（大気安定度は地表濃度に大きな影響を与える要素です）。"}, {"id": 485, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "建屋影響（ビルダウンウォッシュを含む）が大気拡散に与える影響に関する次の記述のうち、正しいものはどれか。", "options": ["煙突近傍に高い建屋がある場合、その後流の乱れにより、煙が予想以上に地表近くに引き込まれることがある。", "建屋の存在は、大気拡散の挙動に一切影響を与えない。", "建屋影響は、煙突が建屋よりも著しく低い場合にのみ生じ、煙突が高い場合には無関係である。", "建屋影響を避けるためには、煙突の高さをできるだけ低くすることが有効である。", "建屋影響は、風速に関係なく常に同じ強さで現れる。"], "answer": [0], "explanation": "正しいのは(1)です。煙突近傍に建屋がある場合、その後流に生じる乱流により煙が地表近くまで引き込まれる（ビルダウンウォッシュ）ことがあります。この影響を避けるには、煙突高さを建屋の影響が及ぶ高さより十分高くすることが対策の一つとなります（「低くする」は誤りの方向）。"}, {"id": 486, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "大気の熱的性質と鉛直安定度の関係に関する次の記述のうち、誤っているものはどれか。", "options": ["地表面が日射で強く加熱される日中は、地表付近の大気が不安定になりやすい。", "夜間、地表面が放射冷却で冷える状況では、地表付近の大気が安定になりやすい。", "海上は陸上に比べて、日変化による大気安定度の変動が大きい傾向がある。", "大気の熱的性質（安定度）は、季節や天候によっても変化する。", "大気安定度の日変化は、汚染物質の拡散状況の日変化にも影響を与える。"], "answer": [2], "explanation": "誤っているのは(3)です。海面は陸地に比べて熱容量が大きく日変化が小さいため、海上の大気安定度の日変化は「陸上より小さい」傾向があります。「大きい」は誤りです。"}, {"id": 487, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "ブリッグスの上昇式に関する次の記述のうち、正しいものはどれか。", "options": ["ブリッグスの上昇式は、運動量効果と浮力効果の両方を考慮できる、代表的な煙の上昇式の一つである。", "ブリッグスの上昇式は、浮力効果を一切考慮しない式である。", "ブリッグスの上昇式は、風速の影響を受けない式である。", "ブリッグスの上昇式は、無風時にのみ適用される特殊な式である。", "ブリッグスの上昇式は、大気安定度の影響を一切受けない式である。"], "answer": [0], "explanation": "正しいのは(1)です。ブリッグスの上昇式は、排出時の運動量効果と煙の浮力効果の両方を考慮し、風速や大気安定度の条件に応じた式の形をとる、広く用いられる代表的な上昇式です。"}, {"id": 488, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "大規模設備からの大気汚染物質の排出と環境濃度予測に関する次の記述のうち、誤っているものはどれか。", "options": ["環境濃度予測には、排出源の位置・高さ・排出量・排出温度等の排出源情報が必要となる。", "環境濃度予測には、風向・風速・大気安定度等の気象データが必要となる。", "環境濃度予測モデルの選定にあたっては、対象地域の地形の複雑さも考慮要素となりうる。", "環境濃度予測は、単一の煙突からの排出のみを対象とし、複数の発生源の重畳影響は考慮できない。", "環境濃度予測の結果は、環境影響評価や施設の立地検討等に活用されることがある。"], "answer": [3], "explanation": "誤っているのは(4)です。環境濃度予測モデルは、複数の発生源からの寄与を足し合わせる（重畳させる）ことで、地域全体の濃度分布を評価することも可能です。「単一の煙突のみ」という限定は誤りです。"}, {"id": 489, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "大気安定度分類において、日射が強く風速が弱い状況で分類される階級の一般的な性質に関する次の記述のうち、正しいものはどれか。", "options": ["この状況（強い日射・弱風）では、大気は不安定側に分類されやすく、鉛直方向の拡散が促進されやすい。", "この状況では、大気は安定側に分類されやすく、鉛直方向の拡散が抑制されやすい。", "日射の強さは、大気安定度の分類には無関係である。", "風速の強さは、大気安定度の分類には無関係である。", "この状況では、必ず逆転層が形成される。"], "answer": [0], "explanation": "正しいのは(1)です。日射が強く風速が弱い状況（典型的には晴れた日中の弱風時）では、地表面が強く加熱され対流が活発になるため、大気は不安定側（パスキル分類でいうA・B等）に分類されやすくなります。"}, {"id": 490, "domain": "大規模大気特論", "sub": "拡散_気象基礎", "type": "single", "q": "拡散モデルにおける「有効煙突高さ」と地表最大濃度の出現距離の関係に関する次の記述のうち、正しいものはどれか。", "options": ["一般に、有効煙突高さが高いほど、地表最大濃度が出現する風下距離は遠くなる傾向がある。", "有効煙突高さは、最大濃度の出現距離には全く影響を与えない。", "有効煙突高さが高いほど、最大濃度の出現距離は常に近くなる。", "最大濃度の出現距離は、有効煙突高さのみで決まり、大気安定度の影響は受けない。", "有効煙突高さと最大濃度出現距離の間には、いかなる関係性も確認されていない。"], "answer": [0], "explanation": "正しいのは(1)です。有効煙突高さが高いほど、煙が地表に到達するまでにより長い距離を要するため、最大着地濃度が出現する風下距離は一般に遠くなる傾向があります（同時に、最大濃度自体は低くなる傾向があります）。"}, {"id": 491, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "製油所（石油精製施設）における大気汚染対策に関する次の記述のうち、誤っているものはどれか。", "options": ["原油の蒸留により分離された各留分は、脱硫工程を経て製品化されることがある。", "製油所のNOx対策として、低NOxバーナーの採用が挙げられる。", "製油所では、硫黄回収装置により回収した単体硫黄が副産物として得られることがある。", "製油所からのVOC排出対策として、タンクへの浮き屋根の採用等が行われることがある。", "製油所では、原油に含まれる硫黄分がそのまま製品にすべて残留し、大気汚染対策の対象とはならない。"], "answer": [4], "explanation": "誤っているのは(5)です。原油中の硫黄分は水素化脱硫等の工程で除去され、回収された硫黄は硫黄回収装置を通じて単体硫黄として回収されるなど、大気汚染対策（脱硫）の重要な対象となっています。"}, {"id": 492, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "石炭火力発電所の排煙処理システムに関する次の記述のうち、誤っているものはどれか。", "options": ["集じんには、主に電気集じん装置が用いられることが多い。", "脱硝には、主に選択的触媒還元法（SCR法）が用いられることが多い。", "脱硫には、主に湿式石灰石こう法が用いられることが多い。", "排煙処理システムは、一般に集じん・脱硝・脱硫のいずれか1つの工程のみで構成され、他の工程は組み合わせない。", "排煙処理システムの構成順序（脱硝→集じん→脱硫等）は、設備により異なる場合がある。"], "answer": [3], "explanation": "誤っているのは(4)です。石炭火力発電所の排煙処理システムは、一般に集じん・脱硝・脱硫の複数の工程を組み合わせて構成されており、「いずれか1つのみ」というのは誤りです。"}, {"id": 493, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "重油・重質油焚き火力発電設備の排煙処理に関する次の記述のうち、正しいものはどれか。", "options": ["重油・重質油は石炭に比べて灰分が少ない傾向があるが、いおう分やバナジウム等の含有には注意が必要とされる。", "重油・重質油の燃焼では、いおう酸化物は一切発生しない。", "重油・重質油焚き設備では、集じん装置は一切不要とされる。", "重油・重質油焚き設備の排煙処理には、乾式・湿式のいずれの処理方式も存在しない。", "重油焚き設備では、バナジウムアタックのような高温腐食の問題は生じない。"], "answer": [0], "explanation": "正しいのは(1)です。重油・重質油は石炭に比べ灰分は少ない傾向がありますが、いおう分やバナジウム等の含有により、いおう酸化物の発生やバナジウムアタック（高温腐食）等への対策が必要とされます。"}, {"id": 494, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "セメント製造業における大気汚染防止対策に関する次の記述のうち、誤っているものはどれか。", "options": ["セメント製造工程では、原料（石灰石等）の焼成に伴い、ばいじんやNOx等が発生することがある。", "セメントキルンの集じんには、電気集じん装置やバグフィルターが用いられることがある。", "セメント製造業では、廃棄物を原燃料として活用（サーマルリサイクル・マテリアルリサイクル）する取組が行われることがある。", "セメント製造業からは、いかなる大気汚染物質も一切発生しないため、対策設備は不要である。", "セメントキルンの排ガス中のNOx対策として、低NOxバーナーの採用などが行われることがある。"], "answer": [3], "explanation": "誤っているのは(4)です。セメント製造業は焼成工程等でばいじん・NOx等の大気汚染物質が発生しうる代表的な業種の一つであり、集じん装置や脱硝対策等が実際に導入されています。「一切発生しない」は誤りです。"}, {"id": 495, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "鉄鋼業（高炉・焼結プロセス等）における大気汚染防止対策に関する次の記述のうち、正しいものはどれか。", "options": ["焼結プロセスから発生するダストは、集じん装置（電気集じん装置等）により捕集されることが多い。", "鉄鋼業のプロセスからは、いかなる粒子状物質も発生しない。", "高炉ガスは、そのまま大気中に放出することが標準的な処理方法とされている。", "鉄鋼業では、大気汚染防止対策として集じん設備を導入する必要はない。", "焼結ダストの電気抵抗率は、集じん性能には一切関係しない。"], "answer": [0], "explanation": "正しいのは(1)です。焼結プロセス等から発生するダストは、電気集じん装置やバグフィルター等により捕集されます。焼結ダストは電気抵抗率が集じん性能（特に電気集じん装置の効率）に影響を与えることが知られています。"}, {"id": 496, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "鉄鋼業における窒素酸化物（NOx）防止技術に関する次の記述のうち、誤っているものはどれか。", "options": ["焼結炉やコークス炉等の設備からは、燃焼に伴いNOxが発生することがある。", "低NOx燃焼技術（燃焼用空気の多段供給等）は、NOx低減対策の一つとして用いられることがある。", "排煙脱硝技術（アンモニア接触還元法等）は、鉄鋼業の設備にも適用されることがある。", "鉄鋼業からのNOx排出は、いかなる技術によっても低減することができない。", "NOx対策の選定にあたっては、対象設備の排ガス性状（温度、濃度等）が考慮される。"], "answer": [3], "explanation": "誤っているのは(4)です。鉄鋼業においても、低NOx燃焼技術や排煙脱硝技術（SCR法等）の適用によりNOx排出の低減が図られており、「いかなる技術によっても低減できない」は誤りです。"}, {"id": 497, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "ごみ焼却設備におけるダイオキシン類の削減対策に関する次の記述のうち、誤っているものはどれか。", "options": ["燃焼温度を高め、燃焼を完全にすることでダイオキシン類の生成を抑制する対策がある。", "バグフィルター入口のガス温度を低くする（急冷する）ことで、ダイオキシン類の再合成を抑制する対策がある。", "活性炭やカルシウム系薬剤の吹き込みにより、ダイオキシン類を吸着・除去する対策がある。", "バグフィルターのろ布に触媒機能を付加し、ダイオキシン類を分解する対策もある。", "ダイオキシン類対策は、燃焼工程・冷却工程のいずれか一方のみで完結し、両方を組み合わせる必要はない。"], "answer": [4], "explanation": "誤っているのは(5)です。ダイオキシン類対策は、燃焼管理（高温完全燃焼）・急速冷却（再合成の抑制）・薬剤吹き込みや高機能ろ布による除去など、複数の対策を組み合わせて実施するのが一般的であり、「一方のみで完結」は誤りです。"}, {"id": 498, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "ごみ焼却設備における窒素酸化物（NOx）対策に関する次の記述のうち、正しいものはどれか。", "options": ["ごみ焼却設備のNOx対策には、燃焼管理による対策（二段燃焼等）と、排煙脱硝による対策（無触媒脱硝・接触還元法等）がある。", "ごみ焼却設備からは、NOxは一切発生しない。", "ごみ焼却設備のNOx対策は、法令上一切求められていない。", "ごみ焼却設備のNOx対策には、燃焼管理による方法しか存在しない。", "ごみ焼却設備のNOx対策は、ダイオキシン類対策とは完全に独立しており、両者は同時に検討する必要がない。"], "answer": [0], "explanation": "正しいのは(1)です。ごみ焼却設備のNOx対策には、燃焼段階での対策（二段燃焼、排ガス再循環等）と、燃焼後の排煙脱硝（選択的無触媒還元法・選択的触媒還元法等）の両方が用いられます。"}, {"id": 499, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "ごみ焼却設備における水銀対策に関する次の記述のうち、正しいものはどれか。", "options": ["ごみ焼却設備からの水銀排出対策として、活性炭の吹き込みによる吸着除去等が行われることがある。", "ごみ焼却設備は、水銀排出施設として大気汚染防止法の規制対象には一切含まれない。", "ごみ焼却灰中には、水銀は一切含まれない。", "水銀は、ごみ焼却過程で完全に分解され、大気中に排出されることはない。", "水銀対策は、ごみ焼却設備には不要であり、他の業種にのみ求められる対策である。"], "answer": [0], "explanation": "正しいのは(1)です。廃棄物焼却施設は水銀の主要な発生源の一つとされ、活性炭の吹き込み等による水銀の吸着除去が対策として行われます。大気汚染防止法上も水銀排出施設として規制の対象に含まれます。"}, {"id": 500, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "揮発油等の品質の確保等に関する法律（品確法）に関する次の記述のうち、正しいものはどれか。", "options": ["品確法は、ガソリン等の揮発油の品質を確保し、自動車の排出ガス性能等に悪影響を及ぼす燃料の流通を防ぐことを目的の一つとしている。", "品確法は、大気汚染物質の排出基準そのものを定める法律である。", "品確法は、工場・事業場のばい煙発生施設のみを対象とする法律である。", "品確法には、燃料の品質に関する規定は一切含まれていない。", "品確法は、大気汚染防止法の下位規則として位置づけられる。"], "answer": [0], "explanation": "正しいのは(1)です。品確法は、揮発油（ガソリン等）の品質を確保し、不適切な品質の燃料が自動車の排出ガス性能等に悪影響を及ぼすことを防ぐことなどを目的とする法律で、大気汚染防止法とは別体系の法律です。"}, {"id": 501, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "大規模設備における硫黄酸化物（SOx）対策に関する次の記述のうち、誤っているものはどれか。", "options": ["燃料中の硫黄分をあらかじめ低減する（低硫黄燃料への転換等）ことは、SOx対策の一つである。", "排煙脱硫装置（湿式石灰石こう法等）による処理は、SOx対策の代表的な手法の一つである。", "SOx対策として、K値規制に基づく排出口の高さ等を考慮した設計が行われることがある。", "大規模設備からのSOx排出には、いかなる法的規制も存在しない。", "SOx対策の選定には、設備規模やコスト等も考慮要素となる。"], "answer": [3], "explanation": "誤っているのは(4)です。大規模設備からのSOx排出は、大気汚染防止法のK値規制・総量規制等の対象であり、「いかなる法的規制も存在しない」は誤りです。"}, {"id": 502, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "大規模設備から排出される大気汚染物質の種類に関する次のa〜dの記述のうち、正しいものの組合せはどれか。\na　石炭火力発電所からは、いおう酸化物、窒素酸化物、ばいじん等が発生しうる。\nb　セメント製造設備からは、ばいじんや窒素酸化物等が発生しうる。\nc　ごみ焼却設備からは、ダイオキシン類や水銀等が発生しうる。\nd　いずれの大規模設備からも、大気汚染物質は一切発生しない。", "options": ["a,b,c", "a,b,d", "a,c,d", "b,c,d", "a,b,c,d"], "answer": [0], "explanation": "a・b・cが正しい記述です。dは明らかに誤りです（各種の大規模設備は、それぞれ特有の大気汚染物質の発生源となりうるからこそ、対策が求められています）。"}, {"id": 503, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "石炭火力発電所における集じん・脱硝・脱硫の一般的な処理順序に関する次の記述のうち、正しいものはどれか。", "options": ["設備によっては、脱硝→集じん→脱硫という順序で処理工程が配置される場合がある。", "集じん・脱硝・脱硫の処理順序は、いかなる設備でも完全に固定されており、変更の余地はない。", "脱硫工程は、必ず集じん工程より前に配置されなければならない。", "脱硝工程は、必ず脱硫工程の後に配置されなければならない。", "処理順序は、排ガスの性状や設備コスト等の要因とは無関係に決定される。"], "answer": [0], "explanation": "正しいのは(1)です。石炭火力発電所の排煙処理では、脱硝を高温段階（集じん前）で行い、その後集じん、そして脱硫という順序で配置される設備がある一方、設備の設計思想によって順序が異なる場合もあります。「固定されており変更の余地はない」という(2)は誤りです。"}, {"id": 504, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "製油所における揮発性有機化合物（VOC）対策に関する次の記述のうち、誤っているものはどれか。", "options": ["貯蔵タンクからのVOC蒸発対策として、浮き屋根式タンクの採用などが行われることがある。", "配管・バルブ等からの漏えい（フガティブエミッション）を低減する対策も、VOC対策の一部とされる。", "出荷設備（ローディング設備）における蒸気回収（ベーパーリカバリー）も、VOC対策の一つである。", "製油所においては、VOC対策として法規制と自主的取組を組み合わせたベストミックスの考え方が用いられている。", "製油所のVOC対策は、貯蔵タンクのみを対象としており、配管や出荷設備は対象外である。"], "answer": [4], "explanation": "誤っているのは(5)です。製油所のVOC対策は、貯蔵タンクだけでなく、配管・バルブ等からの漏えい対策や出荷設備の蒸気回収など、複数の発生源を対象に総合的に行われます。「貯蔵タンクのみ」は誤りです。"}, {"id": 505, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "大規模設備の排煙処理における副生成物の取り扱いに関する次の記述のうち、正しいものはどれか。", "options": ["石灰石こう法による排煙脱硫では、副生成物として石こうが得られ、建材等に有効活用されることがある。", "排煙処理から生じる副生成物は、いかなる場合も全て無価値な廃棄物として扱われる。", "排煙処理の副生成物は、有効活用の余地が一切ない。", "石灰石こう法の副生成物は、常に有害廃棄物として厳重に処分されなければならない。", "排煙処理設備からは、いかなる副生成物も生じない。"], "answer": [0], "explanation": "正しいのは(1)です。石灰石こう法による排煙脱硫では、副生成物として石こう（せっこう）が得られ、これは建材（せっこうボード等）の原料として有効活用されることがあります。"}, {"id": 506, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "焼結ダストの電気抵抗率と集じん性能の関係に関する次の記述のうち、正しいものはどれか。", "options": ["電気集じん装置の集じん性能は、ダストの電気抵抗率が適した範囲から外れると低下することがある。", "ダストの電気抵抗率は、電気集じん装置の性能には一切影響しない。", "電気抵抗率が高すぎるダストは、常に集じん効率が向上する。", "電気抵抗率の概念は、バグフィルターの性能評価にのみ用いられ、電気集じん装置には無関係である。", "焼結ダストの電気抵抗率は、運転温度にかかわらず常に一定である。"], "answer": [0], "explanation": "正しいのは(1)です。電気集じん装置は、ダストが適度な電気抵抗率を持つことを前提に効率よく捕集できる仕組みのため、抵抗率が高すぎる（逆電離現象等）または低すぎる場合には集じん性能が低下することがあります。焼結ダストは運転温度領域によって電気抵抗率が変化することが知られています。"}, {"id": 507, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "大規模設備における排ガス中の窒素酸化物（NOx）低減のための燃焼技術に関する次の記述のうち、誤っているものはどれか。", "options": ["二段燃焼法は、燃焼用空気を分割して供給することでNOx生成を抑制する技術の一つである。", "排ガス再循環法は、排ガスの一部を燃焼用空気に混合することで燃焼温度を下げ、サーマルNOxの生成を抑制する技術である。", "低NOxバーナーは、燃焼条件を工夫することでNOx生成を抑制するよう設計されたバーナーである。", "これらの燃焼技術は、いずれも排煙脱硝装置と同様の触媒反応を利用した技術である。", "燃焼技術によるNOx低減対策は、排煙脱硝技術と組み合わせて用いられることもある。"], "answer": [3], "explanation": "誤っているのは(4)です。二段燃焼法・排ガス再循環法・低NOxバーナー等は、いずれも「燃焼条件の工夫」によりNOxの生成自体を抑える技術であり、触媒を用いる排煙脱硝技術（SCR法等）とは異なる仕組みです。"}, {"id": 508, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "大規模設備の大気汚染防止対策における維持管理の重要性に関する次の記述のうち、正しいものはどれか。", "options": ["集じん装置や脱硫・脱硝装置は、設置後も定期的な点検・整備を行うことで、性能の維持が図られる。", "大気汚染防止設備は、一度設置すれば、その後の点検・整備は一切不要である。", "設備の経年劣化は、大気汚染防止性能には影響を与えない。", "維持管理の状況は、排出基準の遵守状況とは無関係である。", "維持管理記録は、法令上、保存する必要がない。"], "answer": [0], "explanation": "正しいのは(1)です。集じん装置や脱硫・脱硝装置などの大気汚染防止設備は、経年劣化や性能低下が生じうるため、定期的な点検・整備により性能を維持することが排出基準の遵守にもつながる重要な取組です。"}, {"id": 509, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "大規模設備における環境影響評価（環境アセスメント）と大気拡散予測の関係に関する次の記述のうち、正しいものはどれか。", "options": ["大規模な発電所等の新設・変更にあたっては、環境影響評価の一環として大気拡散予測（濃度予測）が行われることがある。", "環境影響評価は、大気拡散予測とは全く関係のない手続きである。", "大規模設備の新設には、環境影響評価の実施は一切求められない。", "大気拡散予測の結果は、環境影響評価書には記載されない。", "環境影響評価における大気拡散予測は、必ず正規形プルーム式のみで行われ、他の手法は用いられない。"], "answer": [0], "explanation": "正しいのは(1)です。大規模な発電所等の設置・変更にあたっては、環境影響評価法等に基づく手続きの一環として、稼働後の大気汚染物質濃度を予測する大気拡散予測が行われることがあります。"}, {"id": 510, "domain": "大規模大気特論", "sub": "産業別対策事例", "type": "single", "q": "大規模設備からの大気汚染物質排出に関する総合的な対策の考え方に関する次の記述のうち、誤っているものはどれか。", "options": ["燃料転換（低硫黄燃料化等）、燃焼管理、排煙処理装置の組み合わせにより、総合的に大気汚染物質の排出を低減する取組が行われる。", "対策の選定には、対象物質の種類、排出濃度、設備コスト、維持管理の容易さ等、複数の要素が考慮される。", "排煙処理技術は、単独の技術のみで全ての大気汚染物質に対応できるため、複数技術の組み合わせは不要である。", "大規模設備の大気汚染対策は、法規制の遵守だけでなく、地域住民の生活環境保全の観点からも重要である。", "対策技術は、技術の進歩や知見の蓄積に応じて、改良・更新されていくことがある。"], "answer": [2], "explanation": "誤っているのは(3)です。実際には、集じん・脱硝・脱硫など対象物質ごとに異なる処理技術を組み合わせることで総合的な対策が行われており、「単独の技術のみで全てに対応できる」というのは誤りです。"}]}/*__END__*/;
const QUESTIONS = BANK.questions;
const META = BANK.meta;
const LS_KEY = "komu1_v1";

/* ====== 状態管理 ====== */
const $ = id => document.getElementById(id);
let stats = loadStats();
let session = null;

function loadStats(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.dom) return s; }catch(e){}
  return { total:0, correct:0, dom:{}, wrong:[] };
}
function saveStats(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(stats)); }catch(e){} }

/* ====== 初期化 ====== */
function init(){
  $("subt").textContent = `練習問題 ／ 全${QUESTIONS.length}問・本番形式(5肢択一)・詳細解説`;
  $("footN").textContent = QUESTIONS.length;
  const cats = META.categories || [...new Set(QUESTIONS.map(q=>q.domain))];
  const sel = $("selDomain");
  sel.innerHTML = `<option value="all">全分野（${QUESTIONS.length}問）</option>` +
    cats.map(c=>{const n=QUESTIONS.filter(q=>q.domain===c).length;return `<option value="${esc(c)}">${esc(c)}（${n}問）</option>`}).join("");
  renderDash();
  bind();
}
function renderDash(){
  $("stTotal").textContent = stats.total;
  $("stAcc").textContent = stats.total ? Math.round(stats.correct/stats.total*100)+"%" : "–";
  $("stWrong").textContent = (stats.wrong||[]).length;
  const cats = META.categories || [...new Set(QUESTIONS.map(q=>q.domain))];
  $("domStats").innerHTML = cats.map(c=>{
    const d = stats.dom[c] || {t:0,c:0};
    const pct = d.t ? Math.round(d.c/d.t*100) : 0;
    return `<div class="domrow"><div class="t"><span>${esc(c)}</span><b>${d.t? pct+"%":"未"} <span class="muted">(${d.c}/${d.t})</span></b></div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}

/* ====== 出題セット作成 ====== */
function buildSet(pool, count, order){
  let arr = pool.slice();
  if(order==="random") shuffle(arr);
  if(count!=="all"){ const n=parseInt(count,10); if(arr.length>n) arr=arr.slice(0,n); }
  // 各問の選択肢をシャッフルし、正解インデックスを再マップ
  return arr.map(q=>{
    const idx = q.options.map((_,i)=>i);
    shuffle(idx);
    const options = idx.map(i=>q.options[i]);
    const answer = q.answer.map(a=>idx.indexOf(a)).sort((x,y)=>x-y);
    return {ref:q, options, answer, type:q.type, picked:[], answered:false, ok:null};
  });
}
