度における平衡吸着量と濃度の関係を表す。"], "answer": [3], "explanation": "物理吸着は発熱過程であるため、温度を高くすると平衡吸着量は減少する。この性質を利用して、加熱により吸着質を追い出す加熱脱着(再生)が行われる。「温度が高いほど吸着量が増える」は事実と逆である。"}, {"id": 165, "domain": "大気有害物質特論", "sub": "ガス吸着", "type": "single", "q": "吸着装置の破過に関する記述として、誤っているものはどれか。", "options": ["破過曲線は、吸着塔出口の濃度と通気時間の関係を表したものである。", "破過点は、出口濃度があらかじめ定めた許容値に達した時点をいう。", "吸着帯の長さが短いほど、破過曲線の立ち上がりは急になる。", "破過点に達した吸着剤は、加熱や水蒸気により再生できる場合がある。", "通気速度を大きくすると、破過に達するまでの時間は長くなる。"], "answer": [4], "explanation": "通気速度を大きくすると、単位時間当たりに供給される吸着質の量が増え、また吸着帯も長くなるため、破過に達するまでの時間は短くなる。処理量を増やせば早く破過する、という関係である。"}, {"id": 166, "domain": "大気有害物質特論", "sub": "ガス吸着", "type": "single", "q": "物理吸着と化学吸着に関する記述として、正しいものはどれか。", "options": ["物理吸着の吸着熱は、一般に化学吸着の吸着熱より小さい。", "物理吸着では、吸着質と吸着剤の間に化学結合が形成される。", "化学吸着は可逆性が高く、減圧により容易に脱着できる。", "物理吸着では、温度が高いほど吸着量が増加する。", "化学吸着では、吸着量が単分子層を超えて増加を続ける。"], "answer": [0], "explanation": "物理吸着はファンデルワールス力によるもので、吸着熱は凝縮熱と同程度で小さい。化学吸着は化学結合を伴うため吸着熱が大きく、脱着しにくい。物理吸着は温度が高いほど吸着量が減少し、化学吸着は表面での結合であるため単分子層で飽和する。「物理吸着で化学結合が形成される」「化学吸着が減圧のみで容易に脱着できる」はいずれも両者の性質を入れ替えたものである。"}, {"id": 167, "domain": "大気有害物質特論", "sub": "ガス吸着", "type": "single", "q": "吸着剤及び脱着操作に関する記述として、誤っているものはどれか。", "options": ["水蒸気を用いた脱着では、凝縮させることで吸着質を回収できる。", "活性炭は親水性が高く、湿度の高い排ガスほど有機溶剤の吸着量が増える。", "活性炭は、有機溶剤蒸気の回収に広く用いられる。", "シリカゲルや活性アルミナは、水分の吸着に用いられる。", "ゼオライトは、細孔径がそろっており分子ふるい効果を示す。"], "answer": [1], "explanation": "活性炭は疎水性(親油性)であり有機物をよく吸着するが、湿度が高いと水分が細孔を占有するため有機溶剤の吸着量はむしろ低下する。このため実務では前段で除湿を行うことがある。「親水性が高い」という記述自体が誤りである。"}, {"id": 168, "domain": "大気有害物質特論", "sub": "その他の処理技術", "type": "single", "q": "ふっ素化合物を含む排ガスの処理に関する記述として、誤っているものはどれか。", "options": ["四ふっ化けい素の水吸収では、生成する二酸化けい素によるスケール付着に留意する。", "吸収液が酸性のまま循環すると、ふっ素の再放散が起こるおそれがある。", "ふっ化カルシウムは水に極めてよく溶けるため、沈殿分離には適さない。", "ふっ化水素は水に溶けやすく、水吸収による除去が有効である。", "水酸化カルシウムを用いると、難溶性のふっ化カルシウムとして固定できる。"], "answer": [2], "explanation": "ふっ化カルシウム(CaF2)は水に難溶であり、この難溶性を利用して沈殿として分離・固定するのがふっ素処理の基本である。天然にも蛍石として安定に存在することからも、水に溶けにくいことがわかる。"}, {"id": 169, "domain": "大気有害物質特論", "sub": "その他の処理技術", "type": "single", "q": "塩化水素を含む排ガスの処理に関する記述として、誤っているものはどれか。", "options": ["アルカリ吸収では、水酸化ナトリウムや水酸化カルシウムが用いられる。", "廃棄物焼却炉では、消石灰を炉内や煙道に吹き込む乾式法も用いられる。", "吸収塔の材質には、塩酸に対する耐食性を考慮する必要がある。", "吸収液のpHが低下しても、塩化水素の吸収効率はほとんど変化しない。", "水に極めてよく溶けるため、水洗塔による吸収が有効である。"], "answer": [3], "explanation": "吸収液のpHが低下する(酸性が強まる)と塩化水素の吸収能力は低下するため、アルカリを補給してpHを管理する必要がある。実運転では吸収液のpH制御が処理性能を左右する重要な管理項目となる。"}, {"id": 170, "domain": "大気有害物質特論", "sub": "その他の処理技術", "type": "single", "q": "特定物質の漏えい時の中和処理に関する記述として、誤っているものはどれか。", "options": ["中和剤の散布に当たっては、発熱や飛散に注意する必要がある。", "塩化水素の漏えいには、消石灰や炭酸ナトリウムによる中和が用いられる。", "硫酸の漏えいには、炭酸ナトリウムや消石灰による中和が用いられる。", "ふっ化水素の漏えいには、消石灰による中和が有効である。", "アンモニアの漏えいには、炭酸ナトリウムによる中和が有効である。"], "answer": [4], "explanation": "アンモニアはアルカリ性のガスであるため、アルカリ性である炭酸ナトリウムでは中和できない。多量の水による希釈や、酸による中和が用いられる。酸性物質にはアルカリを、アルカリ性物質には酸を、という対応関係を取り違えさせるのは頻出の出題パターンである。"}, {"id": 171, "domain": "大気有害物質特論", "sub": "ガス吸収", "type": "single", "q": "次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「ガス吸収装置のうち(ア)は、スロート部でガス流速を高めて液を微細化するため圧力損失が大きい。一方(イ)は、液を噴霧するだけの構造であり圧力損失が小さい。また、水への溶解度が(ウ)ガスの吸収では、ガス側境膜抵抗が支配的となる。」", "options": ["(ア)ベンチュリスクラバー (イ)スプレー塔 (ウ)大きい", "(ア)ベンチュリスクラバー (イ)スプレー塔 (ウ)小さい", "(ア)スプレー塔 (イ)ベンチュリスクラバー (ウ)大きい", "(ア)充塡塔 (イ)ぬれ壁塔 (ウ)大きい", "(ア)サイクロンスクラバー (イ)段塔 (ウ)小さい"], "answer": [0], "explanation": "スロート部で液を微細化するのはベンチュリスクラバーであり、圧力損失が大きい。スプレー塔は液を噴霧する簡素な構造で圧力損失が小さい。また溶解度の大きいガス(塩化水素、アンモニア、ふっ化水素など)はガス側境膜抵抗が支配的、溶解度の小さいガス(二酸化炭素、酸素など)は液側境膜抵抗が支配的となる。"}, {"id": 172, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "排ガス中のふっ素化合物の分析に関する記述として、誤っているものはどれか。", "options": ["イオン電極法やイオンクロマトグラフ法も適用できる。", "水蒸気蒸留を行うと、ふっ素化合物は留出せず残留物側に濃縮される。", "試料ガスを吸収液に通じて、ふっ素化合物を捕集する。", "共存物質の影響を除くため、水蒸気蒸留による分離操作が行われる。", "ランタン-アリザリンコンプレキソン吸光光度法が用いられる。"], "answer": [1], "explanation": "水蒸気蒸留は、ふっ素をヘキサフルオロけい酸などの形で留出させ、共存物質から分離するための操作である。ふっ素は留出液側に移行するのであって、残留物側に残るのではない。分離操作の目的と物質の挙動を取り違えさせる出題は頻出である。"}, {"id": 173, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "排ガス中の塩素の分析に関する記述として、誤っているものはどれか。", "options": ["共存する塩化水素は、測定値の妨害要因となることがある。", "試料採取に用いる器具は、塩素に対する耐食性を考慮する。", "塩素は安定であり、採取後に長期間保存しても濃度は変化しない。", "吸収液に捕集した後、吸光光度法により定量する方法がある。", "イオンクロマトグラフ法を適用して定量することができる。"], "answer": [2], "explanation": "塩素は反応性の高いガスであり、採取後の試料は容器壁への吸着や共存成分との反応により濃度が変化しやすい。このため速やかに分析するか、規定された方法で安定化させる必要がある。「化学的に安定で長期保存できる」は誤りである。"}, {"id": 174, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "排ガス中の塩化水素の分析に関する記述として、正しいものはどれか。", "options": ["共存する塩素は、塩化物イオンを生じないため妨害とならない。", "試料採取管は、加熱を行わずに使用しなければならない。", "定量に用いる方法は、原子吸光法に限られている。", "捕集した塩化物イオンを、イオンクロマトグラフ法で定量できる。", "塩化水素は水に溶けにくいため、吸収液による捕集はできない。"], "answer": [3], "explanation": "塩化水素は吸収液に捕集して塩化物イオンとし、イオンクロマトグラフ法や滴定法、吸光光度法で定量する。塩化水素は水に極めてよく溶けるため吸収捕集が可能であり、「水に溶けにくい」は誤り。共存する塩素は塩化物イオンを生じて妨害となりうる。試料採取管は結露を防ぐため加熱することがあり、原子吸光法は金属分析の手法であって塩化水素の定量には用いない。"}, {"id": 175, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "排ガス中のカドミウム及び鉛の分析に関する記述として、誤っているものはどれか。", "options": ["試料はろ紙などで捕集し、酸により分解して測定溶液とする。", "フレーム原子吸光法を適用することができる。", "ICP発光分光分析法やICP質量分析法を適用することができる。", "電気加熱原子吸光法は、フレーム原子吸光法より低濃度域の測定に適する。", "カドミウムと鉛は排ガス中で気体として存在するため、ろ過捕集は不要である。"], "answer": [4], "explanation": "製錬炉などの排ガス中では、いったん揮発したカドミウムや鉛は冷却されて微細な粒子(ヒューム)となっているため、ろ紙などによるろ過捕集が必要である。気体のまま存在し続けるわけではない。"}, {"id": 176, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "ICP質量分析法に関する記述として、誤っているものはどれか。", "options": ["測定は質量数に基づくため、共存塩類の濃度は結果に影響しない。", "誘導結合プラズマで試料をイオン化し、質量数ごとに分離して検出する。", "多元素を同時に測定でき、感度が高い。", "内標準物質を添加して、測定値の変動を補正することがある。", "共存成分に由来する多原子イオンが、測定を妨害することがある。"], "answer": [0], "explanation": "共存する塩類が高濃度に存在すると、プラズマの状態変化や試料導入系への析出により信号強度が変動する(マトリックス効果)ため、測定結果に影響を及ぼす。この影響を補正する目的で内標準物質が用いられる。"}, {"id": 177, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "原子吸光法に関する記述として、誤っているものはどれか。", "options": ["電気加熱方式では、乾燥・灰化・原子化の各段階を経る。", "多元素を同時に定量できる点が、この方法の最大の利点である。", "目的元素の中空陰極ランプを光源として用いる。", "原子化された目的元素による光の吸収量から濃度を求める。", "検量線法や標準添加法により定量する。"], "answer": [1], "explanation": "原子吸光法は目的元素ごとの中空陰極ランプを用いるため、原則として一元素ずつの測定となる。多元素同時定量を得意とするのはICP発光分光分析法やICP質量分析法である。この両者の特徴を入れ替える出題は頻出である。"}, {"id": 178, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "排ガス中の有害物質の試料採取に関する記述として、誤っているものはどれか。", "options": ["採取管には、目的物質と反応しにくい材質を選定する。", "水分の凝縮が問題となる場合は、採取管の加熱を行う。", "吸引速度が排ガス流速より大きいと、粗大粒子の割合が過大となる。", "採取位置は、ガス流の偏りが少ない直管部から選定する。", "粒子状物質を採取する場合は、等速吸引を行う必要がある。"], "answer": [2], "explanation": "吸引速度が排ガス流速より大きい場合、慣性の小さい微細粒子は過剰に吸い込まれる一方、慣性の大きい粗大粒子は流れに追随できないため、粗大粒子の割合はむしろ過小に評価される。過大に評価されるのは吸引速度が流速より小さい場合である。等速吸引が求められるのはこのためである。"}, {"id": 179, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "次の記述中の(ア)～(ウ)に入る語句の組合せとして、正しいものはどれか。\n\n「濃度既知の標準液を段階的に測定して作成する(ア)により、試料の濃度を求める。共存成分の影響が大きい場合には、試料に目的成分を段階的に添加して測定する(イ)が有効である。また、装置側の変動を補正する目的で、目的元素とは別の元素をあらかじめ加えておく(ウ)が用いられる。」", "options": ["(ア)検量線法 (イ)内標準法 (ウ)標準添加法", "(ア)内標準法 (イ)標準添加法 (ウ)検量線法", "(ア)標準添加法 (イ)内標準法 (ウ)検量線法", "(ア)検量線法 (イ)標準添加法 (ウ)内標準法", "(ア)標準添加法 (イ)検量線法 (ウ)内標準法"], "answer": [3], "explanation": "検量線法は濃度既知の標準液から検量線を作成する基本的な定量法。標準添加法は試料そのものに目的成分を添加していく方法で、マトリックスの影響を受けにくい。内標準法は目的元素とは別の元素を一定量加え、その信号との比をとることで装置変動を補正する方法である。三者の役割を入れ替える出題は頻出である。"}, {"id": 180, "domain": "大気有害物質特論", "sub": "特定物質の測定", "type": "single", "q": "イオンクロマトグラフ法に関する記述として、誤っているものはどれか。", "options": ["分離カラムにより、陰イオンを種類ごとに分離する。", "検出には電気伝導度検出器が広く用いられる。", "サプレッサーを用いると、溶離液由来のバックグラウンドを低減できる。", "ふっ化物イオンや塩化物イオンの定量に適用できる。", "対象はイオンに限られないため、中性の有機溶剤蒸気も直接定量できる。"], "answer": [4], "explanation": "イオンクロマトグラフ法はイオン交換に基づく分離法であり、測定対象はイオン性成分に限られる。中性の有機溶剤蒸気を直接定量することはできず、その場合はガスクロマトグラフ法などが用いられる。"}]}/*__END__*/;
const QUESTIONS = BANK.questions;
const META = BANK.meta;
const LS_KEY = "komu1_v1";

/* ====== 状態管理 ====== */
const $ = id => document.getElementById(id);
let stats = loadStats();
let session = null;

function loadStats(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.dom) return s; }catch(e){}
  return { total:0, correct:0, dom:{}, wrong:[] };
}
function saveStats(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(stats)); }catch(e){} }

/* ====== 初期化 ====== */
function init(){
  $("subt").textContent = `練習問題 ／ 全${QUESTIONS.length}問・本番形式(5肢択一)・詳細解説`;
  $("footN").textContent = QUESTIONS.length;
  const cats = META.categories || [...new Set(QUESTIONS.map(q=>q.domain))];
  const sel = $("selDomain");
  sel.innerHTML = `<option value="all">全分野（${QUESTIONS.length}問）</option>` +
    cats.map(c=>{const n=QUESTIONS.filter(q=>q.domain===c).length;return `<option value="${esc(c)}">${esc(c)}（${n}問）</option>`}).join("");
  renderDash();
  bind();
}
function renderDash(){
  $("stTotal").textContent = stats.total;
  $("stAcc").textContent = stats.total ? Math.round(stats.correct/stats.total*100)+"%" : "–";
  $("stWrong").textContent = (stats.wrong||[]).length;
  const cats = META.categories || [...new Set(QUESTIONS.map(q=>q.domain))];
  $("domStats").innerHTML = cats.map(c=>{
    const d = stats.dom[c] || {t:0,c:0};
    const pct = d.t ? Math.round(d.c/d.t*100) : 0;
    return `<div class="domrow"><div class="t"><span>${esc(c)}</span><b>${d.t? pct+"%":"未"} <span class="muted">(${d.c}/${d.t})</span></b></div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}

/* ====== 出題セット作成 ====== */
function buildSet(pool, count, order){
  let arr = pool.slice();
  if(order==="random") shuffle(arr);
  if(count!=="all"){ const n=parseInt(count,10); if(arr.length>n) arr=arr.slice(0,n); }
  // 各問の選択肢をシャッフルし、正解インデックスを再マップ
  return arr.map(q=>{
    const idx = q.options.map((_,i)=>i);
    shuffle(idx);
    const options = idx.map(i=>q.options[i]);
    const answer = q.answer.map(a=>idx.indexOf(a)).sort((x,y)=>x-y);
    return {ref:q, options, answer, type:q.type, picked:[], answered:false, ok:null};
  });
}
function startSession(pool, count, order, mode){
  if(pool.length===0){ alert("対象の問題がありません。"); return; }
  session = { items: buildSet(pool, count, order), i:0, score:0, mode:mode||"normal", wrongRefs:[] };
  show("quiz"); renderQ();
}

/* ====== 問題描画 ====== */
function renderQ(){
  const it = session.items[session.i];
  const q = it.ref;
  $("qIndex").textContent = session.i+1;
  $("qTotal").textContent = session.items.length;
  $("qScore").textContent = session.score;
  $("qBar").style.width = Math.round(session.i/session.items.length*100)+"%";
  $("qDomain").textContent = q.domain + (q.sub? " ／ "+q.sub : "");
  $("qMulti").classList.toggle("hidden", it.type!=="multi");
  $("qText").textContent = q.q;
  it.picked = [];
  const sq = it.type==="multi";
  $("qOpts").innerHTML = it.options.map((o,i)=>
    `<div class="opt ${sq?'sq':''}" data-i="${i}"><div class="mk">${sq?'':String.fromCharCode(65+i)}</div><div class="tx">${esc(o)}</div></div>`
  ).join("");
  Array.from($("qOpts").children).forEach(el=>el.addEventListener("click",()=>toggle(el,it)));
  $("qExpl").innerHTML = "";
  $("btnAnswer").classList.remove("hidden");
  $("btnNext").classList.add("hidden");
  $("btnNext").textContent = (session.i===session.items.length-1) ? "結果を見る ▶" : "次へ ▶";
}
function toggle(el,it){
  if(it.answered) return;
  const i = +el.dataset.i;
  if(it.type==="multi"){
    const k = it.picked.indexOf(i);
    if(k>=0){ it.picked.splice(k,1); el.classList.remove("sel"); }
    else { it.picked.push(i); el.classList.add("sel"); }
  } else {
    it.picked = [i];
    Array.from($("qOpts").children).forEach(c=>c.classList.toggle("sel", +c.dataset.i===i));
  }
}

/* ====== 採点 ====== */
function answer(){
  const it = session.items[session.i];
  if(it.picked.length===0){ alert("選択肢を選んでください。"); return; }
  it.answered = true;
  const correct = it.answer.slice().sort((a,b)=>a-b).join(",");
  const picked = it.picked.slice().sort((a,b)=>a-b).join(",");
  it.ok = (correct===picked);
  if(it.ok) session.score++;
  // 選択肢の色付け
  Array.from($("qOpts").children).forEach(el=>{
    const i=+el.dataset.i; el.style.pointerEvents="none";
    if(it.answer.includes(i)) el.classList.add("correct");
    else if(it.picked.includes(i)) el.classList.add("wrong");
  });
  // 解説
  const corrText = it.answer.map(i=>it.options[i]).join(" ／ ");
  $("qExpl").innerHTML =
    `<div class="expl ${it.ok?'ok':'ng'}">
      <div class="h ${it.ok?'ok':'ng'}">${it.ok?'✓ 正解':'✗ 不正解'}</div>
      <div class="sub">正解：${esc(corrText)}</div>
      <div class="exbody">${esc(it.ref.explanation)}</div>
    </div>`;
  // 統計更新
  const c = it.ref.domain;
  stats.total++; if(it.ok) stats.correct++;
  stats.dom[c] = stats.dom[c] || {t:0,c:0}; stats.dom[c].t++; if(it.ok) stats.dom[c].c++;
  stats.wrong = stats.wrong || [];
  if(it.ok){ stats.wrong = stats.wrong.filter(id=>id!==it.ref.id); }
  else { if(!stats.wrong.includes(it.ref.id)) stats.wrong.push(it.ref.id); session.wrongRefs.push(it.ref.id); }
  saveStats();
  $("btnAnswer").classList.add("hidden");
  $("btnNext").classList.remove("hidden");
}
function next(){
  if(session.i < session.items.length-1){ session.i++; renderQ(); }
  else showResult();
}

/* ====== 結果 ====== */
function showResult(){
  const n = session.items.length, s = session.score, pct = Math.round(s/n*100);
  $("rScore").textContent = s; $("rTotal").textContent = n; $("rPct").textContent = "正答率 "+pct+"%";
  const pass = pct>=60;
  const v = $("rVerdict"); v.textContent = pass? "合格ライン到達 🎉（目安60%）" : "あと少し（目安60%）";
  v.className = "verdict "+(pass?"pass":"fail");
  // セッション内の分野別
  const byd={};
  session.items.forEach(it=>{const c=it.ref.domain;byd[c]=byd[c]||{t:0,c:0};byd[c].t++;if(it.ok)byd[c].c++;});
  $("rDom").innerHTML = Object.keys(byd).map(c=>{
    const d=byd[c],p=Math.round(d.c/d.t*100);
    return `<div class="domrow"><div class="t"><span>${esc(c)}</span><b>${p}% <span class="muted">(${d.c}/${d.t})</span></b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
  }).join("");
  $("btnReviewWrong").classList.toggle("hidden", session.wrongRefs.length===0);
  renderDash();
  show("result");
}

/* ====== ナビ ====== */
function bind(){
  $("btnStart").addEventListener("click",()=>{
    const dom=$("selDomain").value;
    const pool = dom==="all"? QUESTIONS : QUESTIONS.filter(q=>q.domain===dom);
    startSession(pool, $("selCount").value, $("selOrder").value, "normal");
  });
  $("btnReview").addEventListener("click",()=>{
    const ids = stats.wrong||[];
    const pool = QUESTIONS.filter(q=>ids.includes(q.id));
    if(pool.length===0){ alert("復習対象の問題はありません。まずは演習してみましょう。"); return; }
    startSession(pool, "all", "random", "review");
  });
  $("btnAnswer").addEventListener("click",answer);
  $("btnNext").addEventListener("click",next);
  $("btnAbort").addEventListener("click",()=>{ if(confirm("中断してトップに戻りますか？")){ renderDash(); show("home"); }});
  $("btnHome").addEventListener("click",()=>{ renderDash(); show("home"); });
  $("btnReviewWrong").addEventListener("click",()=>{
    const pool = QUESTIONS.filter(q=>session.wrongRefs.includes(q.id));
    startSession(pool, "all", "random", "review");
  });
  $("btnReset").addEventListener("click",()=>{
    if(confirm("学習記録（正答率・履歴・復習リスト）をすべて消去しますか？")){
      stats={total:0,correct:0,dom:{},wrong:[]}; saveStats(); renderDash();
    }
  });
}
function show(id){ ["home","quiz","result"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }

/* ====== utils ====== */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

init();
</script>
